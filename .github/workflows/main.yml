# Based on the workflows of:
# https://github.com/League-of-Foundry-Developers/FoundryVTT-Module-Template and
# https://github.com/pwatson100/alienrpg
name: Release Creation

on:
  # PRIMARY PATH — pushing a version tag (X.Y.Z) builds and publishes the release
  # with system.json + system.zip. The tag is created on the Gitea side (see
  # RELEASE.md / `npm run release`) and reaches GitHub via the mirror, so it is
  # never pruned. This is the whole release: push a tag, the workflow does the rest.
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # There is deliberately NO `release: [published]` trigger. It used to be here, from
  # when 0.1.0 was assembled by hand on GitHub. It did not cause the mirror bug -- it
  # HID it: a release made in GitHub's UI creates a GitHub-only tag, this trigger built
  # and attached both assets so everything looked correct, and then the next mirror sync
  # pruned the tag and silently demoted the release to a draft. Without it, a
  # GitHub-made release simply has no assets -- broken immediately and visibly, while
  # you are still looking at it. workflow_dispatch below covers every legitimate rebuild.
  #
  # Manual fallback: (re)build + attach assets to an existing tag from the Actions
  # tab. Use if a tag push somehow didn't fire, or to rebuild a release's assets.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and attach system.json + system.zip to (e.g. 0.1.0)"
        required: true

# Declared rather than inherited (review #9): the release step needs
# `contents: write`, and without this block it only gets it from the
# repository-level default — a setting held outside the repo. If that default
# is ever tightened to read-only (GitHub's default for new repos), a tag push
# would build, pass every gate, and 403 at publish; and per RELEASE.md the tag
# must not be re-cut on GitHub, so recovery would be a manual dispatch nothing
# points at. The other two workflows already declare theirs.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # One source of truth for the tag across both triggers:
    #   tag push        -> github.ref_name
    #   manual dispatch -> inputs.tag
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Checkout the RELEASE_TAG's commit on BOTH triggers. A tag push checks out
      # the tag anyway (github.ref); a manual dispatch would otherwise build the
      # BRANCH selected in the Actions UI while labelling the zip with
      # `inputs.tag` — a rebuild of any non-HEAD release shipping newer code
      # under an older number (review #18). `inputs.tag` is empty on a tag push,
      # so the `||` falls through to the pushed ref.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The whole history: check:translations below baselines on the
          # PREVIOUS release tag, and a shallow checkout reaches no tag at all,
          # on which the guard degrades to its first two rules and prints OK.
          fetch-depth: 0

      # Build the LevelDB compendia from src/packs/ (packs/ is gitignored)
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci

      # Build FIRST, gate second: the gates assert on the tree as it will ship,
      # and one of them needs the shipped shape to exist — check:licence anchors
      # its LICENSE.txt path detection on real top-level directories, so with
      # packs/ absent every packs/ reference silently fell out of its list and
      # the zip-coverage check reported the zip shipping an unnamed directory.
      # That failed the first 0.1.10 tag (2026-08-04): the gates ran at steps
      # 5–12 while build:packs sat at step 13, an order no local run ever has,
      # because a working tree always carries built packs.
      - run: npm run build:packs

      # The offline gates, BEFORE anything is published (review 2026-08-04: a
      # tag push used to publish whatever was in the tree — no workflow ran a
      # single check, including check:fields, which guards the htmlFields
      # sanitization declarations CLAUDE.md classes as a security control).
      # These are the offline half of docs/release-testing.md; they need no
      # Foundry and finish in seconds. check:warden is deliberately absent —
      # it fetches the live SRD from another repo, and a release should not be
      # hostage to someone else's outage; it stays a pre-tag step on the
      # developer's machine.
      #
      # ONE STEP, each gate asked of the TAG's own package.json (review #34
      # finding 20). On a dispatch this file comes from the branch picked in the
      # dialog while the checkout is the tag, so a gate newer than the tag
      # (check:package arrived 2026-09-19; no tag up to 0.1.23 has it) stopped
      # every rebuild at npm's "Missing script" — the very rebuild of 0.1.0-0.1.6
      # the release step's comment plans for. On a DISPATCH a gate the tag does
      # not define is skipped with a notice; on a TAG PUSH this file and the
      # package.json are the same commit, so a missing one is a real fault and
      # fails.
      #   check:package — the release ARTIFACT's own shape, over the files this
      #     workflow is about to zip (added 2026-09-19, after a user's "Update
      #     All" left quarantined copies of the system behind). After
      #     build:packs, because `packs/` is most of what ships and the checks
      #     that matter most — case collisions, names Windows cannot write or
      #     DELETE, a pack built but never declared — are only true of a built
      #     tree. The same gate re-runs against the finished zip below.
      #   check:translations — the translation-loss guard, mandatory both sides
      #     of a release by user ruling (2026-08-11). On a tag checkout
      #     `git describe` names the tag being BUILT, so `--exclude` moves the
      #     baseline to the previous release: the one whose translations this
      #     build must not have lost.
      - name: The offline gates
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          gate() {
            if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "$1"; then
              npm run "$@"
            elif [ "$DISPATCH" = "true" ]; then
              echo "::notice::$1 is newer than $RELEASE_TAG (not in its package.json) - skipped on this rebuild"
            else
              echo "::error::$1 is missing from package.json - a tag push runs every gate"
              exit 1
            fi
          }
          gate check:manifest
          gate check:package
          gate check:fields
          gate check:refs
          gate check:traits
          gate check:licence
          gate check:probes
          gate i18n:check
          gate i18n:source
          gate check:translations -- --exclude "$RELEASE_TAG"

      # Substitute the version and the manifest/download URLs in system.json.
      # A node one-liner rather than a third-party action (review #19): the
      # microsoft/variable-substitution@v1 this used is ARCHIVED (last push
      # 2023-01) and declares `using: node12` — it ran on 0.1.17 only because
      # GitHub forces retired runtimes onto Node 24, which its changelog ends
      # in the autumn of 2026. The day that stops, a tag push builds, passes
      # every gate above and dies here, and a tag is never re-cut on GitHub
      # (RELEASE.md) — so the recovery would be a workflow edit plus a manual
      # dispatch. Three keys, written back with the file's own 2-space indent.
      - name: Substitute Manifest and Download Links For Versioned Ones
        env:
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("system.json", "utf8"));
            m.version = process.env.RELEASE_TAG;
            m.manifest = `https://github.com/${process.env.REPO}/releases/latest/download/system.json`;
            m.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.RELEASE_TAG}/system.zip`;
            fs.writeFileSync("system.json", JSON.stringify(m, null, 2) + "\n");
            console.log(`system.json: version ${m.version}, download ${m.download}`);
          '

      # A REBUILD SHIPS WHAT THE TAG SHIPPED (review #34 finding 260). The list
      # of what goes in the archive is a literal line in the RUNNING workflow,
      # and on a dispatch that file comes from the branch picked in the dialog
      # while the checkout is the tag. So a rebuild of 0.1.0-0.1.9 zipped TODAY's
      # list from the old tree: no template.json (0.1.0-0.1.4's only declaration
      # of their Actor and Item types), no portrait, token or Lydia Comer
      # galleries, no game-icons/ or tlomdev/ in 0.1.9 — zip skips a missing name
      # with a warning — and the release step then replaced the working asset.
      # On a dispatch, the TAG's own zip line is read from its main.yml on disk
      # and run instead. On a tag push that file IS the running one, so the
      # literal line below runs. The path is quoted on purpose: check:package and
      # this step's own grep both look for the unquoted line, which must stay the
      # first of its kind in the file.
      - name: On a rebuild, zip the tag's own file list
        if: github.event_name == 'workflow_dispatch'
        run: |
          line=$(grep -m1 -E '^[[:space:]]*(- run: )?zip -r \./system\.zip ' .github/workflows/main.yml || true)
          if [ -z "$line" ]; then
            echo "::error::no zip line in $RELEASE_TAG's own .github/workflows/main.yml - nothing says what it shipped"
            exit 1
          fi
          list=${line#*system.zip }
          echo "::notice::$RELEASE_TAG ships its own file list: $list"
          zip -r "./system.zip" $list

      # Create a zip file with all files required by the system to add to the release
      # template.json was dropped when the sub-type schemas moved to TypeDataModel
      # (module/data-models.js). zip skips a missing file silently, so this listed a
      # file that had not existed for releases without anyone noticing.
      - run: zip -r ./system.zip README.md README.es.md LICENSE.txt system.json art/ css/ fonts/ icons/ lang/ logo/ module/ packs/ templates/
        if: github.event_name != 'workflow_dispatch'

      # And again over the archive itself, which is the only thing a user ever
      # receives. The tree pass above cannot see what `zip` actually wrote — the
      # `template.json` that sat in the line above for releases after the file
      # stopped existing was skipped in silence, and nothing noticed. This pass
      # reads the archive's own central directory: its top level must be exactly
      # the list in that line, and every permission bit, name and path length is
      # re-checked as shipped. `check:package` reads the same line, so a
      # directory added to one and not the other fails here.
      # A tag older than the audit (every tag up to 0.1.23) is rebuilt without
      # it, on a dispatch only, for the reason the gates step gives.
      - name: Audit the archive
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -f tools/dev/package-audit.mjs ]; then
            node tools/dev/package-audit.mjs --zip ./system.zip
          elif [ "$DISPATCH" = "true" ]; then
            echo "::notice::tools/dev/package-audit.mjs is newer than $RELEASE_TAG - skipped on this rebuild"
          else
            echo "::error::tools/dev/package-audit.mjs is missing - a tag push audits the archive"
            exit 1
          fi

      # The release notes ride in the TAG. `npm run release` writes CHANGELOG.md's
      # section for the version as the body of the annotated tag (RELEASE.md), the
      # mirror carries the tag OBJECT to GitHub — every tag on the mirror lists a
      # peeled `^{}` entry, which only an annotated tag has — and this reads the
      # body back, so the release is created with its notes in the same call that
      # attaches the assets. Nothing to paste afterwards. The tags are present
      # because the checkout above fetches the whole history (check:translations
      # already depends on that). A tag cut before the changelog existed (0.1.22
      # and earlier) has a one-line message and an empty body, which is the same
      # empty body those releases were created with; a rebuild of any release
      # through workflow_dispatch leaves the body alone regardless
      # (omitBodyDuringUpdate below), so notes edited by hand on the release page
      # are never blanked.
      - name: Read the release notes from the tag
        run: |
          git tag -l --format='%(contents:body)' "$RELEASE_TAG" > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "release notes: $(wc -l < release-notes.md) lines from the body of tag $RELEASE_TAG"
          else
            echo "release notes: tag $RELEASE_TAG carries none (the release body stays as it is)"
          fi

      # Create/update the release with the built files
      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          # No `name` input: the action falls back to the tag for the name. The body is
          # the tag's own (read above). The omit flags then stop an update — a rebuild
          # through workflow_dispatch — from blanking notes edited by hand on the
          # release page, or from re-imposing the tag's over them.
          omitNameDuringUpdate: true
          bodyFile: release-notes.md
          omitBodyDuringUpdate: true
          draft: false
          # `prerelease: false` applies to NEWLY created releases only. Without the omit
          # flag, allowUpdates would also force an existing release back to false — so
          # rebuilding an old release's assets via workflow_dispatch would silently undo
          # a pre-release marking. 0.1.0-0.1.6 are marked pre-release by hand; this keeps
          # that intact. (ncipollo/release-action: "This will preserve the existing
          # prerelease state during updates.")
          prerelease: false
          omitPrereleaseDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./system.json, ./system.zip"
          tag: ${{ env.RELEASE_TAG }}

  # ---------------------------------------------------------------------------
  # Tell the Foundry Marketplace the release exists.
  #
  # A SEPARATE JOB, `needs: build`, and both halves of that are deliberate.
  #
  # `needs: build` because Foundry FETCHES the manifest URL to validate the
  # submission, so the release and its assets have to exist first. This cannot
  # be folded into `npm run release` for the same reason — that only pushes the
  # tag, and the assets do not exist for another minute or two.
  #
  # SEPARATE rather than one more step on `build`, so the signal stays precise.
  # If foundryvtt.com is down, or the token has expired, the release itself is
  # already published and green and only this job reds — which reads as "it
  # shipped, the Marketplace was not told", recoverable with one command
  # (`npm run publish:foundry X.Y.Z`). Folding it into `build` would paint a
  # perfectly good release red and say nothing about which half failed. It is
  # also the reason `check:warden` is kept out of this workflow entirely: a
  # release should not be hostage to someone else's outage. The difference is
  # that this runs AFTER publishing, so it cannot block anything.
  #
  # It FAILS rather than skips when the secret is missing. A silent skip is how
  # 0.1.22 shipped with empty release notes — a step nobody's checklist held.
  marketplace:
    needs: build
    runs-on: ubuntu-latest
    # TAG PUSHES ONLY. `workflow_dispatch` exists to rebuild an existing
    # release's assets, which is not a reason to re-announce it — a rebuild of
    # 0.1.10 would otherwise submit 0.1.10 to the Marketplace today.
    if: github.event_name == 'push'
    # Narrower than the workflow default: this job writes nothing to the
    # repository, it only reads the checkout and POSTs to foundryvtt.com.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # No `npm ci`: tools/release-foundry.mjs imports only node builtins and
      # uses global fetch, so the job needs no dependency install at all.
      - name: Announce the release to the Foundry Marketplace
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          # Repository secret. The script refuses with an explanatory message if
          # it is unset or lacks the `fvttp_` prefix, and never prints its value.
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: node tools/release-foundry.mjs
