# Publishes the project landing page (site/) to GitHub Pages.
#
# MIRROR-SAFE BY DESIGN. This repo is a push mirror from Gitea, and the mirror
# prunes refs that exist only on GitHub — that is what silently turned early
# releases into drafts. So there is deliberately NO gh-pages branch here: the
# page source lives in master (which the mirror owns) and Pages is fed by this
# workflow's artifact upload, leaving nothing for the mirror to prune.
#
# ONE-TIME SETUP, on GitHub: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Without that, this workflow's deploy step fails.
name: Pages

on:
  push:
    branches: [master]
    # Only rebuild when something the page actually shows has changed.
    paths:
      - "site/**"
      - "tools/site.mjs"
      - "docs/images/**"
      - "art/lydia-comer/**"
      - "logo/**"
      - "fonts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-deployed site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # THE PAGE'S GATED CLAIMS, checked before it is published (review #34
      # finding 21). site/index.html carries text the repo gates as published
      # claims: the class-icon author list and the art counts (check:licence),
      # and the translation-coverage figures (i18n:check). Those gates used to
      # run only at tag time. So at 0.1.25 a site sentence reached master with
      # the release push, Pages deployed it, and the same push's tag build then
      # failed i18n:check on that very sentence. The rule is main.yml's own:
      # the offline gates run BEFORE anything is published. The install and the
      # pack build are what the two gates need (i18n:check reads the packs'
      # strings through node-html-parser; check:licence reads LICENSE.txt's
      # paths against real top-level directories, packs/ among them), measured
      # in a bare clone. tools/site.mjs itself still uses only builtins.
      - run: npm ci
      - run: npm run build:packs
      - run: npm run check:licence
      - run: npm run i18n:check

      - name: Build the landing page
        run: npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
