<div class="flavor-dice-roll">
    <div class="dmg-label">{{label}}</div>

    {{#if (isNotNull targets)}}
    <div class="icon-action">
        <a class="btn apply-dmg" data-targets='{{targets}}' data-tooltip="{{localize 'CAIRN.ApplyDamage'}}">
            <i class="fas fa-burst"></i>
        </a>
    </div>
    {{/if}}

    {{!-- Impaired / Enhanced, on its own line. Empty for a normal roll, so an
          ordinary attack gains nothing. --}}
    {{#if quality}}
    <div class="dmg-quality">{{quality}}</div>
    {{/if}}
</div>
