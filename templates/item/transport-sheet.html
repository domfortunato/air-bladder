{{!-- No <form> here: ApplicationV2 supplies it (DocumentSheetV2 sets tag: "form").
      A nested one is dropped by the parser, taking this element's class with it. --}}
    <div class="item-sheet-grid transport">
        <!-- Portrait -->
        <div class="item-sheet-section-portrait">
            <img class="portrait" src="{{item.img}}" data-action="editImage" data-edit="img" title="{{item.name}}" />
        </div>
        <!-- Name -->
        <div class="item-sheet-section-name">
            <input class="name-input" type="text" name="name" value="{{nameDisplay}}" placeholder="{{ localize 'CAIRN.Name' }}" />
        </div>

        <!-- Type: worn (sack/backpack), mount (beast), or vehicle (cart/wagon).
             Sets the icon and directory visibility; none weighs on the carrier. -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.transportKind">{{ localize 'CAIRN.TransportKind' }}</label>
            <div class="resource-input-wrapper">
                <select name="system.transportKind" id="{{@root.idp}}-system.transportKind">
                    {{selectOptions transportKinds selected=system.transportKind localize=true}}
                </select>
            </div>
        </div>

        <!-- Capacity it holds -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.slots" data-tooltip="{{ localize 'CAIRN.TransportCapacity' }}">{{ localize 'CAIRN.Slots' }}</label>
            <div class="resource-input-wrapper">
                <input type="number" min="0" step="1" name="system.slots" id="{{@root.idp}}-system.slots"
                       value="{{system.slots}}" data-dtype="Number" />
            </div>
        </div>

        <!-- Bulky -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.bulky">{{ localize 'CAIRN.Bulky' }}</label>
            <div class="resource-input-wrapper">
                <input type="checkbox" {{checked system.bulky}} name="system.bulky" id="{{@root.idp}}-system.bulky"
                       value="{{system.bulky}}" data-dtype="Boolean" />
            </div>
        </div>

        <!-- Slow -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.slow">{{ localize 'CAIRN.TransportSlow' }}</label>
            <div class="resource-input-wrapper">
                <input type="checkbox" {{checked system.slow}} name="system.slow" id="{{@root.idp}}-system.slow"
                       value="{{system.slow}}" data-dtype="Boolean" />
            </div>
        </div>

        <!-- Cost -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.cost">{{ localize 'CAIRN.Cost' }}</label>
            <div class="resource-input-wrapper">
                <input type="number" min="0" step="1" name="system.cost" id="{{@root.idp}}-system.cost"
                       value="{{system.cost}}" data-dtype="Number" />
            </div>
        </div>

        <div class="item-sheet-section-tabs">
            <nav class="tabs" data-group="primary">
            {{#each tabs}}
            <a class="item {{this.cssClass}}" data-action="tab" data-group="{{this.group}}"
                data-tab="{{this.id}}">{{ localize this.label }}</a>
            {{/each}}
        </nav>
            <section class="content">
                <div class="tab {{tabs.description.cssClass}}" data-group="primary" data-tab="description">
                    <prose-mirror name="system.description" value="{{system.description}}" toggled collaborate relative
                        data-document-uuid="{{item.uuid}}">{{{enrichedDescription}}}</prose-mirror>
                </div>
            </section>
        </div>
    </div>
