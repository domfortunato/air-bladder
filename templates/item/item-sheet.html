{{!-- No <form> here: ApplicationV2 supplies it (DocumentSheetV2 sets tag: "form").
      A nested one is dropped by the parser, taking this element's class with it. --}}
    <div class="item-sheet-grid">
        <!-- Portrait -->
        <div class="item-sheet-section-portrait">
            <img class="portrait" src="{{item.img}}" data-action="editImage" data-edit="img" title="{{item.name}}" />
        </div>
        <!-- Name -->
        <div class="item-sheet-section-name">
            <input class="name-input" type="text" name="name" value="{{item.name}}" placeholder="{{ localize 'CAIRN.Name' }}" />
        </div>
        <!-- Equipped -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.equipped">{{ localize 'CAIRN.Equipped' }}</label>
            <div class="resource-input-wrapper">
                <input type="checkbox" {{checked system.equipped}} name="system.equipped" id="{{@root.idp}}-system.equipped"
                    value="{{system.equipped}}" data-dtype="Boolean" />
            </div>
        </div>

          <!-- Bulky -->
          <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.bulky">{{ localize 'CAIRN.Bulky' }}</label>
            <div class="resource-input-wrapper">
                <input type="checkbox" {{checked system.bulky}} name="system.bulky" id="{{@root.idp}}-system.bulky"
                        value="{{system.bulky}}" data-dtype="Boolean" />
            </div>
        </div>

        <!-- Weightless -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.weightless">{{ localize 'CAIRN.Weightless' }}</label>
            <div class="resource-input-wrapper">
                <input type="checkbox" {{checked system.weightless}} name="system.weightless" id="{{@root.idp}}-system.weightless"
                        value="{{system.weightless}}" data-dtype="Boolean" />
            </div>
        </div>
      
        <!-- Quantity -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.quantity">{{ localize 'CAIRN.Quantity' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.quantity" id="{{@root.idp}}-system.quantity"
                        value="{{system.quantity}}" data-dtype="Number" />
            </div>
        </div>

        <!-- Number of uses -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.uses.value">{{ localize 'CAIRN.Uses' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.uses.value" id="{{@root.idp}}-system.uses.value"
                       value="{{system.uses.value}}" data-dtype="Number" />
            </div>
        </div>

        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.uses.max">{{ localize 'CAIRN.MaxUses' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.uses.max" id="{{@root.idp}}-system.uses.max"
                      value="{{system.uses.max}}" data-dtype="Number" />
            </div>
        </div>
              
        <!-- Blast -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.blast">{{ localize 'CAIRN.Blast' }}</label>
            <div class="resource-input-wrapper">
                <input type="checkbox" {{checked system.blast}} name="system.blast" id="{{@root.idp}}-system.blast"
                       value="{{system.blast}}" data-dtype="Boolean" />
            </div>
        </div>
        <!-- Damage -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.damageFormula">{{ localize 'CAIRN.Damage' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.damageFormula" id="{{@root.idp}}-system.damageFormula"
                       value="{{system.damageFormula}}" data-dtype="String" />
            </div>
        </div>
        

        <!-- Cost -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.cost">{{ localize 'CAIRN.Cost' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.cost" id="{{@root.idp}}-system.cost"
                       value="{{system.cost}}" data-dtype="Number" />
            </div>
        </div>
        
        <div class="item-sheet-section-tabs">
            <nav class="tabs" data-group="primary">
            {{#each tabs}}
            <a class="item {{this.cssClass}}" data-action="tab" data-group="{{this.group}}"
                data-tab="{{this.id}}">{{ localize this.label }}</a>
            {{/each}}
        </nav>
            <section class="content">
                <div class="tab {{tabs.description.cssClass}}" data-group="primary" data-tab="description">
                    <prose-mirror name="system.description" value="{{system.description}}" toggled collaborate relative
                        data-document-uuid="{{item.uuid}}">{{{enrichedDescription}}}</prose-mirror>
                </div>
                <div class="tab {{tabs.[crit-dmg].cssClass}}" data-group="primary" data-tab="crit-dmg">
                    <prose-mirror name="system.criticalDamage" value="{{system.criticalDamage}}" toggled collaborate relative
                        data-document-uuid="{{item.uuid}}">{{{enrichedCriticalDamage}}}</prose-mirror>
                </div>
            </section>
        </div>
    </div>
