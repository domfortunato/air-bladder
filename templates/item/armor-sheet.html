<form class="cairn" autocomplete="off">
    <div class="item-sheet-grid armor">
        <!-- Portrait -->
        <div class="item-sheet-section-portrait">
            <img class="portrait" src="{{data.img}}" data-edit="img" title="{{data.name}}" />            
        </div>
        <!-- Name -->
        <div class="item-sheet-section-name">
            <input class="name-input" type="text" name="name" value="{{data.name}}" placeholder="{{ localize 'CAIRN.Name' }}" />
        </div>
        <!-- Equipped -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.equipped">{{ localize 'CAIRN.Equipped' }}</label>
            <div class="resource-input-wrapper">
                <input type="checkbox" {{checked data.system.equipped}} name="system.equipped" id="{{@root.idp}}-system.equipped"
                       value="{{data.system.equipped}}" data-dtype="Boolean" {{ disabled (not item.system.isEquipable) }} />
            </div>
        </div>
        <!-- Armor -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.armor">{{ localize 'CAIRN.Armor' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.armor" id="{{@root.idp}}-system.armor"
                       value="{{data.system.armor}}" data-dtype="Number" />
            </div>
        </div>

        <!-- Bulky -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.bulky">{{ localize 'CAIRN.Bulky' }}</label>
            <div class="resource-input-wrapper">
                <input type="checkbox" {{checked data.system.bulky}} name="system.bulky" id="{{@root.idp}}-system.bulky"
                       value="{{data.system.bulky}}" data-dtype="Boolean" />
            </div>
        </div>
        <!-- Weightless -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.weightless">{{ localize 'CAIRN.Weightless' }}</label>
            <div class="resource-input-wrapper">
                <input type="checkbox" {{checked data.system.weightless}} name="system.weightless" id="{{@root.idp}}-system.weightless"
                        value="{{data.system.weightless}}" data-dtype="Boolean" />
            </div>
        </div>
                

        <!-- Number of uses -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.uses.value">{{ localize 'CAIRN.Uses' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.uses.value" id="{{@root.idp}}-system.uses.value"
                        value="{{data.system.uses.value}}" data-dtype="Number" />
            </div>
        </div>

        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.uses.max">{{ localize 'CAIRN.MaxUses' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.uses.max" id="{{@root.idp}}-system.uses.max"
                      value="{{data.system.uses.max}}" data-dtype="Number" />
            </div>
        </div>
        
        
        

         <!-- Cost -->
         <div class="resource-counter long-counter">
            <label class="large-resource-label" for="{{@root.idp}}-system.cost">{{ localize 'CAIRN.Cost' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.cost" id="{{@root.idp}}-system.cost"
                    value="{{data.system.cost}}" data-dtype="Number" />
            </div>
        </div>

        <div class="item-sheet-section-tabs">
            <nav class="tabs" data-group="primary">
                <a class="item" data-group="primary" data-tab="description">{{ localize 'CAIRN.Description' }}</a>
            </nav>
            <section class="content">
                <div class="tab" data-group="primary" data-tab="description">
                    {{ editor enrichedDescription target="system.description" button=true owner=owner editable=editable engine="prosemirror" collaborate=true }}
                </div>
            </section>
        </div>
    </div>
</form>
