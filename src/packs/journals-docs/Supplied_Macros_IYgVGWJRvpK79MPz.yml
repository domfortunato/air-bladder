pages:
  - _id: YsxiL5SGT24RGQNx
    name: Supplied Macros
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Four macros ship in the <strong>Warden Macros</strong> compendium, in the <strong>Air Bladder - Macros</strong> folder. Each flips one world setting, so you do not have to open Configure Settings mid-session. Drag one to your hotbar and click it.</p> <p>Only the Warden can use them. Each takes effect at once for everyone, with no reload.</p> <table> <thead> <tr> <th>Macro</th> <th>Setting it flips</th> <th>What changes</th> </tr> </thead> <tbody><tr> <td><strong>Toggle Change Log</strong></td> <td><strong>Log manual changes to chat</strong></td> <td>Whether a hand-made change to stats, gold, traits, conditions, scars or inventory is whispered to chat.</td> </tr> <tr> <td><strong>Toggle Player Character Creation</strong></td> <td><strong>Allow players to create new player characters through random generation or .json import</strong></td> <td>Whether players see <strong>Create PC</strong> and <strong>Import from Kettlewright</strong> in the Actors sidebar.</td> </tr> <tr> <td><strong>Toggle Player Marketplace</strong></td> <td><strong>Let players buy and take from the marketplace</strong></td> <td>Whether players see the <strong>Marketplace</strong> button on sheets they own. While it is off, a purchase from a shop window a player already had open is refused. You can always shop.</td> </tr> <tr> <td><strong>Toggle Player Creation Tools</strong></td> <td><strong>Let players use Character Creation tools on their sheets</strong></td> <td>Whether players see the <strong>CharGen</strong> toggle, the <strong>Roll Character</strong> button and the re-roll dice on their sheets. While it is off they are hidden even on a character whose CharGen is on.</td> </tr> </tbody></table>'
      format: 1
