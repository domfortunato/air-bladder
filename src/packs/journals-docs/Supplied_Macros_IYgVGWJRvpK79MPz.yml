    name: Supplied Macros
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Four ready-made macros ship in the <strong>Macros</strong> compendium. Each is a Warden&#39;s switch: drag it to your hotbar and click to flip the world setting it names — no trip into Game Settings. All four take effect on connected clients live, with no reload, and all four are Warden-only (the server refuses a world-setting write from anyone else; the macro&#39;s own check just says so politely instead of failing in silence).</p> <table> <thead> <tr> <th>Macro</th> <th>What it flips</th> </tr> </thead> <tbody><tr> <td><strong>Toggle Change Log</strong></td> <td>The manual-change log. Read live at every posting site, so it takes effect on the next change with no reload.</td> </tr> <tr> <td><strong>Toggle Player Character Creation</strong></td> <td>The player-facing character-creation buttons in the Actors sidebar — <strong>Generate PC</strong> and <strong>Import from Kettlewright</strong>. Connected players&#39; directories update live.</td> </tr> <tr> <td><strong>Toggle Player Marketplace</strong></td> <td>Player shopping. Open sheets update live — the Marketplace button hides or returns, and a purchase is refused even behind a stale, already-open shop dialog.</td> </tr> <tr> <td><strong>Toggle Player Creation Tools</strong></td> <td>The sheet&#39;s Character Creation tools as players see them: the title-bar Character Creation Mode toggle, the Roll button and every re-roll die hide from players while it is off — even on an actor whose own Character Creation Mode is on.</td> </tr> </tbody></table>'
      format: 1
