    name: Generating Monsters
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p><strong>Create Monster</strong> rolls a complete monster: abilities, HP, an attack, sometimes armor, a description and a portrait. It follows the <strong>Creating Monsters</strong> procedure in the Cairn 2e Warden&#39;s Guide. You choose how dangerous it is.</p> <p>Only the Warden sees the button.</p> <p><em>The numbers behind the generator are recorded in monster-generation.md.</em></p> <hr> <h2>Where the button is</h2> <p><strong>Actors tab → the button row at the top → Create Monster</strong> (the dragon icon). The same button is on the <strong>Monsters</strong> tab of the Warden&#39;s Dashboard, under <strong>Create</strong>.</p> <p>It opens a window with a <strong>How dangerous is it?</strong> list and a <strong>Use random generation.</strong> tick-box. Clear the box if you want an empty Monster sheet. The list greys out, because an empty sheet doesn&#39;t have a tier.</p> <table> <thead> <tr> <th>Tier</th> <th>HP</th> <th>Attack die</th> <th>Armor</th> </tr> </thead> <tbody><tr> <td><strong>Standard</strong></td> <td>3</td> <td>d6</td> <td>1 time in 4</td> </tr> <tr> <td><strong>Hardier</strong></td> <td>6</td> <td>d8</td> <td>1 time in 2</td> </tr> <tr> <td><strong>Serious</strong></td> <td>10</td> <td>d10</td> <td>3 times in 4</td> </tr> <tr> <td><strong>Random</strong> (the default)</td> <td>—</td> <td>—</td> <td>picks Standard, Hardier or Serious, weighted 3 : 2 : 1</td> </tr> </tbody></table> <p><strong>Cancel</strong> or <strong>✕</strong> closes the window and doesn&#39;t create anything.</p> <h2>What you get</h2> <ul> <li><strong>Abilities</strong> from the SRD&#39;s ladder: 3 (deficient), 6 (weak), 10 (average), 14 (noteworthy) or 18 (legendary). STR runs higher at higher tiers. DEX is always 6, 10 or 14.</li> <li><strong>One equipped attack</strong> with the tier&#39;s damage die. Its name is the rolled attack type plus <code>*</code> (<em>Bites*</em>, <em>Constricts*</em>), the marker the shipped monsters use for an attack whose special effect is in the description.</li> <li><strong>Armor as an equipped item</strong>, when the tier gives it, worth 1 to 3. It&#39;s named for the rolled feature when that feature is Carapace, Shell or Scales, and &quot;Tough Hide&quot; otherwise.</li> <li><strong>A five-line description</strong>: the appearance, a <strong>Quirk</strong>, a <strong>Weakness</strong>, an <strong>Ability</strong> and a <strong>Critical Damage</strong> effect. It&#39;s all prose for you to apply. The system doesn&#39;t automate any of it.</li> <li><strong>A draft name</strong> built from the appearance rolls, such as <em>Hulking Tentacled Creature</em>. Rename it when you know what it is.</li> <li><strong>A portrait</strong> from the creature categories of the Game-Icons gallery, or from your own monster art if you keep any (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.XzQJvxDorYQdCqGp]{Using Your Own Portraits}). The token uses the same image. It&#39;s hostile and unlinked, like the shipped monsters, so you can place the same monster many times and damage each one separately. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.gFK4npERocroPaEG]{Tokens and Sheets}.</li> </ul> <h2>Re-rolling a monster</h2> <p>With Character Creation Mode on, a monster sheet has a <strong>Roll Monster</strong> button in its title bar. A generated monster starts with the mode off, so press the <strong>CharGen: Off</strong> toggle in the title bar to turn it on.</p> <p>Roll Monster asks <strong>Roll this monster again?</strong> and offers the four tiers as buttons. Pressing one is the confirmation, and it can&#39;t be undone. Everything the monster is carrying is deleted, and its abilities, HP, attack, armor and description are re-rolled. Its name, portrait and token stay. Closing the window doesn&#39;t change anything.</p> <p>Because the name and portrait stay, you can turn a Standard monster the party ignored into a Serious one without changing what it looks like.</p> <h2>The eight tables behind it</h2> <p>They are RollTables in the <strong>Warden — Monsters</strong> compendium:</p> <ul> <li><code>Warden: Monster - Appearance (Physique)</code></li> <li><code>Warden: Monster - Appearance (Feature)</code></li> <li><code>Warden: Monster - Trait (Quirk)</code></li> <li><code>Warden: Monster - Trait (Weakness)</code></li> <li><code>Warden: Monster - Attack (Type)</code></li> <li><code>Warden: Monster - Attack (Critical Damage)</code></li> <li><code>Warden: Monster - Ability (Power)</code></li> <li><code>Warden: Monster - Ability (Target)</code></li> </ul> <p>The text is the SRD&#39;s Creating Monsters content (Warden&#39;s Guide, CC BY-SA 4.0, by Yochai Gal). The generator never marks a table&#39;s rows as drawn.</p> <p><strong>You can replace any of them</strong>, as with the @UUID[Compendium.air-bladder.journals-docs.JournalEntry.xrpS5v0W5q67jIzx]{faction generator}&#39;s tables. Make a RollTable in your world with exactly the same name as a shipped table, and the generator rolls yours. Your table survives a system update. Edits made inside the shipped compendium don&#39;t, because an update replaces it.</p> <h2>Monsters play by the same rules</h2> <p>A monster takes damage the same way every other creature does. Damage past HP comes off STR and calls for a STR save. Damage that lands exactly on 0 HP rolls a Scar. Armor is capped at 3.</p>'
