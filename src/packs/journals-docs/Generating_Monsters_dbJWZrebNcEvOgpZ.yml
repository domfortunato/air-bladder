    name: Generating Monsters
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>One click rolls a complete monster — a real Actor with a statblock, an equipped attack, armor, a five-line description and a portrait — following the Cairn 2e Warden&#39;s Guide procedure for <strong>Creating Monsters</strong>. You pick how dangerous it is; the tables do the rest.</p> <p>You need to be the Warden (GM). Players never see the button.</p> <p><em>This page is about using the generator. Every number behind it — the tier stats, the ability weights, the design reasoning — is recorded in monster-generation.md.</em></p> <hr> <h2>Where the button is</h2> <p><strong>Actors tab → the button row at the top → Generate Monster</strong> (the dragon icon).</p> <p>Clicking it opens one question — <strong>&quot;How dangerous is it?&quot;</strong> — with four buttons:</p> <table> <thead> <tr> <th>Tier</th> <th>HP</th> <th>Attack die</th> <th>Armor</th> </tr> </thead> <tbody><tr> <td><strong>Standard</strong></td> <td>3</td> <td>d6</td> <td>rarely</td> </tr> <tr> <td><strong>Hardier</strong></td> <td>6</td> <td>d8</td> <td>sometimes</td> </tr> <tr> <td><strong>Serious</strong></td> <td>10</td> <td>d10</td> <td>usually</td> </tr> <tr> <td><strong>Random</strong> (the default)</td> <td>—</td> <td>—</td> <td>weighted 3 : 2 : 1, so mooks are common and bosses are rare</td> </tr> </tbody></table> <p>Dismissing the dialog with <strong>✕</strong> creates nothing — a monster only ever arrives from an explicit button press.</p> <h2>What you get</h2> <ul> <li><strong>Abilities on the SRD&#39;s ladder</strong> — 3 (deficient), 6 (weak), 10 (average), 14 (noteworthy), 18 (legendary) — never 3d6. STR shifts upward with the tier; DEX stays in the middle band, because speed is texture, not what makes a monster deadly.</li> <li><strong>One equipped attack</strong>, its damage die set by the tier. Its name is the rolled attack verb plus <code>*</code> — <em>Bites*</em>, <em>Constricts*</em> — the same marker the shipped monsters use for an attack whose special effect lives in the description.</li> <li><strong>Armor as an equipped item</strong> when the tier grants it, so the Armor score derives exactly as it does for the 205 shipped monsters. It is named for the rolled feature when the feature <em>is</em> the armor — Carapace, Shell, Scales — and &quot;Tough Hide&quot; otherwise.</li> <li><strong>A five-line description</strong>: the appearance, a <strong>Quirk</strong>, a <strong>Weakness</strong>, an <strong>Ability</strong>, and a <strong>Critical Damage</strong> effect. All of it is prose, none of it is automated — the rules stay in your hands, as everywhere in this system.</li> <li><strong>A draft name</strong> composed from the appearance rolls — <em>Hulking Tentacled Creature</em>. The SRD&#39;s final step (&quot;Thunder Snail&quot;) is creative interpretation no table can roll; the composed name keeps every monster distinguishable in the directory until inspiration strikes. Rename freely.</li> <li><strong>A portrait</strong> drawn from the creature categories of the Game-Icons gallery, with the token wearing the same image — hostile and unlinked, like the shipped monsters.</li> </ul> <h2>Re-rolling a monster</h2> <p>Every monster sheet has a <strong>Roll Monster</strong> button in its title bar (the same dragon). If you don&#39;t see it, flip <strong>Character Creation Mode</strong> on with the toggle beside it.</p> <p>Clicking Roll Monster opens the same tier picker with different wording — and here <strong>the picker is also the confirmation</strong>: it tells you the abilities, HP, attack, armor and description will be re-rolled and that the <strong>name, portrait and token stay</strong>. Dismissing it touches nothing. There is no second &quot;are you sure&quot; — the button press in the picker is the yes, and it cannot be undone.</p> <p>That keep-the-name rule is what makes re-rolling useful mid-campaign: you can promote a Standard nuisance the party ignored into a Serious threat without it changing face.</p> <h2>The eight tables behind it</h2> <p>All of them ship as RollTables in the <strong>Warden — Monsters</strong> compendium:</p> <ul> <li><code>Warden: Monster - Appearance (Physique)</code></li> <li><code>Warden: Monster - Appearance (Feature)</code></li> <li><code>Warden: Monster - Trait (Quirk)</code></li> <li><code>Warden: Monster - Trait (Weakness)</code></li> <li><code>Warden: Monster - Attack (Type)</code></li> <li><code>Warden: Monster - Attack (Critical Damage)</code></li> <li><code>Warden: Monster - Ability (Power)</code></li> <li><code>Warden: Monster - Ability (Target)</code></li> </ul> <p>The text is the SRD&#39;s Creating Monsters content (Warden&#39;s Guide, CC BY-SA 4.0, by Yochai Gal). The generator <em>rolls</em> these tables rather than <em>drawing</em> from them, so it never marks your table rows as drawn.</p> <p>One difference from the @UUID[Compendium.air-bladder.journals-docs.JournalEntry.xrpS5v0W5q67jIzx]{faction generator}: these tables are read <strong>straight from the compendium</strong> — there is no world-table-by-name override. You can unlock the pack and edit the rows, but a system update ships fresh copies, so treat edits there as temporary.</p> <h2>Monsters play by the same rules</h2> <p>Generated or shipped, a monster takes damage exactly like everyone else — by design, the damage flow has no actor-type exceptions. Overflow past HP dents STR and forces a STR save, damage landing exactly on 0 HP rolls a Scar, and the armor cap of 3 holds. A monster that survives an encounter carries its scars into the next one.</p>'
