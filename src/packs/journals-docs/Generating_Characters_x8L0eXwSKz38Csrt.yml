    name: Generating Characters
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>A Cairn character is rolled first and chosen afterwards. Air Bladder has three ways to get one — roll it, open an empty sheet, or import it from Kettlewright — and one set of tools on the sheet for changing the result. There is no step-by-step character builder.</p> <h2>Create PC</h2> <p><strong>Create PC</strong> is in the button row at the top of the Actors sidebar. It asks one question, then rolls a whole character: a name, a portrait, abilities, Hit Protection, gold, a background with its gear and questions, traits and an age. A Cairn 2e character is also dealt a bond. The finished sheet opens, and the character is filed in the <strong>Party</strong> folder.</p> <p>If you offer both Cairn 2e and Barebones, the same window asks which edition the character is. Custom 2e backgrounds join the 2e pool; they do not add a choice. The three switches — <strong>Offer canon Cairn 2e backgrounds</strong>, <strong>Offer Cairn Barebones character sheets</strong> and <strong>Offer custom Cairn 2e backgrounds</strong> — are under <strong>Game Settings → Air Bladder → Configure Character Generation</strong>. The edition decides only how a character is made. Both play by the same rules.</p> <p>Two more settings in that window:</p> <ul> <li><strong>Show character generation dice rolls in chat</strong> posts HP, STR, DEX, WIL and Gold as one chat message whenever a character is generated or re-rolled.</li> <li><strong>Show the Roll Character, Roll NPC and Roll Monster buttons in sheet headers</strong> hides those three buttons when it is off.</li> </ul> <h2>Start from an empty sheet</h2> <p>The question Create PC asks is a tick-box, <strong>Use random generation.</strong> Clear it and you get a character with nothing rolled: no background, gear, bond, traits or age. Abilities start at 10 and Hit Protection at 3. Type over them.</p> <p>The same box is on <strong>Create NPC</strong>, <strong>Create Hireling</strong> and <strong>Create Monster</strong>. On <strong>Create Faction</strong>, clearing it lets you pick each part of the faction from its table (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.xrpS5v0W5q67jIzx]{Generating factions}).</p> <p>An empty sheet is for a table that rolls on paper. Roll the character with the book and your own dice, then copy it in: type the numbers, and use the <strong>pick-list buttons</strong> for anything that comes off a table. An empty sheet opens with <strong>Character Creation Mode</strong> on, so those buttons are already showing. Turn the mode off when you are done.</p> <p><strong>An empty sheet is never handed anything.</strong> Picking a background, a bond, a background question&#39;s answer or a failed career records the choice and grants no gear and no coins. Type the inventory in yourself.</p> <p>The same holds for an empty NPC, hireling or monster. Giving an empty hireling a career, or an empty NPC a background, records the choice and hands over none of its gear. A career also leaves the numbers you typed alone.</p> <p>This lasts for the life of the sheet. To have the dice furnish the character after all, press <strong>Roll Character</strong> and leave <strong>Background</strong> or <strong>Starting gear</strong> ticked. From then on the sheet behaves like a generated one, and a background picked later brings its gear. On an NPC, hireling or monster, <strong>Roll NPC</strong> or <strong>Roll Monster</strong> in the title bar does the same.</p> <p>A player sees the tick-box only on Create PC, and only while <strong>Let players use Character Creation tools on their sheets</strong> is on, because an empty sheet can only be filled in with those tools. With it off, the player&#39;s window only confirms.</p> <h2>Import from Kettlewright</h2> <p><strong>Import from Kettlewright</strong> is in the same button row. Choose a character&#39;s <code>.json</code> export from <a href="https://kettlewright.com/">Kettlewright</a>, the official Cairn app, and it becomes a new character here.</p> <ul> <li>Abilities, HP, gold and inventory arrive as exported.</li> <li>A stock Kettlewright portrait is matched to the same face. A portrait the player uploaded is shown from kettlewright.com; save a copy and set it from the sheet to keep it.</li> <li>Background questions and bonds are matched to their tables, so they can still be re-rolled or picked.</li> <li>A Barebones character arrives as Barebones.</li> <li>A pet becomes an item if Air Bladder has it as an item and the character has room. Otherwise it becomes a companion connected to the character.</li> <li>Kettlewright containers other than the main inventory are not rebuilt. Their contents go onto the character.</li> <li>An item or bond that matches nothing is still imported, built from its tags or kept as text.</li> <li>A background this world does not have does not stop the import. It is kept as plain text, and its questions&#39; answers and bond cannot be re-rolled or picked from a table.</li> </ul> <p>A summary window lists everything worth checking. Always look over the inventory afterwards.</p> <h2>Players can do both</h2> <p>Players see <strong>Create PC</strong> and <strong>Import from Kettlewright</strong> while <strong>Allow players to create new player characters through random generation or .json import</strong> is on. The shipped <strong>Toggle Player Character Creation</strong> macro flips it mid-session. A player who imports gets the same options and the same summary you would.</p> <p>A player who lacks Foundry&#39;s permission to create actors can still use both buttons. Your session makes the character and hands it over as theirs, and you get a notice naming the player and the character. This needs a Warden logged in. With none connected, that player&#39;s buttons are greyed out, with the reason on hover, and they come back when a Warden arrives.</p> <h2>The character sheet</h2> <p>The sheet turns its pages from the tabs hung on its edge:</p> <ul> <li><strong>Character</strong> — portrait, name, Pronouns and Age, Background, the trait sentence, abilities, HP, Armor, inventory slots and Gold.</li> <li><strong>Inventory</strong> — everything carried, and Fatigue.</li> <li><strong>Growth</strong> — Scars, and a journal for the skills and abilities the character gains.</li> <li><strong>Background &amp; Notes</strong> — the bond, the background questions and their answers, the Omen, a description and notes.</li> </ul> <h2>Character Creation Mode</h2> <p>A generated or imported character opens with its creation tools put away. The toggle in the sheet&#39;s title bar reads <strong>CharGen: Off</strong>; press it to turn <strong>Character Creation Mode</strong> on. While it is on:</p> <ul> <li>A <strong>die</strong> beside each part re-rolls that part alone: the name, the portrait, the age, the background (with its gear), the omen, a bond, a background question, and a Barebones character&#39;s failed career where that hack is on.</li> <li>A <strong>pick-list button</strong> (the list icon) beside the name, background, failed career, omen, bond and question dice, and on the portrait, lets you choose instead. Picking the rows you rolled on paper grants whatever those rows grant.</li> <li>A <strong>pen</strong> at the end of the trait sentence opens the <strong>Traits</strong> window, with a die and a list for each trait.</li> <li>The four <strong>Max</strong> boxes can be typed in. They are locked while the mode is off.</li> <li>The STR, DEX and WIL save dice are greyed out. Turn the mode off to roll saves.</li> <li><strong>Roll Character</strong> appears in the title bar.</li> </ul> <p>Generate, re-roll or pick the parts that do not fit, then turn the mode off and play.</p> <p>For players these tools follow <strong>Let players use Character Creation tools on their sheets</strong>, flipped by the <strong>Toggle Player Creation Tools</strong> macro. You can allow character creation and keep re-rolls to yourself, or allow both.</p> <h3>Roll Character</h3> <p><strong>Roll Character</strong> opens a checklist of everything that can be re-rolled. Uncheck what you want to keep; only the rest is re-rolled.</p> <ul> <li><strong>Starting gear</strong> and, on a 2e character, the name and the two Background Questions sit under <strong>Background</strong>. A new background deals its own. On a Barebones character the name has its own line.</li> <li>Bonds re-roll only when <strong>Bond(s)</strong> is checked. A new background still keeps only as many bonds as it allows. Any beyond that are removed, with their items and coins.</li> <li>A background you picked by hand starts unchecked.</li> <li>On a Barebones character, <strong>Starting gear</strong> also covers the Barebones equipment: the Rations, Torch, weapon, armor and Additional Gear roll are dealt again.</li> <li>What the list does not offer is never touched: notes, scars, pronouns, and anything bought or given.</li> </ul> <p>A Barebones character made before Air Bladder 0.1.27 still holds the equipment it was first dealt, and a re-roll cannot tell that from things the player bought. Delete those items by hand once before you re-roll, or the character ends up with both sets.</p> <p>A companion, cart or pack that the old background or a question granted is never deleted by a re-roll. It is disconnected from the character and stays in the world, with everything stowed on it, until you delete it. Its name gains <strong>o_</strong> in front (a Mule becomes <strong>o_Mule</strong>), so sorting the Actors tab by name gathers them.</p> <h2>Turn bonds off</h2> <p><strong>Game Settings → Air Bladder → Configure Character Generation → Use bonds.</strong> With it off:</p> <ul> <li>A new character is dealt no bond, and none of the items or coins a bond grants.</li> <li>Bonds leave every character sheet and the Roll Character window, and printed sheets drop their Bonds section.</li> <li>A background that says to roll a second time on the Bonds table, like the Fieldwarden, is shown without that sentence.</li> </ul> <p>A character who already has a bond keeps it, with whatever it gave them. It is hidden, and comes back if you switch the setting on again.</p> <h2>Give Barebones characters a failed career</h2> <p>Knave 2e gives each character a career that didn&#39;t work out. To give Barebones characters one, turn on <strong>Give Barebones Characters a failed career (like Knave 2e)</strong> under <strong>Game Settings → Air Bladder → Configure Hacks</strong>. It is greyed out unless <strong>Offer Cairn Barebones character sheets</strong> is on. Cairn 2e characters never get one.</p> <p>With it on, Create PC deals a Barebones character two things:</p> <ul> <li><strong>Failed career</strong> — a second Barebones background, never the character&#39;s own. It grants nothing else.</li> <li><strong>Failed career item</strong> — one item drawn at random from that background&#39;s starting gear, kept as a keepsake. It is Petty, so it fills no slot.</li> </ul> <p>Both lines sit under the background on the sheet. In Character Creation Mode the career has a die and a list, and the item has a die that draws again from the same career. A new career replaces the old keepsake. <strong>Roll Character</strong> offers <strong>Failed career</strong> and, under it, <strong>Keepsake item</strong>. The printed sheet shows the career.</p> <p>Outside Character Creation Mode an empty line is hidden. Turn the setting on in a world that already has Barebones characters and the lines appear, empty, in Character Creation Mode for you to roll. Turn it off and the lines go; the career and its keepsake stay on the character.</p> <h2>Choose the dice</h2> <p><strong>Game Settings → Air Bladder → Configure Character Generation</strong> has four settings for what a character is rolled with. The first three apply to player characters only. The age formula is also used for generated NPCs and hirelings.</p> <table> <thead> <tr> <th>Setting</th> <th>Choices</th> </tr> </thead> <tbody><tr> <td><strong>Ability dice for player characters</strong></td> <td>Default (3d6) · Adventurer (4d6kh3) · Crawler (2d6 + 3)</td> </tr> <tr> <td><strong>Gold dice for player characters</strong></td> <td>the same three</td> </tr> <tr> <td><strong>Hit Protection formula for player characters</strong></td> <td>any formula; <code>1d6</code> by default</td> </tr> <tr> <td><strong>Age formula for generated characters</strong></td> <td>any formula; <code>2d20 + 10</code> by default</td> </tr> </tbody></table> <p><strong>Default</strong> is the book&#39;s roll. <strong>Adventurer</strong> rolls four dice and keeps the best three. <strong>Crawler</strong> rolls between 5 and 15. The two menus are independent.</p> <p>For Hit Protection, type a plain number for a fixed value: <code>4</code> gives every character 4. Leave it blank for <code>1d6</code>. The notation is explained in @UUID[Compendium.air-bladder.journals-docs.JournalEntry.JN9oUEMUbsvjwn8A]{Dice Formulas}.</p> <p>These set the base roll only. Coins a bond or a background question grants are added on top.</p> <p>To see what a row will roll, hover STR, DEX, WIL, Hit Protection, Gold or Age in the Roll Character checklist. The die beside Age on the sheet names its formula the same way.</p> <h2>Make the tables yours</h2> <p>Everything a generated character is dealt from is a rollable table. A table in <strong>your world</strong> with a shipped table&#39;s name is rolled instead of the shipped one. Foundry overwrites the shipped compendiums on every system update, so treat them as templates: copy them into your world and edit the copies.</p> <p>Three Warden-only buttons do the copying:</p> <ul> <li><strong>Create a Custom Spell Table…</strong>, on the <strong>Rollable Tables</strong> sidebar tab. It copies the table a random spellbook or scroll is dealt from — <code>Spells — Canon (1d100)</code>, or <code>Spells — GLoG</code> while the GLoG Magic hack is on — into a <strong>Custom Spells</strong> folder, with every spellbook it can hand out. If you copy the canon list and switch the hack on later, press the button again for the GLoG list.</li> <li><strong>Create Custom Barebones Creation Tables…</strong>, on the same tab. It copies the six tables a Barebones character is dealt from — Weapon, Armor, Additional Gear and the three Weapon Tier tables — into a <strong>Custom Barebones Character Creation</strong> folder, with every item, mount and transport they can hand out. The items are sorted into a subfolder per source compendium.</li> <li><strong>Create Custom 2e Backgrounds and Tables…</strong>, on the same tab and at the top of the <strong>Compendium</strong> tab. It copies the 27 backgrounds and the eleven tables a 2e character rolls on. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.yJJsiQGfqZwkGBV0]{Creating Custom Backgrounds} and @UUID[Compendium.air-bladder.journals-docs.JournalEntry.mlSyCzimMvBjzxFH]{Customizing Bonds}.</li> </ul> <p>Each button also points every row of the copied tables at your copies of the items. A table imported by itself still hands out the shipped item, however you edited yours. With the rows pointed at your copies, changing a weapon&#39;s damage changes what the next character is dealt.</p> <p>A window afterwards says what was copied and offers to open the folders. Running a button again never overwrites anything. It only adds what is missing.</p> <p>Each copied table has a note at the top saying what it is dealt for and how to add a row. A table opens in view mode, so press <strong>Edit</strong> at the top of its window first. Drag a spellbook onto the spell table and the table re-sorts by name, formula included, so the new spell can be rolled. Drag an item onto a Barebones creation table and the table&#39;s die follows its rows.</p> <h2>Taking a background out of play</h2> <p>You do not need a copy to hide a shipped background. Open any Cairn 2e character with <strong>Character Creation Mode</strong> on and press the <strong>pick-list button</strong> beside Background. Every background in play is listed, with an <strong>eye</strong> at the end of its row that only the Warden sees. Click the eye and that background is out: its row greys out for you, and players no longer see it or roll it. Click the eye again to bring it back.</p> <p>The choice is per background and holds for every character and every session until you change it. It works on the Player&#39;s Guide twenty, the seven in <strong>Backgrounds (Custom)</strong>, and your own copies. A copy made by <strong>Create Custom 2e Backgrounds and Tables…</strong> counts as the same background: one you switched off stays off when its copy lands, and switching either back on switches on both. The last background left in play cannot be switched off.</p>'
