    name: Generating Characters
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Cairn characters are not built — they are dealt. Air Bladder gives you three ways to get one, and one loop for making the result yours. There is deliberately no step-by-step &quot;character builder&quot;: the dice hand you a person, and the choices come after.</p> <h2>Create PC</h2> <p>The <strong>Create PC</strong> button sits above the Actors sidebar. Clicking it asks one question, then rolls everything a Cairn 2e character starts with — abilities, Hit Protection, a background with its gear and questions, traits, age, and a bond — and opens the finished sheet. With more than one content source enabled (Custom 2e, Barebones), the same window asks which table to deal from.</p> <h2>Start from an empty sheet</h2> <p>That question is a tick-box reading <strong>Use random generation.</strong> Leave it ticked and you get what you always got. Clear it and you get a character with nothing rolled: no background, no gear, no bonds, no traits, no age. Abilities start at 10 and Hit Protection at 3, and you type over them.</p> <p>The same box sits on <strong>Create NPC</strong>, <strong>Create Hireling</strong> and <strong>Create Monster</strong>, so any of the four can arrive empty — and on <strong>Create Faction</strong>, where clearing it lets you pick each part of the faction from its table instead (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.xrpS5v0W5q67jIzx]{Generating factions}).</p> <p>Players see the box only where they could use it. An empty sheet is filled in with the pick-list buttons, and those belong to Character Creation Mode — which the Warden&#39;s <strong>Toggle Player Creation Tools</strong> switch can take away. With that switch off, a player&#39;s dialog just confirms, because an empty sheet they cannot fill in is no use to them.</p> <p><strong>This is not a character builder, and it is not the way to make a character.</strong> It is for the table that rolls on paper. Deal your character with the book and your own dice, then open an empty sheet and put it in: type the numbers, and use the <strong>pick-list buttons</strong> for anything that comes off a table. An empty sheet arrives with <strong>Character Creation Mode</strong> already on so those buttons are there waiting; turn it off when you are finished and the sheet goes quiet.</p> <p><strong>An empty sheet is never handed anything.</strong> Choosing a background, a bond, an answer to a background question or a failed career records what you chose and nothing more — no gear, no coins. You already know what your character is carrying, so the sheet does not guess and then leave you deleting a pack&#39;s worth of things you never asked for. Type your inventory in.</p> <p><strong>The same is true of an empty NPC, hireling or monster.</strong> Giving an empty hireling a career, or an empty NPC a background, records the choice and hands over none of the gear that normally comes with it. A career also leaves the statblock alone, so the numbers you typed off your paper sheet stay where you put them.</p> <p>That holds for as long as the sheet lives, not just while it is empty. If you change your mind and want the dice to furnish the character after all, use <strong>Roll Character</strong> with <strong>Background</strong> ticked: that deals a whole character, and from then on the sheet behaves like any other — pick a background later and it brings its gear. Ticking <strong>Starting gear</strong> on its own does the same. On an NPC, hireling or monster, the <strong>Roll</strong> button in the sheet&#39;s title bar is the way back.</p> <p>If you want a character and you do not have one already, roll it. That is the game.</p> <h2>Import from Kettlewright</h2> <p><strong>Import from Kettlewright</strong> sits beside it. Pick a character&#39;s <code>.json</code> export from <a href="https://kettlewright.com/">Kettlewright</a>, the official Cairn app, and it becomes a new character actor here: stats, gold and inventory as exported, a stock Kettlewright portrait mapped to the same face, questions and bonds matched back to their tables so they stay re-rollable. Items and bonds that match nothing are still imported — built from their tags or kept as text — and a summary dialog lists everything worth reviewing. A background this world doesn&#39;t have doesn&#39;t stop the import either: the character still arrives with the background kept as plain text, and the summary warns that its questions&#39; answers and bond can&#39;t be re-rolled or picked from a table.</p> <h2>Players can do both</h2> <p>Both buttons appear for players while the Warden&#39;s switch is on — the setting reads <strong>&quot;Allow players to create new player characters through random generation or .json import&quot;</strong>, and the shipped <strong>Toggle Player Character Creation</strong> macro flips it mid-session. A player who imports their own Kettlewright character gets the same options dialog and the same review summary the Warden would; if their account cannot create actors, the Warden&#39;s client quietly does it for them and hands them the finished sheet, stamped as theirs. Both routes run through the Warden&#39;s client for a player who can&#39;t create actors themselves, so a Warden must be logged in — with no Warden connected the buttons grey out (hovering says why), and they wake on their own the moment a Warden arrives. The Warden sees a notification either way — a player import arrives with whatever the file says, so it is never invisible.</p> <h2>Make it yours: Character Creation Mode</h2> <p>A generated or imported character arrives quiet — no dice on the sheet. The <strong>Character Creation Mode</strong> toggle in the sheet&#39;s title bar brings the creation tools back: a die beside each part of the character re-rolls that one thing — the name, the portrait, the age, the background (gear and all), the omen, a bond, a background question — and a <strong>pick-list button</strong> (the list icon) beside the name, background, failed career, omen, bond and question dice — and on the portrait — lets you choose instead of roll. The pickers are how you recreate a character you rolled with the book, paper and dice: pick the rows you already rolled, and the sheet grants whatever those rows grant. Traits stay hand-edited pick-lists either way. <strong>Roll Character</strong> opens a checklist of everything that can be re-rolled, all checked to begin with: uncheck what you want to keep, and only the rest is re-rolled. The name, starting gear and the two Background Questions ride the Background line — a new background deals its own, name included — while bonds re-roll only when their own line is checked, and a background you picked by hand starts unchecked, so a full re-roll keeps it unless you say otherwise. What the list never offers it never touches: notes, scars, pronouns, and anything bought or given stay yours. While the mode is on, the STR/DEX/WIL save dice are grayed out — turn it off to roll saves. This is the intended loop: generate, re-roll or pick the parts that don&#39;t sit right, then flip the toggle off and play.</p> <p>For players, the sheet tools ride their own switch — <strong>&quot;Let players use Character Creation tools on their sheets&quot;</strong>, flipped by the <strong>Toggle Player Creation Tools</strong> macro — so you can allow character creation but keep mid-campaign re-rolls to yourself, or hand players the dice entirely.</p> <h2>Make the tables yours</h2> <p>Everything a generated character is dealt from is a rollable table, and a table in <strong>your world</strong> with a shipped table&#39;s name is what gets rolled instead. So the durable way to change what characters arrive with is to keep your own copies in your world, where no update can touch them. Think of the shipped compendiums as <strong>templates</strong>: the starting point you copy and make your own, never the place you edit.</p> <p>Three buttons do the copying, all Wardens only:</p> <ul> <li><strong>Create a Custom Spell Table…</strong>, on the <strong>Rollable Tables</strong> sidebar tab. It copies the spell table a character is dealt a random spellbook or scroll from — <code>Spells — Canon (1d100)</code>, or <code>Spells — GLOG</code> while the GLOG Magic hack is on — into a <strong>Custom Spells</strong> folder, along with every spellbook it can hand out, and points every row at your copies. The hack swaps the pool wholesale and is a one-way campaign decision, so if you copy the canon list and switch the hack on later, come back and press the button again for the GLOG list.</li> <li><strong>Create Custom Barebones Creation Tables…</strong>, on the <strong>Rollable Tables</strong> sidebar tab. It copies the six tables a Barebones character is dealt from — Weapon, Armor, Additional Gear and the three Weapon Tier tables — into a <strong>Custom Barebones Character Creation</strong> folder, along with every item, mount and transport they can hand out — the items sorted into a subfolder per source compendium, Armor, Background Items, Gear, Tools, Trinkets, Weapons — and points every row at your copies.</li> <li><strong>Create Custom 2e Backgrounds and Tables…</strong>, the fourth button on the same tab, and also at the top of the <strong>Compendium</strong> tab. That one is the 27 backgrounds plus the eleven tables a 2e character rolls on; see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.yJJsiQGfqZwkGBV0]{Creating Custom Backgrounds} and @UUID[Compendium.air-bladder.journals-docs.JournalEntry.mlSyCzimMvBjzxFH]{Customizing Bonds}.</li> </ul> <p>Why the items come too: a table row names a document, and generation hands over whatever that row points at. Import a table by itself and its rows still point into the compendium, so the Dagger a new character receives is the shipped Dagger however carefully you edited yours. With the rows pointed at your copies, changing a weapon&#39;s damage or a piece of gear&#39;s description changes what the next character is dealt.</p> <p>A window afterwards says what landed and offers to open the folders. Running either button again never overwrites: what you have edited is kept, and only what is missing is added.</p> <p>Every copy explains itself. Open one and a note at the top says what it is dealt for and how to add a row — and, since a table opens in view mode, that you press <strong>Edit</strong> at the top of the window first. Drag a spellbook onto the spell table and it re-sorts itself by name, formula included, so the new spell can be rolled. Drag an item onto a Barebones creation table and the table&#39;s die follows its rows, so the new item can be rolled too.</p> <h2>Taking a background out of play</h2> <p>You do not need a copy to hide a shipped background. Open any Cairn 2e character with <strong>Character Creation Mode</strong> on, press the <strong>pick-list button</strong> beside Background, and every background in play is listed with an <strong>eye</strong> at the end of its row — the eyes show for the Warden only. Click the eye and that background is out: the row greys out for you, and for players it disappears from the list and the dice never land on it. Click the eye again to bring it back.</p> <p>It is per background, and the world remembers it, so it holds for every character and every session until you change it. It works the same on the Player&#39;s Guide twenty, the seven in <strong>Backgrounds (Custom)</strong>, and your own copies — and a copy made by <strong>Create Custom 2e Backgrounds and Tables…</strong> is the same background as far as the eye is concerned, so one you switched off stays off when its copy lands, and switching either back on switches on both. The last background left in play cannot be switched off, because generation must always have something to deal.</p>'
