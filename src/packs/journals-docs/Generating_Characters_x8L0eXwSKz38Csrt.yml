    name: Generating Characters
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Cairn characters are not built — they are dealt. Air Bladder gives you three ways to get one, and one loop for making the result yours. There is deliberately no step-by-step &quot;character builder&quot;: the dice hand you a person, and the choices come after.</p> <h2>Create PC</h2> <p>The <strong>Create PC</strong> button sits above the Actors sidebar. Clicking it asks one question, then rolls everything a Cairn 2e character starts with — abilities, Hit Protection, a background with its gear and questions, traits, age, and a bond — and opens the finished sheet. With more than one content source enabled (Custom 2e, Barebones), the same window asks which table to deal from.</p> <h2>Start from an empty sheet</h2> <p>That question is a tick-box reading <strong>Use random generation.</strong> Leave it ticked and you get what you always got. Clear it and you get a character with nothing rolled: no background, no gear, no bonds, no traits, no age. Abilities start at 10 and Hit Protection at 3, and you type over them.</p> <p>The same box sits on <strong>Create NPC</strong>, <strong>Create Hireling</strong> and <strong>Create Monster</strong>, so any of the four can arrive empty — and on <strong>Create Faction</strong>, where clearing it lets you pick each part of the faction from its table instead (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.xrpS5v0W5q67jIzx]{Generating factions}).</p> <p>Players see the box only where they could use it. An empty sheet is filled in with the pick-list buttons, and those belong to Character Creation Mode — which the Warden&#39;s <strong>Toggle Player Creation Tools</strong> switch can take away. With that switch off, a player&#39;s dialog just confirms, because an empty sheet they cannot fill in is no use to them.</p> <p><strong>This is not a character builder, and it is not the way to make a character.</strong> It is for the table that rolls on paper. Deal your character with the book and your own dice, then open an empty sheet and put it in: type the numbers, and use the <strong>pick-list buttons</strong> for anything that comes off a table. An empty sheet arrives with <strong>Character Creation Mode</strong> already on so those buttons are there waiting; turn it off when you are finished and the sheet goes quiet.</p> <p><strong>An empty sheet is never handed anything.</strong> Choosing a background, a bond, an answer to a background question or a failed career records what you chose and nothing more — no gear, no coins. You already know what your character is carrying, so the sheet does not guess and then leave you deleting a pack&#39;s worth of things you never asked for. Type your inventory in.</p> <p><strong>The same is true of an empty NPC, hireling or monster.</strong> Giving an empty hireling a career, or an empty NPC a background, records the choice and hands over none of the gear that normally comes with it. A career also leaves the statblock alone, so the numbers you typed off your paper sheet stay where you put them.</p> <p>That holds for as long as the sheet lives, not just while it is empty. If you change your mind and want the dice to furnish the character after all, use <strong>Roll Character</strong> with <strong>Background</strong> ticked: that deals a whole character, and from then on the sheet behaves like any other — pick a background later and it brings its gear. Ticking <strong>Starting gear</strong> on its own does the same. On an NPC, hireling or monster, the <strong>Roll</strong> button in the sheet&#39;s title bar is the way back.</p> <p>If you want a character and you do not have one already, roll it. That is the game.</p> <h2>Import from Kettlewright</h2> <p><strong>Import from Kettlewright</strong> sits beside it. Pick a character&#39;s <code>.json</code> export from <a href="https://kettlewright.com/">Kettlewright</a>, the official Cairn app, and it becomes a new character actor here: stats, gold and inventory as exported, a stock Kettlewright portrait mapped to the same face, questions and bonds matched back to their tables so they stay re-rollable. Items and bonds that match nothing are still imported — built from their tags or kept as text — and a summary dialog lists everything worth reviewing. A background this world doesn&#39;t have doesn&#39;t stop the import either: the character still arrives with the background kept as plain text, and the summary warns that its questions&#39; answers and bond can&#39;t be re-rolled or picked from a table.</p> <h2>Players can do both</h2> <p>Both buttons appear for players while the Warden&#39;s switch is on — the setting reads <strong>&quot;Allow players to create new player characters through random generation or .json import&quot;</strong>, and the shipped <strong>Toggle Player Character Creation</strong> macro flips it mid-session. A player who imports their own Kettlewright character gets the same options dialog and the same review summary the Warden would; if their account cannot create actors, the Warden&#39;s client quietly does it for them and hands them the finished sheet, stamped as theirs. Both routes run through the Warden&#39;s client for a player who can&#39;t create actors themselves, so a Warden must be logged in — with no Warden connected the buttons grey out (hovering says why), and they wake on their own the moment a Warden arrives. The Warden sees a notification either way — a player import arrives with whatever the file says, so it is never invisible.</p> <h2>Make it yours: Character Creation Mode</h2> <p>A generated or imported character arrives quiet — no dice on the sheet. The <strong>Character Creation Mode</strong> toggle in the sheet&#39;s title bar brings the creation tools back: a die beside each part of the character re-rolls that one thing — the name, the portrait, the age, the background (gear and all), the omen, a bond, a background question — and a <strong>pick-list button</strong> (the list icon) beside the name, background, failed career, omen, bond and question dice — and on the portrait — lets you choose instead of roll. The pickers are how you recreate a character you rolled with the book, paper and dice: pick the rows you already rolled, and the sheet grants whatever those rows grant. Traits stay hand-edited pick-lists either way. <strong>Roll Character</strong> opens a checklist of everything that can be re-rolled, all checked to begin with: uncheck what you want to keep, and only the rest is re-rolled. The name, starting gear and the two Background Questions ride the Background line — a new background deals its own, name included — while bonds re-roll only when their own line is checked, and a background you picked by hand starts unchecked, so a full re-roll keeps it unless you say otherwise. What the list never offers it never touches: notes, scars, pronouns, and anything bought or given stay yours. While the mode is on, the STR/DEX/WIL save dice are grayed out — turn it off to roll saves. This is the intended loop: generate, re-roll or pick the parts that don&#39;t sit right, then flip the toggle off and play.</p> <p>For players, the sheet tools ride their own switch — <strong>&quot;Let players use Character Creation tools on their sheets&quot;</strong>, flipped by the <strong>Toggle Player Creation Tools</strong> macro — so you can allow character creation but keep mid-campaign re-rolls to yourself, or hand players the dice entirely.</p>'
