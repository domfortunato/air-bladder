    name: Generating Characters
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Cairn characters are not built — they are dealt. Air Bladder gives you two ways to deal one, and one loop for making the result yours. There is deliberately no step-by-step &quot;character builder&quot;: the dice hand you a person, and the choices come after.</p> <h2>Generate PC</h2> <p>The <strong>Generate PC</strong> button sits above the Actors sidebar. One click rolls everything a Cairn 2e character starts with — abilities, Hit Protection, a background with its gear and questions, traits, age, and a bond — and opens the finished sheet. With more than one content source enabled (Custom 2e, Barebones), a picker asks which table to deal from first.</p> <h2>Import from Kettlewright</h2> <p><strong>Import from Kettlewright</strong> sits beside it. Pick a character&#39;s <code>.json</code> export from <a href="https://kettlewright.com/">Kettlewright</a>, the official Cairn app, and it becomes a new character actor here: stats, gold and inventory as exported, a stock Kettlewright portrait mapped to the same face, questions and bonds matched back to their tables so they stay re-rollable. Items and bonds that match nothing are still imported — built from their tags or kept as text — and a summary dialog lists everything worth reviewing. A background this world doesn&#39;t have doesn&#39;t stop the import either: the character still arrives with the background kept as plain text, and the summary warns that its questions&#39; answers and bond can&#39;t be re-rolled or picked from a table.</p> <h2>Players can do both</h2> <p>Both buttons appear for players while the Warden&#39;s switch is on — the setting reads <strong>&quot;Allow players to create new player characters through random generation or .json import&quot;</strong>, and the shipped <strong>Toggle Player Character Creation</strong> macro flips it mid-session. A player who imports their own Kettlewright character gets the same options dialog and the same review summary the Warden would; if their account cannot create actors, the Warden&#39;s client quietly does it for them and hands them the finished sheet, stamped as theirs. Both routes run through the Warden&#39;s client for a player who can&#39;t create actors themselves, so a Warden must be logged in — with no Warden connected, the buttons refuse with a message rather than leaving the player waiting. The Warden sees a notification either way — a player import arrives with whatever the file says, so it is never invisible.</p> <h2>Make it yours: Character Creation Mode</h2> <p>A generated or imported character arrives quiet — no dice on the sheet. The <strong>Character Creation Mode</strong> toggle in the sheet&#39;s title bar brings the creation tools back: a die beside each part of the character re-rolls that one thing — the name, the portrait, the age, the background (gear and all), the omen, a bond, a background question — and a <strong>pick-list button</strong> (the list icon) beside the background, failed career, omen, bond and question dice lets you choose instead of roll. The pickers are how you recreate a character you rolled with the book, paper and dice: pick the rows you already rolled, and the sheet grants whatever those rows grant. Traits stay hand-edited pick-lists either way. <strong>Roll Character</strong> opens a checklist of everything that can be re-rolled, all checked to begin with: uncheck what you want to keep, and only the rest is re-rolled. Starting gear and the two Background Questions ride the Background line — a new background deals its own, and bonds are re-dealt with it — and a background you picked by hand starts unchecked, so a full re-roll keeps it unless you say otherwise. What the list never offers it never touches: notes, scars, pronouns, and anything bought or given stay yours. While the mode is on, the STR/DEX/WIL save dice are grayed out — turn it off to roll saves. This is the intended loop: generate, re-roll or pick the parts that don&#39;t sit right, then flip the toggle off and play.</p> <p>For players, the sheet tools ride their own switch — <strong>&quot;Let players use Character Creation tools on their sheets&quot;</strong>, flipped by the <strong>Toggle Player Creation Tools</strong> macro — so you can allow character creation but keep mid-campaign re-rolls to yourself, or hand players the dice entirely.</p>'
