    name: GLoG Magic in Foundry
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Air Bladder ships with the optional <a href="https://cairnrpg.com/hacks/glog-magic/">GLoG Magic hack</a> for Cairn, based on Goblin Punch&#39;s <strong>Goblin Laws of Magic</strong> and its <a href="https://goblinpunch.blogspot.com/2016/05/the-glog.html">2016 blogpost</a>. The Warden switches it on in the world&#39;s settings.</p> <p>Yochai Gal&#39;s adaptation of the rules covers casting, Fatigue, Mishaps, and copying and creating Grimoires. It ships as the <strong>GLoG Magic — Player Rules</strong> journal in the <strong>Journals (GLoG)</strong> compendium, with all 100 spells beside it in <strong>GLoG Magic — Spells</strong>.</p> <h2>Overview</h2> <p><strong>Magic Dice</strong> — every cast invests one to four Magic Dice, and never more than the caster has free inventory slots. More dice make a stronger spell, and they also raise the risk of Fatigue and Mishaps.</p> <p><strong>Spellbooks and Spellscrolls</strong> — with only GLoG Magic on, spellbooks stay spellbooks. Each one gets its spell&#39;s GLoG wording, and you cast it from the inventory with Magic Dice.</p> <p><strong>Grimoires</strong> — these are a separate option. With <strong>Use Grimoires</strong> on, every spellbook becomes a single-use Spellscroll, and a character can bind scrolls into a Grimoire as pages. A page isn&#39;t used up when it&#39;s cast.</p> <h2>Turning it on</h2> <p><strong>Game Settings → Configure Settings → Air Bladder → Configure Hacks → Use GLoG Magic</strong></p> <p>Turning this on rewrites the whole world, once:</p> <ul> <li>Every canon spell, wherever it is, gets its GLoG wording. A spellbook stays a spellbook and a scroll stays a scroll, whether it&#39;s spent or not.</li> <li>Spells that show up later get it too.</li> <li>Generation only hands out GLoG and custom spells. They come as spellbooks, or as scrolls with Grimoires on. They&#39;re rolled on the shipped <strong>Spells — GLoG</strong> table in <strong>Tables (GLoG)</strong>. If your world has a table with that name, it&#39;s rolled instead. <strong>Create a Custom Spell Table…</strong> on the Rollable Tables sidebar makes that copy while the hack is on (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Generating Characters}).</li> </ul> <p><strong>Turning GLoG Magic off doesn&#39;t change spells back to their Cairn wording, and turning Grimoires off doesn&#39;t turn spellscrolls back into spellbooks.</strong> Treat each switch as a campaign decision.</p> <h2>Grimoires (optional)</h2> <p><strong>Use Grimoires (converts all spellbooks!)</strong>, just under Use GLoG Magic, is off by default, and it&#39;s greyed out while GLoG Magic is off. Turning it on converts the whole world, once. Every spellbook becomes a single-use Spellscroll, new spells arrive as scrolls, and you can use Grimoires, Transmute and casting from a Grimoire. Turning it off doesn&#39;t convert anything back. A world that used GLoG Magic before this option existed keeps Grimoires on.</p> <p>The next three sections only apply while Use Grimoires is on.</p> <h2>Getting a Grimoire into a character&#39;s inventory</h2> <p>The Grimoire is an item in the <strong>Reliquary</strong> compendium, in the <strong>Air Bladder - Items</strong> folder.</p> <ol> <li>Open the <strong>Reliquary</strong> compendium.</li> <li>Drag the <strong>Grimoire</strong> onto a character&#39;s sheet.</li> </ol> <p>It&#39;s Bulky (two slots), and a character can only carry <strong>one</strong>. If you drop a second onto the same character, it&#39;s refused. An NPC, crate or pile can hold any number of Grimoires, but only a player character&#39;s sheet shows the Transmute and Cast controls.</p> <p>The shipped marketplace doesn&#39;t sell Grimoires. The Player Rules journal explains how a character makes one.</p> <p>A Grimoire holds 10 pages by default. To make the book larger or smaller, change <strong>Pages</strong> on its item sheet. Each page holds one spell.</p> <p>The <strong>Grimoire</strong> box and its <strong>Pages</strong> field only show up on a Grimoire&#39;s sheet, and only while Use Grimoires is on. Other items don&#39;t offer to become one. A spellbook&#39;s <strong>GLoG</strong> box marks a spell written in the hack&#39;s wording, and it only shows up while GLoG Magic is on. Its <strong>Scroll</strong> box is Cairn 2e&#39;s, so it&#39;s always there.</p> <h2>Moving a Grimoire between sheets</h2> <p><strong>A Grimoire&#39;s pages travel with it.</strong> When you drag a Grimoire from one sheet to another, its pages go along, whether that&#39;s to another character or into a crate. You can&#39;t drag a page on its own. If a sheet holds several Grimoires, each one keeps its own pages.</p> <p>A player can&#39;t offer a Grimoire to another character. The Warden has to move it.</p> <p>There&#39;s one exception, for pages bound in an early version of Air Bladder, before a page kept track of which Grimoire it was in. Your world is repaired the first time you open it after updating, wherever a sheet holds a single Grimoire. If two or more of those older Grimoires are on the <em>same</em> sheet, their pages stay where they are when either one leaves. Move the Grimoires off one at a time, and the last one out takes the pages that are left. The repair lists any sheet like that in the browser console (F12).</p> <h2>Transmuting spells into a Grimoire&#39;s pages</h2> <p>While a character is carrying a Grimoire that isn&#39;t full, every spellscroll or spellbook in their inventory that isn&#39;t already a page shows a <strong>Transmute into the Grimoire</strong> control on its row. Click it and confirm, and the spell becomes a page:</p> <ul> <li>It&#39;s Petty, so it doesn&#39;t take up an inventory slot.</li> <li>It&#39;s listed under the Grimoire, indented, with a page icon.</li> <li>It isn&#39;t single-use any more. You can cast a page any number of times.</li> <li>You can never take it out of the Grimoire.</li> </ul> <p>The confirmation for a scroll tells you the cost, which is 50 gold and 6 hours of downtime. The system doesn&#39;t deduct either one, so mark them yourselves.</p> <p>You can still transmute a spent scroll, and its page casts like any other.</p> <h2>Casting</h2> <p>Every cast invests <strong>Magic Dice</strong>. You can invest up to one for each free inventory slot the caster has, and never more than 4. A character who doesn&#39;t have a free slot doesn&#39;t have any dice, so they can&#39;t cast.</p> <p><strong>From a Grimoire (Grimoires on):</strong> once the Grimoire holds a page, its inventory row shows <strong>Cast</strong>. Pick the spell and the number of dice.</p> <p><strong>From a scroll:</strong> an unspent scroll that isn&#39;t a page shows its own cast control. Casting spends the scroll, and it stays in the inventory, struck through.</p> <p><strong>From a spellbook (Grimoires off):</strong> each spellbook&#39;s row shows <strong>Cast</strong>. The spellbook isn&#39;t used up.</p> <p>The roll is a Foundry roll, so Dice So Nice animates it. Two messages follow:</p> <ul> <li><strong>A public card</strong> with the spell&#39;s text filled in. <code>[dice]</code>, <code>[sum]</code> and the per-power blocks are replaced by the rolled values. Hover over a number to see what it replaced.</li> <li><strong>A whisper to the caster</strong> with the rolled dice. If any die shows 4–6, an <strong>Add N Fatigue</strong> button adds one Fatigue for each of those dice. It&#39;s never refused, even when the inventory is full. If the dice show doubles, the whisper says a Mishap has happened and gives the Mishaps table&#39;s entry for the dice&#39;s sum.</li> </ul> <h2>Customizing the Mishaps</h2> <p>Import <strong>GLoG Magic: Mishaps</strong> from the <strong>Tables (GLoG)</strong> compendium into your world and edit your copy. A cast reads your world&#39;s table before the shipped one.</p> <h2>What is not automated</h2> <p>The whisper only tells you what happened. It doesn&#39;t apply anything for you, apart from the one Fatigue button. Everything a Mishap or a spell <em>does</em> stays as text for the table to act out.</p>'
