    name: GLoG Magic in Foundry
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Air Bladder ships with the optional <a href="https://cairnrpg.com/hacks/glog-magic/">GLoG Magic hack</a> for Cairn, based on Goblin Punch&#39;s <strong>Goblin Laws of Magic</strong> and its <a href="https://goblinpunch.blogspot.com/2016/05/the-glog.html">2016 blogpost</a>. The Warden switches it on in the world&#39;s settings.</p> <p>Yochai Gal&#39;s adaptation of the rules — casting, Fatigue, Mishaps, copying and creating Grimoires — ships as the <strong>GLoG Magic — Player Rules</strong> journal in the <strong>Journals (GLoG)</strong> compendium, with all 100 spells beside it in <strong>GLoG Magic — Spells</strong>.</p> <h2>Overview</h2> <p><strong>Magic Dice</strong> — every cast invests one to four Magic Dice, and never more than the caster&#39;s free inventory slots. More dice make a stronger spell and raise the risk of Fatigue and Mishaps.</p> <p><strong>Spellbooks and Spellscrolls</strong> — with GLoG Magic alone, spellbooks stay spellbooks. Each takes its spell&#39;s GLoG wording and casts from the inventory with Magic Dice.</p> <p><strong>Grimoires</strong> — an option of their own. With <strong>Use Grimoires</strong> on, every spellbook becomes a single-use Spellscroll, and a character can bind scrolls into a Grimoire as pages that cast without being used up.</p> <h2>Turning it on</h2> <p><strong>Game Settings → Configure Settings → Air Bladder → Configure Hacks → Use GLoG Magic</strong></p> <p>Turning this on rewrites the whole world, once:</p> <ul> <li>Every canon spell anywhere takes its GLoG wording. A spellbook stays a spellbook and a scroll stays a scroll, spent or not.</li> <li>Spells that arrive later take it too.</li> <li>Generation hands out only GLoG and custom spells, as spellbooks (as scrolls with Grimoires on). They are rolled on the shipped <strong>Spells — GLoG</strong> table in <strong>Tables (GLoG)</strong>. A table of that name in your world is rolled instead. <strong>Create a Custom Spell Table…</strong> on the Rollable Tables sidebar makes that copy while the hack is on (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Generating Characters}).</li> </ul> <p><strong>Turning GLoG Magic off does not change spells back to their Cairn wording, and turning Grimoires off does not turn spellscrolls back into spellbooks.</strong> Treat each switch as a campaign decision.</p> <h2>Grimoires (optional)</h2> <p><strong>Use Grimoires (converts all spellbooks!)</strong>, just under Use GLoG Magic, is off by default and greyed out while GLoG Magic is off. Turning it on converts the whole world, once: every spellbook becomes a single-use Spellscroll, new arrivals land as scrolls, and Grimoires, Transmute and casting from a Grimoire come into play. Turning it off converts nothing back. A world that used GLoG Magic before this option existed keeps Grimoires on.</p> <p>The next three sections apply only while Use Grimoires is on.</p> <h2>Getting a Grimoire into a character&#39;s inventory</h2> <p>The Grimoire is an item in the <strong>Reliquary</strong> compendium, in the <strong>Air Bladder - Items</strong> folder.</p> <ol> <li>Open the <strong>Reliquary</strong> compendium.</li> <li>Drag the <strong>Grimoire</strong> onto a character&#39;s sheet.</li> </ol> <p>It is Bulky (two slots), and a character can carry <strong>one</strong>: a second dropped onto the same character is refused. An NPC, crate or pile can hold any number of Grimoires, but only a player character&#39;s sheet shows the Transmute and Cast controls.</p> <p>The shipped marketplace does not sell Grimoires. How a character makes one is in the Player Rules journal.</p> <p>A Grimoire holds 10 pages by default. Change <strong>Pages</strong> on its item sheet for a larger or smaller book. Each page holds one spell.</p> <p>The <strong>Grimoire</strong> box and its <strong>Pages</strong> field appear only on a Grimoire&#39;s sheet, and only while Use Grimoires is on. No other item offers to become one. A spellbook&#39;s <strong>GLoG</strong> box, which marks a spell written in the hack&#39;s wording, appears only while GLoG Magic is on. Its <strong>Scroll</strong> box is Cairn 2e&#39;s and is always there.</p> <h2>Moving a Grimoire between sheets</h2> <p><strong>A Grimoire&#39;s pages travel with it.</strong> Drag a Grimoire from one sheet to another and its pages go along, to another character or into a crate. A page cannot be dragged on its own. A sheet holding several Grimoires keeps each one&#39;s pages with it.</p> <p>A player cannot offer a Grimoire to another character. The Warden moves it.</p> <p>One exception concerns pages bound in an early version of Air Bladder, before a page recorded which Grimoire it was in. Your world is repaired the first time you open it after updating, wherever a sheet holds a single Grimoire. If two or more of those older Grimoires sit on the <em>same</em> sheet, their pages stay where they are when either one leaves. Move the Grimoires off one at a time and the last one out takes what remains. The repair names any such sheet in the browser console (F12).</p> <h2>Transmuting spells into a Grimoire&#39;s pages</h2> <p>While a character carries a Grimoire that is not full, every spellscroll or spellbook in their inventory that is not already a page shows a <strong>Transmute into the Grimoire</strong> control on its row. Click it, confirm, and the spell becomes a page:</p> <ul> <li>It is Petty: pages take no inventory slots.</li> <li>It is listed under the Grimoire, indented, with a page icon.</li> <li>It is no longer single-use. A page can be cast any number of times.</li> <li>It can never be removed from the Grimoire.</li> </ul> <p>The confirmation for a scroll names the cost: 50 gold and 6 hours of downtime. The system does not deduct either. Mark them yourselves.</p> <p>A spent scroll can still be transmuted, and its page casts like any other.</p> <h2>Casting</h2> <p>Every cast invests <strong>Magic Dice</strong>: up to the caster&#39;s free inventory slots, and at most 4. A character with no free slot has no dice and cannot cast.</p> <p><strong>From a Grimoire (Grimoires on):</strong> once the Grimoire holds a page, its inventory row shows <strong>Cast</strong>. Pick the spell and the number of dice.</p> <p><strong>From a scroll:</strong> an unspent scroll that is not a page shows its own cast control. The cast spends the scroll. It stays in the inventory, struck through.</p> <p><strong>From a spellbook (Grimoires off):</strong> each spellbook&#39;s row shows <strong>Cast</strong>. The spellbook is not used up.</p> <p>The roll is a Foundry roll, so Dice So Nice animates it. Two messages follow:</p> <ul> <li><strong>A public card</strong> with the spell&#39;s text filled in: <code>[dice]</code>, <code>[sum]</code> and the per-power blocks are replaced by the rolled values. Hover a number to see what it replaced.</li> <li><strong>A whisper to the caster</strong> with the rolled dice. If any die shows 4–6, an <strong>Add N Fatigue</strong> button adds one Fatigue per such die. It is never refused, even with a full inventory. If the dice show doubles, the whisper says a Mishap has occurred and gives the Mishaps table&#39;s entry for the dice&#39;s sum.</li> </ul> <h2>Customizing the Mishaps</h2> <p>Import <strong>GLoG Magic: Mishaps</strong> from the <strong>Tables (GLoG)</strong> compendium into your world and edit your copy. A cast reads your world&#39;s table before the shipped one.</p> <h2>What is not automated</h2> <p>The whisper reports and does not apply. Fatigue has the one button. Everything a Mishap or a spell <em>does</em> stays text for the table to act out.</p>'
