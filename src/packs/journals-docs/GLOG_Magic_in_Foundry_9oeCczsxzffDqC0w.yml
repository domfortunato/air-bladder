    name: GLOG Magic in Foundry
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Air Bladder ships with an optional <a href="https://cairnrpg.com/hacks/glog-magic/">GLOG Magic hack</a> for Cairn, which is based on Goblin Punch&#39;s seminal <strong>Goblin Laws of Magic</strong> and its <a href="https://goblinpunch.blogspot.com/2016/05/the-glog.html">2016 blogpost</a>. To use GLOG Magic with the system, the Game Master must first enable it in the world&#39;s game settings.</p> <p>Yochai Gal&#39;s adaptation of the GLOG Magic rules text — casting, Fatigue,Mishaps, copying and creating Grimoires — ships in Air Bladder as the <strong>GLOG Magic — Player Rules</strong> journal in the <strong>Journals (GLOG)</strong> compendium, with all 100 spells beside it in <strong>GLOG Magic — Spells</strong>.*</p> <h2>Overview</h2> <p>Some think that GLOG makes magic more powerful and interesting in Cairn. Here is an overview of how it works:</p> <p><strong>Magic Dice</strong> — are required for each spell, and equal to the number of free item slots that a character has available. Investing more magic dice in your spell casting can increase the power, range and duration of your spell. But each die invested increases risk of fatigue or magical mishap!</p> <p><strong>Grimoires</strong> — These are special spell books that a PC can make or have made at great expense, which can hold spellscrolls as pages. Unlike spellscrolls, the spell pages in a Grimoire have unlimited uses. </p> <p><strong>Spellscrolls</strong> — There are no &quot;normal&quot; spellbooks in a world with GLOG Magic enabled. All player spellbooks (including those give by background grants or previous sessions) automatically convert to GLOG Spellscrolls that are single use only and require at least one Magic Die to cast.</p> <hr> <h2>Turning it on</h2> <p><strong>Configure Settings → Use GLOG Magic (converts all spellbooks!)</strong></p> <p>The exclamation mark is earned. Turning this ON converts the whole world, once, immediately:</p> <ul> <li><strong>Every canon spellbook anywhere becomes a spellscroll</strong>— in inventories, in world items, on unlinked tokens, in world compendia — becomes a single-use <strong>Spellscroll</strong> carrying the GLOG wording of its spell. A scroll that was already spent stays spent.</li> <li><strong>New arrivals convert too.</strong> Drag a canon spellbook from any compendium onto a character and it lands as an unspent Spellscroll. There are no spellbooks in a GLOG world — there are only Grimoires and spellscrolls.</li> <li><strong>Character generation</strong> hands out only GLOG and custom spells, always as scrolls.</li> </ul> <p><strong>IMPORTANT: Turning GLOG magic off in settings will not convert spellscrolls back into normal (non-GLOG) spellbooks and spellscrolls</strong> Treat the switch to GLOG as a campaign decision, not a toggle to flip between sessions.</p> <h2>Getting a Grimoire into a character&#39;s inventory</h2> <p>The Grimoire is a special magical item stored in the <strong>Air Bladder Items | Reliquary</strong> compendium folder — no special actor, no macro needed!</p> <ol> <li>Open the <strong>Reliquary</strong> compendium. Import it into your world if you wish.</li> <li>Drag a <strong>Grimoire</strong> onto a character&#39;s sheet.</li> </ol> <p>It is <em>bulky</em> (two slots), and a character can carry <strong>one</strong> — dropping a second onto the same character is refused. An NPC crate or pile can hold any number of recovered books; it just offers none of the magic controls, because transmuting and casting belong to the book&#39;s carrier.</p> <p>A Grimoire costs 300gp in labor and special inks and is <em>always found, made or taken</em>. Players will never find one for sale as shelf stock — so it ships in the Reliquary, not the Marketplace. Creating one from a Scroll (requiring 200gp in special ink, and a full moon) is downtime action in the Player Rules journal.</p> <p>A warden can edit a Grimoire&#39;s <strong>spellpage capacity</strong> in — <code>Pages</code> on the Grimoire&#39;s item sheet, 10 by default. Edit the capacity there if your table uses larger or meaner tomes. Each spellpage holds one spell that was formerly a spellscroll.</p> <h2>Transmuting spellscrolls into a Grimoire&#39;s pages</h2> <p>While a character carries a Grimoire that is not yet full, every unbound Spellscroll in their inventory grows a <strong>Transmute into the Grimoire</strong> control on its row. Click the control and confirm the dialog and the spell becomes a <strong>spell page</strong>:</p> <ul> <li>weightless — spellpages do not consume inventory slots</li> <li>grouped and indented under the Grimoire wearing a &quot;page&quot; icon;</li> <li>a scroll&#39;s one-use nature is cleared — a spellpage casts forever, even multiple times per day, which is exactly what the 50gp transmute buys (the scroll dialog names the cost: 50 gold and 6 hours of downtime, <em>deduct those costs manually on the Player&#39;s sheets</em>);</li> <li>**bound is forever. **Typically, unless your table plays differently with GLOG!</li> </ul> <h2>Casting</h2> <p><strong>From the book:</strong> once the Grimoire holds at least one spellpage, its inventory row on the Player&#39;s sheet shows <strong>Cast</strong>. Pick the spell and invest <strong>Magic Dice</strong> — up to your <em>free inventory slots</em>, capped at 4. A full pack means no dice and no cast: encumbrance is the resource, exactly as the hack intends, with no bookkeeping — fill a slot and the next cast&#39;s pool shrinks by itself.</p> <p>The roll is a real Foundry roll (Dice So Nice animates it), spoken by the character. Two messages follow:</p> <ul> <li><strong>A public card</strong> with the spell&#39;s text <em>resolved</em>: <code>[dice]</code>, <code>[sum]</code> and per-power blocks are replaced by the rolled values, each marked — hover a resolved number to see the expression it came from.</li> <li><strong>A private whisper to the caster</strong> with the rolled faces, an <strong>Add N Fatigue</strong> button — one Fatigue per die showing 4–6, never refused, even into a full pack, because the cost is owed — and, when the dice come up doubles, the <strong>Mishap</strong>: the line names it and the drawn row from the Mishaps table rides the whisper. No doubles, and the whisper says so outright.</li> </ul> <p><strong>From a scroll (GLOG setting on):</strong> an unspent, unbound Spellscroll shows its own cast control — the same dice, Fatigue and Mishaps — and the cast <strong>spends</strong> the scroll: struck through, kept, never deleted. A spent scroll can still be transmuted into a Grimoire, where it comes back as a permanent page — that is the 50gp decision the hack leaves on the table.</p> <h2>Customizing the Mishaps</h2> <p>The Mishap draw resolves <strong>world-first</strong>: import <strong>GLOG Magic: Mishaps</strong> from the <strong>Tables (GLOG)</strong> compendium into your world and edit your copy — the cast flow finds the world&#39;s table before the shipped one, the same way the Faction die works.</p> <h2>What is deliberately not automated</h2> <p>The whisper reports; it does not apply. Fatigue is the one button, because its count is pure arithmetic. Everything a Mishap or spell <em>does</em> — reversed effects, lost slots, combusting inventories — stays prose for the table to act out, by the same house rule that keeps &quot;Restores 1 STR&quot; a sentence.</p>'
