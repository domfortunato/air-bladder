    name: GLOG Magic in Foundry
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Air Bladder ships with an optional <a href="https://cairnrpg.com/hacks/glog-magic/">GLOG Magic hack</a> for Cairn, which is based on Goblin Punch&#39;s seminal <strong>Goblin Laws of Magic</strong> and its <a href="https://goblinpunch.blogspot.com/2016/05/the-glog.html">2016 blogpost</a>. To use GLOG Magic with the system, the Game Master must first enable it in the world&#39;s game settings.</p> <p>Yochai Gal&#39;s adaptation of the GLOG Magic rules text — casting, Fatigue,Mishaps, copying and creating Grimoires — ships in Air Bladder as the <strong>GLOG Magic — Player Rules</strong> journal in the <strong>Journals (GLOG)</strong> compendium, with all 100 spells beside it in <strong>GLOG Magic — Spells</strong>.*</p> <h2>Overview</h2> <p>Some think that GLOG makes magic more powerful and interesting in Cairn. Here is an overview of how it works:</p> <p><strong>Magic Dice</strong> — are required for each spell, and equal to the number of free item slots that a character has available. Investing more magic dice in your spell casting can increase the power, range and duration of your spell. But each die invested increases risk of fatigue or magical mishap!</p> <p><strong>Grimoires</strong> — These are special spell books that a PC can make or have made at great expense, which can hold spellscrolls as pages. Unlike spellscrolls, the spell pages in a Grimoire have unlimited uses. </p> <p><strong>Spellbooks and Spellscrolls</strong> — With GLoG Magic alone, spellbooks stay spellbooks: each takes its spell&#39;s GLoG wording and casts straight from the inventory with Magic Dice. Turn on <strong>Use Grimoires</strong> and every spellbook becomes a single-use GLoG Spellscroll instead, and spells are kept in a Grimoire.</p> <hr> <h2>Turning it on</h2> <p><strong>Configure Settings → Air Bladder → GLoG &amp; Other Hacks → Configure Hacks → Use GLoG Magic</strong></p> <p>Turning this ON rewrites the whole world, once, immediately:</p> <ul> <li>Every canon spell anywhere takes its GLoG wording. A spellbook stays a spellbook, and a scroll stays a scroll, spent or not.</li> <li>New arrivals take it too.</li> <li>Generation hands out only GLoG spells, as spellbooks (as scrolls with Grimoires on). They are rolled on the shipped <strong>Spells — GLOG</strong> table in <strong>Tables (GLOG)</strong>, and a table of that name in your world is rolled instead — <strong>Create a Custom Spell Table…</strong> on the Rollable Tables sidebar makes that copy, spells included, while the hack is on (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Generating Characters}).</li> </ul> <p><strong>IMPORTANT: Turning GLoG Magic off will not change spells back to their Cairn wording, and turning Grimoires off will not turn spellscrolls back into spellbooks.</strong> Treat each switch as a campaign decision, not a toggle to flip between sessions.</p> <h2>Grimoires (optional)</h2> <p><strong>Use Grimoires (converts all spellbooks!)</strong>, just under Use GLoG Magic, is off by default and greyed out while GLoG Magic is off. Turning it on converts the whole world, once: every spellbook becomes a single-use Spellscroll, new arrivals land as scrolls, and Grimoires, Transmute and casting from a Grimoire come into play. Turning it off converts nothing back. A world that used GLoG Magic before this option existed keeps Grimoires on.</p> <p>The sections below (getting, moving and transmuting into a Grimoire, and casting from one) apply only while Use Grimoires is on.</p> <h2>Getting a Grimoire into a character&#39;s inventory</h2> <p>The Grimoire is a special magical item stored in the <strong>Air Bladder Items | Reliquary</strong> compendium folder — no special actor, no macro needed!</p> <ol> <li>Open the <strong>Reliquary</strong> compendium. Import it into your world if you wish.</li> <li>Drag a <strong>Grimoire</strong> onto a character&#39;s sheet.</li> </ol> <p>It is <em>bulky</em> (two slots), and a character can carry <strong>one</strong> — dropping a second onto the same character is refused. An NPC crate or pile can hold any number of recovered books; it just offers none of the magic controls, because transmuting and casting belong to the book&#39;s carrier.</p> <p>A Grimoire costs 300gp in labor and special inks and is <em>always found, made or taken</em>. Players will never find one for sale as shelf stock — so it ships in the Reliquary, not the Marketplace. Creating one from a Scroll (requiring 200gp in special ink, and a full moon) is downtime action in the Player Rules journal.</p> <p>A warden can edit a Grimoire&#39;s <strong>spellpage capacity</strong> in — <code>Pages</code> on the Grimoire&#39;s item sheet, 10 by default. Edit the capacity there if your table uses larger or meaner tomes. Each spellpage holds one spell that was formerly a spellscroll.</p> <p>The <strong>Grimoire</strong> box and its <strong>Pages</strong> field appear only on a Grimoire&#39;s sheet, and only while GLOG Magic is switched on — no other item offers to become one. A spellbook&#39;s <strong>GLOG</strong> box (marking a spell written in the hack&#39;s wording) likewise appears only while the hack is on; its <strong>Scroll</strong> box is Cairn 2e&#39;s and is always there.</p> <h2>Moving a Grimoire between sheets</h2> <p><strong>A book&#39;s pages travel with it, and only its own.</strong> Drag a Grimoire from one sheet to another and its spellpages go along in the same move — to another character, into a crate, out of one again. They cannot be dragged separately: a page belongs to a book, not to whoever is holding it that day.</p> <p>That holds when a crate is holding several books at once. Each one keeps the pages that were written into it, so taking one library off the shelf leaves the others exactly as they were.</p> <p>One exception, and it only ever concerns pages bound in an earlier version of Air Bladder, before a page recorded which book it was in. Your world is repaired the first time you open it after updating — but only where the answer is readable, meaning a sheet holding one book. If two or more of those older books are sitting on the <em>same</em> sheet, nothing in the saved data says which pages belong to which, so they are left where they are rather than guessed at, and they stay behind when either book leaves. Move the books off one at a time and the last one out takes what remains, or transmute the spells afresh into the book you want them in. The repair names any such sheet in the browser console (F12) when it runs.</p> <h2>Transmuting spellscrolls into a Grimoire&#39;s pages</h2> <p>While a character carries a Grimoire that is not yet full, every unbound Spellscroll in their inventory grows a <strong>Transmute into the Grimoire</strong> control on its row. Click the control and confirm the dialog and the spell becomes a <strong>spell page</strong>:</p> <ul> <li>weightless — spellpages do not consume inventory slots</li> <li>grouped and indented under the Grimoire wearing a &quot;page&quot; icon;</li> <li>a scroll&#39;s one-use nature is cleared — a spellpage casts forever, even multiple times per day, which is exactly what the 50gp transmute buys (the scroll dialog names the cost: 50 gold and 6 hours of downtime, <em>deduct those costs manually on the Player&#39;s sheets</em>);</li> <li>**bound is forever. **Typically, unless your table plays differently with GLOG!</li> </ul> <h2>Casting</h2> <p><strong>From the book:</strong> once the Grimoire holds at least one spellpage, its inventory row on the Player&#39;s sheet shows <strong>Cast</strong>. Pick the spell and invest <strong>Magic Dice</strong> — up to your <em>free inventory slots</em>, capped at 4. A full pack means no dice and no cast: encumbrance is the resource, exactly as the hack intends, with no bookkeeping — fill a slot and the next cast&#39;s pool shrinks by itself.</p> <p>The roll is a real Foundry roll (Dice So Nice animates it), spoken by the character. Two messages follow:</p> <ul> <li><strong>A public card</strong> with the spell&#39;s text <em>resolved</em>: <code>[dice]</code>, <code>[sum]</code> and per-power blocks are replaced by the rolled values, each marked — hover a resolved number to see the expression it came from.</li> <li><strong>A private whisper to the caster</strong> with the rolled faces, an <strong>Add N Fatigue</strong> button — one Fatigue per die showing 4–6, never refused, even into a full pack, because the cost is owed — and, when the dice come up doubles, the <strong>Mishap</strong>: the line names it and the drawn row from the Mishaps table rides the whisper. No doubles, and the whisper says so outright.</li> </ul> <p><strong>From a scroll (GLOG setting on):</strong> an unspent, unbound Spellscroll shows its own cast control — the same dice, Fatigue and Mishaps — and the cast <strong>spends</strong> the scroll: struck through, kept, never deleted. A spent scroll can still be transmuted into a Grimoire, where it comes back as a permanent page — that is the 50gp decision the hack leaves on the table.</p> <p><strong>From a spellbook (Grimoires off):</strong> each spellbook&#39;s row shows <strong>Cast</strong>. The same dice, Fatigue and Mishaps; the book is not used up.</p> <h2>Customizing the Mishaps</h2> <p>The Mishap draw resolves <strong>world-first</strong>: import <strong>GLOG Magic: Mishaps</strong> from the <strong>Tables (GLOG)</strong> compendium into your world and edit your copy — the cast flow finds the world&#39;s table before the shipped one, the same way the Faction die works.</p> <h2>What is deliberately not automated</h2> <p>The whisper reports; it does not apply. Fatigue is the one button, because its count is pure arithmetic. Everything a Mishap or spell <em>does</em> — reversed effects, lost slots, combusting inventories — stays prose for the table to act out, by the same house rule that keeps &quot;Restores 1 STR&quot; a sentence.</p>'
