    name: Encounter Tables
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Air Bladder ships seven encounter tables, and a draw from any of them can put its result <strong>on the map</strong>: the Warden&#39;s copy of the draw card grows an <strong>Add to scene</strong> button that rolls the quantity, fetches the monster, and places the tokens. Players see a plain card — the button exists only for you.</p> <p>The same button appears on tables <strong>you</strong> build, with no setup beyond writing the rows a particular way. The convention is the whole trick, and it is two things: type the dice, drag the monster in.</p> <p>You need to be the Warden (GM). Everything here happens in a world.</p> <hr> <h2>The shipped tables</h2> <p><strong>Compendium sidebar → Air Bladder - Warden Tables → Warden — Encounters &amp; Reactions</strong>:</p> <table> <thead> <tr> <th>Table</th> <th>Roll</th> <th>Terrain</th> </tr> </thead> <tbody><tr> <td>Warden: Encounters - Plains</td> <td>d6 + d10</td> <td>open grassland</td> </tr> <tr> <td>Warden: Encounters - Forest</td> <td>d6 + d10</td> <td>woodland</td> </tr> <tr> <td>Warden: Encounters - City Ruins</td> <td>d6 + d10</td> <td>ruins</td> </tr> <tr> <td>Warden: Encounters - Hills / Mountains</td> <td>d6 + d10</td> <td>high country</td> </tr> <tr> <td>Warden: Encounters - Marshlands / Quagmire</td> <td>d6 + d10</td> <td>wetlands</td> </tr> <tr> <td>Warden: Encounters - Lake</td> <td>2d4</td> <td>near open water</td> </tr> <tr> <td>Warden: Encounters - Dungeon</td> <td>1d6</td> <td>an example, close to home</td> </tr> </tbody></table> <p>The terrain tables pair with <strong>Warden: Events - Wilderness</strong> — when a travel watch turns up an <em>Encounter</em>, roll the table for the terrain you are in. Page references in the rows are to the <strong>Cairn 2e Bestiary</strong>.</p> <p>You can roll a table <strong>straight from the compendium</strong> — no import needed. Import it into your world only if you want to edit the rows, and then your copy&#39;s draws work the same way.</p> <p>A few rows name creatures the Monsters compendium does not have (Burrowing Horror, Creeping Vines, Night Cat, Root Witch, Will-o-Wisp, Kraken). Those rows still roll and still tell you what you met — they just have no button, because there is nothing to place. If you make your own actor for one, import the table, put a count in front, and drag your actor into the row; it lights up like any other.</p> <h2>What the button does</h2> <p>Click <strong>Add to scene: 1d6 × Goblins</strong> and, for each rolled row:</p> <ol> <li><strong>The quantity is rolled for real</strong> — a dice roll posted to chat (Dice So Nice animates it if you have it).</li> <li><strong>The monster is imported once</strong>, into an <strong>Encounters</strong> actor folder created on first use. Every later encounter with the same monster <strong>reuses that one actor</strong> — you get N tokens, never N copies of the actor. Rename or move the folder freely; it is recognized by an internal marker, not its name.</li> <li><strong>Tokens are placed on the scene you are viewing</strong> — unlinked, clustered around the centre of your current view, each on its own grid cell.</li> </ol> <p>The card then reads <strong>Added</strong> and will not fire twice. Draw again for a fresh card with a fresh button. If no scene is open, the click refuses politely and nothing is rolled or written.</p> <p>Tokens arrive with <strong>neutral disposition</strong> on purpose: meeting something is not the same as fighting it. Roll <strong>Warden: NPC - Reactions</strong> to find out how it feels about you.</p> <p>That is all the button automates — logistics. Nothing reads the monster&#39;s stats or rolls its attacks for you.</p> <hr> <h2>Building your own</h2> <p>Make a Rollable Table anywhere — the sidebar, a world compendium — and write each result like this:</p> <blockquote> <p><code>1d6</code> <em>drag a monster from the Monsters compendium into the text</em> <code> — your prose after</code></p> </blockquote> <p>Dragging the monster in creates a link in the text; the leading dice (or a plain number) are the quantity. That is the entire convention. A row qualifies for the button when it has <strong>both</strong>: a leading count, and a monster link.</p> <p>The details, each of them deliberate:</p> <ul> <li><strong>The count must come first.</strong> <code>1d4 [Wolves] on the ridge</code> gets a button; <code>Wolves guard the [Ogre] bridge</code> does not — prose that merely <em>mentions</em> a monster never grows one.</li> <li><strong>The quantity applies to the first link only.</strong> A choice row like <code>1d6 [Gnolls] (pg 69) or [Gnomes] (pg 70)</code> places Gnolls; the <em>or</em> stays yours to exercise by hand.</li> <li><strong><code>random NPC</code> is a magic phrase.</strong> A row containing it (say <code>1 random NPC — lost, curious, or up to no good</code>) runs the NPC generator instead: a brand-new person with a statblock, a face, and a name, different every time, filed in the Encounters folder. The count is optional and defaults to 1.</li> <li><strong>The link&#39;s label is display wording, not a lookup.</strong> After dragging a monster in you can edit the link&#39;s text — the shipped Hills table links the Tiger and labels it <em>Mountain Lion</em>, and the Plains table pluralizes <em>Goblins</em>. The monster placed is the one the link points at, whatever the label says.</li> <li><strong>A row with no count, or no link, is plain prose.</strong> <code>All quiet</code> and <code>Herd Animals (Deer, Goats)</code> draw like any other row and simply have no button.</li> <li>Dropping an actor <strong>as the result itself</strong> (a document-type row) works too — the count is read from the row&#39;s text if you write one, else 1.</li> </ul> <p>There is nothing to register and no setting to switch: if the row parses, the button appears on its draw card.</p>'
