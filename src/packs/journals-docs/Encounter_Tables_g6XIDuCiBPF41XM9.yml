  - _id: irJkoFS0C8c2xBUH
    name: Encounter Tables
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Air Bladder ships seven encounter tables. When a rolled row names monsters, your copy of the card has an <strong>Add to scene</strong> button that rolls how many, fetches the monster and places the tokens. Players see a plain card.</p> <p>Tables you build get the same button if you write their rows the same way: type the dice, then drag the monster in.</p> <p>You need to be the Warden (GM), in a world.</p> <hr> <h2>The shipped tables</h2> <p><strong>Compendium sidebar → Air Bladder - Warden Tables → Warden — Encounters &amp; Reactions</strong>:</p> <table> <thead> <tr> <th>Table</th> <th>Roll</th> <th>Terrain</th> </tr> </thead> <tbody><tr> <td>Warden: Encounters - Plains</td> <td>d6 + d10</td> <td>open grassland</td> </tr> <tr> <td>Warden: Encounters - Forest</td> <td>d6 + d10</td> <td>woodland</td> </tr> <tr> <td>Warden: Encounters - City Ruins</td> <td>d6 + d10</td> <td>ruins</td> </tr> <tr> <td>Warden: Encounters - Hills / Mountains</td> <td>d6 + d10</td> <td>high country</td> </tr> <tr> <td>Warden: Encounters - Marshlands / Quagmire</td> <td>d6 + d10</td> <td>wetlands</td> </tr> <tr> <td>Warden: Encounters - Lake</td> <td>2d4</td> <td>near open water</td> </tr> <tr> <td>Warden: Encounters - Dungeon</td> <td>1d6</td> <td>an example</td> </tr> </tbody></table> <p>The terrain tables pair with <strong>Warden: Events - Wilderness</strong>. When a travel watch turns up an <em>Encounter</em>, roll the table for the terrain you&#39;re in. The page references in the rows point to the <strong>Cairn 2e Bestiary</strong>.</p> <p>All seven are also on the Encounters tab of the @UUID[Compendium.air-bladder.journals-docs.JournalEntry.YQuFB7LNfFSbLzCn]{Warden&#39;s Dashboard}.</p> <p>You can roll a table straight from the compendium. You only need to import it into your world if you want to edit its rows. Your copy works the same way.</p> <p>A few rows name creatures the Monsters compendium doesn&#39;t have (Burrowing Horror, Creeping Vines, Night Cat, Root Witch, Will-o-Wisp, Kraken). Those rows still roll, but they don&#39;t get a button. If you make your own actor for one, import the table, press <strong>Edit</strong>, and open that row with the pen icon at its end. In its <strong>Description</strong>, put a count in front and drag your actor into the text.</p> <h2>What the button does</h2> <p>Click <strong>Add to scene: 1d6 × Goblins</strong> and, for each rolled row:</p> <ol> <li><strong>The quantity is rolled</strong> and posted to chat.</li> <li><strong>The monster is imported once</strong>, into an <strong>Encounters</strong> actor folder made on first use. Later encounters with the same monster reuse that actor. You can rename or move the folder.</li> <li><strong>Tokens are placed on the scene you are viewing</strong>, around the centre of your view, each on its own grid cell. Each token takes its own damage. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.gFK4npERocroPaEG]{Tokens and Sheets}.</li> </ol> <p>The card then reads <strong>Added to the scene</strong> and the button won&#39;t work a second time. Roll again for a new card. If you don&#39;t have a scene open, nothing is rolled or placed.</p> <p>Tokens arrive with <strong>neutral disposition</strong>, because meeting something isn&#39;t fighting it. Roll <strong>Warden: NPC - Reactions</strong> to find out how it feels about the party.</p> <p>The button only places tokens. It doesn&#39;t read the monster&#39;s stats or roll its attacks.</p> <hr> <h2>Building your own</h2> <p>Make a Rollable Table in the sidebar or in a world compendium, and write each result like this:</p> <blockquote> <p><code>1d6</code> <em>drag a monster from the Monsters compendium into the text</em> <code> — your prose after</code></p> </blockquote> <p>That text is the row&#39;s <strong>Description</strong>: press <strong>Edit</strong> at the top of the table&#39;s window, then the pen icon at the end of the row.</p> <p>Dragging the monster in makes a link in the text. The leading dice, or a plain number, are the quantity. A row gets the button when it has both.</p> <ul> <li><strong>The count must come first.</strong> <code>1d4 [Wolves] on the ridge</code> gets a button. <code>Wolves guard the [Ogre] bridge</code> doesn&#39;t.</li> <li><strong>The quantity applies to the first link only.</strong> A row like <code>1d6 [Gnolls] (pg 69) or [Gnomes] (pg 70)</code> places Gnolls. Place the Gnomes by hand if you choose them.</li> <li><strong><code>random NPC</code> runs the NPC generator.</strong> A row containing that phrase makes a new person each time, with stats, a portrait and a name, filed in the Encounters folder. The count is optional and defaults to 1.</li> <li><strong>The link&#39;s label is just wording.</strong> You can edit a link&#39;s text after dragging the monster in. The shipped Hills table links the Tiger and labels it <em>Mountain Lion</em>, and the Dungeon table pluralizes <em>Goblins</em>. The monster that gets placed is the one the link points at.</li> <li><strong>A row without a count, or without a link, doesn&#39;t get a button.</strong> It rolls like any other row.</li> <li><strong>An actor dropped in as the result itself</strong> also works. The count is read from the row&#39;s text if you write one. If you don&#39;t, it&#39;s 1.</li> </ul> <p>There isn&#39;t a setting to switch on.</p>'
