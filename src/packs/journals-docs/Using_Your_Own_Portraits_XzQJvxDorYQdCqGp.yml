name: Using Your Own Portraits
pages:
  - _id: FTDSlQoVVo8mmCGV
    name: Using Your Own Portraits
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Point Air Bladder at a folder of your own portrait art and it uses that art in the picker on every sheet, and for the portraits it assigns when you generate a character, an NPC or a monster.</p> <p>Name a subfolder <code>pc</code>, <code>npc</code>, <code>monster</code> or <code>companion</code> and each kind draws from its own folder.</p> <p>You need to be the Warden to set this up. Your players need no permissions to use it — see Why your players can see them.</p> <h2>Setting the folder</h2> <p><strong>Settings → Configure Settings → Air Bladder → Character Generation → Configure Character Generation → Custom character portrait folder.</strong></p> <p>It is already filled in with <code>air-bladder-portraits</code>, and that folder is created for you. It sits at the <strong>Foundry data root</strong>, beside your <code>worlds/</code> and <code>modules/</code> folders, and not inside the system folder, which is overwritten on every update.</p> <p>Drop your images in, then press <strong>Refresh</strong> (below).</p> <ul> <li>Recognised files: <code>.webp</code>, <code>.png</code>, <code>.jpg</code>, <code>.jpeg</code>, <code>.gif</code>, <code>.svg</code>, <code>.avif</code>, <code>.bmp</code>. Anything else in the folder is ignored.</li> <li>The path is relative to the data root. You can point it at any folder there, including one shared between several worlds.</li> <li>Leave it blank to switch the feature off. The shipped art is used instead.</li> </ul> <h2>Refreshing</h2> <p>Air Bladder reads the folder and remembers what it found. It reads it again:</p> <ul> <li>when you press <strong>Refresh</strong> on the <strong>Custom</strong> tab of any portrait picker (only the Warden sees that button),</li> <li>when you change the folder setting, and</li> <li>every time a Warden logs in.</li> </ul> <p>A notification says how many images it found. If it says none and the folder is full, check the path, then Refresh.</p> <h3>Why your players can see them</h3> <p>Players cannot normally list a folder on the server. The Warden&#39;s refresh saves the list of images in the world, and players read that list. <strong>A player sees whatever the last refresh found</strong>, so add art, then Refresh.</p> <h2>A folder per kind</h2> <p>Make a folder inside your portrait folder with one of these names, and it becomes the pool for that kind alone:</p> <table> <thead> <tr> <th>Folder</th> <th>Used for</th> </tr> </thead> <tbody><tr> <td><code>pc</code></td> <td>player characters, including ones a player generates themselves</td> </tr> <tr> <td><code>npc</code></td> <td>generated NPCs and hirelings, and NPC people you create by hand</td> </tr> <tr> <td><code>monster</code></td> <td>generated monsters</td> </tr> <tr> <td><code>companion</code></td> <td>a granted beast that is not one of the shipped mounts</td> </tr> </tbody></table> <ul> <li><strong>Singular or plural</strong>, and case does not matter: <code>Monsters</code>, <code>monster</code> and <code>MONSTERS</code> are the same folder.</li> <li><strong>Top level only.</strong> A folder called <code>Kindred/monster</code> is an ordinary folder.</li> <li><strong>Nesting inside them counts.</strong> <code>monster/undead/lich.webp</code> is monster art.</li> </ul> <p>Everything that is <em>not</em> inside one of those four folders is the <strong>general pool</strong>.</p> <h3>If you use none of these names</h3> <p>Every image is one pool. Player characters and NPCs draw from it, and monsters and companions keep the shipped art.</p> <h3>Two rules to know before you sort</h3> <p><strong>1. The general pool is everything outside the reserved folders.</strong> Sorting only your monster art does not put monsters on player characters.</p> <p><strong>2. <code>monster</code> and <code>companion</code> fall back to nothing of yours.</strong> A monster takes a creature icon from the shipped Game-Icons art, and a granted beast takes its own illustration or an icon. They use your art only when you name a folder for them.</p> <p>Player characters and NPCs fall back to the general pool.</p> <p><strong>Categories never borrow from each other.</strong> Fill <code>pc/</code> and nothing else, and your NPCs get the shipped art.</p> <h3>Three examples</h3> <pre><code>air-bladder-portraits/ → characters and NPCs draw from all four ├── knight.webp images. Monsters and beasts are untouched. ├── priest.webp ├── thief.webp └── crone.webp </code></pre> <pre><code>air-bladder-portraits/ → characters draw from pc/ (2 images) ├── pc/ NPCs draw from npc/ (1 image) │ ├── knight.webp monsters draw from monster/ (1 image) │ └── thief.webp beasts still take an icon — ├── npc/ there is no companion/ folder │ └── innkeeper.webp └── monster/ └── ogre.webp </code></pre> <pre><code>air-bladder-portraits/ → monsters draw from monster/ ├── monster/ characters and NPCs draw ONLY from │ ├── ogre.webp crone.webp — the monster folder is │ └── ghoul.webp excluded from the general pool └── crone.webp </code></pre> <h2>Where a portrait is assigned</h2> <table> <thead> <tr> <th>What you do</th> <th>Pool it draws from</th> </tr> </thead> <tbody><tr> <td>Generate a player character (yours or a player&#39;s)</td> <td><code>pc</code></td> </tr> <tr> <td>Import a Kettlewright character with no portrait of its own</td> <td><code>pc</code></td> </tr> <tr> <td>Generate an NPC</td> <td><code>npc</code></td> </tr> <tr> <td>Generate a hireling</td> <td><code>npc</code></td> </tr> <tr> <td>Create an NPC person by hand</td> <td><code>npc</code></td> </tr> <tr> <td>Generate a monster</td> <td><code>monster</code></td> </tr> <tr> <td>A background grants a beast the shipped mounts pack does not carry</td> <td><code>companion</code></td> </tr> <tr> <td>Roll the portrait die on a sheet</td> <td>whichever folder the current portrait came from</td> </tr> </tbody></table> <p>Not covered:</p> <ul> <li><strong>A granted mount the pack does carry</strong> keeps the illustration that ships with it.</li> <li><strong>Carts, wagons, sacks and chests</strong> wear icons and have no folder of their own.</li> <li><strong>Items</strong> can be given your art from their own picker, by hand. Nothing assigns item art for you.</li> </ul> <h2>The portrait die</h2> <p>The d20 beside a portrait rolls a new one <strong>from the folder the current portrait came from</strong>. A monster wearing your monster art rolls another monster, and a character rolls another character.</p> <p>If you cannot see the die, turn <strong>Character Creation Mode</strong> on with the <strong>CharGen</strong> toggle in the sheet&#39;s title bar.</p> <h2>The picker still shows everything</h2> <p>The reserved folders decide what is assigned automatically. They never limit what you choose by hand: the <strong>Custom</strong> tab lists every folder you have.</p> <p>Every folder that holds images becomes a tile, labelled by its path, so <code>OSR Fantasy/townsfolk/</code> reads &quot;OSR Fantasy / Townsfolk&quot;. Images loose at the top show as a grid above the tiles. The four reserved folders are captioned &quot;Player Characters&quot;, &quot;NPCs&quot;, &quot;Monsters&quot; and &quot;Companions&quot;.</p> <h2>Things that will not happen</h2> <ul> <li><strong>Nothing is rewritten.</strong> A portrait is set on a character when it is created. Sorting your folders later changes no existing character. Use the die, or pick by hand.</li> <li><strong>No separate token art.</strong> A custom portrait is its own token image. Only the shipped Jon Aspeheim and Lydia Comer galleries carry a second image made for tokens.</li> <li><strong>Portraits do not travel.</strong> They are paths on your own server, and do not follow a character or a shared background to another install.</li> </ul> <h2>If something looks wrong</h2> <p><strong>&quot;No custom portraits found.&quot;</strong> The folder is empty, the path is wrong, or nobody has pressed Refresh since the art went in. Check the setting, then Refresh.</p> <p><strong>Some folders are missing from the picker.</strong> Refresh goes six levels deep and visits at most 200 folders. Past either limit it stops and writes a warning to the browser console (F12). Flatten the folders if you hit it.</p> <p><strong>A player sees fewer portraits than you do.</strong> They see what the last refresh found. Press Refresh.</p> <p><strong>Your art is not being assigned to monsters.</strong> Check the folder is named <code>monster</code> or <code>monsters</code> and sits at the <em>top</em> of your portrait folder.</p>'
