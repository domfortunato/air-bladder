    name: Using Your Own Portraits
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Point Air Bladder at a folder of your own portrait art and it will use it — in the picker on every sheet, and for the faces it assigns automatically when you generate a character, an NPC or a monster.</p> <p>Name a subfolder <code>pc</code>, <code>npc</code>, <code>monster</code> or <code>companion</code> and each kind of thing draws from its own folder instead of from one shared pile.</p> <p>You need to be the Warden to set this up. Your players need no permissions at all to <em>use</em> it — see Why your players can see them, below.</p> <p><em>This page is about using the feature. The decisions behind it, and how it is wired, are recorded in custom-portrait-gallery.md.</em></p> <hr> <h2>Setting the folder</h2> <p><strong>Settings → Configure Settings → Air Bladder → Character Generation → Configure Character Generation → Custom character portrait folder.</strong></p> <p>It is already filled in with <code>air-bladder-portraits</code>, and that folder is created for you the first time the world loads. It sits at the <strong>Foundry data root</strong>, beside your <code>worlds/</code> and <code>modules/</code> folders — deliberately <em>not</em> inside the system folder, which is overwritten on every update.</p> <p>Drop your images in, then press <strong>Refresh</strong> (below). That is the whole setup.</p> <ul> <li>Recognised files: <code>.webp</code>, <code>.png</code>, <code>.jpg</code>, <code>.jpeg</code>, <code>.gif</code>, <code>.svg</code>, <code>.avif</code>, <code>.bmp</code>. Anything else in the folder is ignored.</li> <li>The path is relative to the data root. You can point it anywhere you like — a folder you already keep art in, shared between several worlds.</li> <li>Leave it blank to switch the feature off entirely; the shipped art is used instead.</li> </ul> <h2>Refreshing</h2> <p>Air Bladder scans the folder and remembers what it found. It re-scans:</p> <ul> <li>when you press <strong>Refresh</strong>, on the <strong>Custom</strong> tab of any portrait picker (only the Warden sees that button),</li> <li>when you change the folder setting, and</li> <li>every time a Warden logs in.</li> </ul> <p>The notification tells you how many images it found. If it says none and you know the folder is full, check the path first — then Refresh.</p> <h3>Why your players can see them</h3> <p>Listing a folder on the server needs a permission players do not normally have. So the Warden does the scanning and the resulting list is stored in the world; players read that list. Nothing needs granting, but it does mean <strong>a player sees whatever the last Warden scan found</strong> — add art, then Refresh, or they will not see it.</p> <h2>A folder per kind</h2> <p>Make a folder inside your portrait folder with one of these names, and it becomes the pool for that kind of thing alone:</p> <table> <thead> <tr> <th>Folder</th> <th>Used for</th> </tr> </thead> <tbody><tr> <td><code>pc</code></td> <td>player characters, including ones a player generates themselves</td> </tr> <tr> <td><code>npc</code></td> <td>generated NPCs and hirelings, and NPC people you create by hand</td> </tr> <tr> <td><code>monster</code></td> <td>generated monsters</td> </tr> <tr> <td><code>companion</code></td> <td>a granted beast that is not one of the shipped mounts</td> </tr> </tbody></table> <ul> <li><strong>Singular or plural</strong>, and case does not matter: <code>Monsters</code>, <code>monster</code> and <code>MONSTERS</code> are all the same folder.</li> <li><strong>Top level only.</strong> A folder called <code>Kindred/monster</code> is an ordinary folder.</li> <li><strong>Nesting inside them counts.</strong> <code>monster/undead/lich.webp</code> is monster art, so you can still file each category however you like.</li> </ul> <p>Everything that is <em>not</em> inside one of those four folders is the <strong>general pool</strong>.</p> <h3>If you use none of these names</h3> <p>Nothing changes. Every image is one pool, player characters and NPCs draw from it, and monsters and companions carry on wearing the art they always have. This is worth saying plainly: <strong>you never have to adopt any of this.</strong></p> <h3>The two rules worth knowing before you sort anything</h3> <p><strong>1. The general pool is everything OUTSIDE the reserved folders.</strong></p> <p>Not &quot;everything&quot;. If it were, sorting <em>only</em> your monster art would put monsters on every player character — the one category you had bothered to file would be the one that broke.</p> <p><strong>2. <code>monster</code> and <code>companion</code> inherit nothing.</strong></p> <p>Monsters and beasts have never drawn from your portrait folder at all. A monster takes a creature glyph from the shipped Game-Icons art; a granted beast takes its own illustration or a class icon. They start using your art only when you name a folder for them — otherwise a folder full of human faces would end up on every ogre and every mule.</p> <p>Player characters and NPCs <em>do</em> fall back to the general pool, because that is exactly what they did before.</p> <p>There is also <strong>no borrowing between categories</strong>. Fill <code>pc/</code> and nothing else and your NPCs get the shipped art, not your player-character portraits.</p> <h3>Three worked examples</h3> <pre><code>air-bladder-portraits/ → characters and NPCs draw from all four ├── knight.webp images. Monsters and beasts are untouched. ├── priest.webp (This is how it has always behaved.) ├── thief.webp └── crone.webp </code></pre> <pre><code>air-bladder-portraits/ → characters draw from pc/ (2 images) ├── pc/ NPCs draw from npc/ (1 image) │ ├── knight.webp monsters draw from monster/ (1 image) │ └── thief.webp beasts still take a class icon — ├── npc/ there is no companion/ folder │ └── innkeeper.webp └── monster/ └── ogre.webp </code></pre> <pre><code>air-bladder-portraits/ → monsters draw from monster/ ├── monster/ characters and NPCs draw ONLY from │ ├── ogre.webp crone.webp — the monster folder is │ └── ghoul.webp excluded from the general pool, so └── crone.webp nobody gets an ogre for a face </code></pre> <h2>Where a portrait is assigned</h2> <table> <thead> <tr> <th>What you do</th> <th>Pool it draws from</th> </tr> </thead> <tbody><tr> <td>Generate a player character (yours or a player&#39;s)</td> <td><code>pc</code></td> </tr> <tr> <td>Import a Kettlewright character with no portrait of its own</td> <td><code>pc</code></td> </tr> <tr> <td>Generate an NPC</td> <td><code>npc</code></td> </tr> <tr> <td>Generate a hireling</td> <td><code>npc</code></td> </tr> <tr> <td>Create an NPC person by hand</td> <td><code>npc</code></td> </tr> <tr> <td>Generate a monster</td> <td><code>monster</code></td> </tr> <tr> <td>A background grants a beast the shipped mounts pack does not carry</td> <td><code>companion</code></td> </tr> <tr> <td>Roll the portrait die on a sheet</td> <td>whichever folder the current portrait came from</td> </tr> </tbody></table> <p>A few things this list does <em>not</em> cover, on purpose:</p> <ul> <li><strong>A granted mount the pack does carry</strong> — a Rivertooth, a Heavy Destrier — keeps the illustration that ships with it. Art that already exists always wins.</li> <li><strong>Carts, wagons, sacks and chests</strong> wear class icons, not faces, so they have no folder of their own.</li> <li><strong>Items</strong> can be given your custom art from their own picker, but only by hand; nothing assigns item art for you.</li> </ul> <h2>The portrait die</h2> <p>The d20 beside a portrait rolls a new one <strong>from the folder the current portrait came from</strong> — so a monster wearing your monster art rolls another monster, and a character rolls another character. It always moves, as long as the folder holds more than one image.</p> <p>If you cannot see the die, flip <strong>Randomization</strong> on with the toggle in the sheet&#39;s title bar.</p> <h2>The picker still shows everything</h2> <p>The reserved folders decide what gets assigned <em>automatically</em>. They never limit what you can choose by hand: the <strong>Custom</strong> tab still lists every folder you have, so you can put a monster portrait on a shopkeeper if that is what the scene needs.</p> <p>Every folder that holds images becomes a tile, labelled by its path — so <code>OSR Fantasy/townsfolk/</code> reads &quot;OSR Fantasy / Townsfolk&quot;. Images sitting loose at the top show as a plain grid above the tiles. The four reserved folders are captioned &quot;Player Characters&quot;, &quot;NPCs&quot;, &quot;Monsters&quot; and &quot;Companions&quot; rather than by their raw names.</p> <h2>Things that will not happen</h2> <ul> <li><strong>Nothing is rewritten.</strong> A portrait is copied onto a character when it is created and never looked up again, so sorting your folders today does not change a single character you already have. Use the die, or pick by hand.</li> <li><strong>No separate token art.</strong> A custom portrait is its own token image. Only the shipped Jon Aspeheim and Lydia Comer galleries carry a second image prepared for the canvas.</li> <li><strong>Portraits do not travel.</strong> These are paths on your own server. They will not follow a character or a shared background to somebody else&#39;s install.</li> </ul> <h2>If something looks wrong</h2> <p><strong>&quot;No custom portraits found.&quot;</strong> The folder is empty, the path is wrong, or nobody has pressed Refresh since the art went in. Check the setting, then Refresh.</p> <p><strong>Some folders are missing from the picker.</strong> The scan goes six levels deep and visits at most 200 folders. Past either limit it stops and writes a warning to the browser console (F12). Flatten the tree a little if you hit it.</p> <p><strong>A player sees fewer portraits than you do.</strong> They are reading the stored list from the last Warden scan. Press Refresh.</p> <p><strong>Your art is not being assigned to monsters.</strong> Check the folder is named exactly <code>monster</code> (or <code>monsters</code>) and sits at the <em>top</em> of your portrait folder, not inside another one.</p>'
