    name: Customizing Bonds
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>All Cairn 2e characters start with a <strong>bond</strong>: a short piece of prose, sometimes with gold or an item attached. Barebones characters don&#39;t get one. Bonds are kept on the character sheet&#39;s <strong>Background &amp; Notes</strong> page. With Character Creation Mode on, each bond there has a re-roll die and a list button, a bond after the first has a ✕, and an <strong>Add a bond</strong> link appears when the character is owed another.</p> <p>Bonds are rolled from the shipped <strong>Bonds</strong> table, twenty rows in the <strong>Tables (2e)</strong> compendium. This page covers replacing them with your own. To play without bonds, switch off <strong>Use bonds</strong> under <strong>Configure Character Generation</strong> (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Generating Characters}).</p> <hr> <h2>Where a bond comes from</h2> <p>Generation, the re-roll die and <strong>Add a bond</strong> all find their table the same way:</p> <ol> <li>If the character&#39;s background names its own bonds table, that table is used. Only a custom background can name one.</li> <li>Otherwise, a <strong>RollTable in your world named <code>Bonds</code></strong> is used if there is one.</li> <li>Otherwise, the shipped <strong>Bonds</strong> table in <strong>Tables (2e)</strong> is used.</li> </ol> <p>That means one world table named <code>Bonds</code> changes the bonds for every background, canon ones included. If you delete it, the shipped bonds come back.</p> <hr> <h2>Copy the 2e tables into your world</h2> <p>Open the <strong>Rollable Tables</strong> or <strong>Compendium</strong> sidebar tab and press <strong>Create Custom 2e Backgrounds and Tables…</strong> (Wardens only), then <strong>Copy</strong>. Alongside the 27 backgrounds, it copies the <strong>eleven tables a 2e character rolls on</strong> into a <strong>Custom 2e Character Creation</strong> folder in your Rollable Tables: Bonds, Omens, Scars, and the eight trait tables (Physique, Skin, Hair, Face, Speech, Clothing, Vice, Virtue). The gold and item each shipped bond gives come along too.</p> <p>The Scars it copies is the one in <strong>Utils</strong>, which gives a scar when damage calls for one. The <code>Scars</code> in <strong>Tables (2e)</strong> is the list of checkboxes on the character sheet. The sheet always reads that list from the compendium, and a note on the table says so.</p> <p>Treat the shipped compendiums as templates. Copy from them, and edit the copy. A world table with a shipped table&#39;s name is rolled instead of the shipped one, so once the eleven are copied you can reword a bond, add an omen or change a scar by editing the table in your sidebar.</p> <p>Running it again never overwrites anything. A table you&#39;ve edited is kept as it is, and only what&#39;s missing is added. A copy you renamed is left alone too, and a fresh copy lands under the shipped name beside it.</p> <p>Each copy opens with a note at the top:</p> <ul> <li>It says Air Bladder rolls this table instead of the shipped one, and how to add a row.</li> <li>A table opens in view mode, where you can&#39;t add rows. The note tells you to press <strong>Edit</strong> at the top of the window first.</li> <li>A new row is rolled with the rest straight away. The table&#39;s die follows its rows: a twenty-first bond makes the formula <code>1d21</code>, and deleting the last row shrinks it back.</li> <li>Tables rolled with more than one die, such as the NPC reaction, encounter and GLoG mishap tables, don&#39;t change their own formula. Their note names the dice and asks you to set the formula on the <strong>Summary</strong> tab yourself.</li> <li>If two tables in your world share a name, both say so. Air Bladder can&#39;t tell which to read, so rename or delete one.</li> </ul> <p>To copy one table instead of all eleven, import it by hand as below.</p> <hr> <h2>Replacing the bonds for the whole world</h2> <ol> <li>Open the <strong>Compendium</strong> sidebar tab → <strong>Tables (2e)</strong> → right-click <strong>Bonds</strong> → <strong>Import Entry</strong>.</li> <li>The copy lands in your <strong>Rollable Tables</strong> sidebar, named <code>Bonds</code>. Keep that name, because it&#39;s how Air Bladder finds the table.</li> <li>Edit it there: reword, delete or add rows. Any number of rows works, and the die follows the rows. A thirty-row table rolls <code>1d30</code>.</li> </ol> <p>The imported rows keep the gold and the item each shipped bond gives, so a reworded row still gives them.</p> <p><strong>Rows you add by hand only give their text.</strong> Foundry&#39;s table editor can&#39;t attach gold or an item to a row. Put anything mechanical in the prose and let the player apply it.</p> <p><strong>Don&#39;t edit the copy inside Tables (2e).</strong> A system update replaces that compendium. Your world&#39;s copy survives.</p> <hr> <h2>A bonds table for one background</h2> <p>A <strong>custom background</strong> can name its own table in the <strong>Bonds table</strong> box on its Details tab (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.yJJsiQGfqZwkGBV0]{Creating a custom 2e background}). Type the table&#39;s name. Your world&#39;s tables are checked first, then every compendium. If you leave the box empty, the background uses the default above. Rows in a table of your own only give their text.</p> <p>If the name doesn&#39;t match a table, the default is used and a warning goes to the browser console. A background shared to a world that doesn&#39;t have its table still hands out ordinary bonds.</p> <p>Canon backgrounds don&#39;t have this box. To give one of them its own bonds, open it in <strong>Backgrounds (2e)</strong>, click <strong>Duplicate into Custom 2e Backgrounds</strong>, and set the box on the copy. Then switch the original off with the <strong>eye toggle</strong> on its picker row, so that only the copy comes up (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Taking a background out of play} in Generating Characters).</p> <hr> <h2>Two bonds, and repeats</h2> <p>A character is owed one bond, plus:</p> <ul> <li>one more if the background gives two. A custom background does that with its <strong>Grants two bonds</strong> checkbox. A shipped one, such as the Fieldwarden, does it with a description that contains the sentence &quot;roll a second time on the bonds table&quot;. The checkbox and the sentence together still only count once.</li> <li>one more for each rolled question answer that contains that sentence.</li> </ul> <p>If a bond comes up that the character already has, it&#39;s re-rolled, up to ten times. After that the repeat is kept, so a bonds table with fewer rows than the character has bonds still gives every bond owed.</p> <hr> <h2>Omens work the same way</h2> <p>The omen die on the character sheet, and the list button beside it, use a <strong>RollTable in your world named <code>Omens</code></strong> in place of the shipped one in <strong>Tables (2e)</strong>. If you delete it, the shipped table comes back. Import the shipped <strong>Omens</strong> table the way step 1 above imports Bonds, keep the name, and edit it. Any number of rows works. Omen rows are plain prose and don&#39;t give anything.</p> <hr> <h2>Every other table the generators roll</h2> <p><strong>A table in your world with the same name is rolled instead of the shipped one.</strong> That covers every table a generator or a sheet die uses. Import the shipped table, keep its name and edit it. The button on the Warden&#39;s Dashboard and the generator both roll yours. If you delete it, the shipped table comes back.</p> <table> <thead> <tr> <th>Where it rolls</th> <th>Tables (their shipped compendium)</th> </tr> </thead> <tbody><tr> <td>A 2e character&#39;s traits, at generation and from the sheet&#39;s dice</td> <td><code>Physique</code>, <code>Skin</code>, <code>Hair</code>, <code>Face</code>, <code>Speech</code>, <code>Clothing</code>, <code>Vice</code>, <code>Virtue</code> (<strong>Tables (2e)</strong>)</td> </tr> <tr> <td>NPCs and hirelings: the generators, the sheet dice and the lists</td> <td><code>Warden: NPC - Name</code>, <code>Warden: NPC - Background</code>, <code>Warden: NPC - Faction</code>, <code>Warden: NPC - Quirk</code>, <code>Warden: NPC - Goal</code>, <code>Warden: NPC - Virtue</code>, <code>Warden: NPC - Vice</code> (<strong>Warden — NPCs</strong>)</td> </tr> <tr> <td>Monsters</td> <td>the eight <code>Warden: Monster - …</code> tables (<strong>Warden — Monsters</strong>)</td> </tr> <tr> <td>Barebones character creation</td> <td><code>Barebones: Creation - Weapon</code>, <code>- Armor</code>, <code>- Additional Gear</code>, and the three <code>Barebones: Weapon Tier</code> tables (<strong>Tables (Barebones)</strong>). These have a one-button copy of their own; see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Generating Characters}</td> </tr> <tr> <td>Scars, when damage calls for one</td> <td><code>Scars</code> (<strong>Utils</strong>)</td> </tr> <tr> <td>A random spellbook or spellscroll a background hands out</td> <td><code>Spells — Canon (1d100)</code> (<strong>Tables (2e)</strong>), or <code>Spells — GLoG</code> (<strong>Tables (GLoG)</strong>) with the GLoG hack on. These have a one-button copy of their own, spellbooks included; see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Generating Characters}. A world copy keeps its rows in alphabetical order when a spellbook is dropped in</td> </tr> <tr> <td>Factions</td> <td>every table the faction generator rolls (<strong>Warden — NPCs</strong>); see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.xrpS5v0W5q67jIzx]{Generating Factions}</td> </tr> <tr> <td>The marketplace</td> <td>the four <code>Market: …</code> tables; see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.3XNm7vxBhJUeiuiy]{Customizing the marketplace}</td> </tr> </tbody></table> <p>Two things to know:</p> <ul> <li><strong>Your table&#39;s rows are never marked as drawn.</strong> The generators roll without changing the table. To have rows crossed off as they come up, roll from the table itself.</li> <li><strong>A row&#39;s text is what gets written.</strong> On a table whose rows drive something else, such as the NPC Background that decides an NPC&#39;s starting gear, keep the shipped wording of the rows you want to keep working and add your own beside them. On a spell table, a row that isn&#39;t a spellbook is skipped.</li> </ul> <p>You don&#39;t need to unlock a system compendium for any of this, and you don&#39;t lose any of it when Air Bladder updates.</p>'
