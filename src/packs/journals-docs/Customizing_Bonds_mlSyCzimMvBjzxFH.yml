    name: Customizing Bonds
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>A <strong>bond</strong> is the tie a Cairn 2e character starts with: a short piece of prose, sometimes with starting gold or an item attached. Generation rolls one for every 2e character (Barebones characters get none — bonds are 2e&#39;s mechanic), and the character sheet&#39;s <strong>Background &amp; Notes</strong> tab keeps it, with a re-roll die, a ✕, and an <strong>Add a bond</strong> link where the rules allow more.</p> <p>Out of the box those rolls come from the shipped <strong>Bonds</strong> table — twenty rows in the <strong>Tables (2e)</strong> compendium. This page is about replacing them with your own.</p> <p>You need to be the Warden (GM).</p> <hr> <h2>Where a bond comes from</h2> <p>Every bond draw — generation, the sheet&#39;s re-roll die, <strong>Add a bond</strong> — resolves the same way:</p> <ol> <li>If the character&#39;s background names its own bonds table, that table is used. Custom backgrounds can do this; canon ones never do.</li> <li>Otherwise the draw looks for a <strong>RollTable in your world named <code>Bonds</code></strong> and uses it if one exists.</li> <li>Otherwise it uses the shipped <strong>Bonds</strong> table from <strong>Tables (2e)</strong>.</li> </ol> <p>So one world table named <code>Bonds</code> changes the bonds behind <em>everything</em> — canon backgrounds included — and deleting it puts everything back. There is nothing else to configure.</p> <hr> <h2>Copy the 2e tables into your world</h2> <p>The one-button way, and it brings the rest of 2e&#39;s tables with it. Open the <strong>Compendium</strong> sidebar tab and press <strong>Create Custom Backgrounds and Tables…</strong> (Wardens only). Alongside the 27 backgrounds it copies the <strong>eleven tables a 2e character rolls on</strong> — Bonds, Omens, Scars, and the eight trait tables (Physique, Skin, Hair, Face, Speech, Clothing, Vice, Virtue) — into a <strong>Custom 2e Character Creation</strong> folder in your Rollable Tables, rows and hidden payload intact. The Scars it copies is the one in <strong>Utils</strong>, the table a damage roll deals a scar from; the <code>Scars</code> in <strong>Tables (2e)</strong> is the list of checkboxes on the character sheet, which is read from the compendium only, and its own note says so when you open it.</p> <p>Think of the shipped compendiums as <strong>templates</strong>: the starting point you copy and make your own, never the place you edit. Every one of those eleven follows the rule below — a world table with the shipped table&#39;s name is what gets rolled — so once they are copied, rewording a bond, adding an omen or retuning a scar is just editing the table in your sidebar.</p> <p>Running it again never overwrites: a table you have already edited is kept exactly as it is, and only what is missing is added. That holds for a copy you have renamed, too: it is left alone, and a fresh copy lands under the shipped name beside it.</p> <p>Every copy explains itself: open one and a note at the top says Air Bladder rolls it instead of the shipped table, and how to add a row. A table opens in view mode, where nothing can be dropped or added, so the note also tells you to press <strong>Edit</strong> at the top of the window first. Add a row and it is rolled straight away: the table&#39;s die follows its rows, so a twenty-first bond makes the formula <code>1d21</code> by itself, and deleting the last row shrinks it back. Tables rolled with more than one die — the NPC reactions, encounter and GLOG mishap tables — are the exception: their note names the dice and asks you to set the formula on the <strong>Summary</strong> tab yourself, because a bell curve is not something to flatten behind your back. And if two tables in your world share a name, both say so: Air Bladder cannot tell which one to read, so rename or delete one of them.</p> <p>The hand import below is still there, and is the right tool when you want one table and not eleven.</p> <hr> <h2>Replacing the bonds for the whole world</h2> <ol> <li>Open the <strong>Compendium</strong> sidebar tab → <strong>Tables (2e)</strong> → right-click <strong>Bonds</strong> → <strong>Import</strong>.</li> <li>The copy lands in your <strong>Rollable Tables</strong> sidebar, named <code>Bonds</code>. That name is the whole mechanism — keep it.</li> <li>Edit it there: reword rows, delete rows, add rows. Any number of rows works, and the table&#39;s die follows its rows — a thirty-row table rolls <code>1d30</code> without you touching the formula.</li> </ol> <p>The imported rows keep their hidden payload — the starting gold and the item each shipped bond grants arrive intact — so rewording a row keeps its mechanics.</p> <p><strong>Rows you add by hand grant their text only.</strong> Foundry&#39;s table editor has no way to author that payload, so a hand-written row carries no automatic gold or gear. Put anything mechanical into the prose — &quot;Take 20gp, and a Compass that points somewhere it shouldn&#39;t&quot; — and let the player apply it, which is how this system treats mechanical text everywhere.</p> <p><strong>Do not edit the copy inside Tables (2e) instead.</strong> A system compendium is overwritten wholesale when Air Bladder updates; your world&#39;s copy survives.</p> <hr> <h2>A bonds table for one background</h2> <p>A <strong>custom background</strong> can name its own table: the <strong>Bonds table</strong> box on its Details tab (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.yJJsiQGfqZwkGBV0]{Creating a custom 2e background}). Type the table&#39;s name — your world&#39;s tables are checked first, then every compendium. Leave the box empty and the background draws from the default above.</p> <p>A name that matches nothing does not break generation: the draw falls back to the default with a warning in the console, so a background shared to a world that lacks its table still hands out ordinary bonds.</p> <p>Canon backgrounds have no such box. To give just one of them special bonds, open it in <strong>Backgrounds (2e)</strong>, click <strong>Duplicate into Custom Backgrounds</strong>, set the box on the copy — and switch the original off with the <strong>eye toggle</strong> on its picker row, so the copy is the one that comes up (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Taking a background out of play} in Generating Characters).</p> <hr> <h2>Two bonds, and repeats</h2> <p>A character is entitled to one bond, plus one if their background grants two — the <strong>Grants two bonds</strong> checkbox on a custom background, or, for shipped backgrounds like the Fieldwarden, a description containing the sentence &quot;roll a second time on the bonds table&quot; — plus one more for each rolled question answer containing that sentence. The checkbox and the description together still count once.</p> <p>A drawn bond the character already holds is re-rolled, up to ten attempts, and then the repeat is accepted. That is deliberate: a bonds table with fewer rows than the character has bonds is perfectly legal — one row is a fine table — and there a repeat is a nuisance, while refusing it would leave the character short of what the rules owe them.</p> <hr> <h2>The same trick works for Omens</h2> <p>The character sheet&#39;s omen die (and the picker beside it) resolves the same way: a <strong>RollTable in your world named <code>Omens</code></strong> beats the shipped copy in <strong>Tables (2e)</strong>, and deleting it puts the shipped table back. Import the shipped <strong>Omens</strong> table exactly as step 1 above imports Bonds, keep the name, and edit freely — any number of rows works, and the die rolls whatever formula your table declares. Omen rows are plain prose: unlike bonds, nothing mechanical rides them, so there is nothing else to preserve.</p> <hr> <h2>And for every table the generators roll</h2> <p>The same rule — <strong>a table in your world with the same name wins</strong> — covers every table a generator or a die reaches for. Import the shipped one, keep its name, edit it, and both the button on the Warden&#39;s Dashboard and the generator behind it roll yours. Delete it and the shipped table is back.</p> <table> <thead> <tr> <th>Where it rolls</th> <th>Tables (their shipped compendium)</th> </tr> </thead> <tbody><tr> <td>A 2e character&#39;s biography — generation and the sheet&#39;s re-roll dice</td> <td><code>Physique</code>, <code>Skin</code>, <code>Hair</code>, <code>Face</code>, <code>Speech</code>, <code>Clothing</code>, <code>Vice</code>, <code>Virtue</code> (<strong>Tables (2e)</strong>)</td> </tr> <tr> <td>NPCs and hirelings — the generators, the sheet dice, and the pick-lists</td> <td><code>Warden: NPC - Name</code>, <code>Warden: NPC - Background</code>, <code>Warden: NPC - Faction</code>, <code>Warden: NPC - Quirk</code>, <code>Warden: NPC - Goal</code>, <code>Warden: NPC - Virtue</code>, <code>Warden: NPC - Vice</code> (<strong>Warden: NPCs</strong>)</td> </tr> <tr> <td>Monsters</td> <td>the eight <code>Warden: Monster - …</code> tables (<strong>Warden: Monsters</strong>)</td> </tr> <tr> <td>Barebones character creation</td> <td><code>Barebones: Creation - Weapon</code>, <code>- Armor</code>, <code>- Additional Gear</code>, and the three <code>Barebones: Weapon Tier</code> tables (<strong>Tables (Barebones)</strong>) — these have a one-button copy of their own, see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Generating Characters}</td> </tr> <tr> <td>Scars, when damage lands</td> <td><code>Scars</code> (<strong>Utils</strong>)</td> </tr> <tr> <td>A random spellbook or spellscroll a background hands out</td> <td><code>Spells — Canon (1d100)</code> (<strong>Tables (2e)</strong>), or <code>Spells — GLOG</code> (<strong>Tables (GLOG)</strong>) with the GLOG hack on — these have a one-button copy of their own, spellbooks included, see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Generating Characters}; a world copy re-sorts itself by name when a spellbook is dropped in, so the new spell can be rolled</td> </tr> <tr> <td>Factions</td> <td>every table the faction generator rolls (<strong>Warden: NPCs</strong>)</td> </tr> <tr> <td>The marketplace</td> <td>the four <code>Market: …</code> tables — see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.3XNm7vxBhJUeiuiy]{Customizing the marketplace}</td> </tr> </tbody></table> <p>Two things worth knowing:</p> <ul> <li><strong>Your table&#39;s rows are never marked as drawn.</strong> The generators roll without touching the table, so a table you set to draw <em>without</em> replacement keeps every row available for your own rolls from the Dashboard. If you do want rows crossed off as they come up, roll from the table itself.</li> <li><strong>A row&#39;s text is what gets written</strong>, so on a table whose rows feed a mechanic — a Background that decides an NPC&#39;s starting gear, say — keep the shipped wording for the rows you want to keep working, and add your own rows beside them. On a spell table, rows pointing at anything that is not a spellbook are skipped, so a stray text row does no harm.</li> </ul> <p>None of this needs a system compendium unlocked, and none of it is lost when Air Bladder updates.</p>'
