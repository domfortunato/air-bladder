  - _id: J9dbYfKx3TWZ6EIl
    name: Tokens and Sheets
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Every token on a map is backed by an actor sheet. Whether a stack of tokens shares one sheet, or each keeps its own, is settled when you create the actor — and it is what decides how you track damage in a fight.</p> <p>You need to be the Warden (GM) to change it.</p> <hr> <h2>The two behaviours</h2> <table> <thead> <tr> <th></th> <th><strong>NPC or Hireling</strong></th> <th><strong>Monster</strong></th> </tr> </thead> <tbody><tr> <td>meant for</td> <td>one named person</td> <td>a creature you place several of</td> </tr> <tr> <td>tokens</td> <td>all share one sheet</td> <td>each keeps its own</td> </tr> <tr> <td>damage on one token</td> <td>shows on all of them</td> <td>stays on that token</td> </tr> <tr> <td>disposition</td> <td>neutral</td> <td>hostile</td> </tr> </tbody></table> <p>An innkeeper, a rival, a hostage, a hired torchbearer: there is one of them, so there is one sheet. Hit protection you type on the token is the same hit protection the sheet shows, and that is what NPC and Hireling are for.</p> <p>Six bandits are not one person six times. Each of them needs its own damage, so each token carries its own copy of the stat block and the sheet they came from stays a template. That is what Monster is for.</p> <h2>Running a group of the same enemy</h2> <p>Reach for a Monster. The bestiary carries the human ones — <code>Bandit</code>, <code>Brigand</code>, <code>Brigand Leader</code>, <code>Acolyte</code> — alongside the beasts.</p> <p><strong>Compendium sidebar → Air Bladder - Actors → Monsters</strong>: drag one into the <strong>Actors</strong> tab once, then drag that actor onto the map as many times as you need. Every token takes its own damage, and opening one shows you that token&#39;s numbers rather than the group&#39;s.</p> <p>Dragging straight from the compendium onto the map works as well, and Foundry imports a fresh copy of the actor on every drop — four drops leave four Bandits in your Actors tab. Placing from one world actor keeps the directory tidy.</p> <p>The <strong>Add to scene</strong> button on a rolled encounter does all of this for you.</p> <h2>Changing your mind</h2> <p>Open the actor&#39;s sheet and go to <strong>the ⋮ menu in the title bar → Prototype Token → Identity</strong>, then tick or untick <strong>Link Actor Data</strong>.</p> <p>That governs tokens placed from then on. Tokens already on a map are their own documents and keep the behaviour they were placed with, so delete and re-place them if you want the change to reach them.</p> <p>Switching an existing actor&#39;s <strong>Role</strong> to NPC or Hireling links its prototype token as well, unless you had already unlinked it yourself.</p> <h2>Handing something to a monster</h2> <p>A player can offer an item to anyone they can see: another player&#39;s character, an innkeeper, a mule, a crate. <strong>A monster is the exception, and it is because of permissions rather than any rule about monsters.</strong></p> <p>A monster is created with its permission at <strong>None</strong>, so players cannot see it in the Actors directory and it never appears in their give list. If you want one to be offerable — the party bribing a troll, feeding a guard dog — do two things:</p> <ol> <li>Set the monster&#39;s permission to <strong>Limited</strong> (right-click it in the Actors directory, then <strong>Configure Ownership</strong>).</li> <li>Tick <strong>Link Actor Data</strong> on its token, if the creature the party is talking to is on a map.</li> </ol> <p><strong>The second step matters more than it looks.</strong> An unlinked token is its own copy, so a gift accepted on the directory entry lands on the entry and not on the creature standing in front of the party. That is the same split this page describes above.</p> <p>You answer the offer yourself. Nobody owns a monster or a Limited innkeeper, so the card waits for the Warden.</p> <h2>Giving things away from a sheet you own</h2> <p>The <strong>Give</strong> button on an item row is not only for player characters. It is on every sheet you own, which for you is all of them: open the dead goblin and hand its sword to whoever earned it, or empty a crate into the party without a single drag. A player gets it too on anything they own — a hireling, a connected mule.</p> <p>Two things worth knowing before you use it in a session.</p> <ul> <li><strong>Giving to a player&#39;s character posts a card and waits for them.</strong> You own every actor in the world, so the system cannot tell &quot;my own crate&quot; from &quot;somebody else&#39;s character&quot; by ownership alone. It asks whether anybody <em>else</em> could answer: if somebody could, they do. That is on purpose — taking an item can drop a character&#39;s Hit Protection to 0, and that is their choice to make.</li> <li><strong>Giving to something nobody owns is one click.</strong> An innkeeper, a crate, a mule with no player attached: there is nobody to wait for, so it just happens and the card is the record of it.</li> </ul> <p>Fatigue, a Grimoire and its bound pages still refuse, exactly as they do on a character.</p> <h2>Related</h2> <ul> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.Mpi2G5ctVjYKdC9A]{Generating NPCs and Hirelings} — the two kinds of person and what each one arrives with.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.dbJWZrebNcEvOgpZ]{Generating Monsters} — danger tiers, and what a rolled monster carries.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.g6XIDuCiBPF41XM9]{Encounter Tables} — rolling a wandering encounter and placing its tokens in one click.</li> </ul>'
