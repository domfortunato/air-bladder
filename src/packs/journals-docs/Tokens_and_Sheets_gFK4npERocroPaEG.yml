name: Tokens and Sheets
pages:
  - _id: J9dbYfKx3TWZ6EIl
    name: Tokens and Sheets
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Every token on a map has an actor sheet behind it. When there are several tokens, they either share one sheet or each keep their own. That&#39;s set when you create the actor, and it decides how you track damage in a fight.</p> <p>Only the Warden (GM) can change it.</p> <hr> <h2>The two behaviours</h2> <table> <thead> <tr> <th></th> <th><strong>NPC or Hireling</strong></th> <th><strong>Monster</strong></th> </tr> </thead> <tbody><tr> <td>meant for</td> <td>one named person</td> <td>a creature you place several of</td> </tr> <tr> <td>tokens</td> <td>all share one sheet</td> <td>each keeps its own</td> </tr> <tr> <td>damage on one token</td> <td>shows on all of them</td> <td>stays on that token</td> </tr> <tr> <td>disposition</td> <td>neutral</td> <td>hostile</td> </tr> </tbody></table> <p>An innkeeper, a rival or a hired torchbearer is one person, so there is one sheet. If you change HP on the token, it changes on the sheet too.</p> <p>Six bandits each need their own damage. Each Monster token carries its own copy of the stat block, and the sheet it came from stays a template.</p> <h2>Running a group of the same enemy</h2> <p>Use a Monster. The Monsters compendium has human ones — <code>Bandit</code>, <code>Brigand</code>, <code>Brigand Leader</code>, <code>Acolyte</code> — alongside the beasts.</p> <p><strong>Compendium sidebar → Air Bladder - Actors → Monsters</strong>: drag one into the <strong>Actors</strong> tab once, then drag that actor onto the map as many times as you need. Every token takes its own damage, and opening one shows that token&#39;s numbers.</p> <p>Dragging straight from the compendium onto the map also works, but Foundry imports a fresh copy of the actor on every drop. Four drops leave four Bandits in your Actors tab.</p> <p>The <strong>Add to scene</strong> button on a rolled encounter does all of this for you. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.g6XIDuCiBPF41XM9]{Encounter Tables}.</p> <h2>Changing your mind</h2> <p>Open the actor&#39;s sheet and go to <strong>the ⋮ menu in the title bar → Prototype Token → Identity</strong>, then tick or untick <strong>Link Actor Data</strong>.</p> <p>That only affects tokens you place from then on. Tokens already on a map keep the behaviour they were placed with. To change those, delete them and place them again.</p> <p>Switching an actor&#39;s <strong>Role</strong> from Monster to NPC or Hireling also ticks <strong>Link Actor Data</strong>. If you&#39;d left it unticked on purpose, untick it again after the switch.</p> <h2>Attacking from a sheet</h2> <p>The <strong>Attack</strong> button on the first page of a character&#39;s or creature&#39;s sheet opens a window that asks three things: the <strong>Target</strong>, the <strong>Weapon or attack</strong> (an equipped item that deals damage, or an Improvised Attack), and whether the attack is standard, impaired or enhanced. A panicked attacker&#39;s attacks are always impaired.</p> <p>The roll posts a damage card. You apply it with the card&#39;s <strong>Apply damage</strong> control. The target&#39;s Armor comes off the damage, the rest comes off HP, and anything left over comes off STR. If you rolled the card without a target, it asks who takes it.</p> <p>For a trap or a hazard, use <strong>Warden&#39;s Damage</strong>, the skull in the Token controls. Whoever you&#39;ve targeted takes it. If you haven&#39;t targeted anyone, the card asks who.</p> <h2>Equipping a shield, a light or a spellbook</h2> <p>Under the Armor box on the first page of a character&#39;s or creature&#39;s sheet are three badges: <strong>Equip shield</strong>, <strong>Equip light</strong> and <strong>Equip Spell</strong>. Press one to equip that thing, and press it again to put it away. It does the same as the hand on that item&#39;s row in the inventory. While something&#39;s equipped, its badge glows and the label changes to <strong>Shield equipped</strong>, <strong>Light equipped</strong> or <strong>Spell equipped</strong>. If you don&#39;t carry one, the badge is greyed out and reads <strong>No Shield</strong>, <strong>No Light</strong> or <strong>No Spell</strong>.</p> <ul> <li><strong>Shield.</strong> A shield only adds to Armor while it&#39;s equipped.</li> <li><strong>Light.</strong> The badge shows the light you&#39;re carrying, a torch or a lantern, and how far it reaches once it&#39;s lit. Only one light is equipped at a time, and with several it asks which.</li> <li><strong>Spell.</strong> This covers a spellbook, a scroll and the Grimoire, one at a time, and its tooltip names the one that&#39;s equipped. With several, it asks which. You have to equip it to cast from it, and it takes both hands: equipping it puts away your shield and light, and equipping either of those puts it away.</li> </ul> <p><strong>Lighting a light uses it up.</strong> Equipping a Torch marks off one of its uses, and with none left you can&#39;t light it. A Lantern burns one use of an <strong>Oil Can</strong> you&#39;re carrying, or of a <strong>Candle</strong> if you don&#39;t have oil, and it won&#39;t light without either. Lights that don&#39;t count uses, like the Glowsnail, light for free. Everyone sees a chat message when a light is lit and when it goes out, unless it&#39;s on a hidden token: then only the Warden does.</p> <h2>Handing something to a monster</h2> <p>A player can offer an item to anyone they can see: another player&#39;s character, an innkeeper, a mule, a crate. A monster is created with its permission at <strong>None</strong>, so players can&#39;t see it and it never shows up in their give list.</p> <p>To let the party hand something to a monster:</p> <ol> <li>Set the monster&#39;s permission to <strong>Limited</strong> (right-click it in the Actors directory, then <strong>Configure Ownership</strong>).</li> <li>Tick <strong>Link Actor Data</strong> on its token, if the creature is on a map.</li> </ol> <p>If you skip the second step, the gift lands on the Actors-tab entry instead of the token in front of the party, because an unlinked token is its own copy.</p> <p>You answer the offer yourself. No player owns a monster or a Limited innkeeper, so the card waits for the Warden.</p> <h2>Giving things away from a sheet you own</h2> <p>The hand icon on an item row (<strong>Give this to someone else…</strong>) is on every sheet you own, which for the Warden is all of them. You can hand a dead goblin&#39;s sword to whoever earned it, or empty a crate into the party. A player has it on anything they own, such as a hireling or a connected mule.</p> <ul> <li><strong>Giving to a player&#39;s character posts a card and waits for them.</strong> Taking an item can leave a character without a free slot, which sets their HP to 0, so it&#39;s their choice.</li> <li><strong>Giving to something that no player owns takes one click.</strong> The card is the record of it.</li> </ul> <p>Fatigue, a Grimoire and its bound pages can&#39;t be given.</p> <h2>Related</h2> <ul> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.Mpi2G5ctVjYKdC9A]{Generating NPCs and Hirelings} — the two kinds of person and what each one arrives with.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.dbJWZrebNcEvOgpZ]{Generating Monsters} — danger tiers, and what a rolled monster carries.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.g6XIDuCiBPF41XM9]{Encounter Tables} — rolling a wandering encounter and placing its tokens in one click.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.bGizGOinmw2tNXH4]{Optional Combat Rules} — exploding dice, shields and the other combat options.</li> </ul>'
