name: Tokens and Sheets
pages:
  - _id: J9dbYfKx3TWZ6EIl
    name: Tokens and Sheets
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Every token on a map is backed by an actor sheet. Whether a stack of tokens shares one sheet, or each keeps its own, is settled when you create the actor — and it is what decides how you track damage in a fight.</p> <p>You need to be the Warden (GM) to change it.</p> <hr> <h2>The two behaviours</h2> <table> <thead> <tr> <th></th> <th><strong>NPC or Hireling</strong></th> <th><strong>Monster</strong></th> </tr> </thead> <tbody><tr> <td>meant for</td> <td>one named person</td> <td>a creature you place several of</td> </tr> <tr> <td>tokens</td> <td>all share one sheet</td> <td>each keeps its own</td> </tr> <tr> <td>damage on one token</td> <td>shows on all of them</td> <td>stays on that token</td> </tr> <tr> <td>disposition</td> <td>neutral</td> <td>hostile</td> </tr> </tbody></table> <p>An innkeeper, a rival, a hostage, a hired torchbearer: there is one of them, so there is one sheet. Hit protection you type on the token is the same hit protection the sheet shows, and that is what NPC and Hireling are for.</p> <p>Six bandits are not one person six times. Each of them needs its own damage, so each token carries its own copy of the stat block and the sheet they came from stays a template. That is what Monster is for.</p> <h2>Running a group of the same enemy</h2> <p>Reach for a Monster. The bestiary carries the human ones — <code>Bandit</code>, <code>Brigand</code>, <code>Brigand Leader</code>, <code>Acolyte</code> — alongside the beasts.</p> <p><strong>Compendium sidebar → Air Bladder - Actors → Monsters</strong>: drag one into the <strong>Actors</strong> tab once, then drag that actor onto the map as many times as you need. Every token takes its own damage, and opening one shows you that token&#39;s numbers rather than the group&#39;s.</p> <p>Dragging straight from the compendium onto the map works as well, and Foundry imports a fresh copy of the actor on every drop — four drops leave four Bandits in your Actors tab. Placing from one world actor keeps the directory tidy.</p> <p>The <strong>Add to scene</strong> button on a rolled encounter does all of this for you.</p> <h2>Changing your mind</h2> <p>Open the actor&#39;s sheet and go to <strong>the ⋮ menu in the title bar → Prototype Token → Identity</strong>, then tick or untick <strong>Link Actor Data</strong>.</p> <p>That governs tokens placed from then on. Tokens already on a map are their own documents and keep the behaviour they were placed with, so delete and re-place them if you want the change to reach them.</p> <p>Switching an existing actor&#39;s <strong>Role</strong> to NPC or Hireling links its prototype token as well, unless you had already unlinked it yourself.</p> <h2>Related</h2> <ul> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.Mpi2G5ctVjYKdC9A]{Generating NPCs and Hirelings} — the two kinds of person and what each one arrives with.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.dbJWZrebNcEvOgpZ]{Generating Monsters} — danger tiers, and what a rolled monster carries.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.g6XIDuCiBPF41XM9]{Encounter Tables} — rolling a wandering encounter and placing its tokens in one click.</li> </ul>'
