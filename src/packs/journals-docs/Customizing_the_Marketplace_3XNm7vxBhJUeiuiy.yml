name: Customizing the Marketplace
pages:
  - _id: 7z1bhM5F2aaWhWrL
    name: Customizing the Marketplace
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>The <strong>Marketplace</strong> is the shop a character opens from the <strong>Inventory</strong> page of their sheet. It ships with four aisles: Weapons, Armor, Gear, and Transports &amp; Containers. Every row in it names an item, and the price, description, tags and slot cost a shopper sees are read from that item each time the shop opens.</p> <p>This page covers setting your own prices and stocking your own goods. You need to be the Warden.</p> <h2>How the shop works</h2> <p>Each aisle is a <strong>rollable table</strong>, and each row names one item:</p> <ul> <li><strong>Cost</strong> is the price.</li> <li><strong>Bulky</strong> and <strong>Petty</strong> set how many slots it takes. Bulky takes two, Petty doesn&#39;t take any, and anything else takes one.</li> <li>The description is what a shopper reads when they click the name.</li> </ul> <p>If you change an item, the next person to open the shop sees the change. Nobody has to reload.</p> <p>A shopper can <strong>Buy</strong> an item, paying its cost in gold, or <strong>Take</strong> it for free. A character who doesn&#39;t have a free slot can&#39;t get anything except a Petty item or a transport. Buying a mount, cart or pack creates a new actor, which Foundry only lets the Warden do by default.</p> <p>To close the shop to players, turn off <strong>Let players buy and take from the marketplace</strong> under <strong>Configure Inventory</strong>, or run the shipped <strong>Toggle Player Marketplace</strong> macro. The Warden can always shop.</p> <h2>Do not edit the shipped compendiums</h2> <p>Foundry lets you unlock <strong>Marketplace</strong> or <strong>Market Goods</strong> and edit them in place. You&#39;ll lose those edits, because a system compendium is replaced whole every time Air Bladder updates.</p> <p>An update never touches your world. Keep your version of the shop there, and treat the shipped compendiums as templates to copy.</p> <h2>Copy it into your world</h2> <p>Open the <strong>Rollable Tables</strong> sidebar tab and press <strong>Create a Custom Marketplace…</strong> (Wardens only). A window explains what it will copy. Press <strong>Copy</strong> and you get:</p> <ul> <li>the four <strong>Market:</strong> tables in your Rollable Tables, in a <strong>Custom Marketplace</strong> folder;</li> <li>every item they sell in your Items sidebar, in a <strong>Custom Marketplace</strong> folder with a subfolder per source compendium (Armor, Gear, Market Goods, Tools, Trinkets, Weapons);</li> <li>every mount and cart in a <strong>Custom Marketplace</strong> folder in your Actors sidebar;</li> <li>every row of the copied tables pointing at your copy.</li> </ul> <p>A window then says what was copied, with a button for each new folder: <strong>Show the Custom Marketplace folder in Rollable Tables</strong>, <strong>Show the Custom Marketplace folder in Items</strong> and <strong>Show the Custom Marketplace folder in Actors</strong>.</p> <p>From then on the shop reads your tables and your items, and your changes survive every update.</p> <ul> <li><strong>Running it again never overwrites.</strong> Anything already in your world is kept. Only what&#39;s missing is added, and the window says how many of each.</li> <li><strong>A table you imported by hand earlier is kept too.</strong> It&#39;s found by name, so a <code>Market: Gear</code> you already had stays yours. Its rows still point at the shipped items, and the window says so. Delete it and run again to have it rebuilt pointing at your copies.</li> <li><strong>Items you imported earlier are used, not duplicated.</strong> A copy made with Foundry&#39;s own Import is recognised, and the rows point at it at whatever price you gave it.</li> </ul> <p>A mount copied this way is also what an encounter table places for a row that points at the shipped one, because Foundry treats a world copy as the import of its source.</p> <h2>Replacing an aisle by hand</h2> <ol> <li>Open the <strong>Compendium</strong> sidebar tab → <strong>Marketplace</strong> → right-click <strong>Market: Gear</strong> → <strong>Import</strong>.</li> <li>The copy lands in your <strong>Rollable Tables</strong> sidebar under the same name. Keep that name, because it&#39;s how the shop finds your table.</li> <li>Open the table and press <strong>Edit</strong> at the top of the window. Delete rows you don&#39;t stock, and drag in items you do, from the Items sidebar or a compendium, anywhere onto the table&#39;s window.</li> </ol> <p>A note at the top of any <code>Market:</code> table in your world says which aisle it stocks and how to add or remove a row. On a shipped table the note says it&#39;s a template and names the button. If you rename a table away from <code>Market:</code>, the note disappears, because the shop has stopped reading it. If two tables in your world share a name, both say so. Rename or delete one of them.</p> <p>Your table stays in alphabetical order. When you drop an item in, the rows are re-numbered by name. The shop shows the aisle in the same order.</p> <p>The four names, spelled exactly:</p> <ul> <li><code>Market: Weapons</code></li> <li><code>Market: Armor</code></li> <li><code>Market: Gear</code></li> <li><code>Market: Transports &amp; Containers</code></li> </ul> <p>A world table <strong>replaces</strong> its aisle. Importing the shipped table first gives you all of its rows to start from. If you delete your table, the shipped aisle comes back.</p> <h2>An aisle of your own</h2> <p>If you make a rollable table whose name begins with <code>Market: </code>, it becomes a new aisle, such as <code>Market: Poisons</code>. It shows up after the four shipped ones, for everybody.</p> <h2>Your own prices</h2> <p>A price lives on the item. After <strong>Create a Custom Marketplace…</strong> every row points at your copy, so open the item in the <strong>Custom Marketplace</strong> folder of your Items sidebar (a mount or a cart is in the folder of the same name under Actors) and set its <strong>Cost</strong>.</p> <p>By hand, one item at a time:</p> <ol> <li>Find the item in its compendium: <strong>Market Goods</strong>, <strong>Gear</strong>, <strong>Tools</strong>, <strong>Trinkets</strong>, <strong>Weapons</strong>, <strong>Armor</strong>, or <strong>Companions &amp; Transports</strong> for a mount or a cart.</li> <li>Right-click it → <strong>Import</strong>. It lands in your <strong>Items</strong> sidebar (a mount or a cart lands in <strong>Actors</strong>).</li> <li>Set its <strong>Cost</strong> there.</li> <li>Drag your copy into your market table, and delete the row pointing at the shipped one.</li> </ol> <p>Items you write yourself work the same way. Give one a Cost and drag it into an aisle.</p> <h2>What a row can point at</h2> <p>A row can point at an <strong>item</strong> of any kind, or at an <strong>NPC actor</strong> for a mount, a wagon or a pack animal. The shop ignores anything else in a market table.</p> <p><strong>The table a thing sits in decides its aisle.</strong> A sword in <code>Market: Gear</code> is sold from the Gear aisle.</p> <p>Keep mounts, carts and packs in <code>Market: Transports &amp; Containers</code>. Only a player character&#39;s sheet is shown that aisle. The shop on any other sheet leaves it out.</p> <h2>What your players see</h2> <p>Your players get your prices and your stock the next time they open the shop. Nobody needs to reload.</p> <p>Bonds and omens are customized the same way, with a world table of the same name. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.mlSyCzimMvBjzxFH]{Customizing bonds}.</p>'
