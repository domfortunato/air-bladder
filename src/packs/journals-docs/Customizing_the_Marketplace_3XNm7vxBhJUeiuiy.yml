    name: Customizing the Marketplace
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>The <strong>Marketplace</strong> is the shop a character opens from the <strong>Items</strong> tab of their sheet. It arrives with four aisles — Weapons, Armor, Gear, and Transports &amp; Containers — and every row in it points at a real item somewhere in your world. Nothing in the shop is a price list: the price, the description, the tags and the slot cost a shopper sees are read off the item itself, every time the shop opens.</p> <p>This page is about setting your own prices and stocking your own goods.</p> <p>You need to be the Warden (GM).</p> <hr> <h2>Where a price comes from</h2> <p>Each aisle is a <strong>rollable table</strong>, and each of its rows names one item. When a shopper opens the shop, every row is looked up fresh. So an item&#39;s own fields are the shop:</p> <ul> <li><strong>Cost</strong> is the price.</li> <li><strong>Bulky</strong> and <strong>Petty</strong> are the slots it takes — bulky costs two, petty or weightless costs none, anything else costs one.</li> <li>The description is what a shopper reads when they click the name.</li> </ul> <p>Nothing is cached. Change an item and the next person to open the shop sees the change, with no reload.</p> <hr> <h2>Do not edit the shipped compendiums</h2> <p>Foundry will let you unlock <strong>Marketplace</strong>, or <strong>Market Goods</strong>, and edit them in place. It also warns you, in the dialog that unlocking raises, that your changes may be lost — and here they certainly will be. A system compendium is overwritten wholesale when Air Bladder updates: the old copy is deleted before the new one is written, and everything you typed into it goes with it.</p> <p>Your world is never touched by an update. So the durable way to change the shop is to keep your version of it in your world, which is what the rest of this page describes.</p> <hr> <h2>Replacing an aisle</h2> <ol> <li>Open the <strong>Compendium</strong> sidebar tab → <strong>Marketplace</strong> → right-click <strong>Market: Gear</strong> → <strong>Import</strong>.</li> <li>The copy lands in your <strong>Rollable Tables</strong> sidebar under the same name. That name is the whole mechanism — keep it.</li> <li>Edit it freely. Delete rows you do not stock, and drag in items you do.</li> </ol> <p>The four names, spelled exactly:</p> <ul> <li><code>Market: Weapons</code></li> <li><code>Market: Armor</code></li> <li><code>Market: Gear</code></li> <li><code>Market: Transports &amp; Containers</code></li> </ul> <p>A world table <strong>replaces</strong> its aisle rather than adding to it. That is what lets you take something off the shelves — and it is why importing the shipped table first is the easy way to begin, since you start with all of its rows in front of you.</p> <p>Delete your table and the shipped aisle comes straight back. There is nothing else to configure, and no setting to find.</p> <hr> <h2>An aisle of your own</h2> <p>Make a rollable table whose name begins with <code>Market: </code> and it becomes a new aisle — <code>Market: Poisons</code>, <code>Market: Black Market</code>, whatever your table needs. It appears after the four shipped ones, for everybody.</p> <hr> <h2>Your own prices, kept</h2> <p>A price lives on the item, and the shipped items are in shipped compendiums, so re-pricing one in place has the same fate as everything else in there. To keep a price:</p> <ol> <li>Find the item in its compendium — <strong>Market Goods</strong>, <strong>Expeditionary Gear</strong>, <strong>Weapons</strong>, <strong>Armor</strong>, or <strong>Mounts &amp; Transports</strong> for a mount or a cart.</li> <li>Right-click it → <strong>Import</strong>. It lands in your <strong>Items</strong> sidebar (a mount or a cart lands in <strong>Actors</strong>).</li> <li>Set its <strong>Cost</strong> there.</li> <li>Drag your copy into your market table, and delete the row pointing at the shipped one.</li> </ol> <p>Items you write yourself work exactly the same way: give one a Cost, drag it into an aisle, and it is on the shelves.</p> <hr> <h2>What a row can point at</h2> <p>An <strong>item</strong> of any kind, and an <strong>NPC actor</strong> for a mount, a wagon or a pack animal — those carry a stat block and their own capacity, so they cannot be plain items. Anything else dragged into a market table is ignored by the shop.</p> <p><strong>Which aisle a thing is in is decided by the table it sits in</strong>, not by what kind of thing it is. A sword filed under Gear is sold from the Gear aisle.</p> <p>One exception is worth knowing: a character&#39;s <strong>Containers</strong> tab offers the Transports &amp; Containers aisle and only that one. A mule filed under Gear can still be bought from the main shop, but it will not appear on that tab, so put carriers where they belong.</p> <hr> <h2>What your players see</h2> <p>The shop is read fresh every time it opens, on whoever&#39;s screen it opens. Your players get your prices and your stock the next time they open it — there is nothing to hand out, and nobody needs to reload.</p> <hr> <p>The same trick — a world table beating a shipped one by name — is how bonds and omens are customized. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.mlSyCzimMvBjzxFH]{Customizing bonds}.</p>'
