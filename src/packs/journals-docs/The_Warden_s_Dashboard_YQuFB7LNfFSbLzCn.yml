    name: 'The Warden''s Dashboard'
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>The Dashboard puts every Warden table on a button: encounters by terrain, weather by season, what an NPC wants, what a monster looks like. It also holds the clock controls and the generators.</p> <p>Only the Warden (GM) can open it.</p> <hr> <h2>Opening it</h2> <p>Click the <strong>clipboard</strong> in the Token controls, down the left of the map, below the skull that opens <strong>Warden&#39;s Damage</strong>.</p> <p>The window reopens on the tab you left. Drag its edge to resize it. The <strong>Pop Out</strong> arrow in its title bar moves it into its own browser window, for a second monitor. To put it back, use the <strong>⋮ menu</strong>.</p> <h2>The clock</h2> <p>Above the tabs you&#39;ll see today&#39;s date and watch, plus the season and weather when there are any. Under that are the buttons that move the clock: <strong>Back a Watch</strong>, <strong>Advance a Watch</strong>, <strong>Advance a Day</strong>, <strong>To Next Morning</strong> and <strong>Set the Date…</strong>. Everyone at the table sees the change on the calendar bar across the top of their screen.</p> <p>With the Vald calendar on there is also a <strong>Calendar</strong> button, which opens the month.</p> <p><strong>Roll Today&#39;s Weather</strong> rolls the weather table for the current season. Its card always goes to everyone, and the result becomes the day&#39;s weather on the calendar bar. <strong>Set the Weather…</strong> beside it lets you type the weather instead.</p> <p><strong>Dungeon Events</strong> and <strong>Wilderness Events</strong> sit under those, so you can reach them from every tab.</p> <p>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.EGgjxg76AqBcUGSm]{Keeping Time} explains all of it.</p> <h2>The tabs</h2> <table> <thead> <tr> <th>Tab</th> <th>What&#39;s on it</th> </tr> </thead> <tbody><tr> <td><strong>Travel</strong></td> <td>Path difficulty, path distance and terrain difficulty; Weather Difficulty and the four seasons&#39; weather, or Vald&#39;s four with the Vald calendar on</td> </tr> <tr> <td><strong>Encounters</strong></td> <td>A table for each of the seven terrains</td> </tr> <tr> <td><strong>People</strong></td> <td>Reaction, what they want, the six tables that describe an NPC, and Faction</td> </tr> <tr> <td><strong>Factions</strong></td> <td>Agenda, agent, obstacle, advantages and traits</td> </tr> <tr> <td><strong>Monsters</strong></td> <td>Appearance, ability, attack and traits</td> </tr> <tr> <td><strong>Your Tables</strong></td> <td>Every roll table you have made in this world</td> </tr> </tbody></table> <p><strong>Your Tables</strong> doesn&#39;t need any setup. Make a roll table in the sidebar and it shows up there under its own name.</p> <p>If you copy a shipped table into your world and edit it, its button rolls your copy.</p> <h2>Who sees the result</h2> <p>The <strong>Who sees the result</strong> dropdown above the tabs applies to every roll button on every tab. It opens on <strong>Private to Gamemasters</strong>. Set it to Public Roll when the party should see what came up. It doesn&#39;t change your usual dice settings.</p> <p>Two things ignore it. The <strong>eye</strong> always shows a table to everyone, and <strong>Roll Today&#39;s Weather</strong> always posts publicly.</p> <h2>Showing a table to the players</h2> <p>Every table button has an <strong>eye</strong> on its right edge. Click the name to roll the table. Click the eye to show it.</p> <p>Showing a table opens it on every player&#39;s screen and posts a copy to chat, with every row and its numbers. It doesn&#39;t roll anything.</p> <h2>Rolling a whole set</h2> <p>Four tabs have a button that rolls several tables at once and gives you one combined result: <strong>Complete Path</strong>, <strong>Complete NPC</strong>, <strong>Complete Faction</strong> and <strong>Complete Monster</strong>.</p> <p>These only describe. They don&#39;t create anything. <strong>Complete NPC</strong> gives you a name, a background, a goal, a quirk, a vice and a virtue, for someone the party won&#39;t meet twice.</p> <h2>Creating instead</h2> <p>Under <strong>Create</strong> on the People, Factions and Monsters tabs you&#39;ll find the same generators as the Actors sidebar: <strong>Create NPC</strong>, <strong>Create Hireling</strong>, <strong>Create Faction</strong> and <strong>Create Monster</strong>. Each one makes a sheet you can open, edit and place on a map, or a journal entry for a faction. Each one asks first, in the same window the sidebar opens, so you can pick a monster&#39;s tier, clear <strong>Use random generation.</strong> for an empty sheet, or name a faction and choose its parts.</p> <h2>Encounters place their own monsters</h2> <p>An encounter rolled here works the same way as one rolled from the compendium. If its result names monsters, your copy of the card has an <strong>Add to scene</strong> button that places them. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.g6XIDuCiBPF41XM9]{Encounter Tables}.</p> <p>The Encounters tab doesn&#39;t have a combined button, because a combined result wouldn&#39;t carry Add to scene.</p> <h2>The party at a glance</h2> <p>The <strong>Party sheet</strong> button at the bottom of the Dashboard, beside Warden&#39;s Damage, opens a table of every character in the Party folder, along with any NPC or hireling you&#39;ve put there. The <strong>people</strong> icon in the Token controls opens it too.</p> <p>Each row is one character: who plays them, their pronouns and background, HP and the three abilities, armor, gold, slots, Fatigue, whether their shield is equipped or slung, the light they&#39;ve got equipped, how many rations they have left, how many hirelings, companions, containers and transports are connected to them, and their conditions. Click a name to open that character&#39;s sheet.</p> <p>Colour is the warning. Amber means HP below max or one slot left. Red means HP at 0, an ability below max, no slot left, or no rations. Teal means a shield or a light that&#39;s equipped. A shield or light that&#39;s carried but not equipped shows its symbol without colour, and the light&#39;s symbol matches the light, a torch or a lantern. Fatigue and an empty rations count are boxed. Conditions show as D (Deprived), P (Panicked) and E (Encumbered).</p> <p>To put out a character&#39;s light, click its teal symbol. Everyone sees a chat message saying the Warden put it out.</p> <p>The rows are in marching order. Drag a row onto another to move it there. The order is saved with the world.</p> <p>The last column, <strong>Warden&#39;s notes</strong>, is for a line of your own about each character. Only you see it.</p> <p>If you move a character out of the Party folder, it leaves the table. Move it back and it returns.</p> <h2>Related</h2> <ul> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.g6XIDuCiBPF41XM9]{Encounter Tables} — writing your own encounter tables, and which rows get an Add to scene button.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.Mpi2G5ctVjYKdC9A]{Generating NPCs and Hirelings} — what each kind of person arrives with.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.dbJWZrebNcEvOgpZ]{Generating Monsters} — danger tiers, and what a rolled monster carries.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.gFK4npERocroPaEG]{Tokens and Sheets} — which route gives every token its own damage.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.EGgjxg76AqBcUGSm]{Keeping Time} — watches, the calendar bar, and the Vald calendar.</li> </ul>'
