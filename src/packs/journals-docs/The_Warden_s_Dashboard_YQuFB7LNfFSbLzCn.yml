name: 'The Warden''s Dashboard'
pages:
  - _id: Gf5Gywkjrlulzwib
    name: 'The Warden''s Dashboard'
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Air Bladder ships forty-five tables for you to roll at the table: encounters by terrain, weather by season, what an NPC wants, what a monster looks like. The dashboard puts every one of them on a button, so you are not hunting through compendiums while the party waits.</p> <p>You need to be the Warden (GM). Players cannot open it.</p> <hr> <h2>Opening it</h2> <p>Click the <strong>clipboard</strong> in the Token controls, down the left of the map, below the skull that opens <strong>Warden&#39;s Damage</strong>.</p> <p>The window remembers which tab you left it on. Drag its edge to resize it, and use the <strong>arrow</strong> in its title bar to pop it out into its own window, which is useful on a second monitor. Re-dock it from the <strong>⋮ menu</strong>.</p> <h2>The clock</h2> <p>Across the top, above the tabs, is today: the date, then the watch, the season and the weather beneath it, laid out the same way the calendar&#39;s day panel lays them out. Under that are the controls that move them: <strong>Back a Watch</strong>, <strong>Advance a Watch</strong>, <strong>Advance a Day</strong>, <strong>To Next Morning</strong> and <strong>Set the Date…</strong>. Everyone at the table sees the clock change at once, on the panel above their player list.</p> <p>With the Vald calendar switched on there is a <strong>Calendar</strong> button too, which opens the month grid.</p> <p>Beneath them, <strong>Roll Today&#39;s Weather</strong> rolls the weather for the season you are actually in, so you do not have to remember which one that is. That card always goes to everyone, and the result becomes the day&#39;s weather on everybody&#39;s clock and calendar. <strong>Set the Weather…</strong> beside it lets you simply say what the sky is doing, for the days no table has a row for.</p> <p>Under those sit <strong>Dungeon Events</strong> and <strong>Wilderness Events</strong>. They are here rather than on a tab because an event is something that happens as time passes, and the clock band is on screen whichever tab you are looking at.</p> <p>All of it is explained in @UUID[Compendium.air-bladder.journals-docs.JournalEntry.EGgjxg76AqBcUGSm]{Keeping Time}, including the Vald calendar and why there is no Make Camp button.</p> <h2>The tabs</h2> <table> <thead> <tr> <th>Tab</th> <th>What is on it</th> </tr> </thead> <tbody><tr> <td><strong>Travel</strong></td> <td>Path difficulty and distance, terrain, and weather for each of the four seasons — or Vald&#39;s own four if you have that switched on</td> </tr> <tr> <td><strong>Encounters</strong></td> <td>A table for each of the seven terrains</td> </tr> <tr> <td><strong>People</strong></td> <td>Reaction, what they want, and the six tables that describe an NPC</td> </tr> <tr> <td><strong>Factions</strong></td> <td>Agenda, agent, obstacle, advantages and traits</td> </tr> <tr> <td><strong>Monsters</strong></td> <td>Appearance, ability, attack and traits</td> </tr> <tr> <td><strong>Your Tables</strong></td> <td>Every roll table you have made in this world</td> </tr> </tbody></table> <p><strong>Your Tables needs no setup.</strong> Make a roll table in the sidebar and it appears here with a button, named however you named it.</p> <h2>Who sees the result</h2> <p>The dropdown above the tabs decides who sees what you roll. There is one of it and it applies to every button on every tab.</p> <p><strong>It opens on Private to Gamemasters.</strong> Most of what is on this window is something you want to know before the table does, so a roll stays yours unless you say otherwise. Set it to Public Roll when you want the party to see what came up.</p> <p>Two things ignore it on purpose. The <strong>eye</strong> always shows a table to everyone — showing a table privately would not mean anything — and <strong>Roll Today&#39;s Weather</strong> always posts publicly, because weather the party is standing in is not a secret.</p> <p>It is a per-window choice, so it does not disturb your usual dice settings.</p> <h2>Showing a table to the players</h2> <p>Every table button has a small <strong>eye</strong> on its right edge. Click the name to roll the table. Click the eye to show it.</p> <p>Showing a table opens it on every player&#39;s screen and puts a copy in the chat log, so anyone who was away or closed the window can still find it. It lists every row with its numbers, because seeing the odds is usually the reason to show a travel or weather table at all.</p> <p>A shown table is always public. The <strong>Who sees the result</strong> dropdown governs what you <em>roll</em>, and it is deliberately ignored here: showing a table to the players privately would not mean anything.</p> <p>Nothing is rolled, so nothing is decided. The table is just on the screen.</p> <h2>Rolling a whole set</h2> <p>Four of the tabs carry one button that rolls several tables at once and reports them as a single result: <strong>Complete Path</strong>, <strong>Complete NPC</strong>, <strong>Complete Faction</strong> and <strong>Complete Monster</strong>. Each sits in the grid with the tables it draws from, and hovering it says what it will roll.</p> <p>These describe, they do not create. <strong>Complete NPC</strong> tells you a name, a background, a goal, a quirk, a vice and a virtue, and leaves it at that, which is what you want when someone the party will never meet again opens a door.</p> <h2>Creating instead</h2> <p>Under <strong>Create</strong> are the generators, the same ones the Actors sidebar offers. These do make something: a sheet you can open, edit and place on a map, or on the Factions tab a journal dossier. Each one asks first, in the same window you get from the sidebar, so you can pick a monster&#39;s tier, clear <strong>Use random generation.</strong> for an empty sheet, or name a faction and pick its parts from its tables.</p> <p>So the pair on each tab is a choice about what you need. Roll a complete set when you want to know. Create when you want a sheet.</p> <h2>Encounters place their own monsters</h2> <p>An encounter you roll here behaves exactly as one rolled from the compendium does: if its result names monsters, the card grows an <strong>Add to scene</strong> button that places them for you.</p> <p>That is the reason the Encounters tab has no combined button. Rolling several encounter tables into one result would cost you that button, and placing the monsters is the whole point.</p> <h2>Related</h2> <ul> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.g6XIDuCiBPF41XM9]{Encounter Tables} — writing your own encounter tables, and how a row earns its Add to scene button.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.Mpi2G5ctVjYKdC9A]{Generating NPCs and Hirelings} — what each kind of person arrives with.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.dbJWZrebNcEvOgpZ]{Generating Monsters} — danger tiers, and what a rolled monster carries.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.gFK4npERocroPaEG]{Tokens and Sheets} — which route gives every token its own damage.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.EGgjxg76AqBcUGSm]{Keeping Time} — watches, the watch clock, and the Vald calendar.</li> </ul>'
