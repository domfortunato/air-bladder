    name: Optional Combat Rules
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>There are three optional combat rules and three shield options. They&#39;re all <strong>off by default</strong>, you switch each one on separately, and you&#39;ll find them under <strong>Game Settings → Air Bladder → Configure Hacks</strong>. Only <strong>Shields are Bulky</strong> reloads Foundry.</p> <p>The combat rules, <strong>Hands full</strong> and <strong>Shields are d4 weapons</strong> affect <strong>player characters only</strong>. They don&#39;t change anything for NPCs, hirelings or monsters.</p> <h2>Exploding damage dice</h2> <p>When you tick <strong>Exploding damage dice</strong>, a player character&#39;s damage die that rolls its highest face gets rolled again and added. A die can explode at most <strong>half its faces, less one</strong> times:</p> <table> <thead> <tr> <th>Die</th> <th>Explodes at most</th> </tr> </thead> <tbody><tr> <td>d4</td> <td>once</td> </tr> <tr> <td>d6</td> <td>twice</td> </tr> <tr> <td>d8</td> <td>three times</td> </tr> <tr> <td>d10</td> <td>four times</td> </tr> <tr> <td>d12</td> <td>five times</td> </tr> <tr> <td>d20</td> <td>nine times</td> </tr> </tbody></table> <p>A d6 rolling 6 then 4 deals 10. A d6 rolling 6, 6 and then 2 deals 14. A d6 rolling 6, 6, 6 deals 18 and stops, because the third six is added but isn&#39;t rolled again.</p> <p><strong>Only the die you keep explodes.</strong> Cairn&#39;s dual-wield and similar rules roll two dice and keep the higher. If both come up 6, that&#39;s <strong>one</strong> six, and it explodes once.</p> <p><strong>Every die from a d4 up explodes.</strong> That includes an <strong>Impaired</strong> roll&#39;s d4, a d4 weapon and an <strong>Enhanced</strong> roll&#39;s d12. A d2 or d3 never explodes.</p> <p><strong>Every explosion is announced.</strong> The damage card gets a line, <em>A d6 exploded!</em>, once for each time the die went again. A die that stops at its cap doesn&#39;t add an extra line.</p> <p><strong>An improvised attack counts.</strong> The <strong>Improvised Attack</strong> row at the top of a character&#39;s inventory rolls the die you type, and that die explodes like any other.</p> <p><strong>Only player characters&#39; damage rolls explode.</strong> A monster&#39;s attack, an NPC&#39;s, and the Warden&#39;s Damage tool all roll normally.</p> <p><strong>Mixed dice don&#39;t explode.</strong> A keep-highest formula of <strong>different</strong> dice, such as <code>d6 + d8</code>, is rolled as written. The weapons that ship with the system aren&#39;t written this way. Same-sized dice explode normally, and that covers <code>2d6k</code>, <code>d6 + d6</code> and every shipped weapon.</p> <p><code>d6 + d6</code> means keep the highest only while <strong>Use Cairn dice notation: &#39;d6+d6&#39; as keep highest</strong> is on. With it off, it&#39;s plain addition. It&#39;s rolled as written and doesn&#39;t explode, and that includes the Cutpurse&#39;s twin daggers.</p> <p><strong>The shield is the exception.</strong> With <strong>Shields are d4 weapons</strong> on, a character who adds their shield to an attack rolls the weapon&#39;s die and the shield&#39;s d4 and keeps the higher. The kept die explodes if it rolled its highest face. A d6 rolling 6 against the d4&#39;s 3 keeps the 6 and rolls again. A d6 rolling 5 against the d4&#39;s 4 keeps the 5, and nothing explodes. On a tie the weapon&#39;s die is kept. If a d6 and the d4 both roll 4, you keep the d6&#39;s 4, so nothing explodes.</p> <p><strong>Formulas of your own.</strong> A damage formula that <strong>adds</strong> two dice, such as <code>2d10</code>, shares one cap between them. The shipped weapons don&#39;t use one. A formula typed with its own <code>x</code>, such as an improvised attack rolling <code>1d6x</code>, is rolled exactly as typed and isn&#39;t capped.</p> <h2>Fatigue instead of Critical Damage</h2> <p>When you tick <strong>Fatigue instead of Critical Damage</strong>, a player character who fails a Critical Damage save gets two buttons on the chat card: <strong>Mark Critical Damage</strong>, or <strong>Take a Fatigue instead</strong>.</p> <p><strong>Only an overburdened character has to pay.</strong> A Fatigue fills a slot. If the character has a free slot, pressing the button adds the Fatigue, even when that fills their last slot. If they don&#39;t have a free slot, a window asks what they&#39;ll put down to make room, and that item goes to the party&#39;s Dropped Item Pile. The player always chooses the item.</p> <p>The list only offers things that free a slot, so Petty items and Fatigue aren&#39;t on it. Each row says what it frees, because a bulky item frees two slots. A torch shows how many uses it has left.</p> <p><strong>Refusing costs the save.</strong> The window&#39;s second button is <em>No — take the Critical Damage</em>, and pressing it marks the Critical Damage. Pressing Escape or closing the window <strong>isn&#39;t</strong> a refusal, and the card is left as it was.</p> <p>A character who doesn&#39;t have <strong>anything</strong> that frees a slot can&#39;t pay. When they press the Fatigue button they take the Critical Damage without a window, and the card shows a tick against <em>Mark Critical Damage</em>.</p> <p>Pressing either button settles the card for good. A tick marks the one that was taken.</p> <p>The choice only shows up on a card if the option was on when the save was rolled. Turning the option off later doesn&#39;t remove a choice that&#39;s already on screen.</p> <h2>Maneuver on max damage</h2> <p>With <strong>Maneuver on max damage</strong> ticked, when a player character&#39;s damage die rolls its <strong>highest face</strong>, the damage stands as rolled and the chat card adds a line: <em>Maximum damage! You may also attempt a maneuver.</em></p> <p>A maneuver is resolved with an ability check the Warden calls for, and it doesn&#39;t cause damage directly. The rule is borrowed from <strong>Knave 2e</strong> by Ben Milton, which lists the usual examples. The system doesn&#39;t reprint them.</p> <p><strong>The damage still applies.</strong> Apply it as usual. There isn&#39;t anything to choose or press on the card.</p> <p><strong>With Exploding damage dice also on, both happen.</strong> The die explodes, the chain is added to the damage, and the line still appears.</p> <p><strong>Any die, melee or ranged.</strong> An <strong>Impaired</strong> attack&#39;s d4 earns the line on a 4, and an <strong>Enhanced</strong> attack&#39;s d12 on a 12. An <strong>improvised attack</strong> is judged on the die you typed. The weapon sheet&#39;s <strong>Ranged</strong> checkbox doesn&#39;t do anything at the moment.</p> <p><strong>The same limit as exploding dice.</strong> A keep-highest formula of <strong>different</strong> dice, such as <code>d6 + d8</code>, never shows the line. <code>d6 + d6</code> works normally while <strong>Use Cairn dice notation: &#39;d6+d6&#39; as keep highest</strong> is on. With it off, <code>d6 + d6</code> is plain addition and never shows the line.</p> <p><strong>With a shield added, the line follows the die you keep.</strong> A d4 that rolls 4 but loses to the weapon&#39;s 5 doesn&#39;t earn a maneuver.</p> <p>The line only shows up if the option was on when the damage was rolled, and only for the people who can see the roll.</p> <h2>Shields</h2> <p>A shield is any armor with <strong>Shield</strong> ticked on its sheet. A character holds or slings one with the <strong>Hold shield?</strong> badge beside Armor on their sheet. A <strong>Broken</strong> shield can&#39;t be held.</p> <p><strong>Shields are Bulky.</strong> Every shield takes two inventory slots, like any Bulky item. This one applies to every sheet, and changing it reloads Foundry.</p> <p><strong>Hands full: a shield and a light.</strong> A player character holding both a shield and a light can attack only with the shield, the light, or an improvised attack. Their other weapons can&#39;t be rolled until a hand is free. The Attack window says why: <em>Your hands are full: you are holding a shield and a light.</em></p> <p><strong>Shields are d4 weapons.</strong> A player character&#39;s held shield rolls d4 damage from its inventory row and appears in the Attack window. Choose a one-handed weapon there and tick <strong>Add the shield (d4)</strong> to roll both dice on a standard attack and keep the higher. A two-handed weapon can&#39;t take the shield. That means anything Bulky, and any bow. A panicked character can&#39;t add it either.</p> <h2>Tougher characters, if you want them</h2> <p>Under <strong>Configure Character Generation</strong>, <strong>Ability dice for player characters</strong> offers <strong>Crawler (2d6 + 3)</strong>, which rolls every ability between 5 and 15. It doesn&#39;t depend on anything else on this page.</p> <h2>See also</h2> <ul> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.JN9oUEMUbsvjwn8A]{Dice Formulas} — what a damage formula can say, including keep-highest notation.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.9oeCczsxzffDqC0w]{GLoG Magic in Foundry} — another optional hack.</li> </ul>'
