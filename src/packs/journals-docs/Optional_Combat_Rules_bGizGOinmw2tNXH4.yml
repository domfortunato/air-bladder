    name: Optional Combat Rules
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Three optional rules for a fiercer fight. Each is <strong>off by default</strong>, each is switched on and off on its own, and they live under <strong>Game Settings → Air Bladder → Configure Hacks</strong>. None of them needs a reload.</p> <p>They affect <strong>player characters only</strong>. NPCs, hirelings and monsters are untouched by every one of them.</p> <h2>Resting costs a ration</h2> <p>This one is not optional. It is a <strong>house rule that applies at every table</strong>, to player characters only: pressing <strong>Rest</strong> uses up one ration and restores Hit Protection to its maximum. The button&#39;s dialog says so and shows how many rations the character has left; with none on the sheet it refuses, and the character cannot rest until they have one.</p> <p><strong>Rations are counted by uses.</strong> The Rations item ships with three, so one item is three rations, and a Rest spends one use. Several Rations items are fine: the first one with a use left pays. A stack of Rations (quantity 2) rolls over the way the row&#39;s <strong>−</strong> button does — when the last use of one unit goes, the next unit opens full. Anything named Rations counts, so a Warden&#39;s own &quot;Iron Rations&quot; does too, as long as it has a uses counter — and so does an item named with this system&#39;s own translation of &quot;Rations&quot; on a translated client, though not any other word for food; a Rations item with no uses counter, or with all its uses spent, is not food the system can see.</p> <p>NPCs, hirelings and monsters rest as they always did. Nothing is logged twice: the change log records a Rest as one entry that names both the Hit Protection and the ration.</p> <h2>Exploding damage dice</h2> <p>Tick <strong>Exploding damage dice</strong> and a player character&#39;s damage die that rolls its highest face is rolled again and added. A die explodes at most <strong>half its faces, less one</strong> times, and then the chain stops:</p> <table> <thead> <tr> <th>Die</th> <th>Explodes at most</th> </tr> </thead> <tbody><tr> <td>d4</td> <td>once</td> </tr> <tr> <td>d6</td> <td>twice</td> </tr> <tr> <td>d8</td> <td>three times</td> </tr> <tr> <td>d10</td> <td>four times</td> </tr> <tr> <td>d12</td> <td>five times</td> </tr> <tr> <td>d20</td> <td>nine times</td> </tr> </tbody></table> <p>A d6 rolling 6 then 4 deals 10. A d6 rolling 6, 6 and then 2 deals 14. A d6 rolling 6, 6, 6 deals 18 and stops there: the third six is added but not rolled again.</p> <p><strong>Only the die you keep explodes.</strong> Cairn&#39;s dual-wield and similar rules roll two dice and keep the higher. If both come up 6, that is <strong>one</strong> six, so it explodes once — you do not get two chains.</p> <p><strong>Every die explodes, however small.</strong> An <strong>Impaired</strong> roll is a d4 and explodes like any other die; so does a d4 weapon, if you write one, and so does an <strong>Enhanced</strong> roll&#39;s d12. There is no smallest die.</p> <p><strong>Every explosion is announced.</strong> The damage card gains a line — <em>A d6 exploded!</em> — once for each time the die went again, so a chain that went twice says so twice. A die that stops at its cap adds no extra line: the lines count the explosions, and the table above says where they stop.</p> <p><strong>An improvised attack counts.</strong> The <strong>Improvised Attack</strong> row at the top of a character&#39;s inventory rolls whatever die you type into it, and that die explodes like any other — the d4 an improvised attack starts on included.</p> <p><strong>Only player characters&#39; damage rolls explode.</strong> A monster&#39;s attack, an NPC&#39;s, and the Warden&#39;s Damage tool for a trap or hazard all roll normally.</p> <p><strong>One limit, stated plainly.</strong> If you write a keep-highest damage formula out of <strong>different</strong> dice — <code>d6 + d8</code>, say — it will not explode. Keeping the highest and then exploding only that die has no way to be written for mixed dice, and the alternative would quietly give you better odds than the rule above. No weapon that ships with the system is written this way. Same-sized dice — <code>2d6k</code>, <code>d6 + d6</code>, and every shipped weapon — explode normally.</p> <p><strong>Two more, for formulas of your own.</strong> A damage formula that <strong>adds</strong> two dice — <code>2d10</code>, which no shipped weapon uses — shares one cap between them rather than giving each die its own. And a formula typed with its own <code>x</code> (an improvised attack rolling <code>1d6x</code>, say) is rolled exactly as typed, with no cap: the option caps only the chains it writes itself.</p> <h2>Fatigue instead of Critical Damage</h2> <p>Tick <strong>Fatigue instead of Critical Damage</strong> and a player character who fails a Critical Damage save is offered a choice on the chat card, side by side: take the Critical Damage as usual, or <strong>Take a Fatigue instead</strong>.</p> <p><strong>Only an overburdened character has to pay.</strong> A Fatigue fills a slot, like any ordinary item. If the character has a free slot, pressing the button simply adds the Fatigue — even when that leaves them overburdened, as it does at nine of ten. If they are <strong>already</strong> overburdened, with no free slot, pressing it asks what they put down to make room, and that item goes to the party&#39;s Dropped Item Pile, so the trade is one thing on the floor for one Fatigue in the pack. Which item is always the player&#39;s choice; the system never picks.</p> <p>The list offers only things whose loss would actually free a slot. Petty items are not on it — they take no slot, so giving one up would cost nothing and free nothing — and neither is Fatigue itself. Each row says what it frees, because a bulky item frees two slots and that is usually the thing worth knowing. A torch shows how many uses it has left: it is one item with up to three uses, not three torches.</p> <p><strong>Refusing costs the save.</strong> The dialog&#39;s second button is <em>No — take the Critical Damage</em>, and pressing it marks them as you would have anyway. Pressing Escape, or closing the window, is <strong>not</strong> a refusal: nothing happens and the card is left as it was, so a dialog dismissed by accident has not cost anybody their alternative.</p> <p>A character with <strong>nothing</strong> that frees a slot cannot pay, so they take the Critical Damage the moment they press the Fatigue button — no dialog, because there is nothing to choose from. Worth knowing at the table: it tends to be the character who has been taking Fatigue all session who loses the alternative, and the card shows a tick against <em>Mark Critical Damage</em> so it is clear what happened.</p> <p>It is one choice or the other. Pressing either button settles the card, and it stays settled — coming back to it later, neither button glows, and a tick marks the one that was taken.</p> <p>The choice appears on a card only if the option was on when the save was rolled. Turning the option off later does not retract a choice already on screen.</p> <h2>Maneuver on max damage</h2> <p>Tick <strong>Maneuver on max damage</strong> and when a player character&#39;s damage die rolls its <strong>highest face</strong>, the damage stands as rolled and the chat card adds a line: <em>Maximum damage! You may also attempt a maneuver.</em></p> <p>A maneuver is anything the Warden agrees is plausible in the moment — the sort of thing that changes the situation rather than the enemy&#39;s Hit Protection. It is resolved with an ability check the Warden calls for, and it causes no damage directly. This is borrowed from <strong>Knave 2e</strong> by Ben Milton, which lists the usual examples; the system deliberately does not reprint them.</p> <p><strong>The damage is not the price.</strong> Apply it as usual; the maneuver comes on top. There is no choice to make on the card and nothing to press.</p> <p><strong>With Exploding damage dice also on, both happen.</strong> The die explodes when it is rolled, the chain is added to the damage, and the line is still there — a die that rolled its maximum and then exploded still rolled its maximum.</p> <p><strong>Any die, melee or ranged.</strong> A bow&#39;s maximum counts the same as a sword&#39;s. An <strong>Impaired</strong> attack&#39;s d4 earns the line on a 4, a d4 weapon&#39;s does, and so does an Enhanced attack&#39;s d12 on a 12. An <strong>improvised attack</strong> is judged on the die you typed. The weapon sheet&#39;s <strong>Ranged</strong> checkbox, which once kept ranged weapons out of this, is still there and does nothing at the moment.</p> <p><strong>One limit, the same one exploding dice has.</strong> A keep-highest formula out of <strong>different</strong> dice — <code>d6 + d8</code> — never shows the line. Same-sized dice written as <code>d6 + d6</code> are rolled in their keep form, <code>2d6k</code>, so the card can tell which die was kept, and work normally.</p> <p>The line appears only if the option was on when the damage was rolled, and only to the people who can see the roll: on a private or blind roll, nobody else learns the die came up high.</p> <h2>Tougher characters, if you want them</h2> <p>Under <strong>Configure Character Generation</strong>, <strong>Ability dice for player characters</strong> offers <strong>Crawler (2d6 + 3)</strong>, which rolls every ability between 5 and 15. It is independent of everything on this page — use either without the other. Hit Protection follows the <strong>Hit Protection formula</strong> there, like every other table.</p> <h2>See also</h2> <ul> <li><strong>Dice Formulas</strong> — what a damage formula can say, including keep-highest notation.</li> <li><strong>GLOG Magic in Foundry</strong> — another optional hack.</li> </ul>'
