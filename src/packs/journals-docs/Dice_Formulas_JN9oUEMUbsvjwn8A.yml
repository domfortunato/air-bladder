    name: Dice Formulas
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Air Bladder reads dice formulas in a few places a Warden can edit — a weapon&#39;s damage, a monster&#39;s attack, the <strong>Damage</strong> field on the Warden&#39;s Damage tool, and two settings under Character Generation: the <strong>Age formula</strong> and the <strong>Hit Protection formula for player characters</strong>. This page is what those formulas can say. It also explains the notation on the <strong>Ability dice</strong> and <strong>Gold dice</strong> menus, which offer a fixed set of formulas rather than a box to type in.</p> <p><strong>Every field that takes dice also takes a plain number.</strong> Put <code>4</code> in the Hit Protection formula and every character has 4 Hit Protection; put <code>3</code> in the Warden&#39;s Damage field and it deals 3. A fixed amount is simply a formula with no dice in it, so there is nothing special to turn on.</p> <h2>The basics</h2> <p>A die is <code>NdX</code>: <code>1d20</code> rolls one twenty-sider, <code>2d6</code> rolls two six-siders and adds them. Plain numbers add on: <code>2d20 + 10</code> rolls two d20s, adds them together, then adds 10 — ages 12 to 50, the book&#39;s roll and the Age formula&#39;s default. Any number of faces works: <code>1d31 + 19</code> is a real roll, ages 20 to 50 with every age equally likely.</p> <p>A formula can also be just a number: <code>30</code> means every roll comes out 30.</p> <h2>Cairn&#39;s plus sign</h2> <p>Cairn&#39;s rules write &quot;roll two dice and keep the highest&quot; as <code>d8 + d8</code>, so with <strong>Use Cairn dice notation</strong> on (the default), the system reads <code>+</code> the way the book does — and what is on each side decides which meaning applies:</p> <table> <thead> <tr> <th>You write</th> <th>It means</th> <th>Result</th> </tr> </thead> <tbody><tr> <td><code>2d8</code></td> <td>roll two d8 and add them</td> <td>2–16</td> </tr> <tr> <td><code>d8 + d8</code></td> <td>roll two d8, keep the highest</td> <td>1–8</td> </tr> <tr> <td><code>2d20 + 10</code></td> <td>roll, add, plus 10</td> <td>12–50</td> </tr> </tbody></table> <p>Only the die-plus-die form keeps the highest. With the notation setting off, <code>+</code> always adds and <code>d8 + d8</code> is simply 2–16.</p> <h2>Keeping the best of several dice</h2> <p><code>kh</code> after a die means &quot;keep the highest&quot;, and the number after it says how many dice to keep:</p> <table> <thead> <tr> <th>You write</th> <th>It means</th> <th>Result</th> </tr> </thead> <tbody><tr> <td><code>4d6kh3</code></td> <td>roll four d6, keep the best three</td> <td>3–18, high results much more likely</td> </tr> <tr> <td><code>2d20kh1</code></td> <td>roll two d20, keep the higher</td> <td>1–20</td> </tr> <tr> <td><code>3d6kl2</code></td> <td>roll three d6, keep the lowest two</td> <td>2–12 (<strong>k</strong>eep <strong>l</strong>owest)</td> </tr> </tbody></table> <p>This is Foundry&#39;s own notation rather than Cairn&#39;s, so it works whether the Cairn notation setting is on or off. It is what the <strong>Adventurer</strong> option on the Ability dice and Gold dice menus rolls: <code>4d6kh3</code> covers the same 3–18 range as the book&#39;s <code>3d6</code>, but weights it heavily towards the top.</p> <p>Mind the difference from Cairn&#39;s plus form above. <code>d8 + d8</code> keeps <strong>one</strong> die of two, so it stays within one die&#39;s range, 1–8. <code>4d6kh3</code> keeps <strong>three</strong> dice and adds them, so its range is three dice wide.</p> <h2>Exploding dice</h2> <p><code>x</code> after a die rolls it again whenever it comes up its highest face, and adds the result — for as long as it keeps rolling the highest:</p> <table> <thead> <tr> <th>You write</th> <th>It means</th> <th>Result</th> </tr> </thead> <tbody><tr> <td><code>1d6x</code></td> <td>roll a d6; on a 6, roll and add again</td> <td>1–5, or 6 plus another roll</td> </tr> <tr> <td><code>2d6kx</code></td> <td>roll two d6, keep the higher, and explode <strong>that one</strong></td> <td>1–5, or 6 plus another roll</td> </tr> </tbody></table> <p>Order matters, and <code>2d6kx</code> is deliberate: <code>k</code> keeps the higher die first, so only the kept die explodes. Two sixes are one six. Written the other way round, <code>2d6xk</code> explodes both dice and then compares them, which can never exceed 6 — not what you want.</p> <p><strong>Crawler Combat Mode applies this for you</strong>, to player characters&#39; damage rolls only, so you do not normally type it. See that guide. Two limits go with it. A keep-highest roll of <strong>different</strong> dice, <code>d6 + d8</code>, is left alone — keeping the highest and then exploding it cannot be written for mixed dice. And <strong>nothing smaller than a d6 explodes</strong>, so a d4 weapon and every Impaired roll are left alone too; Enhanced rolls are a d12 and explode normally.</p> <p>With <strong>Maneuver on max melee damage</strong> also on, a melee attack&#39;s die does not explode by itself: the card offers the player the choice of exploding it or forgoing the damage for a maneuver, and pressing <strong>Explode the Die</strong> rolls the chain then and there. Typing <code>x</code> yourself still explodes immediately — the choice is something the hack offers, not something the notation does.</p> <h2>Minimums and maximums</h2> <p>Braces compare two rolls and keep one, which is how a formula says &quot;but never below&quot; or &quot;but never above&quot;:</p> <table> <thead> <tr> <th>You write</th> <th>It means</th> </tr> </thead> <tbody><tr> <td><code>{2d20 + 10, 21}kh</code></td> <td>roll 2d20 + 10, but never below 21 (<strong>k</strong>eep <strong>h</strong>ighest)</td> </tr> <tr> <td><code>{2d20 + 10, 40}kl</code></td> <td>roll 2d20 + 10, but never above 40 (<strong>k</strong>eep <strong>l</strong>owest)</td> </tr> </tbody></table> <p>These work whether the Cairn notation setting is on or off — the brace form belongs to Foundry itself.</p> <p>Prefer shaping the dice over capping them where you can: a cap piles results onto the boundary (capping <code>2d20 + 10</code> at 30 makes more than half of all rolls exactly 30), while dice sized to the range spread across it.</p> <h2>Age formula recipes</h2> <table> <thead> <tr> <th>You want</th> <th>Write</th> </tr> </thead> <tbody><tr> <td>The book&#39;s roll, ages 12–50</td> <td><code>2d20 + 10</code> (the default)</td> </tr> <tr> <td>No characters under 21</td> <td><code>{2d20 + 10, 21}kh</code></td> </tr> <tr> <td>Ages 20–30, the middle most likely</td> <td><code>2d6 + 18</code></td> </tr> <tr> <td>Ages 20–50, all equally likely</td> <td><code>1d31 + 19</code></td> </tr> <tr> <td>Everyone arrives the same age</td> <td><code>30</code></td> </tr> </tbody></table> <h2>When a formula does not parse</h2> <p>A formula the dice reader cannot understand is not rolled: the default is used instead and a warning names the text that was rejected, so a typo never silently changes what the setting does. A <strong>blank</strong> field just means &quot;use the default&quot;, with no warning.</p> <p>The age box on a character&#39;s sheet stays free text either way — a typed age is never checked against any formula.</p> <p>Foundry&#39;s own dice reference covers the full notation, modifiers and all: <a href="https://foundryvtt.com/article/dice/">foundryvtt.com/article/dice</a>.</p>'
