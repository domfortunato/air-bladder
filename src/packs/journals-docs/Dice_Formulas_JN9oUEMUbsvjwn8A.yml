    name: Dice Formulas
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Air Bladder reads dice formulas in a few places you can edit: a weapon&#39;s damage, a monster&#39;s attack, the <strong>Damage</strong> field on the Warden&#39;s Dashboard, and two settings under Character Generation, the <strong>Age formula for generated characters</strong> and the <strong>Hit Protection formula for player characters</strong>. This page covers what those formulas can say. It also explains the notation on the <strong>Ability dice for player characters</strong> and <strong>Gold dice for player characters</strong> menus, which offer a fixed set of formulas.</p> <p><strong>Every field that takes dice also takes a plain number.</strong> Put <code>4</code> in the Hit Protection formula and every character has 4 Hit Protection. Put <code>3</code> in the Dashboard&#39;s Damage field and it deals 3.</p> <h2>The basics</h2> <p>A die is written <code>NdX</code>. <code>1d20</code> rolls one twenty-sider, and <code>2d6</code> rolls two six-siders and adds them. Plain numbers add on, so <code>2d20 + 10</code> rolls two d20s, adds them, then adds 10. That gives ages 12 to 50, which is the book&#39;s roll and the Age formula&#39;s default. Any number of faces works. <code>1d31 + 19</code> gives ages 20 to 50, with every age equally likely.</p> <h2>Cairn&#39;s plus sign</h2> <p>Cairn&#39;s rules write &quot;roll two dice and keep the highest&quot; as <code>d8 + d8</code>. With <strong>Use Cairn dice notation: &#39;d6+d6&#39; as keep highest</strong> on (the default), the system reads <code>+</code> the way the book does:</p> <table> <thead> <tr> <th>You write</th> <th>It means</th> <th>Result</th> </tr> </thead> <tbody><tr> <td><code>2d8</code></td> <td>roll two d8 and add them</td> <td>2–16</td> </tr> <tr> <td><code>d8 + d8</code></td> <td>roll two d8, keep the highest</td> <td>1–8</td> </tr> <tr> <td><code>2d20 + 10</code></td> <td>roll, add, plus 10</td> <td>12–50</td> </tr> </tbody></table> <p>Only the die-plus-die form keeps the highest. With the setting off, <code>+</code> always adds and <code>d8 + d8</code> is 2–16.</p> <h2>Keeping the best of several dice</h2> <p><code>kh</code> after a die means &quot;keep the highest&quot;, and the number after it says how many dice to keep:</p> <table> <thead> <tr> <th>You write</th> <th>It means</th> <th>Result</th> </tr> </thead> <tbody><tr> <td><code>4d6kh3</code></td> <td>roll four d6, keep the best three</td> <td>3–18, high results much more likely</td> </tr> <tr> <td><code>2d20kh1</code></td> <td>roll two d20, keep the higher</td> <td>1–20</td> </tr> <tr> <td><code>3d6kl2</code></td> <td>roll three d6, keep the lowest two</td> <td>2–12 (<strong>k</strong>eep <strong>l</strong>owest)</td> </tr> </tbody></table> <p>This is Foundry&#39;s own notation, so it works whether the Cairn notation setting is on or off. The <strong>Adventurer</strong> option on the Ability dice and Gold dice menus rolls <code>4d6kh3</code>. That&#39;s the same 3–18 range as the book&#39;s <code>3d6</code>, weighted towards the top.</p> <p><code>d8 + d8</code> keeps <strong>one</strong> die of two, so it stays within one die&#39;s range, 1–8. <code>4d6kh3</code> keeps <strong>three</strong> dice and adds them.</p> <h2>Exploding dice</h2> <p><code>x</code> after a die rolls it again whenever it comes up its highest face, and adds the result, for as long as it keeps rolling the highest:</p> <table> <thead> <tr> <th>You write</th> <th>It means</th> <th>Result</th> </tr> </thead> <tbody><tr> <td><code>1d6x</code></td> <td>roll a d6; on a 6, roll and add again</td> <td>1–5, or 6 plus another roll</td> </tr> <tr> <td><code>2d6kx</code></td> <td>roll two d6, keep the higher, and explode <strong>that one</strong></td> <td>1–5, or 6 plus another roll</td> </tr> <tr> <td><code>1d6x2=6</code></td> <td>roll a d6; on a 6, roll and add again, <strong>at most twice</strong></td> <td>1–5, or 6 plus up to two more</td> </tr> </tbody></table> <p>Order matters. In <code>2d6kx</code>, <code>k</code> keeps the higher die first, so only the kept die explodes, and two sixes count as one. Written the other way round, <code>2d6xk</code> explodes both dice and then compares them, which can never be more than 6.</p> <p><strong>The Exploding damage dice option does this for you</strong>, for player characters&#39; damage rolls only. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.bGizGOinmw2tNXH4]{Optional Combat Rules}. It writes the capped form: <code>1d6x2=6</code>, <code>2d6kx2=6</code>, <code>1d4x1=4</code>. The number after <code>x</code> is the cap and the number after <code>=</code> is the face that explodes. Foundry reads <code>x2</code> on its own as &quot;explode on a 2&quot;, so keep the <code>=</code> if you type a cap yourself.</p> <h2>Minimums and maximums</h2> <p>Braces compare two rolls and keep one. This is how a formula says &quot;never below&quot; or &quot;never above&quot;:</p> <table> <thead> <tr> <th>You write</th> <th>It means</th> </tr> </thead> <tbody><tr> <td><code>{2d20 + 10, 21}kh</code></td> <td>roll 2d20 + 10, but never below 21 (<strong>k</strong>eep <strong>h</strong>ighest)</td> </tr> <tr> <td><code>{2d20 + 10, 40}kl</code></td> <td>roll 2d20 + 10, but never above 40 (<strong>k</strong>eep <strong>l</strong>owest)</td> </tr> </tbody></table> <p>The brace form is Foundry&#39;s own, so it works whether the Cairn notation setting is on or off.</p> <p>Where you can, shape the dice instead of capping them. A cap piles results onto the boundary. Capping <code>2d20 + 10</code> at 30 makes more than half of all rolls exactly 30. Dice sized to the range spread across it instead.</p> <h2>Age formula recipes</h2> <table> <thead> <tr> <th>You want</th> <th>Write</th> </tr> </thead> <tbody><tr> <td>The book&#39;s roll, ages 12–50</td> <td><code>2d20 + 10</code> (the default)</td> </tr> <tr> <td>No characters under 21</td> <td><code>{2d20 + 10, 21}kh</code></td> </tr> <tr> <td>Ages 20–30, the middle most likely</td> <td><code>2d6 + 18</code></td> </tr> <tr> <td>Ages 20–50, all equally likely</td> <td><code>1d31 + 19</code></td> </tr> <tr> <td>Everyone arrives the same age</td> <td><code>30</code></td> </tr> </tbody></table> <h2>When a formula cannot be read</h2> <p>If the system can&#39;t read the formula in the Age or Hit Protection setting, it doesn&#39;t roll it. It rolls the default instead, and a warning shows the text that was rejected. A <strong>blank</strong> field means &quot;use the default&quot;, and you don&#39;t get a warning.</p> <p>The age box on a character&#39;s sheet stays free text. An age you type there isn&#39;t checked against any formula.</p> <p>Foundry&#39;s own dice reference covers the full notation: <a href="https://foundryvtt.com/article/dice/">foundryvtt.com/article/dice</a>.</p>'
