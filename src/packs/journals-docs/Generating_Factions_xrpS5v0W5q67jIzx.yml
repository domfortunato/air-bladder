    name: Generating Factions
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p><strong>Create Faction</strong> rolls Cairn 2e&#39;s <strong>Setting Seeds</strong> faction tables into a faction write-up, a <strong>dossier</strong>, and files it as a <strong>Journal Entry</strong>. A faction is not a creature, so it is not an Actor. It lands in your Journal sidebar, where you can rename it and edit it.</p> <p>Only the Warden sees the button, and a dossier is hidden from players until you share it.</p> <hr> <h2>Where the button is</h2> <p><strong>Actors tab → the button row at the top → Create Faction</strong> (the flag icon). The same button is on the <strong>Factions</strong> tab of the Warden&#39;s Dashboard, under <strong>Create</strong>.</p> <p>It opens a window with a <strong>Use random generation.</strong> tick-box. Leave it ticked and press <strong>Create</strong>, and every line of the dossier is rolled. The dossier opens once it is made. Each press makes a new entry and never overwrites an old one. <strong>Cancel</strong> or <strong>✕</strong> creates nothing.</p> <h2>Choosing the parts yourself</h2> <p>Clear the box and the window shows a <strong>Name</strong> field, a list for each of <strong>Type</strong>, <strong>Agent</strong>, <strong>First Trait</strong>, <strong>Second Trait</strong>, <strong>Agenda</strong> and <strong>Obstacle</strong>, and a tick-list of <strong>Advantages</strong>.</p> <ul> <li><strong>Name.</strong> What you type is kept exactly. Leave it empty and the faction is named from its Trait and Type, as a rolled one is.</li> <li><strong>The six lists.</strong> Each holds the rows of its table in the table&#39;s own order, so a faction rolled at the table with the book goes in by row. Each starts on <strong>Random</strong>; a list left there is rolled for you.</li> <li><strong>Advantages.</strong> Tick up to four. Leave them all clear and both the number of advantages and the advantages themselves are rolled.</li> </ul> <p>To file a faction you have only a name for, clear the box, type the name, leave everything else alone and press <strong>Create</strong>.</p> <h2>What the dossier contains</h2> <table> <thead> <tr> <th>Line</th> <th>What it answers</th> </tr> </thead> <tbody><tr> <td><strong>Type</strong></td> <td>What kind of group this is</td> </tr> <tr> <td><strong>Agent</strong></td> <td>A representative you can put in front of the party</td> </tr> <tr> <td><strong>Traits</strong></td> <td>Two notes on how the faction behaves</td> </tr> <tr> <td><strong>Advantages</strong></td> <td>What the faction has going for it: 1 to 4 entries, never the same one twice. The number is rolled too, as the SRD&#39;s procedure has it</td> </tr> <tr> <td><strong>Agenda</strong></td> <td>What they are trying to do</td> </tr> <tr> <td><strong>Obstacle</strong></td> <td>What stands in their way</td> </tr> </tbody></table> <p>Unless you typed a name, the entry is called <strong>&quot;The ⟨Trait⟩ ⟨Type⟩&quot;</strong>, such as <em>The Enigmatic Cultists</em>. Replace it when the faction earns a name in your campaign.</p> <p><strong>Players cannot see a dossier.</strong> To share one, give players Observer ownership of the entry, as with any Foundry journal.</p> <h2>The eight tables behind it</h2> <p>They are RollTables in the <strong>Warden — NPCs</strong> compendium:</p> <ul> <li><code>Warden: NPC - Faction</code> (the Type line; also rolled by the Faction die on a sheet, below)</li> <li><code>Warden: Faction - Agent</code></li> <li><code>Warden: Faction - Trait (Trait 1)</code></li> <li><code>Warden: Faction - Trait (Trait 2)</code></li> <li><code>Warden: Faction - Advantage (Count)</code></li> <li><code>Warden: Faction - Advantage</code></li> <li><code>Warden: Faction - Agenda</code></li> <li><code>Warden: Faction - Obstacle</code></li> </ul> <p>The text is the Cairn 2e SRD&#39;s Setting Seeds content (CC BY-SA 4.0, by Yochai Gal). The generator never marks a table&#39;s rows as drawn.</p> <h2>Making the tables yours</h2> <p>If a RollTable in your world has exactly one of the names above, the generator rolls it and ignores the shipped one. Import a shipped table into your world, keep its name, and edit it there. Your table survives every system update. An edit made inside the shipped compendium does not: the next update replaces it. The lists in the Create Faction window read the same tables, so your rows appear there too.</p> <p>If a table is missing or empty, its line in the dossier is a dash and the rest of the dossier is still made.</p> <h2>The Faction die on NPC, Hireling and Monster sheets</h2> <p>These sheets have a <strong>Faction</strong> field on their first page, under Role. You can always type in it. With Character Creation Mode on (the <strong>CharGen</strong> toggle in the sheet&#39;s title bar), a d20 die appears beside it. The die rolls <code>Warden: NPC - Faction</code> (your world&#39;s table first) and fills the field. It changes nothing else on the sheet. An NPC&#39;s or Hireling&#39;s sheet also has a list button for choosing a row.</p> <p>To put your own factions on that die:</p> <ol> <li>Press <strong>Create Faction</strong> until one suits. Rename it and edit its dossier.</li> <li>Add the faction&#39;s name as a row in your world&#39;s copy of <code>Warden: NPC - Faction</code>.</li> <li>The Faction die now deals your factions to NPCs, Hirelings and Monsters.</li> </ol> <p>The Create Faction window&#39;s <strong>Type</strong> list reads the same table, so your factions&#39; names appear there too. Pick one to write up a splinter group or a rival chapter of a faction you already have.</p> <h2>Language</h2> <p>A dossier is written in the language Foundry was using when it was made, and it stays in that language. A generated monster works the same way.</p>'
