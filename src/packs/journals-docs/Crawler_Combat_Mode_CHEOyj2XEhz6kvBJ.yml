    text:
      content: '<p><strong>Crawler Combat Mode</strong> is an optional hack for a harsher, more lethal game. It is <strong>off by default</strong> and changes nothing until you turn it on, under <strong>Game Settings → Air Bladder → Configure Hacks</strong>.</p> <p>It affects <strong>player characters only</strong>. NPCs, hirelings and monsters are untouched by every part of it.</p> <p>Turning it on reloads the world, so everyone at the table sees the same rules at the same moment.</p> <h2>What the hack itself does</h2> <p>Being overburdened works exactly as it does in Cairn: Hit Protection is 0 until a slot is freed, and nothing else. The hack does not touch the Deprived box, which stays what the Player&#39;s Guide says it is — going without food or rest.</p> <p>One thing worth knowing at the table: <strong>overburdened means no free slot</strong>. A pack filled to exactly its limit counts, so clearing it means ending up with a slot genuinely spare. A character at 11 of 10 slots has to put down two things, not one.</p> <p><strong>Player characters are made with 6 Hit Protection.</strong></p> <p>While the hack is on, a new player character starts with 6 Hit Protection, and 6 is their maximum — the <strong>Hit Protection formula</strong> under Character Generation is ignored, and its hint says so. Ticking Hit Protection on the Roll Character checklist deals 6 as well. Scars can raise a maximum above 6 exactly as they always could; type the new number into the sheet.</p> <p>Switching the hack on does <strong>not</strong> rewrite characters that already exist. Set their maximum to 6 by hand, or tick Hit Protection on Roll Character.</p> <p><strong>A Rest rolls for Hit Protection instead of restoring it.</strong></p> <p>Pressing <strong>Rest</strong> still costs a ration (the house rule below), but under the hack it does not refill Hit Protection. It rolls one die the size of the character&#39;s maximum — a d6 for most, a d7 for a maximum of 7 — and if the roll is higher than their current Hit Protection, that is their new Hit Protection. If it is not, nothing changes, and the ration is gone either way. A chat card shows the die and says which it was.</p> <h3>The first Fatigue is free</h3> <p>This is a <strong>house rule, and it applies whether or not any of this is switched on</strong>: a character carries their <strong>first Fatigue for free</strong>, as though it were petty. Every Fatigue after that fills a slot as normal. The free one wears a <strong>Petty</strong> tag on the sheet so you can see which it is, and the slot count agrees with it — a character with nine things and one Fatigue reads nine of ten, not ten of ten.</p> <p>Cairn as written charges a slot for every Fatigue. The reason for the change is further down this page: when a player takes a Fatigue instead of Critical Damage and it would not fit, they have to put something down, and without this the trade left them no better off than before. With it, they drop one thing, take one Fatigue, and end where they started — and a first Fatigue, costing nothing, never needs anything put down at all.</p> <p>When a Fatigue is cleared — by the <strong>−</strong> button or by the row&#39;s dustbin — the system removes one that <strong>costs a slot</strong>, keeping the free one. That way the Petty tag stays put instead of jumping to another row, and the slot you expected to get back is the one you get back.</p> <h3>Resting costs a ration</h3> <p>This is a <strong>house rule too, and it also applies whether or not the hack is on</strong>, to player characters only: pressing <strong>Rest</strong> uses up one ration. The button&#39;s dialog says so and shows how many rations the character has left; with none on the sheet it refuses, and the character cannot rest until they have one.</p> <p><strong>Rations are counted by uses.</strong> The Rations item ships with three, so one item is three rations, and a Rest spends one use. Several Rations items are fine: the first one with a use left pays. A stack of Rations (quantity 2) rolls over the way the row&#39;s <strong>−</strong> button does — when the last use of one unit goes, the next unit opens full. Anything named Rations counts, so a Warden&#39;s own &quot;Iron Rations&quot; does too, as long as it has a uses counter; a Rations item with no uses counter, or with all its uses spent, is not food the system can see.</p> <p>NPCs, hirelings and monsters rest as they always did. Nothing is logged twice: the change log records a Rest as one entry that names both the Hit Protection and the ration.</p> <h2>Exploding damage dice</h2> <p>Tick <strong>Exploding damage dice</strong> and a player character&#39;s damage die that rolls its highest face is rolled again and added — for as long as it keeps rolling the highest.</p> <p>A d6 rolling 6 then 4 deals 10. A d6 rolling 6, 6 and then 2 deals 14.</p> <p><strong>Only the die you keep explodes.</strong> Cairn&#39;s dual-wield and similar rules roll two dice and keep the higher. If both come up 6, that is <strong>one</strong> six, so it explodes once — you do not get two chains.</p> <p><strong>Every die explodes, however small.</strong> An <strong>Impaired</strong> roll is a d4 and explodes like any other die; so does a d4 weapon, if you write one, and so does an <strong>Enhanced</strong> roll&#39;s d12. There is no smallest die.</p> <p><strong>Every explosion is announced.</strong> The damage card gains a line — <em>A d6 exploded!</em> — once for each time the die went again, so a chain of three says so three times.</p> <p><strong>An unarmed attack counts.</strong> The <strong>Unarmed Attack</strong> row at the top of a character&#39;s inventory rolls whatever die you type into it, and that die explodes like any other — the d4 an unarmed attack starts on included.</p> <p><strong>Only player characters&#39; damage rolls explode.</strong> A monster&#39;s attack, an NPC&#39;s, and the Warden&#39;s Damage tool for a trap or hazard all roll normally.</p> <p><strong>One limit, stated plainly.</strong> If you write a keep-highest damage formula out of <strong>different</strong> dice — <code>d6 + d8</code>, say — it will not explode. Keeping the highest and then exploding only that die has no way to be written for mixed dice, and the alternative would quietly give you better odds than the rule above. No weapon that ships with the system is written this way. Same-sized dice — <code>2d6k</code>, <code>d6 + d6</code>, and every shipped weapon — explode normally.</p> <h2>Fatigue instead of Critical Damage</h2> <p>Tick <strong>Fatigue instead of Critical Damage</strong> and a player character who fails a Critical Damage save is offered a choice on the chat card, side by side: take the Critical Damage as usual, or <strong>Take a Fatigue instead</strong>.</p> <p><strong>The Fatigue has to fit.</strong> With room in the pack, pressing it simply adds the Fatigue. If the Fatigue would overburden the character, pressing it asks what they put down to make room, and that item goes to the party&#39;s Dropped Item Pile — so the trade is one thing on the floor for one Fatigue in the pack. Which item is always the player&#39;s choice; the system never picks. A first Fatigue takes no slot, so a character carrying none is never asked, even with a full pack; it is a second or later Fatigue, at nine of ten slots or more, that has to be made room for.</p> <p>The list offers only things whose loss would actually free a slot. Petty items are not on it — they take no slot, so giving one up would cost nothing and free nothing — and neither is Fatigue itself. Each row says what it frees, because a bulky item frees two slots and that is usually the thing worth knowing. A torch shows how many uses it has left: it is one item with up to three uses, not three torches.</p> <p><strong>Refusing costs the save.</strong> The dialog&#39;s second button is <em>No — take the Critical Damage</em>, and pressing it marks them as you would have anyway. Pressing Escape, or closing the window, is <strong>not</strong> a refusal: nothing happens and the card is left as it was, so a dialog dismissed by accident has not cost anybody their alternative.</p> <p>A character with <strong>nothing</strong> that frees a slot cannot pay, so they take the Critical Damage the moment they press the Fatigue button — no dialog, because there is nothing to choose from. Worth knowing at the table: it tends to be the character who has been taking Fatigue all session who loses the alternative, and the card shows a tick against <em>Mark Critical Damage</em> so it is clear what happened.</p> <p>It is one choice or the other. Pressing either button settles the card, and it stays settled — coming back to it later, neither button glows, and a tick marks the one that was taken.</p> <p>The choice appears on a card only if the option was on when the save was rolled. Turning the option off later does not retract a choice already on screen.</p> <h2>Maneuver on max melee damage</h2> <p>Tick <strong>Maneuver on max melee damage</strong> and a player character who rolls the <strong>highest face</strong> of their damage die with a <strong>melee</strong> weapon is offered a choice on the chat card: keep the damage, or give all of it up and attempt a <strong>maneuver</strong> instead.</p> <p>A maneuver is anything the Warden agrees is plausible in the moment — the sort of thing that changes the situation rather than the enemy&#39;s Hit Protection. It is resolved with an ability check the Warden calls for, and it causes no damage directly. This is borrowed from <strong>Knave 2e</strong> by Ben Milton, which lists the usual examples; the system deliberately does not reprint them.</p> <p><strong>Press Maneuver and the damage is forgone.</strong> The card says so, and the Apply-damage control is greyed and refuses — the player traded that damage for the attempt, so the card cannot also spend it. If you rule that some of it lands anyway, the <strong>Warden&#39;s Damage</strong> tool is the right instrument for a number the dice did not decide.</p> <p><strong>With Exploding damage dice also on, the card asks which.</strong> The die has rolled its maximum, so the player may either let it <strong>Explode the Die</strong> — rolling the chain then and there, with the dice animating and the card&#39;s total rewritten — or <strong>Maneuver</strong> and forgo the lot. That is the whole bet: more damage, or a chance to change the situation. The hover text on each button says what it does.</p> <p>Note what that means for the roll itself: when both options are on, a melee attack&#39;s die does <strong>not</strong> explode on its own any more, because the explosion is now the player&#39;s to choose. Ranged attacks still explode immediately, exactly as before.</p> <p><strong>Melee only.</strong> Cairn 2e does not divide weapons into melee and ranged, so the system asks: a weapon&#39;s sheet has a <strong>Ranged</strong> checkbox, and the Bow, Crossbow and Sling arrive with it ticked. Anything unticked counts as melee, which is every other shipped weapon. Tick it on your own ranged weapons and they will stop offering maneuvers.</p> <p><strong>Any die.</strong> The same rule as exploding dice: an <strong>Impaired</strong> attack&#39;s d4 offers a maneuver when it rolls a 4, a d4 weapon&#39;s does, and so does an Enhanced attack&#39;s d12 on a 12. An <strong>unarmed attack</strong> is judged on the die you typed. Melee-only is the one place the two options differ: a ranged weapon&#39;s die explodes but never offers a maneuver.</p> <p><strong>One limit, the same one exploding dice has.</strong> A keep-highest formula out of <strong>different</strong> dice — <code>d6 + d8</code> — offers no maneuver, for the reason it does not explode. Same-sized dice written as <code>d6 + d6</code> are rolled as <code>2d6k</code> when a maneuver is on offer, so the card can tell which die was kept, and work normally.</p> <p>It is one choice or the other, once. Pressing either button settles the card and it stays settled, and the choice appears only if the option was on when the damage was rolled.</p> <h2>A matching character generator</h2> <p>This hack suits characters built to survive it. Under <strong>Configure Character Generation</strong>, <strong>Ability dice for player characters</strong> offers <strong>Crawler (2d6 + 6)</strong>, which never rolls an ability below 8.</p> <p>That setting is independent of this hack — you can use either without the other. Hit Protection is the exception: with the hack on, its formula is ignored and every player character is made with 6.</p> <h2>See also</h2> <ul> <li><strong>Dice Formulas</strong> — what a damage formula can say, including keep-highest notation.</li> <li><strong>GLOG Magic in Foundry</strong> — the system&#39;s other optional hack.</li> </ul>'
