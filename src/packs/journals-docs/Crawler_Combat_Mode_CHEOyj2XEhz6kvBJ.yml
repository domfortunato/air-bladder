    name: Crawler Combat Mode
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p><strong>Crawler Combat Mode</strong> is an optional hack for a harsher, more lethal game. It is <strong>off by default</strong> and changes nothing until you turn it on, under <strong>Game Settings → Air Bladder → Configure Hacks</strong>.</p> <p>It affects <strong>player characters only</strong>. NPCs, hirelings and monsters are untouched by every part of it.</p> <p>Turning it on reloads the world, so everyone at the table sees the same rules at the same moment.</p> <h2>What the hack itself does</h2> <p><strong>An overburdened player character is Deprived.</strong></p> <p>Cairn already sets a character&#39;s Hit Protection to 0 while they are overburdened. With Crawler Combat Mode on, they are <strong>Deprived</strong> as well, until they are no longer overburdened.</p> <p>Being Deprived means they cannot Rest and cannot Restore Abilities — both buttons grey out on the sheet. This is <strong>not</strong> the same as Critical Damage, which is a separate condition with its own banner and its own recovery.</p> <p>While the hack is holding a character Deprived, the Deprived box on their sheet is ticked and cannot be unticked — hovering it says why. <strong>Your own use of the box is not lost</strong>: if you had marked a character Deprived for going without food or rest, that is still there, and it comes back the moment they stop being overburdened.</p> <p>One thing worth knowing at the table: <strong>overburdened means no free slot</strong>. A pack filled to exactly its limit counts, so clearing it means ending up with a slot genuinely spare. A character at 11 of 10 slots has to put down two things, not one.</p> <h2>Exploding damage dice</h2> <p>Tick <strong>Exploding damage dice</strong> and a player character&#39;s damage die that rolls its highest face is rolled again and added — for as long as it keeps rolling the highest.</p> <p>A d6 rolling 6 then 4 deals 10. A d6 rolling 6, 6 and then 2 deals 14.</p> <p><strong>Only the die you keep explodes.</strong> Cairn&#39;s dual-wield and similar rules roll two dice and keep the higher. If both come up 6, that is <strong>one</strong> six, so it explodes once — you do not get two chains.</p> <p><strong>Nothing smaller than a d6 explodes.</strong> An <strong>Impaired</strong> roll is a d4, so an impaired attack never explodes — and neither does a d4 weapon, if you write one. <strong>Enhanced</strong> rolls are a d12 and explode normally. The same floor decides whether a maneuver is offered, so the two options agree about which dice are big enough to be interesting.</p> <p><strong>Every explosion is announced.</strong> The damage card gains a line — <em>A d6 exploded!</em> — once for each time the die went again, so a chain of three says so three times.</p> <p><strong>Only player characters&#39; damage rolls explode.</strong> A monster&#39;s attack, an NPC&#39;s, and the Warden&#39;s Damage tool for a trap or hazard all roll normally.</p> <p><strong>One limit, stated plainly.</strong> If you write a keep-highest damage formula out of <strong>different</strong> dice — <code>d6 + d8</code>, say — it will not explode. Keeping the highest and then exploding only that die has no way to be written for mixed dice, and the alternative would quietly give you better odds than the rule above. No weapon that ships with the system is written this way. Same-sized dice — <code>2d6k</code>, <code>d6 + d6</code>, and every shipped weapon — explode normally.</p> <h2>Fatigue instead of Critical Damage</h2> <p>Tick <strong>Fatigue instead of Critical Damage</strong> and a player character who fails a Critical Damage save is offered a choice on the chat card: take the Critical Damage as usual, or <strong>Take a Fatigue instead</strong>.</p> <p>Taking the Fatigue adds it to their inventory <strong>even if they have no free slot</strong> — Fatigue is a cost the rules impose, not something they chose to pick up. That will usually leave them overburdened, which under this hack means Deprived and at 0 Hit Protection until they free a slot. The button says so before you press it.</p> <p>It is one choice or the other. Pressing either button settles the card, and it stays settled — coming back to it later, the buttons are spent.</p> <p>The choice appears on a card only if the option was on when the save was rolled. Turning the option off later does not retract a choice already on screen.</p> <h2>Maneuver on max melee damage</h2> <p>Tick <strong>Maneuver on max melee damage</strong> and a player character who rolls the <strong>highest face</strong> of their damage die with a <strong>melee</strong> weapon is offered a choice on the chat card: keep the damage, or give all of it up and attempt a <strong>maneuver</strong> instead.</p> <p>A maneuver is anything the Warden agrees is plausible in the moment — the sort of thing that changes the situation rather than the enemy&#39;s Hit Protection. It is resolved with an ability check the Warden calls for, and it causes no damage directly. This is borrowed from <strong>Knave 2e</strong> by Ben Milton, which lists the usual examples; the system deliberately does not reprint them.</p> <p><strong>Press Maneuver and the damage is forgone.</strong> The card says so, and the Apply-damage control is greyed and refuses — the player traded that damage for the attempt, so the card cannot also spend it. If you rule that some of it lands anyway, the <strong>Warden&#39;s Damage</strong> tool is the right instrument for a number the dice did not decide.</p> <p><strong>With Exploding damage dice also on, the card asks which.</strong> The die has rolled its maximum, so the player may either let it <strong>Explode the Die</strong> — rolling the chain then and there, with the dice animating and the card&#39;s total rewritten — or <strong>Maneuver</strong> and forgo the lot. That is the whole bet: more damage, or a chance to change the situation. The hover text on each button says what it does.</p> <p>Note what that means for the roll itself: when both options are on, a melee attack&#39;s die does <strong>not</strong> explode on its own any more, because the explosion is now the player&#39;s to choose. Ranged attacks, sub-d6 dice and everything else still explode immediately, exactly as before.</p> <p><strong>Melee only.</strong> Cairn 2e does not divide weapons into melee and ranged, so the system asks: a weapon&#39;s sheet has a <strong>Ranged</strong> checkbox, and the Bow, Crossbow and Sling arrive with it ticked. Anything unticked counts as melee, which is every other shipped weapon. Tick it on your own ranged weapons and they will stop offering maneuvers.</p> <p><strong>d6 or larger.</strong> The same floor as exploding dice: an <strong>Impaired</strong> attack is a d4 and never offers a maneuver, and neither does a d4 weapon. Enhanced attacks (d12) do.</p> <p><strong>One limit, the same one exploding dice has.</strong> A keep-highest formula written out of separate dice — <code>d6 + d6</code> or <code>d6 + d8</code> — offers no maneuver, because when the losing die may also have rolled its maximum there is no single answer to &quot;did it roll the highest face&quot;. Write such a weapon as <code>2d6k</code> and it works normally.</p> <p>It is one choice or the other, once. Pressing either button settles the card and it stays settled, and the choice appears only if the option was on when the damage was rolled.</p> <h2>A matching character generator</h2> <p>This hack suits characters built to survive it. Under <strong>Configure Character Generation</strong>, <strong>Ability dice for player characters</strong> offers <strong>Crawler (2d6 + 6)</strong>, which never rolls an ability below 8.</p> <p>That setting is independent of this hack — you can use either without the other.</p> <h2>See also</h2> <ul> <li><strong>Dice Formulas</strong> — what a damage formula can say, including keep-highest notation.</li> <li><strong>GLOG Magic in Foundry</strong> — the system&#39;s other optional hack.</li> </ul>'
