  - _id: HXkC8Amdk5nWFRaQ
    name: Sharing Custom Backgrounds
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>A <strong>custom background</strong> is a Cairn 2e background you wrote yourself. It lives in a world compendium named <em>Custom 2e Backgrounds</em>, and it&#39;s offered in the background picker, under <strong>Custom 2e Backgrounds</strong>, while <strong>Offer custom Cairn 2e backgrounds</strong> is on (Game Settings → Configure Settings → Air Bladder → Character Generation → Configure Character Generation).</p> <blockquote> <p>**Not <em>Backgrounds (Custom)</em>.** That compendium ships with Air Bladder inside the <em>Air Bladder - Backgrounds</em> folder. It holds seven third-party class backgrounds, it&#39;s replaced on every system update, and it isn&#39;t where your own work goes. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.yJJsiQGfqZwkGBV0]{Where it lives}.</p> </blockquote> <blockquote> <p><strong>Writing one</strong> is covered in @UUID[Compendium.air-bladder.journals-docs.JournalEntry.yJJsiQGfqZwkGBV0]{Creating a custom 2e background}. This page is about moving one you already have.</p> </blockquote> <p>A background carries its own copy of every item you dragged into it, and the gear it lists by name is gear every Air Bladder install ships. That means it works in any other Air Bladder world. There are two ways to move one.</p> <blockquote> <p><strong>Check it first.</strong> Open the background and click <strong>Test ×10</strong> on its Details tab. If the report says an item <em>resolves to nothing</em>, drag that item into the background before you share it. A background whose report reads <em>Looks self-contained — every grant resolves.</em> will arrive whole.</p> </blockquote> <h2>Share a set: package a module</h2> <p>Foundry&#39;s <strong>Module Maker</strong> packs a set of backgrounds into a module. The recipient installs it, turns custom backgrounds on, and every background in it is offered.</p> <ol> <li>On Foundry&#39;s setup screen, open the <strong>Add-On Modules</strong> tab and click <strong>Create Module</strong>.</li> <li><strong>Basic Details</strong>: give the module a title, identifier and version.</li> <li><strong>Compendium Packs</strong> → <strong>Add Compendium Pack</strong>: add one pack of document type <strong>Item</strong> (for example, label <em>Custom 2e Backgrounds</em>, required system <strong>air-bladder</strong>).</li> <li>Finish the wizard. It creates the module in your user data folder.</li> <li>Launch a world and enable the module. Open your world&#39;s <em>Custom 2e Backgrounds</em> compendium, unlock the module&#39;s compendium (right-click it → <em>Toggle Edit Lock</em>), and drag your backgrounds from one into the other.</li> <li>Zip the module folder (<code>Data/modules/&lt;your-module&gt;</code>) and send it. The recipient puts it in their <code>Data/modules/</code>, enables it, and turns on <strong>Offer custom Cairn 2e backgrounds</strong>.</li> </ol> <p>Air Bladder offers the 2e backgrounds in any installed module&#39;s Item compendium. They can&#39;t be edited there. A recipient who wants to change one opens it and uses <strong>Duplicate into Custom 2e Backgrounds</strong>, which copies it into their own world compendium.</p> <p>See Foundry&#39;s <a href="https://foundryvtt.com/article/module-maker/">Module Maker article</a> for the wizard in detail.</p> <h2>Share one: Export Data and Import Data</h2> <p>A compendium window doesn&#39;t offer Export Data or Import Data, so both sides go through the <strong>Items</strong> sidebar.</p> <ol> <li>Open your <em>Custom 2e Backgrounds</em> compendium and drag the background into the <strong>Items</strong> sidebar (or right-click it → <strong>Import Entry</strong>). Right-click that copy → <strong>Export Data</strong> and send the <code>.json</code> file it saves. You can delete the sidebar copy afterwards.</li> <li>The recipient creates a new Background in their <strong>Items</strong> sidebar, right-clicks it → <strong>Import Data</strong> and picks the file. Import Data replaces the item it&#39;s run on, so use a fresh one. They then open it and press <strong>Duplicate into Custom 2e Backgrounds</strong> on its Details tab. With custom backgrounds on, it appears in their picker.</li> </ol> <h2>Notes</h2> <ul> <li><strong>Dragged-in items are copies.</strong> Later edits to the original item don&#39;t reach a background that already holds a copy. Gear listed by name is looked up on the recipient&#39;s install, and Test ×10 confirms each name matches an item.</li> <li><strong>Don&#39;t repackage shipped backgrounds.</strong> A hand-made duplicate of a shipped background counts as a different background, so both show up in the picker. A copy made by <strong>Create Custom 2e Backgrounds and Tables…</strong> is the exception. It stands in for the shipped one wherever it&#39;s shared, and the two never both show up.</li> <li><strong>Air Bladder only.</strong> A background needs Air Bladder on the receiving side to find its gear.</li> </ul>'
