    name: Sharing Custom Backgrounds
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>A <strong>custom background</strong> is a Warden-authored Cairn 2e background — a background Item carrying its own tagline, example names, starting gear, and two d6 question tables. It lives in a <strong>world compendium</strong> named <em>Custom Backgrounds</em>, and whenever the custom content source is toggled on (Game Settings → <em>Offer custom Cairn 2e backgrounds</em>) it joins the <strong>Custom</strong> section of the character-generation picker.</p> <blockquote> <p><strong>Not to be confused with <em>Backgrounds (Custom)</em></strong>, the pack Air Bladder ships inside the <em>Air Bladder - Backgrounds</em> folder. That one holds seven third-party class backgrounds, is replaced on every system update, and is not where your own work goes. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.yJJsiQGfqZwkGBV0]{Where it lives}.</p> </blockquote> <blockquote> <p><strong>Writing one is covered separately</strong> — see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.yJJsiQGfqZwkGBV0]{Creating a custom 2e background}. This page assumes you already have one and want to move it.</p> </blockquote> <p>Because a custom background is a <strong>self-contained snapshot</strong> — gear you drag into it is frozen into the background, and its by-name references point at gear every Air Bladder install already ships — it travels cleanly to any other Air Bladder world or install. This page covers the two ways to move or share them.</p> <blockquote> <p><strong>Check it travels first.</strong> Open the background&#39;s sheet and click <strong>Test ×10</strong>. The report doubles as a self-contained linter: if it flags a <em>missing</em> item (a name-only reference that won&#39;t resolve on another install), fix that before sharing — re-drag the item into the background so it snapshots. A background that lints clean will arrive intact.</p> </blockquote> <h2>Share a whole set — package a module (recommended)</h2> <p>The cleanest way to hand a friend (or another of your own worlds) a <em>set</em> of custom backgrounds is Foundry&#39;s built-in <strong>Module Maker</strong>. The recipient installs one module, toggles the Custom source on, and every background appears — no files to import one by one.</p> <ol> <li>From Foundry&#39;s main setup screen, open the <strong>Add-On Modules</strong> tab and click <strong>Create Module</strong>.</li> <li><strong>Basic Details</strong> — give the module a title, identifier, and version.</li> <li><strong>Compendium Packs</strong> → <strong>Add Compendium Pack</strong> — add one pack of document type <strong>Item</strong> (e.g. label <em>Custom Backgrounds</em>, required system <strong>air-bladder</strong>).</li> <li>Finish the wizard. This creates the module shell in your user data folder.</li> <li>Launch any world, enable the new module, and copy your backgrounds into its compendium: open your world <em>Custom Backgrounds</em> compendium, <strong>unlock</strong> the module&#39;s compendium (its context menu → <em>Toggle Edit Lock</em>), then drag your backgrounds from one compendium into the other.</li> <li>Zip the module folder from your user data (<code>Data/modules/&lt;your-module&gt;</code>) and send it. The recipient drops it into their <code>Data/modules/</code>, enables it, and turns the <strong>Custom</strong> content source on.</li> </ol> <p>Air Bladder discovers source-2e backgrounds in <strong>any</strong> installed module&#39;s Item compendium, so a module delivered this way is a first-class content source. It is read-only by default; a recipient who wants to tweak one uses <strong>Duplicate into Custom Backgrounds</strong> on its sheet, which copies it into their own editable world pack.</p> <p>See Foundry&#39;s own <a href="https://foundryvtt.com/article/module-maker/">Module Maker article</a> for the wizard in detail.</p> <h2>Share one — Export / Import Data</h2> <p>For a one-off, use Foundry&#39;s per-document JSON:</p> <ol> <li>Open your <em>Custom Backgrounds</em> compendium, right-click the background → <strong>Export Data</strong>. This saves a <code>.json</code> you can send.</li> <li>The recipient imports it into a world <em>Custom Backgrounds</em> compendium (right-click a background → <strong>Import Data</strong>, or create the compendium first if they have none). As long as it lands in a <strong>world</strong> compendium with the Custom source on, it shows up in their picker.</li> </ol> <h2>Notes &amp; caveats</h2> <ul> <li><strong>Portability is a snapshot, not a link.</strong> A background freezes the gear you dropped into it, so later edits to the <em>real</em> item do not propagate — that is the price of a shareable, self-contained unit. Name-only references (kept for shipped gear that every install has) resolve on the far side; the Test ×10 linter is what confirms none are dangling.</li> <li><strong>Module packs are read-only.</strong> They work as a <em>source</em>; editing goes through <strong>Duplicate into Custom Backgrounds</strong>.</li> <li><strong>De-dup is by document id.</strong> If a module re-ships a background that is byte-for-byte a copy of a shipped one but with a new id, both can appear in the picker. Share genuinely custom backgrounds, not re-packaged shipped ones.</li> <li>Sharing only makes sense <strong>between Air Bladder installs</strong> — a background is an Air Bladder Item type and needs the system to resolve its gear.</li> </ul>'
