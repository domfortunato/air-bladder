    name: Custom Portrait Gallery
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p><strong>Status:</strong> Built (2026-07-26), verified live. First version — the deliberate non-goals below are deferred, not forgotten.</p> <p>A GM can point Air Bladder at a folder of their own character portraits. When that folder holds images, new characters and NPCs draw from it and the portrait picker gains a <strong>Custom</strong> tab; when it is empty, everything falls back to the shipped tlomdev <strong>humanoid</strong> art. This is a <strong>per-GM / per-world local pool</strong> — it does not travel inside shared content (see Non-goals).</p> <h2>Decisions (settled with the user)</h2> <ul> <li><strong>Local per-GM pool</strong>, not portraits that travel with a shared custom background (image paths don&#39;t resolve across installs — the same portability wall as snapshot-on-drop items; embedding image data would bloat the shared unit).</li> <li><strong>Auto-assignment replaces, doesn&#39;t merge:</strong> a non-empty custom folder is the <em>only</em> source for auto-assigned portraits; the shipped gallery is the fallback when it&#39;s empty. (Confirmed wording, 2026-07-26: &quot;draw only from custom; if empty, default to Aspeheim.&quot;)</li> <li><strong>The shipped fallback is tlomdev&#39;s <code>humanoid</code> folder</strong> — 70 drawings of people — since <strong>2026-08-18</strong>, by ruling, superseding the Aspeheim wording above for characters, NPCs and hirelings alike. Aspeheim&#39;s gallery still ships and is still offered in the picker wherever faces belong; it is simply no longer what generation <em>assigns</em>. Two consequences worth knowing: a tlomdev drawing is its own token, so a generated actor no longer gets the 256px canvas art Aspeheim&#39;s paired half provided, and nothing rewrites an existing actor — an <code>img</code> is copied onto the document at creation and never re-read, so every character made before that date keeps the portrait and paired token it already has.</li> <li><strong>Default folder is created for the GM</strong>, empty, and is GM-overridable — so the common case is zero setup (drop images in, Refresh). It lives at the Foundry data root (<code>air-bladder-portraits/</code>), <strong>never inside the system folder</strong> (overwritten on every update — the same rule that sends custom backgrounds to a world pack). Data-root default means the collection is reusable across a GM&#39;s worlds.</li> <li><strong>Custom portraits are their own token.</strong> No paired token art like the shipped 80 have; each image serves as both portrait and token. (<code>_setPortrait</code> already handled the no-paired-token case.)</li> <li><strong>Folders inside the folder are categories</strong> (2026-08-14). File your portraits however you like — <code>clerics-paladins/</code>, <code>OSR Fantasy/townsfolk/</code>, as deep as you care to go — and each folder that holds images becomes a tile in the Custom tab, labelled by its path (&quot;OSR Fantasy / Townsfolk&quot;). Images sitting loose at the top still show as a plain grid above the tiles, so a Warden who uses no folders sees no change. Auto-assignment ignores the structure entirely: every custom image is one pool no matter which folder it sits in.</li> </ul> <h2>How it works</h2> <ul> <li><strong>Settings</strong> (<code>settings.js</code>, Character Generation group):<ul> <li><code>custom-portrait-folder</code> (String, default <code>air-bladder-portraits</code>) — the path.</li> <li><code>custom-portrait-list</code> (Array, <code>config:false</code>) — the cached scan result.</li> </ul> </li> <li><strong>Why a cached list:</strong> listing a server folder needs <code>FILES_BROWSE</code>, which GMs have and players usually don&#39;t. So the GM scans; the file list is cached into a world setting; <strong>players read the cache and need no permission</strong> — the same &quot;ship the list as data&quot; trick the shipped <code>portrait-manifest.json</code> already uses.</li> <li><strong>Discovery</strong> (<code>character-generator.js</code>): <code>ensureCustomPortraitFolder()</code> creates the folder (GM, non-fatal), <code>refreshCustomPortraits()</code> scans it for image files and writes the cache (GM only), <code>getCustomPortraitPaths()</code> reads the cache (anyone). Both folder ops are non-fatal — a host that forbids them just leaves the pool empty and the shipped art is used.</li> <li><strong>The scan walks subfolders</strong> (<code>MAX_SCAN_DEPTH</code> 6, <code>MAX_SCAN_DIRS</code> 200). Foundry&#39;s <code>FilePicker.browse</code> reports one directory and does not recurse, so the walk is breadth-first, one request per folder, skipping any it cannot read. Hitting either limit logs a warning — a short list otherwise looks exactly like a small collection. The cache stays a FLAT list of paths; the picker derives the folder structure from it at display time.</li> <li><strong>Auto-assign</strong> (<code>randomPortraitPair()</code>): custom-first, else a random path from the shipped default folder. Feeds PC, NPC and hireling creation, plus a Kettlewright import with no portrait of its own (they share the code path), so changing the default folder changes all of them at once.</li> <li><strong>Picker</strong> (<code>_onEditPortrait</code>, shared by PC + NPC sheets): a <code>[ Jon Aspeheim ] [ Custom ]</code> tab toggle. The Custom tab shows when there are custom portraits <strong>or</strong> the viewer is a GM (so a GM sees it even when empty, with an empty-state hint and a <strong>Refresh</strong> button). The CC BY 4.0 Aspeheim credit renders <strong>only</strong> under the shipped tab — the custom art isn&#39;t his. The existing paste-a-URL row and FilePicker &quot;Browse…&quot; escape are unchanged.</li> <li><strong>GM login refresh</strong> (<code>cairn.js</code> ready hook, primary-GM-gated): ensures the folder and re-scans, so the cache players see stays current without a manual step.</li> </ul> <p>Containers are untouched — they have their own art gallery (<code>_onPickContainerArt</code>). NPCs keep Foundry&#39;s default image editing.</p> <h2>Non-goals (deferred)</h2> <ul> <li>Paired custom <strong>token</strong> art (custom portrait doubles as its token).</li> <li>A drag-and-drop <strong>management</strong> screen (drop files in the folder + Refresh).</li> <li>Portraits that <strong>travel with a shared custom background</strong> (portability wall above).</li> </ul> <h2>Verification</h2> <p>Live probe (<code>dev:smoke</code> + a Playwright probe) confirmed: custom-only draw when the pool is non-empty (token===img), Aspeheim paired-art fallback when empty, a real folder scan caching image files, and the two-tab picker rendering both grids with a GM Refresh and the credit scoped to the shipped tab — zero console errors.</p>'
