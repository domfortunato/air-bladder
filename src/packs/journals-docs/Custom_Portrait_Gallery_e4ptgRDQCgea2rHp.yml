    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p><strong>Status:</strong> Built (2026-07-26), verified live. Per-category folders added 2026-08-20 (issue #18). The deliberate non-goals below are deferred, not forgotten.</p> <p>A GM can point Air Bladder at a folder of their own character portraits. When that folder holds images, new characters and NPCs draw from it and the portrait picker gains a <strong>Custom</strong> tab; when it is empty, everything falls back to the shipped tlomdev <strong>humanoid</strong> art. Four subfolder names — <code>pc</code>, <code>npc</code>, <code>monster</code> and <code>companion</code> — split that pool by what is being made (see <strong>Reserved folders</strong>). This is a <strong>per-GM / per-world local pool</strong> — it does not travel inside shared content (see Non-goals).</p> <h2>Decisions (settled with the user)</h2> <ul> <li><strong>Local per-GM pool</strong>, not portraits that travel with a shared custom background (image paths don&#39;t resolve across installs — the same portability wall as snapshot-on-drop items; embedding image data would bloat the shared unit).</li> <li><strong>Auto-assignment replaces, doesn&#39;t merge:</strong> a non-empty custom folder is the <em>only</em> source for auto-assigned portraits; the shipped gallery is the fallback when it&#39;s empty. (Confirmed wording, 2026-07-26: &quot;draw only from custom; if empty, default to Aspeheim.&quot;)</li> <li><strong>The shipped fallback is tlomdev&#39;s <code>humanoid</code> folder</strong> — 70 drawings of people — since <strong>2026-08-18</strong>, by ruling, superseding the Aspeheim wording above for characters, NPCs and hirelings alike. Aspeheim&#39;s gallery still ships and is still offered in the picker wherever faces belong; it is simply no longer what generation <em>assigns</em>. Two consequences worth knowing: a tlomdev drawing is its own token, so a generated actor no longer gets the 256px canvas art Aspeheim&#39;s paired half provided, and nothing rewrites an existing actor — an <code>img</code> is copied onto the document at creation and never re-read, so every character made before that date keeps the portrait and paired token it already has.</li> <li><strong>Default folder is created for the GM</strong>, empty, and is GM-overridable — so the common case is zero setup (drop images in, Refresh). It lives at the Foundry data root (<code>air-bladder-portraits/</code>), <strong>never inside the system folder</strong> (overwritten on every update — the same rule that sends custom backgrounds to a world pack). Data-root default means the collection is reusable across a GM&#39;s worlds.</li> <li><strong>Custom portraits are their own token.</strong> No paired token art like the shipped 80 have; each image serves as both portrait and token. (<code>_setPortrait</code> already handled the no-paired-token case.)</li> <li><strong>Folders inside the folder are categories</strong> (2026-08-14). File your portraits however you like — <code>clerics-paladins/</code>, <code>OSR Fantasy/townsfolk/</code>, as deep as you care to go — and each folder that holds images becomes a tile in the Custom tab, labelled by its path (&quot;OSR Fantasy / Townsfolk&quot;). Images sitting loose at the top still show as a plain grid above the tiles, so a Warden who uses no folders sees no change.</li> <li><strong>Four folder names are reserved, and they decide who gets what</strong> (2026-08-20, issue #18). This replaces the original wording, which said auto-assignment ignored the structure entirely and treated every custom image as one pool.</li> </ul> <h2>Reserved folders</h2> <p>Name a folder at the <strong>top level</strong> of your custom portrait folder and it becomes the pool for that kind of thing alone:</p> <table> <thead> <tr> <th>folder</th> <th>used for</th> <th>when you have no such folder</th> </tr> </thead> <tbody><tr> <td><code>pc</code> (or <code>pcs</code>)</td> <td>player characters, and a Kettlewright import with no portrait</td> <td>everything else in the custom folder, then the shipped tlomdev <code>humanoid</code> art</td> </tr> <tr> <td><code>npc</code> (or <code>npcs</code>)</td> <td>generated NPCs, and an NPC person you make by hand</td> <td>the same</td> </tr> <tr> <td><code>monster</code> (or <code>monsters</code>)</td> <td>generated monsters</td> <td>the shipped game-icons creature glyphs — <strong>not</strong> your other portraits</td> </tr> <tr> <td><code>companion</code> (or <code>companions</code>)</td> <td>a granted beast the Mounts &amp; Transports pack does not carry</td> <td>its class icon — <strong>not</strong> your other portraits</td> </tr> </tbody></table> <p>Matching is case-insensitive, and anything <strong>nested inside</strong> a reserved folder counts toward it, so <code>monster/undead/lich.webp</code> is monster art. <code>Kindred/monster</code> is an ordinary folder: only the top level is reserved.</p> <p>Three rules are worth knowing before you sort anything:</p> <ul> <li><strong>The general pool is everything OUTSIDE the reserved folders.</strong> If it were not, filing only your monster art would put it on every player character — the feature would have made things worse for the one category you sorted.</li> <li><strong><code>monster</code> and <code>companion</code> do not fall back to your other portraits.</strong> They have never drawn from the custom folder at all; naming a folder is how they start. This is what stops a folder of faces landing on a mule.</li> <li><strong>No borrowing between categories.</strong> With only <code>pc/</code> filled, NPCs get the shipped art, not your player-character portraits.</li> </ul> <p><code>character</code> and <code>characters</code> are deliberately <em>not</em> reserved — that is the likeliest name for a folder meaning <em>all</em> your portraits, and capturing it would silently take your NPC art away.</p> <p><strong>The picker is not scoped.</strong> Reserved folders decide what is assigned automatically and what the portrait die re-rolls; the Custom tab still shows every folder you have, so you can always hand-pick from any of them. The four reserved tiles are captioned &quot;Player Characters&quot;, &quot;NPCs&quot;, &quot;Monsters&quot; and &quot;Companions&quot; rather than by their raw folder names.</p> <h2>How it works</h2> <ul> <li><strong>Settings</strong> (<code>settings.js</code>, Character Generation group):<ul> <li><code>custom-portrait-folder</code> (String, default <code>air-bladder-portraits</code>) — the path.</li> <li><code>custom-portrait-list</code> (Array, <code>config:false</code>) — the cached scan result.</li> </ul> </li> <li><strong>Why a cached list:</strong> listing a server folder needs <code>FILES_BROWSE</code>, which GMs have and players usually don&#39;t. So the GM scans; the file list is cached into a world setting; <strong>players read the cache and need no permission</strong> — the same &quot;ship the list as data&quot; trick the shipped <code>portrait-manifest.json</code> already uses.</li> <li><strong>Discovery</strong> (<code>character-generator.js</code>): <code>ensureCustomPortraitFolder()</code> creates the folder (GM, non-fatal), <code>refreshCustomPortraits()</code> scans it for image files and writes the cache (GM only), <code>getCustomPortraitPaths()</code> reads the cache (anyone). Both folder ops are non-fatal — a host that forbids them just leaves the pool empty and the shipped art is used.</li> <li><strong>The scan walks subfolders</strong> (<code>MAX_SCAN_DEPTH</code> 6, <code>MAX_SCAN_DIRS</code> 200). Foundry&#39;s <code>FilePicker.browse</code> reports one directory and does not recurse, so the walk is breadth-first, one request per folder, skipping any it cannot read. Hitting either limit logs a warning — a short list otherwise looks exactly like a small collection. The cache stays a FLAT list of paths; the picker derives the folder structure from it at display time.</li> <li><strong>Auto-assign</strong> (<code>randomPortraitPair(category)</code>): the category&#39;s custom pool first, else a random path from the shipped default folder. Feeds PC, NPC and hireling creation, plus a Kettlewright import with no portrait of its own (they share the code path), so changing the default folder changes all of them at once.</li> <li><strong>One helper owns the category rule</strong> (<code>customPoolFor</code> in <code>character-generator.js</code>): it buckets the flat cached list by top-level folder and hands back the category&#39;s bucket, or the general one for <code>pc</code>/<code>npc</code> when they have no folder of their own. <code>portraitCategoryFor(actor)</code> maps an actor to its category — that is what lets the portrait die re-roll a monster inside <code>monster/</code>. <code>reservedPortraitCategory</code> is the single copy of the name/alias list; the picker imports it rather than keeping a second one.</li> <li><strong>Monsters and companions reach it from their own paths.</strong> A generated monster goes through <code>randomMonsterIcon</code> (<code>monster-generator.js</code>), which now tries <code>customPoolFor(&quot;monster&quot;)</code> before the game-icons creature glyphs. A granted beast goes through <code>grantContainers</code>, which tries <code>customPoolFor(&quot;companion&quot;)</code> only when the Mounts &amp; Transports pack has no document for it — a resolved document&#39;s own art always wins, so a granted Rivertooth keeps its illustration.</li> <li><strong>Picker</strong> (<code>_onEditPortrait</code>, shared by PC + NPC sheets): a <code>[ Jon Aspeheim ] [ Custom ]</code> tab toggle. The Custom tab shows when there are custom portraits <strong>or</strong> the viewer is a GM (so a GM sees it even when empty, with an empty-state hint and a <strong>Refresh</strong> button). The CC BY 4.0 Aspeheim credit renders <strong>only</strong> under the shipped tab — the custom art isn&#39;t his. The existing paste-a-URL row and FilePicker &quot;Browse…&quot; escape are unchanged.</li> <li><strong>GM login refresh</strong> (<code>cairn.js</code> ready hook, primary-GM-gated): ensures the folder and re-scans, so the cache players see stays current without a manual step.</li> </ul> <p>Containers and transports are untouched — they wear class icons and have their own art gallery (<code>_onPickContainerArt</code>), which is why neither has a reserved folder: two pools nobody would fill are two more things to explain. Companions share that gallery for hand-picking but DO have a reserved folder, because a granted one-off beast is auto-assigned and a generic horse glyph was all it could get.</p> <h2>Non-goals (deferred)</h2> <ul> <li>Paired custom <strong>token</strong> art (custom portrait doubles as its token).</li> <li>A drag-and-drop <strong>management</strong> screen (drop files in the folder + Refresh).</li> <li>Portraits that <strong>travel with a shared custom background</strong> (portability wall above).</li> </ul> <h2>Verification</h2> <p>Live probe (<code>dev:smoke</code> + a Playwright probe) confirmed: custom-only draw when the pool is non-empty (token===img), Aspeheim paired-art fallback when empty, a real folder scan caching image files, and the two-tab picker rendering both grids with a GM Refresh and the credit scoped to the shipped tab — zero console errors.</p> <p>The per-category folders have their own probe, <code>npm run dev:portrait-categories</code>. It plants three roots and goes through the real creation paths, because the category is a literal at each call site. Its two load-bearing legs are the negative ones: with only <code>monster/</code> filled, sixteen player-character draws must never touch it; and with no reserved names at all, the monster and companion pools must be EMPTY rather than inheriting a folder of faces.</p>'
