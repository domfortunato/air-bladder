_id: Mpi2G5ctVjYKdC9A
name: Generating NPCs and Hirelings
pages:
  - _id: Cv1CBe9JFqVd4FSk
    name: Generating NPCs and Hirelings
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p><strong>Create NPC</strong> makes somebody the party <em>meets</em> — an innkeeper, a rival, a hostage — with a Background off the Warden&#39;s Guide table and four traits of their own. <strong>Create Hireling</strong> makes somebody the party <em>pays</em>, with a Career from the 2e careers list, the gear that career carries and a day rate.</p> <p>Both arrive complete: a name, a portrait, a matching token, traits, an age and a stat block. Each asks one question first, a tick-box reading <strong>Use random generation.</strong> Clear it to open an empty sheet instead (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Generating characters}).</p> <p>That window also says what the new person&#39;s tokens will do: <strong>all of their tokens share one sheet</strong>, because an NPC or a hireling is one person. For a crowd whose members take damage separately, make a Monster, or clear <strong>Link Actor Data</strong> on the actor&#39;s Prototype Token. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.gFK4npERocroPaEG]{Tokens and Sheets}.</p> <p>You need permission to create Actors. The Warden always has it. A player only has it if you&#39;ve given it to them.</p> <hr> <h2>Which one you want</h2> <table> <thead> <tr> <th></th> <th><strong>NPC</strong></th> <th><strong>Hireling</strong></th> </tr> </thead> <tbody><tr> <td>the party…</td> <td>meets them</td> <td>pays them</td> </tr> <tr> <td>job field</td> <td><strong>Background</strong> — Academic, Gravedigger, Peddler, Spy</td> <td><strong>Career</strong> — Blacksmith, Navigator, Trapper</td> </tr> <tr> <td>where it comes from</td> <td>the Warden&#39;s Guide NPC table (d20)</td> <td>the 2e careers list (12 of them)</td> </tr> <tr> <td>day rate</td> <td>none</td> <td>yes, from the career</td> </tr> <tr> <td>stat block</td> <td><strong>rolled</strong> — 3d6 each, 1d6 HP</td> <td>fixed by the career</td> </tr> <tr> <td>gear</td> <td>a full Barebones equipment kit, weapon and armor included, plus the gear of its Background&#39;s Barebones counterpart; a Lord or Politician arrives with <strong>nothing at all</strong></td> <td>the career&#39;s whole loadout, weapons and armor equipped</td> </tr> <tr> <td>extra traits</td> <td><strong>Quirk, Goal</strong>, plus NPC Virtue and Vice</td> <td>2e Virtue and Vice</td> </tr> </tbody></table> <p>The <strong>Role</strong> dropdown at the top of either sheet switches one into the other without losing anything. See Changing your mind.</p> <h2>Where the buttons are</h2> <p><strong>Actors tab → the button row at the top.</strong></p> <ul> <li><strong>Create NPC</strong> (the person-plus icon)</li> <li><strong>Create Hireling</strong> (the coin-in-hand icon)</li> </ul> <p>Both are also in a folder&#39;s <strong>+</strong> menu, under <em>What are you creating?</em>, which puts the new person straight into that folder.</p> <h2>What an NPC arrives with</h2> <ul> <li><strong>A name</strong> off <code>Warden: NPC - Name</code>, the book&#39;s three d20 lists merged into one d60.</li> <li><strong>A Background</strong> off <code>Warden: NPC - Background</code>.</li> <li><strong>Ten traits</strong>: the six appearance traits a player character rolls — Physique, Skin, Hair, Face, Speech, Clothing — plus <strong>Quirk</strong>, <strong>Goal</strong>, <strong>Virtue</strong> and <strong>Vice</strong> off the Warden&#39;s Guide NPC lists.</li> <li><strong>An age</strong>, rolled with your <strong>Age formula for generated characters</strong> setting, the same as a player character&#39;s.</li> <li><strong>Blank pronouns.</strong> There isn&#39;t a table for pronouns, and generation never chooses them. The field is under the name on the sheet&#39;s first page.</li> <li><strong>A portrait and a matching token.</strong> If you&#39;ve set up a custom portrait folder with an <code>npc</code> subfolder, it picks from there. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.XzQJvxDorYQdCqGp]{Using Your Own Portraits}.</li> <li><strong>Gear</strong>: the full Barebones equipment kit plus what its Background gives. A <strong>Lord or Politician doesn&#39;t get any items at all</strong>. See What an NPC is carrying below.</li> <li><strong>A rolled stat block</strong>: 3d6 for each of STR, DEX and WIL, and 1d6 Hit Protection.</li> </ul> <p>The Warden&#39;s Guide doesn&#39;t give NPCs numbers. These save you from making them up when an NPC ends up in a fight. Type over anything that doesn&#39;t suit.</p> <h2>What a hireling arrives with</h2> <ul> <li>A name off the same table, the six appearance traits with 2e <strong>Virtue</strong> and <strong>Vice</strong>, an age, blank pronouns, and a portrait and token chosen the same way.</li> <li><strong>A Career</strong>, and everything that comes with it: abilities, HP, the day rate and the gear. Weapons and armor arrive <strong>equipped</strong>, so the Armor score is already right.</li> <li><strong>For Hire</strong> ticked, and the day rate showing.</li> </ul> <p>Untick <strong>For Hire</strong> to hide the rate. That lets you keep a Career on someone who isn&#39;t taking work.</p> <p>The twelve careers, with their day rates in gold: Alchemist (30), Animal Handler (5), Blacksmith (15), Bodyguard (10), Local Guide (5), Lockpick (10), Navigator (10), Sailor (5), Scholar (20), Tracker (5), Trapper (5), Veteran Bodyguard (20). If you type one of those names over the Career of a hireling whose rate is 0, the rate fills itself in. A rate you set by hand is never overridden.</p> <h2>The sheet</h2> <p>An NPC&#39;s or hireling&#39;s sheet is laid out like a player character&#39;s, with four pages: <strong>NPC</strong> or <strong>Hireling</strong>, <strong>Inventory</strong>, <strong>Description</strong> and <strong>Notes</strong>.</p> <p>The first page has the name, Pronouns and Age, the Role, the Background or Career, the Faction, the trait sentence, the stat block and the Armor row:</p> <ul> <li><strong>Hold shield?</strong> and <strong>Hold light?</strong> sit either side of the Armor box. Each holds or puts away a shield or a light the person carries. A shield only adds to Armor while it&#39;s in hand.</li> <li>The <strong>Max</strong> boxes are locked while Character Creation Mode is off.</li> </ul> <p>On the Inventory page, every row has a <strong>Mark broken</strong> toggle beside the trash. It asks first. A broken item still takes up a slot but doesn&#39;t provide any benefit. It can&#39;t be held or worn, and it doesn&#39;t add Armor or roll damage.</p> <h3>The trait sentence reads &quot;They&quot;</h3> <p>The trait sentence on the first page is written in the third person — <em>&quot;They have…&quot;</em> — where a player character&#39;s reads <em>&quot;You have…&quot;</em>. The printed sheet says the same.</p> <p>With <strong>Character Creation Mode</strong> on, press the pen at the end of that sentence to open the <strong>Traits</strong> window and change any trait from its table&#39;s list. A trait you typed that isn&#39;t on the table is kept and shown as it is.</p> <h2>Re-rolling</h2> <p>Each of these sheets has a <strong>Roll NPC</strong> button in the title bar while <strong>Character Creation Mode</strong> is on. Generated people arrive with the mode off, and the toggle in the title bar reads <strong>CharGen: Off</strong>.</p> <p>Roll NPC asks first, and the question depends on the role:</p> <ul> <li>On a <strong>hireling</strong>: everything it&#39;s carrying is deleted, and its abilities, HP, Career, day rate, traits and age are replaced. Its pronouns, coins and status marks are cleared, and it is marked For Hire.</li> <li>On an <strong>NPC</strong>: its Background, stat block, traits and age are replaced, and so is everything generation gave it to carry — the Background&#39;s gear and the kit. Its pronouns, coins and status marks are cleared. Anything you gave it by hand is kept. The new stat block arrives at full.</li> </ul> <p>Both keep the name, the portrait and the notes, so you can re-roll a shopkeeper the party has already met. You can&#39;t undo either one.</p> <h2>The dice on the sheet</h2> <p>With Character Creation Mode on, each of these re-rolls one thing:</p> <table> <thead> <tr> <th>Die</th> <th>What it does</th> </tr> </thead> <tbody><tr> <td>beside the name</td> <td>a new name off the d60</td> </tr> <tr> <td>beside <strong>Background</strong> (NPC)</td> <td>a new Background <strong>and the gear that comes with it</strong>. The kit stays between ordinary trades. Landing <strong>Lord or Politician empties the whole pack</strong>, and rolling back off one packs a fresh kit</td> </tr> <tr> <td>beside <strong>Career</strong> (hireling)</td> <td>a new Career, <strong>with its stat block, day rate and gear</strong></td> </tr> <tr> <td>beside <strong>Faction</strong></td> <td>a side, off <code>Warden: NPC - Faction</code></td> </tr> <tr> <td>beside <strong>Age</strong></td> <td>your <strong>Age formula for generated characters</strong> setting (default 2d20 + 10 — see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.JN9oUEMUbsvjwn8A]{Dice Formulas})</td> </tr> <tr> <td>on the portrait</td> <td>another face from the same folder</td> </tr> </tbody></table> <p><strong>These dice are only for the Warden.</strong> A player never sees them on an NPC or hireling sheet, even if they own the hireling, and no matter what <strong>Let players use Character Creation tools on their sheets</strong> says. That setting only covers player characters.</p> <h3>Picking instead of rolling</h3> <p>Beside the die, the <strong>pick-list button</strong> lets you choose a specific value:</p> <ul> <li><strong>Career</strong> (hireling): the twelve 2e careers, each shown with its day rate and loadout. Picking one brings the whole career, as the die would.</li> <li><strong>Background</strong> (NPC): the d20 table. The gear follows the same rules as the die, Lord and Politician included.</li> <li><strong>Faction</strong>: your faction table. A table of the same name in your world is used instead of the shipped one.</li> <li><strong>Portrait</strong>: the list button on the portrait opens the portrait gallery, as clicking the portrait does.</li> </ul> <p>There isn&#39;t a pick-list for the name. The pick-list buttons show and hide with the dice.</p> <h2>What players see</h2> <p>A generated NPC or hireling arrives with <strong>Limited</strong> default ownership. Players see its name and portrait in the Actors list, and opening the sheet shows them the portrait, the name and the Description. They don&#39;t see the stat block, the inventory, the notes or a Print button. Put anything the players are allowed to read in <strong>Description</strong> and keep your secrets in <strong>Notes</strong>.</p> <p>When the party hires a hireling, give ownership as usual. Its generation dice stay yours, no matter how much of it a player owns.</p> <h2>Changing your mind</h2> <p>The <strong>Role</strong> dropdown turns an NPC into a hireling and back. Nothing is thrown away either way. Background and Career are kept separately, and Quirk and Goal stay stored on a hireling even though its Traits window doesn&#39;t list them. When you switch back, everything returns.</p> <p>The same dropdown holds the other four roles: Monster, Companion, Transport and Container.</p> <h2>The tables behind it</h2> <p>These ship as rollable tables in the <strong>Warden — NPCs</strong> compendium:</p> <ul> <li><code>Warden: NPC - Name</code> (d60)</li> <li><code>Warden: NPC - Background</code></li> <li><code>Warden: NPC - Quirk</code></li> <li><code>Warden: NPC - Goal</code></li> <li><code>Warden: NPC - Virtue</code></li> <li><code>Warden: NPC - Vice</code></li> <li><code>Warden: NPC - Faction</code></li> </ul> <p>The text is the Cairn 2e Warden&#39;s Guide NPC tables (CC BY-SA 4.0, by Yochai Gal). Generation <em>rolls</em> these tables and never <em>draws</em> from them, so your tables are never marked as drawn.</p> <p><strong>You can override every one of these tables.</strong> Make a rollable table in your own world with exactly a shipped table&#39;s name — <code>Warden: NPC - Faction</code>, say — and it&#39;s used instead of the shipped one. It also survives a system update. Edits made inside the shipped compendium don&#39;t survive, because an update replaces it.</p> <p>The twelve careers are <strong>not</strong> a table. They&#39;re a fixed list taken from the 2e hireling examples, so there isn&#39;t a careers compendium to edit. For a career the book doesn&#39;t have, type it into the Career field and set the rate yourself.</p> <h2>What an NPC is carrying</h2> <p>An NPC&#39;s Background is a word off a d20 table, and the table doesn&#39;t give any gear. The Cairn Barebones list of 100 backgrounds does, so each row of the NPC table is matched to its nearest Barebones counterpart and the NPC arrives with that gear. The items come from the same item compendiums a Barebones character and a hireling use.</p> <table> <thead> <tr> <th>d20</th> <th>NPC Background</th> <th>Barebones counterpart</th> <th>d100</th> <th>what you get</th> </tr> </thead> <tbody><tr> <td>1</td> <td>Academic</td> <td>Scribe</td> <td>82</td> <td>Candle, Parchment &amp; Ink, Stylus</td> </tr> <tr> <td>2</td> <td>Assassin</td> <td><strong>Assassin</strong></td> <td>5</td> <td>Garrotte, Mask, Poison</td> </tr> <tr> <td>3</td> <td>Blacksmith</td> <td><strong>Blacksmith</strong></td> <td>14</td> <td>Bellows, Hammer, Iron Tongs</td> </tr> <tr> <td>4</td> <td>Farmer</td> <td><strong>Farmer</strong></td> <td>37</td> <td>Rope, Sack, Shovel</td> </tr> <tr> <td>5</td> <td>General</td> <td>Knight</td> <td>57</td> <td>Gloves, Signal Flag, Whetstone</td> </tr> <tr> <td>6</td> <td>Gravedigger</td> <td><strong>Gravedigger</strong></td> <td>45</td> <td>Alcohol, Ladder, Shovel</td> </tr> <tr> <td>7</td> <td>Guard</td> <td><strong>Guard</strong></td> <td>46</td> <td>Lantern, Manacles, Whistle</td> </tr> <tr> <td>8</td> <td>Healer</td> <td>Herbalist</td> <td>48</td> <td>Antitoxin, Mugwort, Sack</td> </tr> <tr> <td>9</td> <td>Jailer</td> <td><strong>Jailer</strong></td> <td>54</td> <td>Chain, 10ft, Manacles, Whistle</td> </tr> <tr> <td>10</td> <td>Laborer</td> <td>Gardener</td> <td>42</td> <td>Gloves, Sack, Shovel</td> </tr> <tr> <td>11</td> <td>Lord</td> <td>—</td> <td></td> <td></td> </tr> <tr> <td>12</td> <td>Merchant</td> <td><strong>Merchant</strong></td> <td>64</td> <td>Random Additional Gear, Stylus <em>(plus a Wagon — not granted, see below)</em></td> </tr> <tr> <td>13</td> <td>Monk</td> <td><strong>Monk</strong></td> <td>67</td> <td>Candle, Cloak, Songbook</td> </tr> <tr> <td>14</td> <td>Mystic</td> <td>Hermit</td> <td>49</td> <td>Blanket, Pole, 10ft, Smoking Herbs</td> </tr> <tr> <td>15</td> <td>Outlander</td> <td>Vagabond</td> <td>96</td> <td>Blanket, Poncho, Rope</td> </tr> <tr> <td>16</td> <td>Peddler</td> <td><strong>Peddler</strong></td> <td>73</td> <td>Random Additional Gear, Sack <em>(plus a Cart — not granted, see below)</em></td> </tr> <tr> <td>17</td> <td>Politician</td> <td>—</td> <td></td> <td></td> </tr> <tr> <td>18</td> <td>Spy</td> <td><strong>Spy</strong></td> <td>86</td> <td>Disguise Kit, Garrotte, Mirror</td> </tr> <tr> <td>19</td> <td>Thief</td> <td><strong>Thief</strong></td> <td>92</td> <td>Caltrops, Grappling Hook, Lockpicks</td> </tr> <tr> <td>20</td> <td>Thug</td> <td>Highway Robber</td> <td>50</td> <td>Grappling Hook, Rope, Signal Flag</td> </tr> </tbody></table> <p>Eleven are the same word in both lists, in <strong>bold</strong>. Seven are matched to a different trade, and two don&#39;t have a counterpart:</p> <ul> <li><strong>Lord and Politician don&#39;t get any items at all</strong>, kit included. Every Barebones background is an occupation, so rank and office don&#39;t have a counterpart. Give them what the fiction says they carry.</li> <li><strong>Thug is Highway Robber, not Thief</strong>, because Thief is already row 19.</li> <li><strong>Healer and Academic are the loosest matches.</strong> Barebones splits each across several trades — a healer could just as well be Apothecary, Physician, Barber Surgeon or Leech Collector.</li> <li><strong>&quot;Random Additional Gear&quot; is a roll</strong> on the Barebones Additional Gear d100, rerolled if it duplicates something the NPC already has.</li> <li><strong>NPCs don&#39;t get the Merchant&#39;s Wagon or the Peddler&#39;s Cart.</strong> A transport is its own Actor in the Actors list, and generating a dozen NPCs shouldn&#39;t create a dozen carts. Make one if the peddler needs it. A hireling&#39;s career doesn&#39;t come with a transport either.</li> </ul> <p><strong>Every other NPC also carries a kit</strong>, which is the equipment a Barebones character gets. That&#39;s Rations, a Torch, a rolled weapon and armor (both worn), and a roll on the Barebones Additional Gear table, with a second roll when the armor comes up None. With the Background&#39;s gear that&#39;s about eight items, so some NPCs arrive <strong>encumbered</strong>, without a free slot and at 0 HP, just as a freshly generated player character can. Decide what they put down.</p> <p>What each re-roll replaces:</p> <ul> <li><strong>The Background die or pick-list</strong> replaces the Background&#39;s gear. Between ordinary trades it leaves the kit alone. Landing on Lord or Politician removes the gear and the kit, and moving back off one packs a fresh kit.</li> <li><strong>Roll NPC</strong> replaces both.</li> <li><strong>Neither one touches anything you added by hand.</strong></li> </ul> <h2>What generation will not do</h2> <ul> <li><strong>It doesn&#39;t give anyone a transport.</strong> See above.</li> <li><strong>It doesn&#39;t automate rules text.</strong> A trait, a quirk or a goal is prose for you to play. The system doesn&#39;t read it or roll it.</li> <li><strong>It doesn&#39;t roll a faction at creation.</strong> The Faction die is there when you want it.</li> </ul> <h2>Related</h2> <ul> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.dbJWZrebNcEvOgpZ]{Generating Monsters} — for things that fight, with a danger tier to pick.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.gFK4npERocroPaEG]{Tokens and Sheets} — why every token of one of these people shares a sheet, and what to use for a crowd.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.xrpS5v0W5q67jIzx]{Generating Factions} — for the groups these people belong to.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.XzQJvxDorYQdCqGp]{Using Your Own Portraits} — how the <code>npc</code> folder supplies the portraits.</li> </ul>'
