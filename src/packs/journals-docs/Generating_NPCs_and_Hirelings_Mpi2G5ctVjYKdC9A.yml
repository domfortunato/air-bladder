name: Generating NPCs and Hirelings
pages:
  - _id: Cv1CBe9JFqVd4FSk
    name: Generating NPCs and Hirelings
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>Two buttons, two kinds of person. <strong>Generate NPC</strong> makes somebody the party <em>meets</em> — an innkeeper, a rival, a hostage — with a Background off the Warden&#39;s Guide table and four traits of their own. <strong>Generate Hireling</strong> makes somebody the party <em>pays</em>, with a Career off the 2e careers list, the gear that career carries and a day rate.</p> <p>Both arrive as complete Actors: a name, a portrait, a matching token, a biography and a stat block. Neither asks you a question first.</p> <p>You need permission to create Actors. The Warden always has it; a player only if you have granted it.</p> <hr> <h2>Which one you want</h2> <table> <thead> <tr> <th></th> <th><strong>NPC</strong></th> <th><strong>Hireling</strong></th> </tr> </thead> <tbody><tr> <td>the party…</td> <td>meets them</td> <td>pays them</td> </tr> <tr> <td>job field</td> <td><strong>Background</strong> — Academic, Gravedigger, Peddler, Spy</td> <td><strong>Career</strong> — Blacksmith, Navigator, Trapper</td> </tr> <tr> <td>where it comes from</td> <td>the Warden&#39;s Guide NPC table (d20)</td> <td>the 2e careers list (12 of them)</td> </tr> <tr> <td>day rate</td> <td>none</td> <td>yes, from the career</td> </tr> <tr> <td>stat block</td> <td><strong>rolled</strong> — 3d6 a piece, 1d6 HP</td> <td>fixed by the career</td> </tr> <tr> <td>gear</td> <td>a full Barebones equipment kit — weapon and armor included — plus its Background&#39;s Barebones counterpart; a Lord or Politician arrives with <strong>nothing at all</strong></td> <td>the career&#39;s whole loadout, equipped</td> </tr> <tr> <td>extra traits</td> <td><strong>Quirk, Goal</strong>, plus NPC Virtue and Vice</td> <td>2e Virtue and Vice</td> </tr> </tbody></table> <p>Nothing is locked in. The <strong>Role</strong> dropdown at the top of any of these sheets switches one into the other, and switching costs you nothing — see Changing your mind below.</p> <h2>Where the buttons are</h2> <p><strong>Actors tab → the button row at the top.</strong></p> <ul> <li><strong>Generate NPC</strong> (the person-plus icon)</li> <li><strong>Generate Hireling</strong> (the coin-in-hand icon)</li> </ul> <p>Both also live in the folder <strong>+</strong> menu, under <em>What are you creating?</em>, which is the one to use when you want the new person filed straight into a folder.</p> <h2>What an NPC arrives with</h2> <ul> <li><strong>A name</strong> off <code>Warden: NPC - Name</code>, the book&#39;s three d20 lists merged into one d60.</li> <li><strong>A Background</strong> off <code>Warden: NPC - Background</code>.</li> <li><strong>Ten traits</strong>: the six appearance ones a player character rolls — Physique, Skin, Hair, Face, Speech, Clothing — plus <strong>Quirk</strong>, <strong>Goal</strong>, <strong>Virtue</strong> and <strong>Vice</strong> off the Warden&#39;s Guide NPC lists.</li> <li><strong>An age</strong>, respecting your minimum- and maximum-age settings, the same as a player character&#39;s.</li> <li><strong>Blank pronouns.</strong> Generation does not choose them — there is no table for pronouns and no die should decide them. The field is at the top of the Description tab; fill it in when you know.</li> <li><strong>A portrait and a matching token.</strong> If you have set up a custom portrait folder with an <code>npc</code> subfolder, it draws from there — see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.XzQJvxDorYQdCqGp]{Using Your Own Portraits}.</li> <li><strong>The full Barebones equipment kit</strong> — Rations, a torch, a rolled weapon and armor (both worn), and a roll on Additional Gear, a second when the armor comes up None: the same procedure a starting Barebones character goes through — plus <strong>the gear its Background grants</strong>; see the table below. The exception is a <strong>Lord or Politician, who arrives with no items at all</strong>, kit included: rank and office pack nothing, and you give them exactly what the fiction says they carry.</li> <li><strong>A rolled stat block</strong>: 3d6 for each of STR, DEX and WIL, and 1d6 Hit Protection — the same dice a player character is made with.</li> </ul> <p>The stat block is a starting point, not a verdict. The Warden&#39;s Guide gives NPCs no numbers at all, on the reasoning that most of them never get into a fight, so these are here to save you inventing three of them when one does. Type over anything that does not suit — a hedge wizard with WIL 17 is a decision, not a die roll.</p> <h2>What a hireling arrives with</h2> <ul> <li>The same name table, the same biography, the same portrait treatment.</li> <li><strong>A Career</strong>, and everything that comes with it: abilities, HP, the day rate, and the gear — weapons and armor arrive <strong>equipped</strong>, so the Armor score is already right.</li> <li><strong>For Hire</strong> ticked, and the day rate showing beside it.</li> </ul> <p>Untick <strong>For Hire</strong> and the rate hides. That is how you keep a Career on someone who is not currently taking work — a retired sailor is still a sailor.</p> <p>The twelve careers, with their day rates in gold: Alchemist (30), Animal Handler (5), Blacksmith (15), Bodyguard (10), Local Guide (5), Lockpick (10), Navigator (10), Sailor (5), Scholar (20), Tracker (5), Trapper (5), Veteran Bodyguard (20). Type one of those names over the Career of someone whose rate is still 0 and the rate fills itself; set a rate by hand and nothing overrides it.</p> <h2>The biography reads &quot;They&quot;</h2> <p>The sentence under the pronouns is written in the third person on both of these sheets — <em>&quot;They have a Gaunt Physique, Sallow Skin and Wiry Hair…&quot;</em> — where a player character&#39;s reads <em>&quot;You have…&quot;</em>. The printed sheet says the same.</p> <p>Open <strong>Traits</strong> to change any single one from its table&#39;s list. Anything you type that is not on the table survives too; it just shows as it is.</p> <h2>Re-rolling</h2> <p>Every person&#39;s sheet has a <strong>Roll NPC</strong> button in the title bar. If you don&#39;t see it, flip <strong>Randomization</strong> on with the toggle beside it — generated people arrive with it off, so a sheet you are showing a player has no dice on it.</p> <p>Roll NPC asks first, and it asks two different questions:</p> <ul> <li>On a <strong>hireling</strong>: everything it is carrying will be deleted, and its abilities, HP, Career and day rate replaced. A whole new working person.</li> <li>On an <strong>NPC</strong>: its Background, stat block, traits and age are replaced, and so is everything generation gave it — the Background&#39;s gear AND the kit, because this is a different person. Its pronouns, coins and status marks are cleared. Its <strong>name, portrait, notes and anything you gave it by hand are kept</strong>. The new stat block arrives at full, so a re-rolled NPC never carries the last one&#39;s wounds.</li> </ul> <p>Both keep the name and the portrait, so you can re-roll the shopkeeper the party has already met without them changing face. Neither can be undone.</p> <h2>The dice on the sheet</h2> <p>With Randomization on, each of these re-rolls one thing and touches nothing else:</p> <table> <thead> <tr> <th>Die</th> <th>What it does</th> </tr> </thead> <tbody><tr> <td>beside the name</td> <td>a new name off the d60</td> </tr> <tr> <td>beside <strong>Background</strong></td> <td>a new Background <strong>and the gear it grants</strong> — the kit stays between ordinary trades; landing <strong>Lord or Politician empties the whole pack</strong>, and rolling back off one repacks it (NPC role)</td> </tr> <tr> <td>beside <strong>Career</strong></td> <td>a new Career — <strong>and its stat block and gear with it</strong>, because in 2e a career <em>is</em> those things</td> </tr> <tr> <td>beside <strong>Faction</strong></td> <td>a side, off <code>Warden: NPC - Faction</code></td> </tr> <tr> <td>beside <strong>Age</strong></td> <td>your <strong>Age formula</strong> setting (default: 2d20 + 10 — see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.JN9oUEMUbsvjwn8A]{Dice Formulas})</td> </tr> <tr> <td>on the portrait</td> <td>another face from the same folder</td> </tr> </tbody></table> <p><strong>These dice are yours alone.</strong> On an NPC or hireling sheet a player never sees them — not even a player who owns the hireling, and whatever <strong>Allow players to randomize</strong> says. That setting still governs player characters only.</p> <h3>Picking instead of rolling</h3> <p>Beside the die, the <strong>magnifying glass</strong> picks a specific value instead of a random one — the same control a player character&#39;s background row has:</p> <ul> <li><strong>Career</strong> (hireling): choose from the twelve 2e careers, each shown with its day rate and loadout. Picking one adopts the whole career — stat block, rate and gear — exactly as the die would.</li> <li><strong>Background</strong> (NPC): choose from the d20 table. The old trade&#39;s gear is swapped for the new trade&#39;s; the kit stays — except that picking <strong>Lord or Politician empties the pack entirely</strong>, and picking your way back off one packs a fresh kit.</li> <li><strong>Faction</strong>: choose from your faction table (your own world table of the same name wins, as always).</li> </ul> <p>The pickers ride the same <strong>Randomization</strong> toggle as the dice: turning it off removes the whole surface, magnifying glasses included. Flip it on to roll or to pick.</p> <h2>What players see</h2> <p>A generated NPC arrives with <strong>Limited</strong> default ownership: players see its name and portrait in the directory, and opening the sheet shows them the portrait, the name and the Description field — no stat block, no inventory, no notes, and no Print button. Put anything the players may read in <strong>Description</strong>; keep your secrets in <strong>Notes</strong>.</p> <p>A generated hireling arrives <strong>Limited</strong> too — it is meant to be handed to a player whole, so grant ownership as usual when the party hires them, and until you do, players see its limited view like any stranger&#39;s. However much of a hireling a player owns, its generation dice stay yours (above).</p> <h2>Changing your mind</h2> <p>The <strong>Role</strong> dropdown turns an NPC into a hireling and back. Nothing is thrown away in either direction: the two roles keep their job fields in separate places, and Quirk and Goal stay stored on a hireling even though that sheet does not show them. Switch back and everything returns.</p> <p>This is also how you promote one of the six shipped roles into another — Monster, Companion, Transport and Container are the same dropdown.</p> <h2>The tables behind it</h2> <p>These ship as RollTables in the <strong>Warden — NPCs</strong> compendium:</p> <ul> <li><code>Warden: NPC - Name</code> (d60)</li> <li><code>Warden: NPC - Background</code></li> <li><code>Warden: NPC - Quirk</code></li> <li><code>Warden: NPC - Goal</code></li> <li><code>Warden: NPC - Virtue</code></li> <li><code>Warden: NPC - Vice</code></li> <li><code>Warden: NPC - Faction</code></li> </ul> <p>The text is the Cairn 2e Warden&#39;s Guide NPC tables (CC BY-SA 4.0, by Yochai Gal). Everything here <em>rolls</em> these tables rather than <em>drawing</em> from them, so your tables never get marked as drawn.</p> <p><strong>Faction is the one you can override.</strong> Make a RollTable in your own world named exactly <code>Warden: NPC - Faction</code> and it wins over the shipped copy, so your campaign&#39;s factions survive a system update. The others are read straight from the compendium — you can unlock the pack and edit rows, but an update ships fresh copies, so treat those edits as temporary.</p> <p>The twelve careers are <strong>not</strong> a table. They are a list inside the system, taken from the 2e hireling examples, which is why there is no &quot;Careers&quot; compendium to edit. To use a career the book does not have, type it into the Career field and set the rate yourself.</p> <h2>What an NPC is carrying, and where it comes from</h2> <p>An NPC&#39;s Background is a word off a d20 table, and a word grants nothing. The Cairn Barebones list of 100 backgrounds is the one list in this system whose entries DO carry gear, so each row of the NPC table points at its nearest Barebones counterpart and an NPC arrives holding that gear — resolved out of the same editable item packs a Barebones character and a hireling draw from, so editing an item changes what every NPC generated afterwards carries.</p> <table> <thead> <tr> <th>d20</th> <th>NPC Background</th> <th>Barebones counterpart</th> <th>d100</th> <th>what you get</th> </tr> </thead> <tbody><tr> <td>1</td> <td>Academic</td> <td>Scribe</td> <td>82</td> <td>Candle, Parchment &amp; Ink, Stylus</td> </tr> <tr> <td>2</td> <td>Assassin</td> <td><strong>Assassin</strong></td> <td>5</td> <td>Garrotte, Mask, Poison</td> </tr> <tr> <td>3</td> <td>Blacksmith</td> <td><strong>Blacksmith</strong></td> <td>14</td> <td>Bellows, Hammer, Iron Tongs</td> </tr> <tr> <td>4</td> <td>Farmer</td> <td><strong>Farmer</strong></td> <td>37</td> <td>Rope, Sack, Shovel</td> </tr> <tr> <td>5</td> <td>General</td> <td>Knight</td> <td>57</td> <td>Gloves, Signal Flag, Whetstone</td> </tr> <tr> <td>6</td> <td>Gravedigger</td> <td><strong>Gravedigger</strong></td> <td>45</td> <td>Alcohol, Ladder, Shovel</td> </tr> <tr> <td>7</td> <td>Guard</td> <td><strong>Guard</strong></td> <td>46</td> <td>Lantern, Manacles, Whistle</td> </tr> <tr> <td>8</td> <td>Healer</td> <td>Herbalist</td> <td>48</td> <td>Antitoxin, Mugwort, Sack</td> </tr> <tr> <td>9</td> <td>Jailer</td> <td><strong>Jailer</strong></td> <td>54</td> <td>Chain, 10ft, Manacles, Whistle</td> </tr> <tr> <td>10</td> <td>Laborer</td> <td>Gardener</td> <td>42</td> <td>Gloves, Sack, Shovel</td> </tr> <tr> <td>11</td> <td>Lord</td> <td>—</td> <td></td> <td></td> </tr> <tr> <td>12</td> <td>Merchant</td> <td><strong>Merchant</strong></td> <td>64</td> <td>Random Additional Gear, Stylus <em>(plus a Wagon — not granted, see below)</em></td> </tr> <tr> <td>13</td> <td>Monk</td> <td><strong>Monk</strong></td> <td>67</td> <td>Candle, Cloak, Songbook</td> </tr> <tr> <td>14</td> <td>Mystic</td> <td>Hermit</td> <td>49</td> <td>Blanket, Pole, 10ft, Smoking Herbs</td> </tr> <tr> <td>15</td> <td>Outlander</td> <td>Vagabond</td> <td>96</td> <td>Blanket, Poncho, Rope</td> </tr> <tr> <td>16</td> <td>Peddler</td> <td><strong>Peddler</strong></td> <td>73</td> <td>Random Additional Gear, Sack <em>(plus a Cart — not granted, see below)</em></td> </tr> <tr> <td>17</td> <td>Politician</td> <td>—</td> <td></td> <td></td> </tr> <tr> <td>18</td> <td>Spy</td> <td><strong>Spy</strong></td> <td>86</td> <td>Disguise Kit, Garrotte, Mirror</td> </tr> <tr> <td>19</td> <td>Thief</td> <td><strong>Thief</strong></td> <td>92</td> <td>Caltrops, Grappling Hook, Lockpicks</td> </tr> <tr> <td>20</td> <td>Thug</td> <td>Highway Robber</td> <td>50</td> <td>Grappling Hook, Rope, Signal Flag</td> </tr> </tbody></table> <p>Eleven are the same word in both lists, in <strong>bold</strong>. Seven needed a translation, and two get nothing at all:</p> <ul> <li><strong>Lord and Politician generate with no items at all</strong> — no gear, no kit — and that is not an oversight. Every one of the 100 Barebones backgrounds is an OCCUPATION — what you did before adventuring — so hereditary rank and elected office have nowhere to sit. That is exactly why both words are on a table the WARDEN rolls: they say where someone stands in the world, which is what you need about a person the party meets, not a set of skills a starting character brings. A Lord arrives with an empty pack; give them what the fiction says they carry.</li> <li><strong>Thug is not Thief</strong>, obvious as that looks, because Thief is already row 19. Highway Robber keeps the distinction the table draws: one takes by stealth, the other by force.</li> <li><strong>Healer and Academic are the loosest</strong>, because Barebones splits each across several trades — a healer could as well be Apothecary, Physician, Barber Surgeon or Leech Collector. Herbalist and Scribe are picks, not verdicts.</li> <li><strong>&quot;Random Additional Gear&quot; is a real roll, not a missing item.</strong> Two of these name it, and it means a roll on the Barebones Additional Gear d100, rerolled if it duplicates something the Background already gave.</li> <li><strong>The Merchant&#39;s Wagon and the Peddler&#39;s Cart are NOT granted.</strong> A transport is a second Actor, connected to its keeper and always listed in the Actor Directory, and generating a dozen NPCs should not mint a dozen carts. Buy or make one if the peddler needs it. A hireling&#39;s career grants no transport either.</li> </ul> <p><strong>Every other NPC also carries a kit</strong>: the whole equipment procedure a Barebones character goes through — Rations, a Torch, a rolled weapon and armor (both worn), and a roll on the Barebones Additional Gear table, a second when the armor comes up None. That brings a typical NPC to eight or nine items, a real pack — full enough that some arrive <strong>encumbered</strong>, exactly as a freshly generated player character can. That is not a bug in either case: they were owed the gear, and deciding what gets put down is part of meeting them.</p> <p>A note on the Background <strong>die</strong> (as against generation): rolling an existing NPC&#39;s Background onto Lord or Politician removes <strong>everything generation granted — the trade&#39;s gear and the kit alike</strong> — so the swap leaves them exactly as generating them would: empty-handed. Rolling between two ordinary trades keeps the bag, and rolling your way back off Lord or Politician packs a fresh kit, so the NPC ends up matching a generated one whichever way the die walked them there.</p> <p>Both are tagged, and the tags are what tell them apart when you re-roll:</p> <ul> <li><strong>The Background die</strong> replaces the Background&#39;s gear; between ordinary trades it leaves the kit alone, with the Lord and Politician exception above.</li> <li><strong>Roll NPC</strong> replaces both, because that is a different person.</li> <li><strong>Anything you added by hand is never touched by either.</strong></li> </ul> <h2>What generation will not do</h2> <ul> <li><strong>It grants no transport.</strong> A Merchant or Peddler NPC gets their items but not the Wagon or Cart the Barebones background lists — see above.</li> <li><strong>It automates no rules text.</strong> A trait, a quirk or a goal is prose. Nothing reads it, nothing rolls it, nothing applies it — that is yours to play.</li> <li><strong>It rolls no faction at creation.</strong> Whose side someone is on is a decision about your campaign, not a die roll, so the Faction die is there when you want it and silent when you do not.</li> </ul> <h2>Related</h2> <ul> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.dbJWZrebNcEvOgpZ]{Generating Monsters} — the same idea for things that fight, with a danger tier to pick.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.xrpS5v0W5q67jIzx]{Generating Factions} — for the groups these people belong to.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.XzQJvxDorYQdCqGp]{Using Your Own Portraits} — how the <code>npc</code> folder feeds the faces above.</li> </ul>'
