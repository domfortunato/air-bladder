    name: Creating Custom Backgrounds
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>A <strong>custom background</strong> is a Cairn 2e background you write yourself: All custom, or &quot;home-brewed&quot; backgrounds include:</p> <ul> <li>a description</li> <li>example names</li> <li>starting gear</li> <li>Two d6 question tables.</li> </ul> <p>They work the same way that the backgrounds published in the Cairn 2e Player&#39;s Guide do and appear in the Background Picker unless you hide them from the picker or disable custom 2e backgrounds.</p> <p>This page covers writing a custom background. To move one of your custom backgrounds to another world or another Warden, see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.AtCRQjDgxlCLS40I]{Sharing &amp; moving custom backgrounds}.</p> <p>Only Wardens can create custom backgrounds. </p> <hr> <h2>Start by duplicating a shipped background</h2> <p>A copy of a shipped background gives you a complete example to edit.</p> <ol> <li>Open the <strong>Compendium</strong> sidebar tab → <strong>Air Bladder - Backgrounds</strong> → <strong>Backgrounds (2e)</strong> and click a background.</li> <li>Open its <strong>Details</strong> tab and click <strong>Duplicate into Custom 2e Backgrounds</strong>.</li> </ol> <p>A shipped background opens on its Description tab, where a note points you to Details. You don&#39;t need to import the background first, because the button works on the locked compendium entry.</p> <p>The first time you use it, the button creates a world compendium called <strong>Custom 2e Backgrounds</strong>. It puts an editable copy there, named after the original with <em>(Copy)</em> added, and opens it. Rename the copy and replace its content using the fields described under The sheet.</p> <h2>Editing the backgrounds that ship with Air Bladder</h2> <p>To edit the shipped backgrounds themselves, open the <strong>Rollable Tables</strong> or <strong>Compendium</strong> sidebar tab and press <strong>Create Custom 2e Backgrounds and Tables…</strong> at the top (Wardens only). A window explains what will be copied. Press <strong>Copy</strong>.</p> <p>It copies all 27 shipped 2e backgrounds (20 from the Cairn 2e Player&#39;s Guide, plus 7 classic D&amp;D style backgrounds) into your <strong>Custom 2e Backgrounds</strong> compendium under their own names, with no <em>(Copy)</em> added, and switches custom backgrounds on.</p> <p>Treat these shipped backgrounds as templates; copy them and edit them as needed.</p> <h2>Air Bladder uses the Custom Background before using another background with the same name in the compendium</h2> <p>Each custom background <strong>stands in</strong> for the shipped background of the same name in all pickers and character generators. If you delete a custom background that was copied from a canon background, Air Bladder will revert to using the canon background in the compendium. To take any background out of play without deleting it, use the eye toggle in the background picker. A background you switched off before copying stays off. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Taking a background out of play} in Generating Characters.</p> <p>The <strong>Create Custom 2e Backgrounds and Tables…</strong> button copies the <strong>eleven tables a 2e character rolls on</strong> into a <strong>Custom 2e Character Creation</strong> folder in your Rollable Tables: Bonds, Omens, Scars (the one in <strong>Utils</strong>, which gives a scar when damage calls for one), and the eight trait tables (Physique, Skin, Hair, Face, Speech, Clothing, Vice, Virtue). A table in your world with a shipped table&#39;s name is rolled instead of the shipped one, and the trait lists on the character sheet offer your rows. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.mlSyCzimMvBjzxFH]{Customizing Bonds}.</p> <p>A window then tells you what was copied, with two buttons: <strong>Open Custom 2e Backgrounds on the Compendium tab</strong> and <strong>Show the Custom 2e Character Creation folder in Rollable Tables</strong>. The backgrounds compendium sits on the Compendium tab, outside the Air Bladder folders.</p> <p><strong>Running it again never overwrites anything.</strong> A copy you&#39;ve edited is kept, and only what&#39;s missing is added. If your Custom 2e Backgrounds compendium is locked, the backgrounds aren&#39;t copied. Unlock it and run it again.</p> <h2>Starting from nothing</h2> <p>There isn&#39;t a &quot;new background&quot; button, but you can start from an empty Item:</p> <ol> <li>Open the <strong>Items</strong> sidebar tab and click <strong>Create Item</strong>.</li> <li>Name it and set <strong>Type</strong> to <strong>Background</strong>.</li> <li>Fill in the fields described below.</li> <li>On the <strong>Details</strong> tab, click <strong>Duplicate into Custom 2e Backgrounds</strong>.</li> </ol> <p>You can&#39;t skip step 4. A background in the Items sidebar never shows up in the picker. Only one in a compendium does.</p> <hr> <h2>The sheet</h2> <p>The background sheet has two tabs.</p> <p><strong>Description</strong> is the prose a player reads in the picker and on their character sheet. The picker&#39;s list shows its <strong>first sentence</strong> beside the background&#39;s name, so write that sentence to stand alone. To edit the text, hover over the box and press the edit button in its top-right corner.</p> <p><strong>Details</strong> is the form. At the top are <strong>Test ×10</strong> and <strong>Duplicate into Custom 2e Backgrounds</strong>, then the sections below.</p> <h3>Source and Archetype</h3> <p><strong>Source</strong> always reads <em>Cairn 2e</em> and can&#39;t be changed.</p> <p><strong>Archetype</strong> (Wizard, Fighter, Thief, or blank) sets the picker group for a copy that stands in for one of the Player&#39;s Guide twenty. A background of your own is listed under <strong>Custom 2e Backgrounds</strong> in the picker, whatever its archetype is, so you can leave it blank. The archetype never shows up on a character sheet.</p> <h3>Credit line</h3> <p>This is one line saying who wrote the background and under what licence. Whatever you type prints in the footer of every character sheet built on this background, beside Cairn&#39;s own credit. The box suggests the form:</p> <pre><code>Title — Author · CC BY-SA 4.0 </code></pre> <p><strong>Leave it empty for your own unshared work.</strong> Cairn&#39;s credit prints on every sheet anyway. Fill it in when you hand the background to someone else.</p> <p><strong>If you duplicated someone else&#39;s background, their credit is already in the box.</strong> A duplicated Cleric carries <em>Backgrounds for Cairn — Gordon McCormick, after BECMI D&amp;D by Frank Mentzer · CC BY-SA 4.0</em>. Keep it for as long as any of their writing is still there, as CC BY-SA requires. You can add your own name beside theirs. Once their text is all gone, replace it with your own.</p> <p>Air Bladder prints what&#39;s in the box and doesn&#39;t add anything.</p> <h3>Bonds</h3> <p><strong>Grants two bonds</strong> makes characters from this background roll on the bonds table twice. <strong>Bonds table</strong> names a RollTable of your own for this background&#39;s bonds. Most backgrounds leave both alone. See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.mlSyCzimMvBjzxFH]{Customizing bonds}.</p> <h3>Example Names</h3> <p>These are the names offered when a character rolls this background. <strong>Add a name</strong> adds a row, and the ✕ removes one.</p> <p>If there aren&#39;t any names, a generated character is named after the background itself.</p> <h3>Starting Gear</h3> <p>These are the items every character of this background starts with. There are two ways to add one:</p> <ul> <li><strong>Drag an item in</strong> from a compendium or the Items sidebar. The background keeps its own copy of the item, marked with a camera badge.</li> <li><strong>Add gear by name</strong> and type a name. The item is looked up by that name when a character is generated.</li> </ul> <p>Each row has a <strong>uses</strong> box and shows the item&#39;s armor, damage, bulky or petty tag and its uses once the name matches an item.</p> <p>A dragged-in copy travels with the background, so someone you share it with doesn&#39;t need your custom items. Later edits to the original item don&#39;t reach the copy. Use a name for gear every Air Bladder install ships, and drag in anything you made yourself.</p> <h3>Question Tables (2 × d6)</h3> <p>There are two tables of six options each. You can&#39;t change the number of tables or options.</p> <p>Each table has a <strong>question</strong>. Each option has:</p> <ul> <li>a <strong>description</strong> in prose: what happened, and what it gives;</li> <li><strong>Bonus gold</strong>, a number;</li> <li>a box to drag items into. They&#39;re kept as copies, the same way dragged starting gear is.</li> </ul> <p>At generation, one option is rolled on each table, and its prose, gold and items go to the character.</p> <p>An empty option can still be rolled, and it doesn&#39;t give the character anything. Test ×10 reports each one.</p> <hr> <h2>Test ×10</h2> <p><strong>Test ×10</strong> rolls the background ten times without creating a character and shows a report.</p> <p><strong>Problems</strong> come first, if there are any:</p> <table> <thead> <tr> <th>What it says</th> <th>What it means</th> </tr> </thead> <tbody><tr> <td><em>Source is not &quot;Cairn 2e&quot;, so this won&#39;t appear in the 2e picker.</em></td> <td>The background won&#39;t be offered.</td> </tr> <tr> <td><em>No example names — generation falls back to the background&#39;s own name.</em></td> <td>Characters will be named after the background.</td> </tr> <tr> <td><em>A starting-gear row has no name.</em></td> <td>An empty row that doesn&#39;t give anything.</td> </tr> <tr> <td><em>Starting gear &quot;X&quot; resolves to nothing — it will silently vanish. Drag the item in to snapshot it, or fix the name.</em></td> <td>The name doesn&#39;t match an item, so characters won&#39;t get it. Fix the spelling or drag the item in.</td> </tr> <tr> <td><em>Table 1, option 2: &quot;X&quot; resolves to nothing — it will silently vanish. …</em></td> <td>The same, for an item on a question option.</td> </tr> <tr> <td><em>Table 1, option 6 is empty — a d6 can still roll it, granting nothing.</em></td> <td>An option that doesn&#39;t have any prose, gold or items.</td> </tr> </tbody></table> <p>If there aren&#39;t any problems, the report reads <em>Looks self-contained — every grant resolves.</em></p> <p>Below that, the report lists the starting gear, how many of the ten rolls landed on each option of each table, and the bonus gold across the ten rolls (average and range). If one option gives far more gold than the rest, you&#39;ll see it here.</p> <hr> <h2>Making it appear in the picker</h2> <p>Custom backgrounds are offered only while this setting is on:</p> <p><strong>Game Settings → Configure Settings → Air Bladder → Character Generation → Configure Character Generation → Offer custom Cairn 2e backgrounds</strong></p> <p>With it on, your backgrounds are listed under <strong>Custom 2e Backgrounds</strong> at the end of the picker. A copy made by <strong>Create Custom 2e Backgrounds and Tables…</strong> keeps the place its shipped original had, because it stands in for it.</p> <p>The same setting also offers the seven class backgrounds in <strong>Backgrounds (Custom)</strong>: Fighter, Cleric, Magic-User, Thief, Dwarf, Elf and Halfling, from Gordon McCormick&#39;s <em>Backgrounds for Cairn</em>. &quot;Custom&quot; here means any background not published in the Cairn 2e Player&#39;s Guide, whoever wrote it.</p> <p>Turning off <strong>Offer canon Cairn 2e backgrounds</strong> still leaves those seven on offer beside yours. To offer only your own, also switch the seven off one by one with the <strong>eye toggle</strong> on each picker row (see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.x8L0eXwSKz38Csrt]{Taking a background out of play} in Generating Characters).</p> <p>If a finished background doesn&#39;t show up, check three things. You won&#39;t get an error for any of them.</p> <ol> <li>The setting above is off.</li> <li>Its <strong>Source</strong> isn&#39;t <em>Cairn 2e</em>.</li> <li>It&#39;s in the Items sidebar. It has to be in a compendium that belongs to the world or to a module.</li> </ol> <hr> <h2>Where it lives</h2> <p>Your backgrounds live in a world compendium called <strong>Custom 2e Backgrounds</strong>, created the first time you duplicate into it. You can edit it, and it belongs to that world only, which is why sharing has its own steps. A world that created the compendium under an earlier name keeps that name, and Air Bladder&#39;s messages use whichever name your world has.</p> <h3>Two compendiums with similar names</h3> <table> <thead> <tr> <th></th> <th><strong>Backgrounds (Custom)</strong></th> <th><strong>Custom 2e Backgrounds</strong></th> </tr> </thead> <tbody><tr> <td>Comes from</td> <td>Air Bladder, in every install</td> <td>your world, created on first duplicate</td> </tr> <tr> <td>Where it appears</td> <td>inside the <em>Air Bladder - Backgrounds</em> folder</td> <td>outside that folder</td> </tr> <tr> <td>Editable</td> <td>no, it&#39;s replaced on every system update</td> <td>yes</td> </tr> <tr> <td>Holds</td> <td>seven third-party class backgrounds</td> <td>what you write</td> </tr> </tbody></table> <p>**Never write into <em>Backgrounds (Custom)</em>.** A system update replaces it, and work put there is lost without warning. To change one of the seven, open it and use <strong>Duplicate into Custom 2e Backgrounds</strong>, or copy all 27 with <strong>Create Custom 2e Backgrounds and Tables…</strong>.</p> <p><strong>Your compendium sits outside the <em>Air Bladder - Backgrounds</em> folder.</strong> That folder holds the four compendiums Air Bladder ships: Backgrounds (2e), Backgrounds (Barebones), Backgrounds (Custom) and Background Items. Yours belongs to the world. You can drag it into a folder of your own, and Air Bladder finds it wherever it is.</p> <p>Backgrounds delivered in a <strong>module</strong> can&#39;t be edited. To change one, open it and use <strong>Duplicate into Custom 2e Backgrounds</strong>.</p> <p>See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.AtCRQjDgxlCLS40I]{Sharing &amp; moving custom backgrounds}.</p>'
