    name: Creating Custom Backgrounds
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>A <strong>custom background</strong> is a Cairn 2e background you write yourself: a tagline and description, example names, starting gear, and two d6 question tables. Air Bladder treats it exactly like a shipped one — it appears in the character-creation picker, grants its gear, and rolls its questions.</p> <p>This page is about <strong>authoring</strong> one. Once you have it working, see @UUID[Compendium.air-bladder.journals-docs.JournalEntry.AtCRQjDgxlCLS40I]{Sharing &amp; moving custom backgrounds} for getting it to another world or another Warden.</p> <p>You need to be the Warden (GM). Everything here happens in a world.</p> <hr> <h2>The fastest start: duplicate a shipped background</h2> <p>Writing one from a blank sheet means filling twelve question-table options before you can see anything work. Copying a real background gives you a complete, correct example to edit down.</p> <ol> <li>Open the <strong>Compendium</strong> sidebar tab → <strong>Air Bladder - Backgrounds</strong> → <strong>Backgrounds (2e)</strong> → click any background (say <em>Fieldwarden</em>).</li> <li>Switch to the <strong>Details</strong> tab and click <strong>Duplicate into Custom Backgrounds</strong>.</li> </ol> <p>The button is on <strong>Details</strong>, not Description, and a shipped background opens on Description — so if you cannot see it, you are on the wrong tab. You do <strong>not</strong> need to import the background into your world first; the button works directly on a locked compendium entry.</p> <p>That does two things: it creates a world compendium called <strong>Custom Backgrounds</strong> the first time you use it, and it puts an editable copy inside, named <em>Fieldwarden (Copy)</em>.</p> <p>Open that copy and you have the authoring sheet. Rename it, then work through the fields below, replacing the borrowed content as you go.</p> <h2>Starting from nothing instead</h2> <p>There is no separate &quot;new background&quot; button. Duplicating is the intended path, but the Background item type is public, so you can start from an empty one:</p> <ol> <li>Open the <strong>Items</strong> sidebar tab and click <strong>Create Item</strong>.</li> <li>Name it and set <strong>Type</strong> to <strong>Background</strong>.</li> <li>Fill in the fields described below.</li> <li>On the <strong>Details</strong> tab, click <strong>Duplicate into Custom Backgrounds</strong> to file it in the world compendium — created for you if it does not exist yet.</li> </ol> <p>Step 4 is not optional. A background sitting loose in the Items sidebar is not a content source and will never appear in the picker.</p> <hr> <h2>The sheet</h2> <p>The background sheet has two tabs.</p> <p><strong>Description</strong> is the prose a player reads in the picker and at the top of their character sheet. The <strong>first sentence</strong> is used on its own as the tagline in the picker&#39;s list, so lead with something that reads well truncated.</p> <p>It is a rich-text field, and its edit button only appears when you hover over the top-right corner of the box — so an empty Description can look like a static panel rather than something you can type in.</p> <p><strong>Details</strong> is the authoring form. It has a toolbar with <strong>Test ×10</strong> and <strong>Duplicate into Custom Backgrounds</strong>, then five sections.</p> <h3>Source and Archetype</h3> <p><strong>Source</strong> is fixed at <em>Cairn 2e</em> and is not editable — a custom background is a 2e background by definition.</p> <p><strong>Archetype</strong> is a dropdown (Wizard / Fighter / Thief, or blank). It decides which group the background sits under in the picker. It is <em>only</em> used there — it never appears on a character sheet — but leaving it blank means the background sits ungrouped, which looks like a mistake to a player.</p> <h3>Credit line</h3> <p>Who wrote this background, and under what licence. One line — a title, a name, a licence. It is the only field here that leaves your world: whatever you type prints in the footer of every character sheet built on this background, beside Cairn&#39;s own credit.</p> <p><strong>Leave it empty for your own unshared work.</strong> Cairn&#39;s credit prints on every sheet regardless, because the page reproduces Cairn&#39;s rules whether a background is involved or not. An empty field simply prints nothing extra. Fill it in when you are handing the background to someone else, so your name travels with it:</p> <pre><code>Bramblewick — A. Warden · CC BY-SA 4.0 </code></pre> <p><strong>If you duplicated someone else&#39;s background, their credit is already in the box.</strong> Duplicate a Cleric and you get <em>Backgrounds for Cairn — Gordon McCormick, after BECMI D&amp;D by Frank Mentzer · CC BY-SA 4.0</em>, because that is whose writing you are starting from. Keep it while any of their words remain — that is what CC BY-SA asks of you, and adding your own name beside theirs is the usual way to put it. Once you have rewritten the thing entirely and none of their text is left, the box is yours to empty and replace.</p> <p>Air Bladder never guesses at this. It reads the box and prints it, so nothing puts a name on your writing that you did not put there yourself.</p> <h3>Example Names</h3> <p>A list of names offered when a character rolls this background. <strong>Add a name</strong> appends a row; the ✕ removes one.</p> <p>If you leave this empty, generation falls back to the background&#39;s own name, so a Smuggler character will be called &quot;Smuggler&quot;. Ten or so names is the shipped norm.</p> <h3>Starting Gear</h3> <p>The items a character gets for free. Two ways to add one, and the difference matters:</p> <ul> <li><strong>Drag an item in</strong> (from a compendium or the Items sidebar) — this stores a <strong>frozen copy</strong> of the item, marked with a 📷 camera badge.</li> <li><strong>Add gear by name</strong> and type a name — this stores a <em>reference</em> that is looked up when a character is generated.</li> </ul> <p>Each row also has a <strong>uses</strong> box, for things like a torch with 3 uses, and shows the item&#39;s tags (Armor, Damage, bulky, petty) once it resolves.</p> <blockquote> <p><strong>Why the freeze:</strong> a snapshot travels. Someone who installs your background does not need your custom items — the copy is inside the background itself. The price is that later edits to the original item do <strong>not</strong> propagate. Use a name reference for ordinary gear every Air Bladder install already ships (Rations, Torch, Rope); drag in anything you made yourself.</p> </blockquote> <h3>Question Tables (2 × d6)</h3> <p>Two tables, six options each. This shape is fixed — you cannot add a third table or a seventh option, because generation rolls a d6 on each.</p> <p>Each table has a <strong>question</strong> (&quot;What happened at your final performance?&quot;), and each option has:</p> <ul> <li>a <strong>description</strong>, written as prose — what happened, and what it grants</li> <li><strong>bonus gold</strong>, a number</li> <li>an <strong>items</strong> drop zone, where dropped items are frozen the same way starting gear is</li> </ul> <p>At generation, <strong>one option per table is rolled</strong> and its prose, gold, and items go to the character. Both tables always fire, so a character gets two answers.</p> <p>Empty options still count. A blank sixth option means a one-in-six chance of getting nothing, and the linter will say so.</p> <hr> <h2>Test ×10 before you trust it</h2> <p><strong>Test ×10</strong> dry-runs the background ten times without creating anything. It is the only way to see what you actually built, and it doubles as a linter.</p> <p>It reports two things.</p> <p><strong>Problems</strong>, if any:</p> <table> <thead> <tr> <th>What it says</th> <th>What it means</th> </tr> </thead> <tbody><tr> <td><em>Source is not &quot;Cairn 2e&quot;</em></td> <td>It will not appear in the 2e picker at all.</td> </tr> <tr> <td><em>No archetype set</em></td> <td>It works, but sits ungrouped in the picker.</td> </tr> <tr> <td><em>No example names</em></td> <td>Characters will be named after the background.</td> </tr> <tr> <td><em>A starting-gear row has no name</em></td> <td>An empty row that grants nothing.</td> </tr> <tr> <td><em>Starting gear &quot;X&quot; resolves to nothing — it will silently vanish</em></td> <td><strong>The important one.</strong> A name reference matching no item. Drag the real item in so it snapshots, or fix the spelling.</td> </tr> <tr> <td><em>(empty option — a d6 can still roll this)</em></td> <td>A blank question-table option.</td> </tr> </tbody></table> <p><strong>A sampling run:</strong> which of each table&#39;s six options came up across the ten rolls, and the bonus-gold spread (average, min, max). This is how you notice that one option grants 300 gold and the rest grant 10.</p> <p><em>Looks self-contained — every grant resolves</em> is the all-clear.</p> <hr> <h2>Making it appear in the picker</h2> <p>A finished background is still invisible until you switch the source on:</p> <p><strong>Game Settings → Configure Settings → Air Bladder → Character Generation → Configure Character Generation → &quot;Offer custom Cairn 2e backgrounds&quot;</strong></p> <p>With it on, your custom backgrounds join the picker&#39;s <strong>Custom</strong> section.</p> <p>That section is not only yours. The same setting also admits the seven class backgrounds Air Bladder ships in <strong>Backgrounds (Custom)</strong> — Fighter, Cleric, Magic-User, Thief, Dwarf, Elf, Halfling, from Gordon McCormick&#39;s <em>Backgrounds for Cairn</em>. &quot;Custom&quot; here means <em>not published in the Cairn 2e Player&#39;s Guide</em>, whoever wrote it, so third-party sets and your own arrive through the same switch.</p> <p>So turning off <em>Offer canon Cairn 2e backgrounds</em> does <strong>not</strong> leave players rolling only what you wrote — the shipped class backgrounds are still in the pool. For a pool that is genuinely yours alone, switch those seven off individually with the <strong>eye toggle</strong> on each picker row, which is per-background and remembered by the world.</p> <p>Three things make a finished background invisible, and none of them produce an error, so check them in this order if yours does not show up:</p> <ol> <li>that setting is off</li> <li>its <strong>Source</strong> is not <em>Cairn 2e</em></li> <li>it is not in a <strong>world or module</strong> compendium (a background sitting loose in the Items sidebar is not a content source)</li> </ol> <hr> <h2>Where it lives</h2> <p>Custom backgrounds you write live in a world compendium called <strong>Custom Backgrounds</strong>, created the first time you duplicate into it. Being a world compendium, it is editable and belongs to that world only — which is why sharing needs its own steps.</p> <h3>Two packs with nearly the same name, and only one is yours</h3> <p>This trips people up, so it is worth being exact:</p> <table> <thead> <tr> <th></th> <th><strong>Backgrounds (Custom)</strong></th> <th><strong>Custom Backgrounds</strong></th> </tr> </thead> <tbody><tr> <td>Comes from</td> <td>the system, shipped in every install</td> <td>your world, created on first duplicate</td> </tr> <tr> <td>Where it appears</td> <td>inside the <em>Air Bladder - Backgrounds</em> folder</td> <td>outside that folder, on its own</td> </tr> <tr> <td>Editable</td> <td>no — replaced on every system update</td> <td>yes</td> </tr> <tr> <td>Holds</td> <td>seven third-party class backgrounds</td> <td>what you write</td> </tr> </tbody></table> <p>**Never author into <em>Backgrounds (Custom)</em>.** It is a system pack, and a system pack is overwritten wholesale when Air Bladder updates — work put there is gone at the next release, with no warning and no recovery. If you want to change one of the seven, open it and use <strong>Duplicate into Custom Backgrounds</strong>, which copies it somewhere that survives.</p> <p><strong>Your own pack sits outside the <em>Air Bladder - Backgrounds</em> folder</strong>, and that is not a mistake to fix. That folder groups the four packs the <em>system</em> ships — Backgrounds (2e), Backgrounds (Barebones), Backgrounds (Custom) and Background Items — and Foundry only lets a system file its own packs there. Your Custom Backgrounds compendium belongs to the world, so it appears on its own. You can drag it into any folder you make yourself; nothing in Air Bladder reads the folder, only the compendium.</p> <p>Backgrounds delivered inside a <strong>module</strong> are read-only. To change one, open it and use <strong>Duplicate into Custom Backgrounds</strong>, which copies it into your own editable pack.</p> <p>See @UUID[Compendium.air-bladder.journals-docs.JournalEntry.AtCRQjDgxlCLS40I]{Sharing &amp; moving custom backgrounds}.</p>'
