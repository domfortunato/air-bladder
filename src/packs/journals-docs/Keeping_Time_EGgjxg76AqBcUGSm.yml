    text:
      content: '<p>Cairn counts a journey in <strong>watches</strong>. This system now keeps track of them for you, shows the current watch to everyone at the table, and — if you are running Vald — puts a date on it.</p> <hr> <h2>Watches</h2> <p>A day is three watches, called <strong>morning</strong>, <strong>afternoon</strong> and <strong>night</strong>. Each is eight hours. Every character chooses one Wilderness Action per watch, and the last watch of the day is usually spent making camp.</p> <p>This is why the travel tables are priced the way they are. A trail costs <strong>+1 Watch</strong>, wilderness <strong>+2 Watches</strong>, mountains another <strong>+2</strong>, and bad weather can add one more. Add them up and you know how many watches the journey takes; divide by three and you know how many days.</p> <p>Weather is rolled <strong>once a day</strong>, not once a watch.</p> <h2>The watch clock</h2> <p>A small panel sits above the player list, and everyone sees it. It shows the current watch, and the date underneath.</p> <p>You can turn it off in <strong>Configure Settings → Air Bladder → Configure General</strong>, under <strong>Show the watch clock</strong>. That is one switch for the whole table, not a per-player preference: whether your game tracks watches at all is your call as Warden.</p> <p>Only you can move the clock. Players can read it and nothing else.</p> <h2>Moving the clock</h2> <p>The controls are at the top of the <strong>Warden&#39;s Dashboard</strong> — the clipboard in the Token controls, down the left of the map.</p> <table> <thead> <tr> <th>Button</th> <th>What it does</th> </tr> </thead> <tbody><tr> <td><strong>Back a Watch</strong></td> <td>Takes back eight hours, for when a watch was counted twice</td> </tr> <tr> <td><strong>Advance a Watch</strong></td> <td>Moves everyone on by one watch</td> </tr> <tr> <td><strong>Advance a Day</strong></td> <td>Three watches at once</td> </tr> <tr> <td><strong>To Next Morning</strong></td> <td>Skips whatever is left of today and lands at the start of the next morning</td> </tr> <tr> <td><strong>Set the Date…</strong></td> <td>Type a year, month, day and watch</td> </tr> </tbody></table> <p><strong>There is no &quot;Make Camp&quot; button, on purpose.</strong> Making camp is a Wilderness Action your players choose, with consequences they carry. This system does not apply rules on a player&#39;s behalf, so the Warden moves the calendar and the party decides whether they camped. <strong>To Next Morning</strong> is the same jump without the claim.</p> <p>Nothing is posted to chat when the clock moves. It does not need to be — the clock is already on everyone&#39;s screen.</p> <h2>Today&#39;s Weather</h2> <p>Under the clock is a <strong>Today&#39;s Weather</strong> button. It rolls the weather table for the season the world is actually in, so you stop having to remember which season that is. It behaves like any other table button: click the name to roll, click the eye to show the table to the players.</p> <hr> <h2>The Vald calendar</h2> <p>Vald keeps its own year, and it is switched off by default. Turn it on in <strong>Configure Settings → Air Bladder → GLOG &amp; Other Hacks</strong>, under <strong>Use the Vald calendar and seasons</strong>.</p> <p>With it on, the clock reads a Vald date and the Travel tab grows a <strong>Weather in Vald</strong> group.</p> <h3>The year</h3> <p>Twelve months of twenty-four days, so 288 days in a year. Six days in a week, so four weeks in a month — and because twenty-four divides by six, <strong>every month begins on Market Day</strong>.</p> <p><strong>Days of the week:</strong> Market, Garden, Song, Tithe, Bathing, Resting.</p> <p><strong>Months:</strong> Mourning, Silence, Veil, Sunrise, Bright, Ashfall, Flood, Highwater, Rise, Quell, Bane, Sunset.</p> <p><strong>Seasons</strong>, each about seventy-two days: <strong>Dead</strong> begins on the 4th of Mourning, <strong>Dry</strong> on the 4th of Sunrise, <strong>Wet</strong> on the 4th of Flood, and <strong>Harvest</strong> on the 1st of Quell.</p> <p>Every tenth year adds <strong>Reclamation</strong>, a six-day week belonging to no month: Recognize, Remember, Reward, Rejoice, Relinquish, Renew. A new world starts on the 1st of Mourning, 7728, and 7728 is itself a Reclamation year.</p> <h3>Two places the Warden&#39;s Guide disagrees with itself</h3> <p>Worth knowing before you notice them and report them as bugs here. Both are in the published text, and this system follows the dated entries rather than correcting the prose.</p> <ul> <li>The Guide says each season lasts seventy-two days. Its own &quot;season begins&quot; dates make Dead and Dry seventy-two, but <strong>Wet sixty-nine and Harvest seventy-five</strong>.</li> <li>It puts <em>Lift the Veil</em>, &quot;the end of the Dead season&quot;, on the 9th of Veil — <strong>nineteen days before</strong> Dry begins.</li> </ul> <h3>Vald weather</h3> <p>Four tables, one per season, on the Travel tab under <strong>Weather in Vald</strong>. They describe the day: <em>Light snow</em>, <em>Thunderstorms</em>, <em>Warm and breezy</em>.</p> <p><strong>Cairn&#39;s own four seasons stay where they are</strong>, and you want both. Cairn&#39;s Spring through Winter give you <em>severity</em> — Nice, Fair, Unpleasant, Inclement, Extreme — which is what costs a Fatigue or an extra watch and makes the terrain harder. Vald&#39;s four give you the <em>weather itself</em>. Roll Cairn&#39;s for what it costs the party and Vald&#39;s for what they see.</p> <p><strong>Today&#39;s Weather</strong> picks the Vald table while the hack is on, and a Cairn one while it is off.</p> <h3>Switching it on and off</h3> <p>The world clock is a count of seconds and nothing more. Switching the Vald calendar on does not convert it — it simply <strong>reads that number differently</strong>, so the date on screen will jump the first time. Nothing is lost, and switching back restores exactly the reading you had before.</p> <p>So: turn it on, then use <strong>Set the Date…</strong> once to put the party where you want them.</p> <p>Foundry reloads when you change this setting, so everyone at the table changes over at the same moment.</p> <h2>Related</h2> <ul> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.YQuFB7LNfFSbLzCn]{The Warden&#39;s Dashboard} — where the clock controls live, and every other table on a button.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.g6XIDuCiBPF41XM9]{Encounter Tables} — what a travel watch turns up.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.JN9oUEMUbsvjwn8A]{Dice Formulas} — the notation used elsewhere in this system.</li> </ul>'
