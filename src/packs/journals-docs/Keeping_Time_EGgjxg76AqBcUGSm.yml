    text:
      content: '<p>Cairn counts a journey in <strong>watches</strong>. The system tracks them, shows the current watch to everyone at the table, and puts a Vald date on it if you are running Vald.</p> <hr> <h2>Watches</h2> <p>A day is three watches of eight hours: <strong>morning</strong>, <strong>afternoon</strong> and <strong>night</strong>. Every character chooses one Wilderness Action per watch, and the last watch of the day is usually spent making camp.</p> <p>The travel tables count in watches. A trail costs <strong>+1 Watch</strong>, wilderness <strong>+2 Watches</strong>, mountains another <strong>+2</strong>, and bad weather can add one more. Add them up for the length of the journey in watches; divide by three for days.</p> <p>Weather is rolled once a day.</p> <h2>The calendar bar</h2> <p>A bar across the top of the screen shows everyone the current watch and the date, and with the Vald calendar on, the season. Once you have rolled or set it, today&#39;s weather hangs under the bar. With the Vald calendar on, the date and the season are buttons that open the month.</p> <p>Only you can move the clock. Players can read it.</p> <p><strong>Turning it off.</strong> <strong>Configure Settings → Air Bladder → Configure General Settings → Show the calendar bar</strong>. This is one switch for the whole table. Without the bar, players lose today&#39;s weather and their way to open the Vald calendar. You can still open the calendar from <strong>Calendar</strong> on the Dashboard.</p> <p><strong>Tucking it away.</strong> Anyone can tuck the bar on their own screen: Configure Settings → Air Bladder → <strong>Tuck the calendar bar</strong>. Only a thin edge shows. Point at it and it slides down; move away and it tucks again. <strong>Y</strong> pulls it down to stay, and tucks it again. You can change the key in Configure Controls.</p> <h2>Moving the clock</h2> <p>The controls are at the top of the @UUID[Compendium.air-bladder.journals-docs.JournalEntry.YQuFB7LNfFSbLzCn]{Warden&#39;s Dashboard}, the clipboard in the Token controls down the left of the map.</p> <table> <thead> <tr> <th>Button</th> <th>What it does</th> </tr> </thead> <tbody><tr> <td><strong>Back a Watch</strong></td> <td>Takes back eight hours, for when a watch was counted twice</td> </tr> <tr> <td><strong>Advance a Watch</strong></td> <td>Moves everyone on by one watch</td> </tr> <tr> <td><strong>Advance a Day</strong></td> <td>Three watches at once</td> </tr> <tr> <td><strong>To Next Morning</strong></td> <td>Skips whatever is left of today and lands at the start of the next morning watch</td> </tr> <tr> <td><strong>Set the Date…</strong></td> <td>Type a year, month, day and watch. A line under the fields shows the date you are about to set and how many days away it is</td> </tr> </tbody></table> <p>There is no Make Camp button. Making camp is a Wilderness Action the players choose, and the system does not apply rules on a player&#39;s behalf. You move the clock; the party decides whether they camped.</p> <p>Nothing is posted to chat when the clock moves.</p> <h2>Roll Today&#39;s Weather</h2> <p><strong>Roll Today&#39;s Weather</strong>, under the clock on the Dashboard, rolls the weather table for the current season.</p> <p>It differs from the other table buttons in two ways. The card goes to everyone, whatever <strong>Who sees the result</strong> says. And the result becomes today&#39;s weather: it shows under the calendar bar, and on the Vald calendar when that is on, and it clears when the day turns over. For a private look at a season&#39;s weather, roll that season&#39;s table on the Travel tab, which sets nothing.</p> <p><strong>Set the Weather…</strong> beside it is for weather no table has a row for. Type what the sky is doing, or pick one of the season&#39;s own rows from the suggestions. Leave the field empty to clear the weather. Nothing is posted to chat. With the calendar bar off, players see the weather only if you keep a weather log.</p> <h2>Keeping a weather log</h2> <p><strong>Configure Settings → Air Bladder → Configure General Settings → Keep a weather log</strong>, off by default. With it on, every time the weather is rolled or set, a line goes into a journal called <strong>The Weather Log</strong>: the date, the watch, the season, anything the calendar marks on that day, and the weather. One page per month.</p> <p>Everyone at the table can read it. It is an ordinary journal, so you can edit a line, and if you delete the journal a new one starts the next time the weather is rolled or set.</p> <p>A line is written in the language of the Warden who was running the game at the time, and it stays in that language.</p> <hr> <h2>The Vald calendar</h2> <p>Vald keeps its own year. It is off by default. Turn it on in <strong>Configure Settings → Air Bladder → Configure Hacks → Use the Vald calendar and seasons</strong>.</p> <p>With it on, the clock reads a Vald date and the Travel tab shows a <strong>Weather in Vald</strong> group.</p> <h3>The year</h3> <p>Twelve months of twenty-four days make 288 days in a year. A week is six days, so a month is four weeks and every month begins on Market Day.</p> <p><strong>Days of the week:</strong> Market, Garden, Song, Tithe, Bathing, Resting.</p> <p><strong>Months:</strong> Mourning, Silence, Veil, Sunrise, Bright, Ashfall, Flood, Highwater, Rise, Quell, Bane, Sunset.</p> <p><strong>Seasons</strong>, each about seventy-two days: <strong>Dead</strong> begins on the 4th of Mourning, <strong>Dry</strong> on the 4th of Sunrise, <strong>Wet</strong> on the 4th of Flood, and <strong>Harvest</strong> on the 1st of Quell.</p> <p>Every tenth year adds <strong>Reclamation</strong>, a six-day week belonging to no month: Recognize, Remember, Reward, Rejoice, Relinquish, Renew. A new world starts on the 1st of Mourning, 7728, and 7728 is a Reclamation year.</p> <h3>Two places the Warden&#39;s Guide disagrees with itself</h3> <p>Both are in the published text. This system follows the dated entries and does not correct the prose.</p> <ul> <li>The Guide says each season lasts seventy-two days. Its own &quot;season begins&quot; dates make Dead and Dry seventy-two, but <strong>Wet sixty-nine and Harvest seventy-five</strong>.</li> <li>It puts <em>Lift the Veil</em>, &quot;the end of the Dead season&quot;, on the 9th of Veil, <strong>nineteen days before</strong> Dry begins.</li> </ul> <h3>Vald weather</h3> <p>Four tables, one per season, sit on the Travel tab under <strong>Weather in Vald</strong>. They describe the day: <em>Light snow</em>, <em>Thunderstorms</em>, <em>Warm and breezy</em>.</p> <p>With the Vald calendar on, Cairn&#39;s own weather buttons leave the Travel tab: the four seasons and Weather Difficulty. Cairn&#39;s five tables are still in the compendium if you want a severity roll.</p> <p><strong>Roll Today&#39;s Weather</strong> picks the Vald table while the Vald calendar is on, and a Cairn one while it is off.</p> <h3>The month at a glance</h3> <p>Click the date on the calendar bar, or press <strong>Calendar</strong> on the Dashboard, and the month opens: twenty-four days in six columns, with today circled and the day you last clicked highlighted. Everyone can open it while the calendar bar is shown. With the bar off, only you can, from the Dashboard.</p> <ul> <li><strong>Each day is tinted with its season</strong>, and the day a season begins carries that season&#39;s mark. Vald&#39;s seasons change in the middle of a month.</li> <li><strong>Days with something on them carry a dot.</strong> Click one and its festival is given underneath, in the Warden&#39;s Guide&#39;s words. The Splash Festival and the Storm Dance run for three and five days, and every day of the run is marked.</li> <li><strong>Reclamation</strong>, in a year that has one, is a row of six cells named Recognize through Renew, set apart from the months.</li> <li><strong>Today&#39;s weather</strong> shows beside the season, for today only. Only you see the pencil beside it, which sets the weather.</li> <li><strong>Set the world to this day</strong> is at the foot of the panel, and only you see it. Clicking a day opens it and never moves the clock. The button asks first, naming the day and how many days away it is. The watch stays as it is.</li> </ul> <p>The 24 festivals also ship in the <strong>Vald</strong> compendium as a journal entry, <em>Festivals of Vald</em>, which you can read, edit or hand to your players.</p> <h3>Putting your own days on it</h3> <p><strong>Add an event…</strong> sits beside Set the world to this day, and only you see it. Pick a day and say what happens.</p> <ul> <li><strong>Which watch</strong> it happens in, or all day.</li> <li><strong>How many days</strong> it runs.</li> <li><strong>Every year</strong> makes it recur. Unticked, it belongs to the year you put it in.</li> <li><strong>The party can see it</strong> decides which of two journals it goes in: <em>The Warden&#39;s Calendar</em>, which everyone can read, or <em>The Warden&#39;s Calendar (hidden)</em>, which players cannot.</li> </ul> <p>Your events show with a coloured dot and a rule down the side, apart from the Guide&#39;s festivals. Each is an ordinary journal page: <strong>Edit</strong> opens it, and <strong>Remove</strong> deletes it.</p> <p>A hidden event stays off the party&#39;s calendar and out of their journal sidebar. It is not secure against a determined player, because Foundry still sends the journal to their browser. Keep anything that must not be readable outside the world.</p> <h3>Switching it on and off</h3> <p>Switching the Vald calendar on converts nothing. The same moment is read as a different date, so the date on screen jumps the first time. Switching it off restores the reading you had before.</p> <p>After turning it on, use <strong>Set the Date…</strong> once to put the party where you want them.</p> <p>Foundry reloads when you change this setting, so everyone at the table changes over together.</p> <h2>Related</h2> <ul> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.YQuFB7LNfFSbLzCn]{The Warden&#39;s Dashboard} — the clock controls, and every other table on a button.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.g6XIDuCiBPF41XM9]{Encounter Tables} — what a travel watch turns up.</li> <li>@UUID[Compendium.air-bladder.journals-docs.JournalEntry.JN9oUEMUbsvjwn8A]{Dice Formulas} — the notation used elsewhere in this system.</li> </ul>'
