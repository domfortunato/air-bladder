system:
  source: 2e
  archetype: Wizard
  description: >-
    <p>Born of both the mortal world and the unseen, you are an enigma to some
    and feared by many. Yours is the tale of what happens when two worlds
    collide.</p>
  names:
    - Solena
    - Veles
    - Bryn
    - Sabine
    - Razvan
    - Rowena
    - Galen
    - Nyx
    - Vex
    - Iwan
  startingGear:
    - name: Rations
      uses: 3
    - name: Torch
      uses: 3
    - name: Spellbook (Thicket)
    - name: Iron Dagger
    - name: Herbs Pouch
      uses: 3
    - name: Ghillie Suit
  containers: []
  tables:
    - question: What did you bring back from the Unseelie Court?
      options:
        - description: >-
            A Black Rose Fiddle (bulky). Its music causes intense sadness and
            immobility in nearby mortals. (Others are merely fascinated.) You
            don't know how to play.
          items:
            - name: Black Rose Fiddle
        - description: >-
            Paper legs. You are extremely light, and can fall a few stories
            without getting hurt. Try to avoid tearing them or getting them wet.
          items:
            - name: Paper Legs
        - description: >-
            A Living Nightmare that dwells within you but manifests whenever you
            are in danger. It has your same Attributes and HP and attacks with
            claws (d8+d8). It disappears on Critical Damage (take 1d4 WIL
            damage), re-appearing again on the next full moon.
          items:
            - name: Living Nightmare
        - description: >-
            A Raven Familiar [8 HP, 3 STR, 11 DEX, 13 WIL, beak, (d6)]. It
            speaks as an intelligent being and is entirely devoted to you.
          containers:
            - name: Raven Familiar
              slots: 0
        - description: >-
            A Briar Thorn. It can pierce any organic material (quite painfully)
            but when removed leaves no trace of the intrusion.
          items:
            - name: Briar Thorn
        - description: >-
            A Fae creature's True Name. Use it to summon its owner for an act of
            great service, but only once. It could also fetch a hefty price,
            from the right buyer.
    - question: >-
        What concoction do you carry, and what rare ingredients did you gather
        to make it?
      options:
        - description: >-
            Rebirth Ash: Remnants of a bark spirit. Sprinkle to reignite a fire
            that has died or return to life a creature that has died only
            moments before. 3 uses.
          items:
            - name: Rebirth Ash
              uses: 3
        - description: >-
            Glamour Feather: Plume of a firebird. Can make any creature appear
            convincingly as someone (or something) else. 1 use.
          items:
            - name: Glamour Feather
              uses: 1
        - description: >-
            Hawthorn Seed: An acorn from the other side, gathered on the spring
            equinox. When planted, it sprouts a luxurious shelter, collapsing at
            moonrise the next day. 1 use.
          items:
            - name: Hawthorn Seed
              uses: 1
        - description: >-
            Stonetree Sap: Sap obtained in exchange for blood. Hardens when
            rubbed on any surface (+1 Armor). 3 uses.
          items:
            - name: Stonetree Sap
              uses: 3
        - description: >-
            Nightdust Powder: Made from the ritual burning of six owls. When
            tossed in the air, day turns to night for a short while. 2 uses.
          items:
            - name: Nightdust Powder
              uses: 2
        - description: >-
            Hex Stone: Gathered from a river that flows from the other side.
            Removed from its iron tin, it can absorb the effects of an active
            magical effect. If destroyed, the magic is released. 1 use.
          items:
            - name: Hex Stone
              uses: 1
