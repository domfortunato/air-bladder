system:
  source: 2e
  archetype: Fighter
  description: '<p>Protectors of the harvest, defense against pests, thieves, and beasts. A position of great honor, while it lasts: many guardians do not live out their natural lives. Roll a second time on the Bonds table.</p>'
  names:
    - Seed
    - Thresh
    - Dibber
    - Sow
    - Stalk
    - Harrow
    - Cobb
    - Flax
    - Briar
    - Rye
  startingGear:
    - name: Rations
      uses: 3
    - name: Torch
      uses: 3
    - name: Brigandine
    - name: Sling
    - name: Hand axe
    - name: Repellent
      uses: 3
  containers: []
  tables:
    - question: 'What got the better of you?'
      options:
        - description: 'A voracious swarm of pests that swallowed crops and animals alike. With nothing to defend, you left. Take Gale Seed Extract (3 uses). Ingesting it lets you sprint with a speed four times your regular rate. Afterward you add two Fatigue.'
          items:
            - name: Gale Seed Extract
              uses: 3
        - description: 'A crop spirit, angered by a poor tithing. The fires consumed nearly everything, and afterward you were able to gather a pouch of Fireseeds (d8, blast, 4 uses).'
          items:
            - name: Fireseeds
              uses: 4
        - description: 'An antlered, toothy demon that nearly ended you. Take a blood-stained Bone Knife (d6). On Critical Damage, its next attack becomes enhanced from contact with blood.'
          items:
            - name: Bone Knife
        - description: 'The Withering, a type of stem rot from the Roots. Take a Diseased Crop (6 uses) that quickly decays any plant it touches.'
          items:
            - name: Diseased Crop
              uses: 6
        - description: 'Wolves, or so you thought. You are now a Werewolf [8 HP, 15 STR, 14 DEX, claws (d6+d6), bite (d8)]. Your WIL remains the same. You can turn at will (once per day) but must make a WIL save to revert. Anyone left alive from your attacks must make a WIL save to avoid infection.'
        - description: 'Crop thieves. Not all of them survived, but you were outnumbered. Start with +d4 HP and a Cusped Falchion (d8).'
          items:
            - name: Cusped Falchion
    - question: 'What tool saved your life?'
      options:
        - description: 'Bloodvine Whip: d8 damage. On Critical Damage, it drains the target''s blood, granting the weapon''s next attack the blast quality'
          items:
            - name: Bloodvine Whip
        - description: 'Clatter Keeper: A hand-cranked device that emits a loud noise, frightening away most creatures.'
          items:
            - name: Clatter Keeper
        - description: 'Sun Stick: Provides ample warmth and light for up to one hour. Recharge: Leave in heavy sunlight for a full day. 1 use.'
          items:
            - name: Sun Stick
              uses: 1
        - description: 'Root Tether: When thrown, binds a creature as large as a wolf to the soil for a short time.'
          items:
            - name: Root Tether
        - description: 'Greenwhistle: A small flute that calms plants, making passage through areas heavy with plant life a bit easier.'
          items:
            - name: Greenwhistle
        - description: 'Everbloom Band: A circlet adorned with flowers that never wilt. On Critical Damage, the flowers dissolve into dust, but you act as if your save succeeded (STR loss still occurs).'
          items:
            - name: Everbloom Band
