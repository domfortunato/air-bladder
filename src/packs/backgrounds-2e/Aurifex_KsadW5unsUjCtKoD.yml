flags:
  air-bladder:
    backgroundSource: srd-2e
system:
  source: 2e
  archetype: Wizard
  description: >-
    <p>You are an artisan of the arcane, a smith of subtle forces. In the
    crucible of your workshop, the laws that govern this world are warped to
    suit your needs.</p>
  names:
    - Hestia
    - Basil
    - Rune
    - Prism
    - Ember
    - Quintess
    - Aludel
    - Mordant
    - Salaman
    - Jazia
  startingGear:
    - name: Rations
      uses: 3
    - name: Lantern
    - name: Oil Can
      uses: 6
    - name: Needle-Knife
    - name: Protective Gloves
  containers: []
  tables:
    - question: What went horribly wrong?
      options:
        - description: >-
            There was an explosion, and you lost your sense of smell. Well,
            almost: you can sniff out gold as a pig does truffles. Take a Tin of
            Snuff (6 uses) to dampen the impact. Use it every day or become
            deprived.
          items:
            - name: Tin of Snuff
              uses: 6
        - description: >-
            You dematerialized a beloved pet. Now it follows you around,
            invisible but always present. Although it cannot interact with the
            physical realm, you are able to share its senses. (Add a Fatigue
            each time.) It follows basic commands.
        - description: >-
            You were exposed to a long-acting truth serum whose effects have yet
            to wear off. The disorder has its advantages: you cannot repeat lies
            you've heard, either.
        - description: >-
            You were adept at creating fake gold, which is almost as good.
            Eventually, your ruse was discovered, and you had to make a hasty
            retreat. Take a heavy Metal Ingot and Gold Powder (3 uses).
          items:
            - name: Metal Ingot
            - name: Gold Powder
              uses: 3
        - description: >-
            Your alchemical recipe worked, but a rival stole the blueprint
            before your claims could be proven. Take a prototype Blunderbuss
            (d12, blast, bulky) that takes one round to reload, and a taste for
            revenge.
          items:
            - name: Blunderbuss
        - description: >-
            Ridiculed for discovering how to turn gold into lead, you were a
            laughing stock. Take a bottle of Universal Solvent (2 uses) that
            dissolves anything it touches into its constituent parts.
          items:
            - name: Universal Solvent
              uses: 2
    - question: What alchemical marvel is the product of your latest ingenuity?
      options:
        - description: >-
            Pyrophoric Gel: A sticky green fluid that catches fire when exposed
            to air, then burns for 8 hours. Cannot be extinguished (1 use).
          items:
            - name: Pyrophoric Gel
              uses: 1
        - description: >-
            Blast Sphere: A head-sized iron ball filled with explosive powder
            that detonates on impact (d12, blast, bulky, 1 use).
          items:
            - name: Blast Sphere
              uses: 1
        - description: >-
            Aqua Vita: Purifies any liquid, converting it to pure water.
            Drinking it cures 1d6 STR (1 use).
          items:
            - name: Aqua Vita
              uses: 1
        - description: 'Mimic Stone: Records a short phrase that can later be played back.'
          items:
            - name: Mimic Stone
        - description: >-
            Spark Dust: Ignites easily and quickly. Useful for starting a fire
            or as an incendiary device (3 uses).
          items:
            - name: Spark Dust
              uses: 3
        - description: >-
            Homunculus: A miniature clay replica of yourself that follows your
            every command. It hates being enthralled to you and complains
            bitterly whenever possible. Any damage done to the homunculus is
            also done to you. 3 HP, 4 STR, 13 DEX, 5 WIL
          items:
            - name: Homunculus
