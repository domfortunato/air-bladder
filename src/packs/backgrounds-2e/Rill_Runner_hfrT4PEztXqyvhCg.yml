  archetype: Fighter
  description: '<p>You sing the stories of rivers and lakes, your talents soothing friends and the elements alike. You''ve seen more than most, but somehow it never seems to be enough.</p>'
  names:
    - Gale
    - Piper
    - Brook
    - Adair
