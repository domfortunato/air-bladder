system:
  source: 2e
  archetype: Thief
  description: >-
    <p>You live in the grey space between those who have power and those who
    don’t. You find opportunity where others see only chaos. With nimble
    fingers, you unburden both the richest merchant and the lowliest guard.</p>
  names:
    - Arlo
    - Lyra
    - Eamon
    - Salina
    - Elara
    - Freya
    - Bull
    - Sparrow
    - Ivy
    - Silas
  startingGear:
    - name: Rations
      uses: 3
    - name: Torch
      uses: 3
    - name: Twin daggers
    - name: Padded leather
    - name: Lockpicks
    - name: Black outfit
  containers: []
  tables:
    - question: What was your last big job?
      options:
        - description: >-
            A noble's summer home. The place was full of fancy wine (+20gp) but
            not much else. Take Fence Cutters.
          bonusGold: 20
          items:
            - name: Fence Cutters
        - description: >-
            A bank. (You were caught.) You bear a brand only visible by
            firelight, and anyone who sees the mark can ask you for a beer. Take
            Retractable Wires.
          items:
            - name: Retractable Wires
        - description: >-
            A guild warehouse. Take a Ladder (bulky, 10ft) and Blinding Powder
            (1 use).
          items:
            - name: Ladder
            - name: Blinding Powder
              uses: 1
        - description: >-
            Moneylender. Someone beat you to the job but left behind a Scroll of
            Arcane Eye (petty). Arcane Eye: You can see through a magical
            floating eyeball that flies around at your command.
          items:
            - name: Scroll (Arcane Eye)
        - description: >-
            Constable's quarters. You escaped but left some friends behind. Take
            Strong Silk Rope (30ft) and a queasy feeling.
          items:
            - name: Strong Silk Rope
        - description: >-
            A university. You were seen but not pursued. You still don't know
            why. Take Smoke Pellets (3 uses).
          items:
            - name: Smoke Pellets
              uses: 3
    - question: What helps you steal?
      options:
        - description: >-
            Catring: 2 charges. Climb up walls and fall safely. Recharge: Place
            the ring on a stray cat's tail.
          items:
            - name: Catring
        - description: >-
            Gildfinger: 1 charge. A finger glove that mimics any mundane key.
            Recharge: Bundle it with at least 100gp for a night.
          items:
            - name: Gildfinger
        - description: >-
            Glimpse Glass: 3 uses. A monocle that lets you see through walls or
            other obstructions. It shatters after the last use.
          items:
            - name: Glimpse Glass
              uses: 3
        - description: >-
            Sweetwhistle: 1 charge. Listeners hear a soft, familiar voice in the
            distance that they cannot resist following. Recharge: Lose a dear
            memory. (Describe it.)
          items:
            - name: Sweetwhistle
        - description: >-
            Vagrant's Veil: 1 charge. Wear it to blend seamlessly into crowds,
            appearing as a simple pauper. Recharge: Donate the day's winnings to
            the poor. Petty
          items:
            - name: Vagrant's Veil
        - description: >-
            Reverse Teetotum: 1 use. When spun, time skips backwards 30 seconds.
            Everyone remembers what happened.
          items:
            - name: Reverse Teetotum
              uses: 1
