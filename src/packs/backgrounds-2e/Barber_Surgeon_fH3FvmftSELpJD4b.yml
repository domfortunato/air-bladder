  containers: []
  tables:
    - question: 'How have you "improved" yourself?'
      options:
        - description: 'You have a replacement eye that can magnify objects, act as a telescope, and provide minimal night vision. You cannot wear anything metal on your head, and the presence of strong magnets make you deprived.'
        - description: 'One foot is mostly metal (kick, d6), and you treat some Tough terrain as Easy. Carry a Oil Can (6 uses). Without a daily application, you are deprived and noisy.'
          items:
            - name: Oil Can
              uses: 6
        - description: 'One of your fingers has been swapped, the bone replaced by gold and iron. Take a Hook and a Screwdriver that can attach to the fingertip.'
          items:
            - name: 'Hook & Screwdriver'
        - description: 'Both ears have been surgically enhanced, tripling your hearing. You can focus on a specific sound, such as a conversation, at a great distance. You wear an ear flap to protect against sudden loud noises (WIL save to avoid temporary paralysis).'
        - description: 'Your chest is lined with alchemical sigils, toughening the skin (1 Armor). Wearing other metallic armor nullifies the effect.'
          items:
            - name: Alchemical Sigils
        - description: 'One arm is fully metal and comes off at the shoulder. It can be used as a weapon (d8, bulky when not attached) and can move independently if you are within sight of it.'
    - question: 'What rare tool is essential to your work?'
      options:
        - description: 'Regrowth Salve: Regrows a body part over the course of a day. 1 use.'
          items:
            - name: Regrowth Salve
              uses: 1
        - description: 'Graftgrub: A small worm that can fuse inanimate objects with parts of the body. 1 use.'
          items:
            - name: Graftgrub
              uses: 1
        - description: 'Woundwax: Heals wounds from fire or chemicals (restoring full STR) but nothing else. 2 uses.'
          items:
            - name: Woundwax
              uses: 2
        - description: 'Quicksilver: A stimulant. Go first in combat, and automatically pass any WIL saves for one hour. Addictive: Save STR or become deprived after 24 hours without it. 4 uses.'
          items:
            - name: Quicksilver
              uses: 4
        - description: 'Pneuma Pump: Portable iron lungs (bulky). Enables life-saving surgery or underwater breathing.'
          items:
            - name: Pneuma Pump
        - description: 'Lodestone: Draws out dangerous elements from the body and acts as a powerful magnetic force.'
          items:
            - name: Lodestone
