name: Scrivener
type: background
img: systems/air-bladder/icons/background.svg
effects: []
folder: null
sort: 0
flags:
  air-bladder:
    backgroundSource: srd-2e
system:
  source: 2e
  archetype: Wizard
  description: >-
    <p>You copy ancient texts and illuminate manuscripts, recording the voices
    of the clever, the great, and the powerful. You will prove that the pen
    truly is mightier than the sword.</p>
  names:
    - Lazlo
    - Stilo
    - Akshara
    - Pisa
    - Ji-Yun
    - Kalamos
    - Hugo
    - Shui
    - Kalam
    - Julius
  startingGear:
    - name: Rations
      uses: 3
    - name: Torch
      uses: 3
    - name: Quill & Ink
    - name: Blank Book
    - name: Awl
    - name: Badge
  containers: []
  tables:
    - question: What work did you keep for yourself?
      options:
        - description: >-
            The Wild Tongue. A bundle of leather-bound scrolls. A seminal work,
            cataloging the hidden languages of beasts and how to understand
            them.
          items:
            - name: The Wild Tongue
        - description: >-
            The Silent Symphony. Bound in fluorescent wrap. Very rare, it
            chronicles the subtle signs used by those employing invisibility
            magic.
          items:
            - name: The Silent Symphony
        - description: >-
            A Treatise on the Abyss. A nondescript black book. An in-depth,
            largely theoretical text describing the Roots, as well as
            information about the location of a nearby Gate.
          items:
            - name: A Treatise on the Abyss
        - description: >-
            The Star Waltz. A comet-shaped clasp bound in a fine leather cover.
            Detailed astronomical charts, celestial movements, and stellar
            festivals. Highly valued (100gp) for its usefulness to travelers.
          items:
            - name: The Star Waltz
        - description: >-
            The Cathedral and the Canopy. Large-leaf binding over vellum.
            Nominally a children's storybook, the margins detail information
            about traveling, eating, and sleeping in the cloud forests.
          items:
            - name: The Cathedral and the Canopy
        - description: >-
            Garden of Glass. Bound in the cover of another book. A heretical
            work, it describes the materials, procedures, and optimal locations
            required to open a Gate.
          items:
            - name: Garden of Glass
    - question: How do you transcribe sensitive information?
      options:
        - description: >-
            Fib Ink: Glows when used to write true statements but fades if used
            to write false ones.
          items:
            - name: Fib Ink
        - description: >-
            Cipher Stone: A pair of sharp black stones. Each one decrypts any
            message written by the other.
          items:
            - name: Cipher Stone
        - description: >-
            Everquill: A quill that writes on any surface. You still need ink.
            Petty.
          items:
            - name: Everquill
        - description: >-
            Whisper Vial: Whisper a message into the vial, and it will play it
            back to whoever opens it next.
          items:
            - name: Whisper Vial
        - description: >-
            Sanguine Lens: Extracts blood from a target without their knowledge.
            A stolen drop placed on the eye reveals memories from the past day.
          items:
            - name: Sanguine Lens
        - description: >-
            Echo Leaf: A blank parchment. Whomever unfurls it sees their actions
            of the day slowly revealed in a tight scrawl. Petty.
          items:
            - name: Echo Leaf
ownership:
  default: 0
