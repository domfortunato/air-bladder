_id: GwsevjCXfEce1evb
name: Prowler
type: background
img: systems/air-bladder/icons/background.svg
effects: []
folder: null
sort: 0
flags:
  air-bladder:
    backgroundSource: srd-2e
system:
  source: 2e
  archetype: Thief
  description: >-
    <p>You are a specter in the night, a fleeting shadow that slips by its prey,
    unseen. Each kill is a test of cunning and animal determination, a contest
    between life and death. You know that one day you will lose. You look
    forward to it.</p>
  names:
    - Winda
    - Brielle
    - Theron
    - Chayse
    - Nuja
    - Dev
    - Raven
    - Arawan
    - Sable
    - Baruani
  startingGear:
    - name: Rations
      uses: 3
    - name: Torch
      uses: 3
    - name: Tarp
    - name: Boiled Leather
    - name: Short Sword
    - name: Spring-Loaded Trap
  containers: []
  tables:
    - question: What did you last hunt?
      options:
        - description: >-
            A mock firefly, baiting water carriers with its glowing lure. Take
            an Alchemical Limb (d8, petty when worn) to replace the one it tore
            off and an Oil Can (6 uses). The limb is immune to heat and poison.
            Needs to be oiled daily.
          items:
            - name: Alchemical Limb
            - name: Oil Can
              uses: 6
        - description: >-
            An ice nettle, trapping and draining sheep. You lost your commission
            when the fungus you introduced killed half the flock. Take a Rime
            Seed (1 use). It freezes any body of water, no matter the size.
            Don't eat it.
          items:
            - name: Rime Seed
              uses: 1
        - description: >-
            A silver marsh crawler that killed someone close to you. You now
            carry its Tooth (petty) on a chain around your neck as a warning to
            others of its kind. The tooth hums softly when something is stalking
            you.
          items:
            - name: Tooth
        - description: >-
            A malicious forest spirit that poisoned a homestead. You saved a
            Heartseed from the roots of a dying tree. (Plant it to create a new
            forest.) Also, take Iron Bracers (+1 Armor, bulky).
          items:
            - name: Heartseed
            - name: Iron Bracers
        - description: >-
            A hollow wolf that had been frightening travelers. You took pity on
            the half-starved creature and nursed it back to health. Now it is
            loyal to you unto death. It is also a great tunneler. 5 HP, 11 STR,
            13 DEX, 8 WIL, teeth (d6).
        - description: >-
            An azure warbler. The gametes attract a sizeable profit, if properly
            extracted. You succeeded but left its nest to the wolves. Take a
            Paring Knife (d6), an extra 20gp, and a pang of regret.: 
          bonusGold: 20
          items:
            - name: Paring Knife
    - question: What tool is always in your pack?
      options:
        - description: >-
            Fermented Spirits: Keeps you warm at the best of times and as an
            explosive at the worst. 3 Uses.
          items:
            - name: Fermented Spirits
              uses: 3
        - description: >-
            Trail Shaker: A noisy instrument that reveals nearby trails, even
            when deeply hidden.
          items:
            - name: Trail Shaker
        - description: >-
            Drowse Balm: A wax bar. If boiled in water, the steam acts as a
            soporific agent.
          items:
            - name: Drowse Balm
        - description: >-
            Spike and Cord: For traversing difficult terrain or for creating
            makeshift traps and structures.
          items:
            - name: Spike and Cord
        - description: >-
            Iron Rattle: A noisemaker for distracting or scaring your quarry.
            Sounds convincingly like a snake.
          items:
            - name: Iron Rattle
        - description: >-
            Hardening Glue: Makes any flat material (cloth, leather, sand) as
            hard as stone. Expensive (20gp a bottle, 3 uses).
          items:
            - name: Hardening Glue
              uses: 3
ownership:
  default: 0
