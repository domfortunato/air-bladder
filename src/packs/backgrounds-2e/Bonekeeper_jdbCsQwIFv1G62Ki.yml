name: Bonekeeper
type: background
img: systems/air-bladder/icons/background.svg
effects: []
folder: null
sort: 0
flags:
  air-bladder:
    backgroundSource: srd-2e
system:
  source: 2e
  archetype: Wizard
  description: '<p>You are a shepherd to the departed. You listen to the final whispers of the dead as they descend into the cold, unyielding earth. You know that to fully celebrate the gift of life, we must honor its finale as well.</p>'
  names:
    - Rook
    - Ebon
    - Moro
    - Yew
    - Pall
    - Leth
    - Bea
    - Barnaby
    - Vesper
    - Leder
  startingGear:
    - name: Rations
      uses: 3
    - name: Lantern
    - name: Oil Can
      uses: 6
    - name: Stake
    - name: Chains (10ft)
  containers: []
  tables:
    - question: 'What did you take from the dead?'
      options:
        - description: A crow-shaped amulet. You can ask a question of the dead but must add a Fatigue each time. They do not always speak truthfully.
          items:
            - name: Crow-shaped Amulet
        - description: 'A mortal wound from a freed revenant. You were healed, but the disfigurement has made you a pariah. You require neither air nor sustenance but are still subject to pain and death. Trapped between worlds, the dead see you as one of their own.'
        - description: 'A Blood Pail (bulky) from a local death-cult. Empty it to raise a servant built from whatever is buried below, with 6 HP, 1 Armor, 13 STR, 11 DEX, 4 WIL, and shard fists (d8+d8). Only one servant can be raised at a time. If destroyed, you permanently lose 1d4 STR. Recharge: Fill with the blood of a dying warrior.'
          items:
            - name: Blood Pail
        - description: 'A burial wagon (+6 slots, slow) from your last job. It came with a stubborn old donkey (+4 slots, only +2 slots if pulling wagon).'
          containers:
            - name: Burial Wagon
              slots: 6
              carried_by: Donkey
              load: 2
            - name: Donkey
              slots: 4
        - description: 'The Detect Magic Spellbook, stolen from an ancient library. Your family worked in service to an obscure underworld deity, but you lost your faith. Though exiled, you continue to serve, even as an apostate. Detect Magic: You can see or hear nearby magical auras. Becomes warm to the touch when magic is used nearby.'
          items:
            - name: Spellbook (Detect Magic)
        - description: 'A plague doctor''s mask, after its owner succumbed to the disease that wiped out everyone you once knew. They should have kept it on.'
          items:
            - name: 'Plague Doctor''s Mask'
    - question: 'What tool was invaluable in your work?'
      options:
        - description: 'Manacles: Though old, it''s still effective even against the very strong. You don''t have the key.'
          items:
            - name: Manacles
        - description: 'Sponge: Supposedly made from the remains of a rare sea creature. It never seems to dry out.'
          items:
            - name: Sponge
        - description: 'Pulley: Great for moving gravestones, rocks, or even bodies.'
          items:
            - name: Pulley
        - description: 'Incense: Perfect for rituals or to keep the flies at bay. Cools the blood.'
          items:
            - name: Incense
        - description: 'Crowbar: d6 damage. Sometimes you just need to get the damn thing open!'
          items:
            - name: Crowbar
        - description: 'Repellent: Powerful stuff. Its faded label makes it unclear what it is actually meant to repel, though. Perhaps everything. 3 uses.'
          items:
            - name: Repellent
              uses: 3
