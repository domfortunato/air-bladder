  description: >
    <ul>

    <li>Large blobs of green slime that stick to walls and ceiling. Attack by
    dropping on top of their victims.</li>

    <li>The acid corrodes both metal and wood along with the carrier, but cannot
    affect stone. Consumed flesh becomes more green slime.</li>

    <li>Immune to all damage except fire. Once stuck on a victim, can only be
    removed if burned away.</li>

    </ul>
