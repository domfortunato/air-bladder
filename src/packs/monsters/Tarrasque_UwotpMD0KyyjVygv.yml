  description: "<ul>\n<li>  Legendary, gargantuan (50’ long) reptilian monstrosities with plated\nskin, dreaded throughout all\_lands. Spend most of their time\nsleeping in their underground lairs. Emerge periodically and ravage\nvast swaths of land, consuming all plants and animals in the path.\nPossibly the most feared monster of all.</li>\n<li>  Regenerates 1 HP every turn. A Tarrasque always regenerates, even if\nits body is reduced to pieces. The way of permanently killing it is\nunknown.</li>\n<li>  Critical Damage: The razor-sharp claws sever a part of the victim&#39;s\nbody.</li>\n</ul>\n"
