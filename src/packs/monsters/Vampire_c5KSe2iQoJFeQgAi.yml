  description: |
    <ul>
    <li>  Charming, undead creatures that drink the blood of mortals. Act at
    night and sleep in a coffin during the day. Can shape change to the
    form of a giant bat.</li>
    <li>  Regeneration: A damaged vampire gains 3hp at the start of each
    round, as long as it is alive. If killed, becomes a cloud of gas and
    retreats to its coffin, reforming at the next nightfall. Can only be
    killed if exposed to sunlight or if the coffin is destroyed.</li>
    <li>  Critical Damage: The Vampire drains the victim&#39;s essence (d12 WIL
    damage). At 0 WIL, the victim is killed and becomes a vampire.</li>
    </ul>
