  description: >-
    <ul>

    <li style="box-sizing: border-box; margin: 0.25em 0px;">Floating spheres
    with a large maw, one big central eye, and several small eyes on stalks
    scattered through the body. Scheming and greedy, lair deep underground.</li>

    <li style="box-sizing: border-box; margin: 0.25em 0px;">Cancels any magic
    effect in a nearby range facing its central eye.</li>

    <li style="box-sizing: border-box; margin: 0.25em 0px;">The eyestalks cast
    one of those spells each round randomly: (1-Charm, 2-Phobia, 3-Telekinesis,
    4-Sleep, 5-Shuffle, 6-Vision).</li>

    </ul>
