    text:
      content: '<p>The GLOG spell list — the canon hundred re-worded to scale with casting: [dice] is the Magic Dice invested, [sum] their total. How casting works: @UUID[Compendium.air-bladder.journals-glog.JournalEntry.h14bZq29fDTpoTS3]{GLOG Magic — Player Rules}.</p><p><strong>Adhere.</strong> [dice] objects is covered in extremely sticky slime.</p><p><strong>Anchor.</strong> A strong wire sprouts from your arms, affixing itself to [dice] points within 50ft on each side.</p><p><strong>Animate Object.</strong> [dice] objects obeys your commands as best it can. It can walk 15ft per round.</p><p><strong>Anthropomorphize.</strong> A touched animal either gains human intelligence or human appearance for [sum] days.</p><p><strong>Arcane Eye.</strong> You can see through a magical floating eyeball that flies around at your command.</p><p><strong>Astral Prison.</strong> [dice] objects are frozen in time and space within an invulnerable crystal shell.</p><p><strong>Attract.</strong> [sum]+1 objects are strongly magnetically attracted to each other if they come within 10 feet.</p><p><strong>Auditory Illusion.</strong> You create illusory sounds that seem to come from a direction of your choice.</p><p><strong>Babble.</strong> [dice] creatures must loudly and clearly repeat everything you think. It is otherwise mute.</p><p><strong>Bait Flower.</strong> A plant sprouts from the ground that emanates the smell of decaying flesh.</p><p><strong>Beast Form.</strong> You and your possessions transform into a mundane animal.</p><p><strong>Befuddle.</strong> [sum] creatures of your choice are unable to form new short-term memories for the duration of the spell.</p><p><strong>Body Swap.</strong> You switch bodies with a creature you touch. If one body dies, the other dies as well.</p><p><strong>Charm.</strong> [sum] creatures treat you like a friend.</p><p><strong>Command.</strong> A creature obeys a single, [sum] word command that does not harm it</p><p><strong>Comprehend.</strong> You become fluent in all languages</p><p><strong>Cone of Foam.</strong> Dense foam sprays from your hand, coating [dice] targets.</p><p><strong>Control Plants.</strong> [sum] nearby plants and trees obey you and gain the ability to move at a slow pace.</p><p><strong>Control Weather.</strong> You may alter the type of weather for [sum] minutes, but you do not otherwise control it.</p><p><strong>Cure Wounds.</strong> Restore [dice] STR to a creature you can touch.</p><p><strong>Deafen.</strong> [sum] nearby creatures are deafened at random.</p><p><strong>Detect Magic.</strong> You hear nearby magical auras singing. Volume and harmony signify the aura''s power and refinement.</p><p><strong>Disassemble.</strong> Any of your body parts may be detached and reattached at will, without causing pain or damage. You can still control them.</p><p><strong>Disguise.</strong> You may alter the appearance of [sum] characters at will as long as they remain humanoid. Attempts to duplicate other characters will seem uncanny</p><p><strong>Displace.</strong> An object appears to be up to [sum]×10ft from its actual position.</p><p><strong>Earthquake.</strong> The ground begins shaking violently. Structures may be damaged or collapse.</p><p><strong>Elasticity.</strong> Your body can stretch up to [dice]×10ft.</p><p><strong>Elemental Wall.</strong> A straight wall of ice or fire [dice]×40ft long and 10ft high rises from the ground.</p><p><strong>Filch.</strong> [dice] visible items teleport to your hands.</p><p><strong>Flare.</strong> A bright ball of energy fires a trail of light into the sky, revealing your location to friend or foe for [dice] minutes.</p><p><strong>Fog Cloud.</strong> Dense fog spreads out from you</p><p><strong>Frenzy.</strong> [sum] creatures erupt in a frenzy of violence</p><p><strong>Gate.</strong> A portal to a random plane opens.</p><p><strong>Gravity Shift.</strong> You can change the direction of gravity (for yourself only) up to [dice] per round.</p><p><strong>Greed.</strong> [sum] creatures develop an overwhelming urge to possess a visible item of your choice.</p><p><strong>Haste.</strong> Your movement speed is multiplied [dice] times.</p><p><strong>Hatred.</strong> [dice] creatures develop a deep hatred of another creature or group of creatures and wish to destroy it.</p><p><strong>Hear Whispers.</strong> You can hear faint sounds clearly</p><p><strong>Hover.</strong> An object hovers, frictionless, [sum] ft above the ground.</p><p><strong>Hypnotize.</strong> A creature enters a trance and will truthfully answer [dice] yes or no questions you ask it.</p><p><strong>Icy Touch.</strong> A thick ice layer spreads across a touched surface, up to [dice]×10ft in radius.</p><p><strong>Identify Owner.</strong> [dice] letters appear over the object you touch, spelling out the name of the object''s owners, if there are any.</p><p><strong>Illuminate.</strong> A floating light moves as you command.</p><p><strong>Invisible Tether.</strong> Two objects within [dice]x10ft of each other cannot be moved more than [dice]x10ft apart.</p><p><strong>Knock.</strong> [dice] nearby mundane or magical locks unlock.</p><p><strong>Leap.</strong> You can jump up to [dice]×10ft in the air.</p><p><strong>Liquid Air.</strong> The air around you becomes swimmable.</p><p><strong>Magic Dampener.</strong> [dice] nearby magical effects have their effectiveness halved.</p><p><strong>Manse.</strong> A sturdy, furnished cottage appears for [dice]×12 hours. You can permit and forbid entry to it at will.</p><p><strong>Marble Madness.</strong> Your pockets are full of marbles, and will refill for [sum] rounds.</p><p><strong>Masquerade.</strong> [dice] characters'' appearances and voices become identical to a touched character.</p><p><strong>Miniaturize.</strong> You and [dice] other touched creatures are reduced to the size of a mouse.</p><p><strong>Mirror Image.</strong> [dice] illusory duplicates of yourself appear under your control.</p><p><strong>Mirrorwalk.</strong> A mirror becomes a gateway to another mirror that you looked into today.</p><p><strong>Multiarm.</strong> You gain [dice] extra arms</p><p><strong>Night Sphere.</strong> An [sum]×40ft wide sphere of darkness displaying the night sky appears.</p><p><strong>Objectify.</strong> You become any inanimate object between the size of a grand piano and an apple.</p><p><strong>Ooze Form.</strong> You become a living jelly.</p><p><strong>Pacify.</strong> [dice] creatures have an aversion to violence.</p><p><strong>Phobia.</strong> [dice] creatures become terrified of an object of your choice.</p><p><strong>Pit.</strong> A pit 10ft wide and [sum]x5ft deep opens in the ground</p><p><strong>Primeval Surge.</strong> An object grows to the size of an elephant. If it is an animal, it is enraged.</p><p><strong>Push/Pull.</strong> [dice] objects of any size are pulled directly towards you or pushed directly away from you with the strength of [sum] men.</p><p><strong>Raise Dead.</strong> [sum] skeletons rise from the ground to serve you. They are incredibly stupid and can only obey simple orders.</p><p><strong>Raise Spirit.</strong> The spirit of a dead body manifests and will answer [dice] questions.</p><p><strong>Read Mind.</strong> You can hear the surface thoughts of [dice] nearby creatures.</p><p><strong>Repel.</strong> [sum]+1 objects are strongly magnetically repelled from each other if they come within 10 feet.</p><p><strong>Scry.</strong> You can see through the eyes of a creature you touched earlier today.</p><p><strong>Sculpt Elements.</strong> All inanimate material behaves like clay in your hands.</p><p><strong>Sense.</strong> Choose one kind of object (key, gold, arrow, jug, etc). You can sense the nearest [dice] examples.</p><p><strong>Shield.</strong> A creature you touch is protected from mundane attacks for [dice] minutes.</p><p><strong>Shroud.</strong> [sum] creatures are invisible until they move</p><p><strong>Shuffle.</strong> [sum] creatures instantly switch places. Determine where they end up randomly.</p><p><strong>Sleep.</strong> [dice] creatures fall into a light sleep.</p><p><strong>Slick.</strong> Every surface in a [dice]x10ft radius becomes extremely slippery.</p><p><strong>Smoke Form.</strong> Your body becomes living smoke for [dice] minutes.</p><p><strong>Sniff.</strong> You can smell even the faintest traces of scents.</p><p><strong>Snuff.</strong> The source of [sum] mundane lights you can see are instantly snuffed out.</p><p><strong>Sort.</strong> Inanimate items sort themselves according to categories you set.</p><p><strong>Spectacle.</strong> A clearly unreal but impressive illusion of your choice appears for [dice] minutes, under your control. It may be up to the size of a palace and has full motion and sound</p><p><strong>Spellsaw.</strong> A whirling blade flies from your chest, clearing any plant material in its way. It is otherwise harmless.</p><p><strong>Spider Climb.</strong> You can climb surfaces like a spider for [dice] minutes.</p><p><strong>Summon Cube.</strong> [sum] times per round] you may summon or banish a 3-foot-wide cube of earth. New cubes must be affixed to the earth or to other cubes.</p><p><strong>Summon Idol.</strong> A carved stone statue the size of a mule rises from the ground.</p><p><strong>Swarm.</strong> You become a swarm of crows, rats, or piranhas. You only take damage from area effects</p><p><strong>Target Lure.</strong> An object you touch becomes the target of any nearby spell.</p><p><strong>Telekinesis.</strong> You may mentally move [sum] items.</p><p><strong>Telepathy.</strong> [sum]+1 creatures can hear each other''s thoughts, no matter how far apart they move</p><p><strong>Teleport.</strong> An object disappears and reappears on the ground in a visible, clear area up to [sum]×40ft away.</p><p><strong>Thicket.</strong> A thicket of trees and dense brush up to [sum]×40ft wide suddenly sprouts up.</p><p><strong>Time Control.</strong> Time in a 50ft bubble slows down or increases by 10% for 30 seconds.</p><p><strong>True Sight.</strong> You see through all nearby illusions.</p><p><strong>Upwell.</strong> A spring of seawater appears.</p><p><strong>Vision.</strong> You completely control what a creature sees.</p><p><strong>Visual Illusion.</strong> A silent, immobile, illusion of your choice appears, up to the size of a bedroom.</p><p><strong>Ward.</strong> A silver circle 40ft across appears on the ground. Choose one thing that cannot cross it</p><p><strong>Web.</strong> Your wrists can shoot thick webbing that covers [sum]x10ft.</p><p><strong>Widget.</strong> A primitive version of a drawn tool or item appears before you and disappears after a [dice] minutes.</p><p><strong>Wizard Mark.</strong> Your finger can shoot a stream of ulfire-colored paint. This paint is only visible to you, and can be seen at any distance, even through solid objects.</p><p><strong>X-Ray Vision.</strong> You gain X-Ray vision.</p><p><em>GLOG Spells, cairnrpg.com/hacks/glog-spells/ — CC BY-SA 4.0.</em></p>'
