    text:
      content: '<p>You carry a <strong>Grimoire</strong> worth 300gp. It is <em>bulky</em>, and contains a single random spell.</p><p>Treat any discovered Spellbooks as <strong>Scrolls</strong>.</p><h2>Casting Spells</h2><p>Holding your <strong>Grimoire</strong> in both hands, choose a spell. The description may denote the spell’s duration with <strong>D</strong> and range with <strong>R</strong>.</p><p>You have an amount of <strong>Magic Dice</strong> (d6) equal to the amount of available <em>inventory slots</em>. Choose how many you wish to invest (up to a maximum of 4). Spells will refer to these as [dice]. Some spells will refer to their [sum] as well.</p><p>Roll [dice]. For each die that shows a 4-6, you gain one <strong>Fatigue</strong>.</p><p>If you get a series (e.g. 2-4 dice that match), something has gone very wrong. Look up the spell’s [sum] on the <strong>Mishaps</strong> table for what happens next.</p><h2>Scrolls</h2><p>Scrolls contain a single spell and are destroyed after a single use. Otherwise, they work exactly the same as spells recorded in your <strong>Grimoire</strong>.</p><h2>Copying Spells</h2><p>You may copy spells found in Scrolls to your <strong>Grimoire</strong>. It costs 50gp for the gold inks and takes 6 hours to complete, reduced by [sum] hours. The Scroll is destroyed in the process.</p><h2>Creating a Grimoire</h2><p>Creating a <strong>Grimoire</strong> is time-consuming and expensive. You will need:</p><ul><li>A single Scroll, which is sacrificed through the process.</li><li>200gp in inks, as well as a blank book.</li><li>6 hours of undisturbed labor in the light of a full moon. Afterwards, you are <em>deprived</em>.</li></ul><p>The spell contained within the Scroll becomes the first recorded spell.</p><p><em>GLOG Magic, cairnrpg.com/hacks/glog-magic/ — CC BY-SA 4.0.</em></p>'
