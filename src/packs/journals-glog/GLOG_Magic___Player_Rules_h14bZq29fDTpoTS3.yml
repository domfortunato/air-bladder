  - _id: nUmtjfb7NoFefKCP
    name: Magical Mishaps
    type: text
    title:
      show: false
      level: 1
    text:
      content: '<p>When a cast comes up doubles, something has gone very wrong: look up the cast''s [sum] on the table below. A single die can never mishap — doubles take at least two.</p><h2>Risks by Magic Dice</h2><p>Every die that shows 4–6 costs a Fatigue, and every extra die raises the chance of doubles. The odds under each mishap are per cast and exact; a dice count an entry does not list cannot produce that [sum] at all — the deepest mishaps are simply out of reach unless you risk more dice.</p><table><thead><tr><th>Magic Dice</th><th>Any Fatigue</th><th>Average Fatigue</th><th>Mishap</th></tr></thead><tbody><tr><td>1</td><td>50%</td><td>0.5</td><td>Impossible</td></tr><tr><td>2</td><td>75%</td><td>1</td><td>16.7%</td></tr><tr><td>3</td><td>87.5%</td><td>1.5</td><td>44.4%</td></tr><tr><td>4</td><td>93.8%</td><td>2</td><td>72.2%</td></tr></tbody></table><h2>Mishaps, by [sum]</h2><table><thead><tr><th>[sum]</th><th>Mishap</th></tr></thead><tbody><tr><td>2</td><td>You cannot cast spells for 1d6 hours, and any attempts to manipulate magic will fail. <em>Odds per cast: 1 in 36 — only possible with 2 dice.</em></td></tr><tr><td>3</td><td>For the next 24 hours, when casting spells you gain a Fatigue on a roll of 3-6. <em>Odds per cast: 1 in 216 — only possible with 3 dice.</em></td></tr><tr><td>4</td><td>There is a chain reaction to the spell (the Warden will say how). Take an additional Fatigue. <em>Odds per cast: 1 in 36 with 2 dice; 1 in 72 with 3 dice; 1 in 1,296 with 4 dice.</em></td></tr><tr><td>5</td><td>The Spell’s effects are reversed; the Warden will tell you how. Take an additional Fatigue. <em>Odds per cast: 1 in 36 with 3 dice; 1 in 324 with 4 dice.</em></td></tr><tr><td>6</td><td>Any objects in your inventory that are not made of metal instantly combust. You are now immune to fire for short bursts. <em>Odds per cast: 1 in 36 with 2 dice; 1 in 54 with 3 dice; 1 in 130 with 4 dice.</em></td></tr><tr><td>7</td><td>You are deprived. After recovery, roll 1d6. If the total is higher than your max HP, take the new result. <em>Odds per cast: 1 in 24 with 3 dice; 1 in 65 with 4 dice.</em></td></tr><tr><td>8</td><td>You take 1d4 WIL damage when casting spells for the next 24 hours. Afterwards roll 3d6. If the total is higher than your max WIL, take the new result. <em>Odds per cast: 1 in 36 with 2 dice; 1 in 24 with 3 dice; 1 in 37 with 4 dice.</em></td></tr><tr><td>9</td><td>The spell turns your skin a dark shade of purple, and makes you invisible in the moonlight. Your eyes however glow a bright yellow at night. <em>Odds per cast: 1 in 31 with 3 dice; 1 in 23 with 4 dice.</em></td></tr><tr><td>10</td><td>You become insubstantial for 1d4 hours as your spirit leaves your body, which remains unconscious. You can fly and pass through walls, but not touch anything. Also, no one can see or hear you through mundane means. <em>Odds per cast: 1 in 36 with 2 dice; 1 in 24 with 3 dice; 1 in 23 with 4 dice.</em></td></tr><tr><td>11</td><td>You suffer horrible arcane burns; lose 1d4 WIL. From now on you can add +1 Magic Dice to a spell’s [dice] (use a die of a different color). If it results in a 4-6 you lose 1 WIL. <em>Odds per cast: 1 in 24 with 3 dice; 1 in 16 with 4 dice.</em></td></tr><tr><td>12</td><td>The spell backfires; you lose 1 inventory slot (scratch it off your sheet). You are now surrounded by a magical essence that provides +1 Armor (normal limits still apply). <em>Odds per cast: 1 in 36 with 2 dice; 1 in 31 with 3 dice; 1 in 17 with 4 dice.</em></td></tr><tr><td>13</td><td>Your Grimoire is damaged and unusable. Creating a new Grimoire from its remains restores the original spells as well. <em>Odds per cast: 1 in 24 with 3 dice; 1 in 14 with 4 dice.</em></td></tr><tr><td>14</td><td>Instead of Fatigue, the spell causes magical tumors to fill their respective slots. They can only be removed by a specialized healer. Upon recovery, you are able to ignore a single Fatigue taken from spellcasting. If the spell did not cause Fatigue, you are deprived. <em>Odds per cast: 1 in 24 with 3 dice; 1 in 18 with 4 dice.</em></td></tr><tr><td>15</td><td>Arcane energies wrack your body as a piece of your soul is transferred into your Grimoire. You lose half your WIL (rounded down). Your Grimoire now appears in any form you wish and takes no space in inventory. It cannot be destroyed except by your own death, and vice-versa. <em>Odds per cast: 1 in 54 with 3 dice; 1 in 14 with 4 dice.</em></td></tr><tr><td>16</td><td>You permanently lose 1d4 STR as the spell interacts with nearby plant life, which rips out of the earth and fuses against your skin. You have +1 Armor, although fire does enhanced damage against you. You can only feed by photosynthesis. <em>Odds per cast: 1 in 36 with 3 dice; 1 in 17 with 4 dice.</em></td></tr><tr><td>17</td><td>You are transformed into something weird and unnatural (the Warden will say exactly how). Others will have difficulty looking at you. If someone doesn’t focus on you, you are invisible. You fail any attempts at persuasion. <em>Odds per cast: 1 in 72 with 3 dice; 1 in 16 with 4 dice.</em></td></tr><tr><td>18</td><td>One your hands becomes fused with your Grimoire. You can never let go of it, however it only takes up 1 inventory slot. You can fire a bolt of arcane energy from that hand that deals 1d6 damage. If your hand is cut off, you can never cast spells again. <em>Odds per cast: 1 in 216 with 3 dice; 1 in 23 with 4 dice.</em></td></tr><tr><td>19</td><td>Large ugly wings sprout from your back, ripping through whatever you are wearing. You gain 1d4 DEX and can fly. You cannot wear armor or a backpack, and have only 5 inventory slots. <em>Odds per cast: 1 in 23 — only possible with 4 dice.</em></td></tr><tr><td>20</td><td>You dimensionally swap limbs with a magical being from an alien plane. Gain its properties (ask the Warden), both good and bad. Also: it’s coming for you, and it’s mad as hell. <em>Odds per cast: 1 in 37 — only possible with 4 dice.</em></td></tr><tr><td>21</td><td>An extra-planar deity senses your arcane power (ask the Warden which). You are now linked, and can call on it for aide. It can likewise ask you for help, and punish you for non-compliance. Good luck. <em>Odds per cast: 1 in 65 — only possible with 4 dice.</em></td></tr><tr><td>22</td><td>Your body becomes a vessel of pure magical energy. You no longer need to consume food, water or air. Fatigue and Mishaps from casting spells does not affect you, but instead you lose 1d4 STR on a result of 5-6. At STR 0 you become a spell (ask the Warden which). You can smell magic. <em>Odds per cast: 1 in 130 — only possible with 4 dice.</em></td></tr><tr><td>23</td><td>You create an exact duplicate of yourself. One grows older while the other grows younger. Both age at at the rate of 1 year per day. Your thoughts are joined, and if one dies so does the other. Only magical aide will restore you; afterward add +1d6 to each ability score. <em>Odds per cast: 1 in 324 — only possible with 4 dice.</em></td></tr><tr><td>24</td><td>You have become Elemental. Create a True Name for yourself. Magical energies surround you at all times, and mundane attacks against you are impaired. If someone learns your True Name, they can control you. Other Elementals will come for you. <em>Odds per cast: 1 in 1,296 — only possible with 4 dice.</em></td></tr></tbody></table><p><em>Mishap text: GLOG Magic, cairnrpg.com/hacks/glog-magic/ — CC BY-SA 4.0. The odds annotations and the risk table are Air Bladder''s.</em></p>'
