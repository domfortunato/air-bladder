_id: iEdmUOB8UiCSlNfU
name: Vald
pages:
  - _id: jLlx54hQtIEWB1Ko
    name: Introduction
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<p>The implied setting of Cairn is called <em>Vald</em>, encompassing all developed or settled lands, cities, towns, forests, etc. The specific ruler is irrelevant, as most adventures will take place in smaller towns and villages, the forest, and the margins of the realm. Most inhabitants (regardless of region) refer to the local centers of power as the <em>Cities</em>, occasionally as a pejorative.</p> <p>Most towns and villages are built within a day&#39;s walk of one another, near sources of water and lumber. Larger villages try to be self-sufficient but may still rely on nearby farms and local hunters for food. Most settlements were originally organized around a specific industry such as lumber, brewing, fishing, or mining, and often a Fieldwarden or Beast Handler is posted to protect a community&#39;s most valuable assets.</p> <p>Larger towns will elect a Reeve responsible for the community&#39;s well-being and external relationships. In the event of a crime or violence, a constable is empowered to enforce the local laws. Taverns and inns are common in villages close to trade routes, while large settlements often boast at least one temple or shrine. </p> <p>Established trails between larger towns are fairly common, while maintained roads are almost non-existent except to the distant cities. Itinerant merchants, Kettlewrights, and various peddlers pass through settlements on a semi-regular basis, sometimes hiring Outriders to protect and escort larger caravans, or Rill Runners to help ferry passengers in the Riverlands.</p> <p>Even the smallest village may play host to scholarly types from the cities: a Scrivener, Aurifex, or Greenwise with keen interest in nearby tombs, barrows, and Gates. Often a Bonekeeper or Fungal Forager will be hired for their expertise, while clever adventurers will ensure that a Barber-Surgeon is never far away, or a Cutpurse if there is unsavory business that needs tending to. Of course, Mountebanks and Jongleurs often accompany these sorts, riding their coattails in hopes that they too will benefit from the next major discovery.</p> <p>Those who enter the Wood hire a guide familiar with the territory, such as a Prowler or Fletchwind, while the truly determined traveler will seek the wisdom of a Half Witch or Foundling with some connection to its darker secrets. Closer to the border, the Marchguard work to keep the realm free of outside influence, while the Hexenbane seek to protect it from forces within.</p>'
      format: 1
    sort: 0
    ownership:
      default: -1
    flags: {}
    _key: '!journal.pages!iEdmUOB8UiCSlNfU.jLlx54hQtIEWB1Ko'
  - _id: 3aN40s8g8NMz0jDb
    name: Belief
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<p>There are several major religions and spiritual beliefs popular among the smallfolk.</p> <h3>Tideborn</h3> <p>A hierarchical religious sect that worships <em>Rivulus</em>, a petty god of rivers and lakes. Even the unaffiliated are familiar with the group’s initiation ceremony, a ritual drowning that occasionally kills participants. Survivors are dubbed <em>Tideborn</em> and adopt a new, water-related moniker (Carp, Reed, Oxbow, and so on). Only clergy need participate in the ritual; however, in recent years, their following among rural folk has increased, especially in villages near bodies of water. Within the clergy, there is little hierarchy, save for the <em>Aqua Primaris</em>, whom all obey without question.</p> <p>The Tideborn are hardly the only faith in the realm, but their steady growth and zealotry have earned them the respect of some other factions, particularly the <em>House of Burgesses</em>. The continued expansion of their membership has, in turn, earned them some enemies, particularly from other factions. Their enmity is such that today Tideborn clergy never attempt solitary travel through heavily wooded areas, lest they risk a beating or worse.</p> <h3>The White Raven</h3> <p>Popular among those who live close to the Wood, the followers of the <em>White Raven</em> (or &quot;the Flock,&quot; as they prefer) believe strongly in the power of the Wood and in keeping its forests and creatures healthy. They are in awe of the Woodwose and obey the will of the Wood without question. They can be identified by tattoos of a white bird on their wrists, necks, or backs. Every settlement keeps a Flock unique to their community, and their devotees distrust organized religion as a whole.</p> <h3>The Five-Pointed Star</h3> <p>An older religion that owes its origin to the first peoples of the realm, who built stone structures to map the stars and constellations. Its worshipers adhere strictly to a set of religious principles that deny the legitimacy of all other beliefs, and local history is marked by its wars and forced conversions. Today, the <em>Five-Pointed Star</em> keeps temples in every major settlement, which often provide needed services, particularly for the poor. In recent years, its prominence has waned as other faiths have risen, prompting some of its members to join a reactionary order known as the <em>Bleeding Star</em>.</p>'
      format: 1
    sort: 100
    ownership:
      default: -1
    flags: {}
    _key: '!journal.pages!iEdmUOB8UiCSlNfU.3aN40s8g8NMz0jDb'
  - _id: uBJkUYIxaRxFGcTe
    name: Vald Principles
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<ul> <li>Keep it small. Adventures take place in smaller towns, villages, forests, and the margins of the realm.</li> <li>Keep it local. Major rulers (kings, queens, etc.) are far-off, almost irrelevant entities. They have power, but distance diminishes their impact.</li> <li>Most people are human. Some have a drop of Fae blood or are born of two worlds. But for the most part, everyone looks, sounds, and acts recognizably human.</li> <li>Distance matters. Most villages are within a day&#39;s walk from one another to ensure the safety of travelers. Camping is a last resort, and those that journey far rarely return.</li> <li>Language matters. Most towns and villages share a common tongue, but it loses intelligibility the farther one travels. Written, older forms are common in places people no longer tread.</li> <li>There is only one Wood. It is not one forest, but <em>all</em> forests. It is neither Good nor Evil but simply wishes to grow, to be free, and to protect itself.</li> <li>The Wood is a porous dungeon. It has rooms and traps and hazards but can also be traversed in different ways: one can always climb a tree. This makes it no less dangerous.</li> <li>The Roots are a foreign land. Time, logic, and matter operate by principles so alien as to make them unknowable.</li> <li>Magic is rare and dangerous. Relics and Spellbooks are not well understood, and attempting to manipulate their power may lead to self-destruction.</li> <li>Relics originate in the Roots. They cannot be created by humans, only found. They are ancient, and yet they sprout from rubble as if grown there.</li> <li>Monsters and other creatures do not follow the rules. They speak and act differently than the PCs and have abilities and magic beyond the reach of regular characters.</li> </ul>'
      format: 1
    sort: 200
    ownership:
      default: -1
    flags: {}
    _key: '!journal.pages!iEdmUOB8UiCSlNfU.uBJkUYIxaRxFGcTe'
  - _id: 4ZbIpgEtXQNThc4R
    name: The Wood
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<p>The <strong>Wood</strong> surrounds and divides the realm, representing not just one forest, but <em>all</em> forests. Denizens of the Wood are fiercely independent, believing they are subject solely to its rules. Its various peoples, creatures, and unrelenting natural elements have kept the outside world at bay since time immemorial. The Wood is the spirit of all forests, and they in turn are its flesh, and the life they support a sign of its health.</p> <p>At the core of each forest is a <em>Heart Tree</em> and the place where the forest is at its most powerful as well as its most dangerous. Each Heart Tree is born from a single <em>Heartseed</em>, acquired exclusively from a Heart Tree that is dying or dead. The Heart Tree acts as a pinion to the plants, trees, and animals all around it, observing and reacting to any problematic incursions into its domain. In particular, Heart Trees <em>fear humans</em>.</p> <p>Forests never live in isolation and will communicate with one another to give warning or ask for help. Aid can come in many forms, as the Heartseed has great reach. Raven Folk defenders may lay sap traps to capture stray hunters, while Dryads steal the hatchet from the lumberjack&#39;s toolbox. But none are more powerful (nor feared) than the Woodwose, the forest&#39;s true protector. A creature wrought from both plant and bone, the Woodwose lives for only one purpose: to protect the forest and any that live within its boundaries.</p> <p>Despite its fearsome reputation, many tell tales of the wood&#39;s kindness as well. Green, muscular arms saving a child caught by a sudden rock slide. Will-o-Wisps revealing a hidden path once thought lost. Words of warning sung from a crow on a tree. And so, rangers and other outsiders will leave bowls of fruit and nuts alongside great rock piles as proof of their respect and admiration, in the hopes that they will be allowed to pass freely through a protected Wood.</p> <p>Of course, the Wood is not empty of people. Hidden in the boughs and in empty glades are populated villages, rustic cabins, and the odd tower. Those who can survive (or even thrive) in such places learn to live according to the rules of the forest, for those who ignore or foolishly oppose these rules often meet grisly ends. The Wood is populated by creatures strange and wondrous, such as Goblins, Spirits, Treants, Trolls, Werewolves, Witches, and even talking plants and animals. Most are openly hostile to outsiders (particularly humans), but others will (on occasion) parley with those that have shown respect for the Wood. Of course, all demonstrate utter respect for the Fae (sometimes called the Pale Folk, or the <em>Neighbors</em>).</p>'
      format: 1
    sort: 300
    ownership:
      default: -1
    flags: {}
    _key: '!journal.pages!iEdmUOB8UiCSlNfU.4ZbIpgEtXQNThc4R'
  - _id: QTmxJb0jEVQMD7E6
    name: The Neighbors
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<p>Through the bramble and over the bush, there is a liminal space where the realms of mortals and the Faerie touch. If you look for it, you will not find it. But if you need to pass over, you will. The creatures that inhabit this place may look and sound familiar, but make no mistake: they are not like us. Tall, slender, pale as ice, and eerily beautiful, the Fae obey no mortal law, nor do they submit to its morality. And yet they are crippled by sterility, lacking the ability to create their own kindred. For this deed, they must cross the threshold into the mortal realm to treat with mortals. There are many names for their kind, but only one has ever escaped their lips: Neighbors.</p> <p>The Neighbors are continually shrouded in mystery, and it can often be difficult to separate fact from rumor. There are some who say the Neighbors steal babes from their cribs, replacing them with a Changeling child. Others claim that they will pay great sums of wealth or bestow enormous power to those willing to give away their own flesh and blood. There is one truth that all agree on: to make deals with their kind is to invite ill luck not only to your life but that of your descendants as well.</p> <p>Hunters swear that occasionally animals from the Faerie world will pass into ours, a white blaze burnt into their fur. They say that their meat is the sweetest you will ever taste and that afterward you will starve because of the lack of it. Worse, to be caught poaching these creatures invites a fate worse than death. Scholars have written that the Neighbors can spill magic as if it were water, having no need for Spellbooks or even Relics. They also claim that all magic has its origin in the land of the Pale Folk and that within each Spellbook are the trapped spirits of their most craven lawbreakers.</p> <p>Those who make their lives in the Wood know to carry charms, gifts, and similar items in case of a chance meeting. And though the Neighbors rarely trouble the borders to their kingdom, they have been known to deliver harsh punishment to those that cross their boundary uninvited. However, it is common knowledge that the Neighbors are terrified of the Roots and will avoid Gates whenever possible.</p>'
      format: 1
    sort: 400
    ownership:
      default: -1
    flags: {}
    _key: '!journal.pages!iEdmUOB8UiCSlNfU.QTmxJb0jEVQMD7E6'
  - _id: TvlNqL3NhpHpwFn5
    name: The Roots
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<p>The <strong>Roots</strong> is a realm of mystery and horror underground, indifferent to the arbitrary divisions of the aboveground civilizations. Below, labyrinthine hollows stretch for immeasurable distances, connecting humble town sewers to far-flung ruins beyond the borders. Only the brave or foolish dare enter the Roots in search of forgotten Relics or profound wealth, and the few that do return whisper of the indescribable horrors and evil intelligence guarding these lost treasures. Stories tell of adventurers lost for centuries in the depths, only to emerge claiming that just a few hours have passed. Others claim to have made a week-long journey above ground in just one day, traveling through the tunnels beneath.</p> <p>Entrances to the Roots, known as <em>Gates</em>, are scattered across the lands and are usually hidden or protected by powerful forces. Further, Gates cannot be opened without a proper key or alchemical pattern, and once opened, <em>can never be shut again.</em> Folk histories recount their openings as omens of great misfortunes, where creatures more vile than the darkest nightmare slink through, devouring nearby homes and villages. Others tell of great heroes raising their swords against these terrors, sealing away the Gates beneath rubble, mountains, lakes, or other impenetrable barriers.</p> <p>What <em>is</em> known is that the Roots are made of vast underground caves as large as an emptied ocean, without even a hint of sunlight. A variety of fungal growths provide weak light in some places, as do various minerals and strange, shallow pits of blue flame. Very little is known about these pits other than that they are tended to by terrible three-eyed Ogres who thirst for blood as if it were the sweetest wine. The various creatures and wild animals that survive in such harsh conditions have developed natural means to live in utter darkness, adapting their eyesight to function in even the dimmest light or eschewing vision altogether.</p> <p>Of the various peoples and tribes, it is said they speak a harsh, guttural speech, sprinkled with familiar words and phrases. Their warriors carry weapons that spin of their own volition, glowing brighter with each rotation. When the blades are finally released, their heated edges can split flesh and even rock with deadly ease. To date, no one has successfully parlayed with the <em>People Who Live Below</em>. Some contend that there are bustling towns, cities, and even great palaces in the Roots! Of course, few scholars believe them, and those that do have been ostracized into obscurity by their peers. Still, explorers cannot deny the ancient husks of impressive architecture found throughout the Roots, the ancient cities and enormous ships of an unimaginable world. Hazy reports claim that one such ruin, a gargantuan ziggurat boasting hundreds of levels, still flickers with light and life. These rumors have yet to be substantiated.</p> <p>Today, most know to avoid any mention of Gates, or keys, or related alchemy. But of course, there are always those that cannot resist its draw...</p>'
      format: 1
    sort: 500
    ownership:
      default: -1
    flags: {}
    _key: '!journal.pages!iEdmUOB8UiCSlNfU.TvlNqL3NhpHpwFn5'
  - _id: SICrLEnTEy8ziFIP
    name: Factions
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<h3>The House of Burgesses</h3> <p>An assembly of wealthy, land-owning lords and ladies. Cunning, assertive, and convinced of their own superiority, they can accomplish great things when acting as a single body. Unfortunately, their efforts are often undermined by individual squabbles, petty disputes, and their never-ending lust for power and prestige. Although there is a healthy distrust of the <em>Order of Nine</em> in the House, a <em>Burgess</em> will rarely speak ill of them in public. For their part, the House are openly friendly with the Tideborn, although internally there is much consternation regarding the upstart religion&#39;s recent increase in popularity.</p> <h3>The Order of Nine</h3> <p>A consortium of merchants, scholars, and the very powerful, the Order relies on their substantial wealth and a vast network of spies to accomplish their aims. Their primary focus is on the discovery, identification, and regulation of Relics. In recent years, they&#39;ve turned their focus onto the Roots, as they believe this to be the origin of most Relics, and they pay handsomely for any information regarding Gates. The organization owes its name to the founding members of the Order, whose names and titles are kept secret. The Order detests Spellbooks and any that carry them. They see little reason to openly engage in politics, yet keep spies in nearly every faction.</p> <p>The Order employs several distinct ranks and titles (in order of primacy):</p> <ul> <li><em>Lector</em>: An initiate is deemed a <em>Junior Lector</em> until they&#39;ve proven themselves, after which they are awarded the title of <em>High Lector</em>. Only the latter may use Relics in their work.</li> <li><em>Keeper</em>: Protector of a Gate, akin to a typical soldier or mercenary.</li> <li><em>Archivist</em>: A highly respected researcher or librarian, led by the <em>Grand Archivist</em>.</li> <li><em>Chamberlain</em>: A master of Relics, charged with their protection, dispersal, and discovery.</li> <li><em>Inquisitor</em>: The highest-ranking position within the Order, sharing power as a triumvirate (called the <em>Three</em>) and answering only to the <em>Nine</em>.</li> </ul> <h3>The Marchguard</h3> <p>At the margins of the realm and beyond the Wood lies a place so wild, so dangerous, that only the extremely brave or extremely foolish dare set foot. The borders of these lands are ever-shifting, growing, and changing along with the passage of time. And so the Marchguard was born. No one can remember when the Guard was formed nor who worked to create it, but all know their purpose: to protect the realm from any incursions that might cross the boundary and to prevent those attempting to cross without guidance.</p> <p>The Guard bends to no kings, knows no religion, and obeys no laws but their own. They lack even a central leadership, instead providing a masked volunteer to represent them in external negotiations. New members adopt a Blood Oath so powerful it is said to be inescapable by all but death itself. Of course, joining the Guard is rarely a choice, as their ranks are largely composed of ex-thugs, disgraced scholars, neglected knights, misbegotten rangers, and the like. This is how it must be, of course. For who else would willingly devote their lives to stand against such unknowable horrors?</p> <p>Bloodhounds are members of the Guard who have been awarded special commendations or have demonstrated true belief in their cause. These hunters have adopted a single purpose of duty: enforcing the Oath. Utilizing a network of spies, informants, and plants, they ensure that any who escape the Guard are forced to return or die.</p> <p>The Guard sees little reason to engage in politics or other such short-sighted quarrels with the other factions. However, decades of living near the borders have caused them to broker an uneasy friendship with those who call the Wood their home, and they will even treat with them on occasion. And although it is never discussed, on rare occasions the Guard will come the aid of those who live in the Wood as well.</p>'
      format: 1
    sort: 600
    ownership:
      default: -1
    flags: {}
    _key: '!journal.pages!iEdmUOB8UiCSlNfU.SICrLEnTEy8ziFIP'
  - _id: UKlqPjgb75hPjRYM
    name: The Vald Calendar
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<h3>Overview</h3> <p>There are 24 hours in a day and 6 days in a week. Each month has 24 days (4 weeks), with 12 months in a year. The year is divided into 4 seasons (Dead, Dry, Wet, and Harvest), each lasting 72 days. Every 10 years, a 6-day &quot;Leap Week&quot; (<em>Reclamation</em>) is added, and does not belong to any particular month. This makes the average length of a year over a decade 288.6 days. Each year starts just before the <em>Dry</em> season begins. The current year is 7728.</p> <h3>Days of the Week</h3> <ol> <li>Market Day</li> <li>Garden Day</li> <li>Song Day</li> <li>Tithe Day</li> <li>Bathing Day</li> <li>Resting Day</li> </ol> <h3>Months</h3> <ol> <li>Mourning</li> <li>Silence</li> <li>Veil</li> <li>Sunrise</li> <li>Bright</li> <li>Ashfall</li> <li>Flood</li> <li>Highwater</li> <li>Rise</li> <li>Quell</li> <li>Bane</li> <li>Sunset</li> </ol> <h3>Reclamation Week (Once per decade)</h3> <ol> <li>Recognize</li> <li>Remember</li> <li>Reward</li> <li>Rejoice</li> <li>Relinquish</li> <li>Renew</li> </ol> <h3>Holidays, Festivals, &amp; Events Sorted by Date</h3> <table> <thead> <tr> <th><strong>Month</strong></th> <th><strong>Date</strong></th> <th><strong>Event</strong></th> </tr> </thead> <tbody><tr> <td><strong>1. Mourning</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Midnight on the 4th (Tithe Day)</td> <td>Dead season begins.</td> </tr> <tr> <td></td> <td>Dusk on the 24th (Resting Day)</td> <td><em>First Light</em>: Commemorating the end of the first month of the new year. Torches and fire are lit all night, turning night to day.</td> </tr> <tr> <td><strong>2. Silence</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Midnight on the 10th (Tithe Day)</td> <td><em>Dead Solstice</em>: Marks the shortest day of the year, and the midpoint of the Dead season.</td> </tr> <tr> <td></td> <td>Dawn to dusk on the 11th (Bathing Day)</td> <td><em>Whisper</em>: Speaking above a whisper is taboo. Silent auctions are common.</td> </tr> <tr> <td><strong>3. Veil</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Midnight on the 9th (Song Day)</td> <td><em>Lift the Veil</em>: The end of the Dead season is celebrated through solemn vows and humble gestures.</td> </tr> <tr> <td></td> <td>Afternoon to twilight on the 17th (Bathing Day)</td> <td><em>Veil’s Edge</em>: A day for honoring ancestors with offerings and prayers at family altars.</td> </tr> <tr> <td><strong>4. Sunrise</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Midnight on the 4th (Tithe Day)</td> <td>Dry season begins.</td> </tr> <tr> <td></td> <td>Morning on the 14th (Garden Day)</td> <td><em>Bartermoot</em>: Representatives from the smaller towns and villages trade steel for lumber in ritual arrangement with the denizens of the Wood.</td> </tr> <tr> <td><strong>5. Bright</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Afternoon until midnight on the 9th (Song Day)</td> <td><em>Dustset</em>: A carnival marked by parades and masquerades, where participants wear masks to protect from dust and wind.</td> </tr> <tr> <td></td> <td>Midnight on the 10th (Tithe Day)</td> <td><em>Dry Equinox</em>: Marks the midpoint of the Dry season.</td> </tr> <tr> <td><strong>6. Ashfall</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Dawn until the afternoon on the 16th (Tithe Day)</td> <td><em>Boughmeal</em>: A market day held exclusively within the Wood, where artisans and merchants from all over the realm meet to trade their wares.</td> </tr> <tr> <td></td> <td>Afternoon on the 24th (Resting Day)</td> <td><em>Parade of Ash</em>: In celebration of the final day of the Dry season, participants mark their faces with ash and play music. Most kinds of labor are frowned upon.</td> </tr> <tr> <td><strong>7. Flood</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Midnight on the 4th (Tithe Day)</td> <td>Wet season begins.</td> </tr> <tr> <td></td> <td>3 days starting on the 5th (Bathing Day to Market Day)</td> <td><em>Splash Festival</em>: Celebrates the abundance of water, with boat races, contests, gifts, and water blessings.</td> </tr> <tr> <td></td> <td>All day on the 14th (Garden Day)</td> <td><em>Float</em>: Communities build and decorate enormous boats or rafts to float down rivers.</td> </tr> <tr> <td><strong>8. Highwater</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Dawn until midnight on the 1st (Market Day)</td> <td><em>Highwater Fair</em>: A major trade event taking place when the waters are highest. Every major town and city celebrates with fairs and markets.</td> </tr> <tr> <td></td> <td>Midnight on the 10th (Tithe Day)</td> <td><em>Wet Solstice</em>: Marks the longest day of the year, and the midpoint of the Wet season.</td> </tr> <tr> <td></td> <td>Afternoon of the 18th (Resting Day)</td> <td><em>First Plant</em>: A festival marking the beginning of planting season. Communities gather to plant the first seeds of the year together.</td> </tr> <tr> <td><strong>9. Rise</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Lunchtime on the 14th (Garden Day)</td> <td><em>Waterwish</em>: Participants write wishes on scrolls, place them into holes in a boulder, and roll it downhill. When it stops, any remaining wishes are thought to come true.</td> </tr> <tr> <td></td> <td>Five days starting on the 19th (Market Day to Bathing Day)</td> <td><em>Storm Dance</em>: Dances and betrothals meant to please the masters of storm and rain for a fruitful Harvest season ahead.</td> </tr> <tr> <td><strong>10. Quell</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Midnight on the 1st (Market Day)</td> <td>Harvest season begins.</td> </tr> <tr> <td></td> <td>Afternoon on the 4th (Tithe Day)</td> <td><em>Harvest Festival</em>: Celebrates the start of the harvest with feasting and communal gatherings to begin harvesting crops.</td> </tr> <tr> <td></td> <td>Dusk on the 24th (Resting Day)</td> <td><em>Gathering Night</em>: Communities come together to collect and store the harvested crops, followed by a night of storytelling and music.</td> </tr> <tr> <td><strong>11. Bane</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Midnight on the 10th (Tithe Day)</td> <td><em>Harvest Equinox</em>: Marks the midpoint of the Harvest season.</td> </tr> <tr> <td></td> <td>Daylight hours of the 12th (Resting Day)</td> <td><em>The Golden Hind</em>: Hunters from far and wide join a great hunt in search of a mythical stag amid great revelry.</td> </tr> <tr> <td></td> <td>All day on the 18th (Resting Day)</td> <td><em>Firelight</em>: A day of kite-flying, wind chimes, and noisemakers. At night, massive bonfires are lit as dancers perform impressive fire dances.</td> </tr> <tr> <td><strong>12. Sunset</strong></td> <td></td> <td></td> </tr> <tr> <td></td> <td>Evening on the 11th (Bathing Day)</td> <td><em>Ember</em>: Pays homage to the setting sun and the hard work ahead preparing for the Dead season. Lantern release ceremonies are a common practice.</td> </tr> <tr> <td></td> <td>Evening of the 24th (Resting Day)</td> <td><em>Gloam</em>: The final grand feast of the year, celebrating gratitude for the harvest, with the sun as centerpiece. Pregnancies are common.</td> </tr> </tbody></table>'
      format: 1
    sort: 700
    ownership:
      default: -1
    flags: {}
    _key: '!journal.pages!iEdmUOB8UiCSlNfU.UKlqPjgb75hPjRYM'
  - _id: t03BaLfddxoCxHkU
    name: Weather in Vald
    type: text
    title:
      show: true
