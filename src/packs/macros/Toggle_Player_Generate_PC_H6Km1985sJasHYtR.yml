_id: H6Km1985sJasHYtR
name: Toggle Player Generate PC
type: script
author: null
img: icons/svg/dice-target.svg
scope: global
command: |-
  // Flip the Warden's switch for the player-facing Generate PC button in the
  // Actors sidebar (the allow-player-generate world setting). Connected
  // players' directories update live — no reload. Warden-only: the server
  // refuses a world-setting write from anyone else anyway; the check just
  // says so politely.
  if (!game.user.isGM) return ui.notifications.warn(game.i18n.localize("CAIRN.Notify.WardenOnly"));
  const KEY = "allow-player-generate";
  const on = !game.settings.get("air-bladder", KEY);
  await game.settings.set("air-bladder", KEY, on);
  ui.notifications.info(game.i18n.localize(on ? "CAIRN.Notify.PlayerGenOn" : "CAIRN.Notify.PlayerGenOff"));
folder: null
sort: 100000
ownership:
  default: 0
flags: {}
_stats:
  systemId: air-bladder
  coreVersion: '14.365'
_key: '!macros!H6Km1985sJasHYtR'
