system:
  description: >-
    <p>A heavy book of vellum and gold-inked script, made under a full moon at
    ruinous cost. Its carrier may <strong>transmute</strong> the Spellbooks and
    Scrolls they hold into its pages: a bound page weighs nothing, travels with
    the book, and can never be removed. Copying a Scroll costs 50gp for the gold
    inks and takes 6 hours to complete, reduced by [sum] hours; the Scroll is
    destroyed in the process.</p><p>To cast from the book, invest <strong>Magic
    Dice</strong> — up to your free inventory slots, at most 4. Dice that come
    up 4–6 are spent as Fatigue; doubles mean a Mishap. The full rules ship as
    the <em>GLOG Magic — Player Rules</em> journal (Journals
    (GLOG)).</p><p><em>After the GLOG Magic hack, cairnrpg.com/hacks/glog-magic/
    (CC BY-SA 4.0).</em></p>
