      content: '<p><em>These rules are the same for every character — canon 2e backgrounds, custom backgrounds, or Barebones: only character CREATION differs.</em></p><h2>Attributes</h2> <p>Each of the three <strong>Attributes</strong> are used in different circumstances. (See <strong>Saves</strong>, below.)</p> <ul> <li><strong>Strength (STR)</strong>: Used for saves requiring physical power, like lifting gates, bending bars, resisting poison, etc.</li> <li><strong>Dexterity (DEX)</strong>: Used for saves requiring poise, speed, reflexes, dodging, climbing, sneaking, balancing, etc.</li> <li><strong>Willpower (WIL)</strong>: Used for saves to persuade, deceive, interrogate, intimidate, charm, provoke, manipulate spells, etc.</li> </ul> <h2>Saves</h2> <ul> <li>A save is a roll to avoid negative outcomes from risky choices. Characters roll a d20 and compare the results to the appropriate attribute. If they roll equal to or under that attribute, they succeed. Otherwise, they fail. A 1 is always a success, and a 20 is always a failure.</li> <li>If two opponents are each trying to overcome the other, whoever is most at risk should save.</li> <li>If two characters need to take an action together, whoever is most at risk should save (usually the character with the lowest relevant Attribute).</li> </ul> <h2>Healing &amp; Recovery</h2> <ul> <li>Resting for a few moments and having a drink of water restores lost HP but may leave the party exposed. Bandages can stabilize a character that has taken critical damage.</li> <li>Attribute loss (see <strong>Critical Damage</strong>) can usually be restored with a week’s rest, facilitated by a healer or other appropriate source of expertise.</li> <li>Some healing services are free, while magical or more expedient means of recovery may come at a cost.</li> </ul> <h2>Deprivation &amp; Fatigue</h2> <ul> <li>A PC that lacks a crucial need (such as food or rest) is <strong>Deprived</strong>. Anyone <strong>Deprived</strong> for more than a day adds <strong>Fatigue</strong> to their inventory, one for each day. A <strong>Deprived</strong> PC cannot recover HP, Attributes, or item slots from <strong>Fatigue</strong>.</li> <li>A PC may also be forced to add <strong>Fatigue</strong> after casting spells or due to events occurring in the fiction. Each Fatigue occupies one slot and lasts until the PC is able to recuperate (such as with a full night’s rest in a safe spot).</li> <li>If a character is forced to add <strong>Fatigue</strong> to their inventory but they have no free slots, they must drop an item from their inventory.</li> </ul> <h2>Armor</h2> <ul> <li>Before calculating damage to HP, subtract the target’s <strong>Armor</strong> value from the result of damage rolls.</li> <li>Shields and similar armor provide a bonus defense (e.g. +1 Armor), but only while the item is held or worn. Some may also provide additional benefits, depending on the fiction.</li> <li>A PC, NPC, or monster cannot have more than 3 Armor.</li> </ul> <h2>Reactions</h2> <p>When the PCs encounter an NPC whose reaction to the party is not obvious, the Warden may roll 2d6 and consult the following table:</p> <table> <thead> <tr> <th>2</th> <th>3-5</th> <th>6-8</th> <th>9-11</th> <th>12</th> </tr> </thead> <tbody> <tr> <td>Hostile</td> <td>Wary</td> <td>Curious</td> <td>Kind</td> <td>Helpful</td> </tr> </tbody> </table> <h2>Morale</h2> <ul> <li>Enemies must pass a WIL save to avoid fleeing when they take their first casualty and again when they lose half their number.</li> <li>Some groups may use their leader’s WIL in place of their own. Lone foes must save when they’re reduced to 0 HP.</li> <li>Morale does not affect PCs.</li> </ul> <h2>Hirelings</h2> <ul> <li>Adventuring parties can recruit hirelings, relying on their unique skills, knowledge, and training to aid in expeditions.</li> <li>To create a hireling, choose an appropriate role from the Hirelings table in the Marketplace. Roll 3d6 for each attribute and 1d6 for their HP. Give them <strong>equipment</strong> appropriate to their station, then roll on the Character Traits tables to further flesh them out.</li> <li>Alternatively, choose an appropriate <strong>background</strong> and <strong>name</strong> from the Character Creation guide. Roll (or choose from) the tables for that background. Then roll for Rations, Gold Pieces, Attributes, HP, and age.</li> </ul> <h2>Die of Fate</h2> <ul> <li>Optionally, roll 1d6 whenever the outcome of an event is uncertain or to simulate an element of randomness and chance.</li> <li>A roll of 4 or more generally favors the PCs, while a roll of 3 or under usually means bad luck for the PCs.</li> </ul> <h2>Combat</h2> <h3>Rounds</h3> <ul> <li>A <strong>Round</strong> is roughly ten seconds of in-game time and and proceeds with each side taking turns. Each round starts with any PC that is able to act, followed by their opponents. <em>The result of each side’s actions occur simultaneously</em>.</li> <li>During the <em>first round of combat</em>, each PC must make a DEX save in order to act. Special circumstances, abilities, items, or skills may negate this requirement. PCs that fail their save <em>lose their turn</em> for this round.</li> <li>Their opponents then take their turn, and the first round ends. The next round begins with the PCs taking their turn, followed by their opponents, and so on until combat has ended with one side defeated or fled.</li> </ul> <h3>Actions</h3> <p>On their turn, a character may move up to 40ft and take up to one action. This may be casting a spell, attacking, moving for a second time, or some other reasonable action. Each round, the PCs declare what they are doing before dice are rolled. If a character attempts something risky, the Warden calls for a save for appropriate players or NPCs.</p> <h3>Attacking &amp; Damage</h3> <ul> <li>The attacker rolls their weapon die and subtracts the target’s armor, then deals the remaining total to their opponent’s HP. Attacks in combat automatically hit.</li> <li>If multiple attackers target the same foe, roll all damage dice and keep the single highest result. All actions are declared before being resolved.</li> <li>If an attack would take a PC’s HP exactly to 0, refer to the Scars table to see how they are uniquely impacted.</li> </ul> <h3>Attack Modifiers</h3> <ul> <li>If fighting from a position of weakness (such as through cover or with bound hands), the attack is <em>Impaired</em>, and the attacker must roll 1d4 damage regardless of the attacks damage die. Unarmed attacks always do d4 damage.</li> <li>If fighting from a position of advantage (such as against a helpless foe or through a daring maneuver), the attack is <em>Enhanced</em>, allowing the attacker to roll 1d12 damage instead of their normal die.</li> <li>Attacks with the <em>Blast</em> quality affect all targets in the noted area, rolling separately for each affected character. This can be anything from explosions to a dragon’s breath or the impact of a meteorite. If unsure how many targets can be affected, <em>roll the related damage die for a result</em>.</li> <li>If attacking with two weapons at the same time, roll both damage dice and keep the single highest result (denoted with a plus symbol, e.g. d8+d8).</li> </ul> <h3>Critical Damage</h3> <ul> <li>Damage that reduces a target’s HP below zero is subtracted <em>from their STR</em> by the amount of damage remaining. The target must then immediately make a STR save to avoid taking <strong>Critical Damage</strong>, using their <em>new STR score</em>. On a success, the target is still in the fight (albeit with a lower STR score) and must continue to make critical damage saves when incurring damage.</li> <li>Any PC that suffers Critical Damage cannot do anything but crawl weakly, grasping for life. If given aid (such as bandages), they will stabilize. If left untreated, they die within the hour. NPCs and monsters that fail a Critical Damage save are considered dead, per the <strong>Warden’s</strong> discretion. Additionally, some enemies will have special abilities or effects that are triggered when their target fails a critical damage save.</li> </ul> <h3>Attribute Loss</h3> <ul> <li>If a PC takes damage outside of combat, they should instead receive damage to an Attribute, typically STR.</li> <li>If a PC’s STR is reduced to 0, they die. If their DEX is reduced to 0, they are paralyzed. If their WIL is reduced to 0, they are delirious. Complete DEX and WIL loss renders the character unable to act until they are restored through extended rest or by extraordinary means.</li> </ul> <h3>Character Death</h3> <ul> <li>When a character dies, the player should create a new character or take control of a hireling. They immediately join the party in order to reduce downtime.</li> </ul> <h3>Detachments</h3> <ul> <li>Large groups of similar combatants fighting together are treated as a single <em>Detachment</em>. When a <em>detachment</em> takes <strong>Critical Damage</strong>, it is routed or significantly weakened. When it reaches 0 STR, it is destroyed.</li> <li>Attacks against detachments by individuals are <em>impaired</em> (excluding <em>blast</em> damage). Attacks against individuals by detachments are <em>enhanced</em> and deal <em>blast</em> damage.</li> </ul> <h3>Retreat</h3> <ul> <li>Running away from a dire situation always requires a successful DEX save, as well as a safe destination to run to.</li> </ul> <h3>Ranged Attacks</h3> <ul> <li>Ranged weapons can target any enemy near enough to see the whites of their eyes. Attacks against especially distant targets are <em>Impaired</em>.</li> <li>Ammunition is not tracked unless otherwise specified.</li> </ul> <h2>Scars</h2> <p>If damage to a PC would reduce their HP to exactly 0, look up the result on the table below based on the <em>amount of HP lost in the attack</em>. For example, if a PC went from 3 HP to 0 HP, they would look at entry #3 (Walloped).</p> <h3>Scars Table</h3> <table> <thead> <tr> <th><strong>HP Lost</strong></th> <th><strong>Result</strong></th> </tr> </thead> <tbody> <tr> <td>1</td> <td>Lasting Scar: Roll 1d6. 1: Neck, 2: Hands, 3: Eye, 4: Chest, 5: Legs, 6: Ear. Roll 1d6. If the total is higher than your max HP, take the new result.</td> </tr> <tr> <td>2</td> <td>Rattling Blow: You’re disoriented and shaken. Describe how you refocus. Roll 1d6. If the total is higher than your max HP, take the new result.</td> </tr> <tr> <td>3</td> <td>Walloped: You’re sent flying and land flat on your face, winded. You are deprived until you rest for a few hours. Then, roll 1d6. Add that amount to your max HP.</td> </tr> <tr> <td>4</td> <td>Broken Limb: Roll 1d6. 1-2: Leg, 3-4: Arm, 5: Rib, 6: Skull. Once mended, roll 2d6. If the total is higher than your max HP, take the new result.</td> </tr> <tr> <td>5</td> <td>Diseased: You’re afflicted with a gross, uncomfortable infection. When you get over it, roll 2d6. If the total is higher than your max HP, take the new result.</td> </tr> <tr> <td>6</td> <td>Reorienting Head Wound: Roll 1d6. 1-2: STR, 3-4: DEX, 5-6: WIL. Roll 3d6. If the total is higher than your current attribute, take the new result.</td> </tr> <tr> <td>7</td> <td>Hamstrung: You can barely move until you get serious help and rest. After recovery, roll 3d6. If the total is higher than your max DEX, take the new result.</td> </tr> <tr> <td>8</td> <td>Deafened: You cannot hear anything until you find extraordinary aid. Regardless, make a WIL save. If you pass, increase your max WIL by 1d4.</td> </tr> <tr> <td>9</td> <td>Re-brained: Some hidden part of your psyche is knocked loose. Roll 3d6. If the total is higher than your max WIL, take the new result.</td> </tr> <tr> <td>10</td> <td>Sundered: An appendage is torn off, crippled, or useless. (The Warden will tell you which.) Then make a WIL save. If you pass, increase your max WIL by 1d6.</td> </tr> <tr> <td>11</td> <td>Mortal Wound: You are deprived and out of action. You die in one hour unless healed. Upon recovery, roll 2d6. Take the new result as your max HP.</td> </tr> <tr> <td>12</td> <td>Doomed: Death seemed ever so close, but somehow you survived. If your next save against critical damage is a fail, you die horribly. If you pass, roll 3d6. If the total is higher than your max HP, take the new result.</td> </tr> </tbody> </table> <h2>Magic</h2> <h3>Spellbooks</h3> <ul> <li><strong>Spellbooks</strong> contain a single spell and take up one slot. They cannot be easily transcribed or created; instead they are recovered from places like tombs, dungeons, and manors.</li> <li>Spellbooks sometimes display unusual properties or limitations, such as producing a foul or unearthly smell when opened, possessing an innate intelligence, or being legible only when held in moonlight.</li> <li>Spellbooks will attract the attention of those who seek the arcane power within, and it is considered dangerous to display them openly.</li> </ul> <h3>Casting Spells</h3> <ul> <li>Anyone can cast a spell by holding a Spellbook in both hands and reading its contents aloud. They must then add a <strong>Fatigue</strong> to inventory.</li> <li>Given time and safety, PCs can <em>enhance</em> a spell’s impact (e.g., affecting multiple targets, increasing its power, etc.) without any additional cost.</li> <li>If the PC is <em>deprived</em> or in danger (such as during combat), the Warden may require a PC to make a WIL save to avoid any ill-effects from casting the spell. Consequences of failure are on par with the intended effect and may result in added <strong>Fatigue</strong>, the destruction of the Spellbook, injury, and even death.</li> </ul> <h3>Scrolls</h3> <p><strong>Scrolls</strong> are similar to Spellbooks, however:</p> <ul> <li>They are <em>petty</em>.</li> <li>They do not cause <strong>Fatigue</strong>.</li> <li>They disappear after one use.</li> </ul> <h3>Relics</h3> <p><strong>Relics</strong> are items imbued with a magical spell or power. They do not cause Fatigue. Relics usually have limited use, as well as a <strong>Recharge</strong> condition.</p><p><em>Cairn 2e Player’s Guide, cairnrpg.com/second-edition/players-guide/core-rules/ — CC BY-SA 4.0.</em></p>'
