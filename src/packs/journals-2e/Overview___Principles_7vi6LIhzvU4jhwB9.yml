      content: '<h2>Overview</h2> <h3>Neutrality</h3> <p>The Warden’s role is to act as a neutral arbiter and portray the rules, situations, non-player characters (NPCs), and narrative clearly.</p> <h3>Classless</h3> <p>A character’s role or skills are not limited by a single class. Instead, the equipment they carry and their experiences define their specialty.</p> <h3>Death</h3> <p>Characters may be powerful, but they are also vulnerable to harm in its many forms. Death is always around the corner, but it is never random or without warning.</p> <h3>Fiction First</h3> <p>Dice do not always reflect an obstacle’s difficulty or its outcome. Instead, success and failure are based on in-world elements and arbitrated by the Warden in dialogue with the players.</p> <h3>Growth</h3> <p>Characters are changed through in-world advancement, gaining new skills and abilities by surviving dangerous events and overcoming obstacles.</p> <h3>Player Choice</h3> <p>Players should always understand the reasons behind the choices they’ve made, and information about potential risks should be provided freely and frequently.</p> <h3>Principles</h3> <p>The Warden and the players each have guidelines that help foster a specific play experience defined by critical thinking, exploration, and an emergent narrative.</p> <h3>Shared Objectives</h3> <p>Players trust one another to engage with the shared setting, character goals, and party challenges. Therefore the party is typically working together towards a common goal, as a team.</p> <h2>Principles for Players</h2> <h3>Agency</h3> <ul> <li>Attributes and related saves do not define your character. They are tools.</li> <li>Don’t ask only what your character would do; ask what you would do, too.</li> <li>Be creative with your intuition, items, and connections.</li> </ul> <h3>Teamwork</h3> <ul> <li>Seek consensus from the other players before barreling forward.</li> <li>Stay on the same page about goals and limits, respecting each other and accomplishing more as a group than alone.</li> </ul> <h3>Exploration</h3> <ul> <li>Asking questions and listening to detail is more useful than any stats, items, or skills you have.</li> <li>Take the Warden’s description without suspicion, but don’t shy away from seeking more information.</li> <li>There is no single correct way forward.</li> </ul> <h3>Talking</h3> <ul> <li>Treat NPCs as if they were real people, and rely on your curiosity to safely gain information and solve problems.</li> <li>You’ll find that most people are interesting and will want to talk things through before getting violent.</li> </ul> <h3>Caution</h3> <ul> <li>Fighting is a choice and rarely a wise one; consider whether violence is the best way to achieve your goals.</li> <li>Try to stack the odds in your favor, and retreat when things seem unfavorable.</li> </ul> <h3>Planning</h3> <ul> <li>Think of ways to avoid your obstacles through reconnaissance, subtlety, and fact-finding.</li> <li>Do some research, and ask around about your objectives.</li> </ul> <h3>Ambition</h3> <ul> <li>Set goals, and use your meager means to take steps forward.</li> <li>Expect nothing. Earn your reputation.</li> <li>Keep things moving forward, and play to see what happens.</li> </ul> <h2>Principles for Wardens</h2> <h3>Information</h3> <ul> <li>Provide useful information about the game world as the characters explore it.</li> <li>Players do not need to roll dice to learn about their circumstances.</li> <li>Be helpful and direct with your answers to their questions.</li> <li>Respond honestly, describe consistently, and always let them know they can keep asking questions.</li> </ul> <h3>Difficulty</h3> <ul> <li>Default to context and realism rather than numbers and mechanics.</li> <li>If something the players want to do is sincerely impossible, no roll will allow them to do it.</li> <li>Is what the player describes and how they leverage the situation sensible? Let it happen.</li> <li>Saves cover a great deal of uncertain situations and are often all that is necessary for risky actions.</li> </ul> <h3>Preparation</h3> <ul> <li>The game world is organic, malleable and random. It intuits and makes sharp turns.</li> <li>Use random tables and generators to develop situations, not stories or plots.</li> <li>NPCs remember what the PCs say and do, and how they affect the world.</li> <li>NPCs don’t want to die. Infuse their own self-interest and will to live into every personality.</li> </ul> <h3>Narrative Focus</h3> <ul> <li>Emergent experience of play is what matters, not math or character abilities. Give the players weapon trainers and personal quests to facilitate improvement and specialization.</li> <li>Pay attention to the needs and wants of the players, then put realistic opportunities in their path.</li> <li>A dagger to your throat will kill you, regardless of your expensive armor and impressive training.</li> </ul> <h3>Danger</h3> <ul> <li>The game world produces real risk of pain and death for the player characters.</li> <li>Telegraph serious danger to players when it is present. The more dangerous, the more obvious.</li> <li>Put traps in plain sight and let the players take time to figure out a solution.</li> <li>Give players opportunities to solve problems and interact with the world.</li> </ul> <h3>Treasure</h3> <ul> <li>A Treasure is specific to the environment from where it is recovered. It tells a story.</li> <li>Treasure is highly valuable, almost always bulky, and rarely useful beyond its worth and prestige.</li> <li>Relics are not Treasure, though they are useful and interesting.</li> <li>Use Treasure as a lure to exotic locations under the protection of intimidating foes.</li> </ul> <h3>Choice</h3> <ul> <li>Give players a solid choice to force outcomes when the situation lulls.</li> <li>Use binary “so, A or B?” responses when their intentions are vague.</li> <li>Work together using this conversational method to keep the game moving.</li> <li>Ensure that the player character’s actions leave their mark on the game world.</li> </ul> <h3>Die of Fate</h3> <ul> <li>Occasionally you will want an element of randomness (e.g. the weather, unique character knowledge, etc.).</li> <li>In these situations, roll 1d6. A roll of 4 or more generally favors the players.</li> <li>A roll of 3 or under tends to mean bad luck for the PCs or their allies.</li> </ul><p><em>Cairn 2e Player’s Guide, cairnrpg.com/second-edition/players-guide/overview-and-principles/ — CC BY-SA 4.0.</em></p>'
